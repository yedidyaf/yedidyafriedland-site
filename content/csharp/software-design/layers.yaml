  options:
    - "שכבת ממשק חדשה (למשל Controllers של API לנייד) שקוראת לאותם Services"
    - "עותק של כל ה-Services בתוך פרויקט האפליקציה לנייד"
    - "Repositories חדשים, כי אפליקציה לנייד צריכה מסד נתונים אחר"
    - "להעביר את הכללים העסקיים לתוך ה-Controllers, כדי שכל ממשק יקבל אותם"
  answer: 0
  explanation: "זה היתרון של הפרדת שכבות: הכללים העסקיים נמצאים ב-Services, ולכן כל ממשק חדש רק מתחבר אליהם. רק שכבת הממשק משתנה, והלוגיקה והנתונים נשארים כמו שהם."
  optionExplanations:
    "1": "העתקת השירותים היא שכפול קוד: כל שינוי בכלל יצטרך להיעשות בשני מקומות."
    "2": "הנייד משתמש באותם נתונים דרך אותם שירותים. אין סיבה למסד נתונים חדש."
    "3": "זה ההפך: כללים בתוך Controllers צריך לשכפל לכל ממשק."

- id: cs.software-design.layers.014
  type: single
  difficulty: 2
  prompt: "ב-Services משתמשים רק בממשק `IProductRepository`, ושאילתות SQL קיימות רק ב-`SqlProductRepository`. מחליטים לעבור מ-SQL Server ל-MongoDB. איזה קוד צריך להשתנות?"
  options:
    - "ה-Services וה-Controllers, כי הם אלה שמבקשים את המוצרים"
    - "כל השכבות, כי מסד הנתונים הוא הבסיס של כל המערכת"
    - "רק מימוש חדש של `IProductRepository` ורישום שלו במקום הישן"
    - "רק ה-Models, כי הם מייצגים את הטבלאות"
  answer: 2
  explanation: "מכיוון שה-Services תלויים בממשק ולא במימוש, מספיק לכתוב `MongoProductRepository` שמממש את אותו ממשק ולרשום אותו במקום הקודם. זו המטרה של שכבת נתונים מבודדת: שינוי טכנולוגי נשאר בשכבה אחת."
  optionExplanations:
    "0": "ה-Services מכירים רק את הממשק, ולכן הם לא יודעים איזה מסד נמצא מאחוריו."
    "1": "בארכיטקטורה שכבתית טובה, החלפת מסד נוגעת רק בשכבת הנתונים."
    "3": "המודלים מייצגים את הנתונים העסקיים, לא טבלאות של מסד מסוים. השאילתות נמצאות ב-Repository."

- id: cs.software-design.layers.015
  type: single
  difficulty: 3
  prompt: "מה הבעיה העיקרית בתכנון של `OrderService`?"
  code: |
    public class OrdersController
    {
        private readonly OrderService _service;

        public OrdersController() => _service = new OrderService(this);

        public void ShowError(string message) => Console.WriteLine($"Error: {message}");

        public void Submit(int quantity) => _service.Place(quantity);
    }

    public class OrderService
    {
        private readonly OrdersController _controller;

        public OrderService(OrdersController controller) => _controller = controller;

        public void Place(int quantity)
        {
            if (quantity <= 0)
            {
                _controller.ShowError("Quantity must be positive");
                return;
            }
            Console.WriteLine($"Placed {quantity}");
        }
    }
  options:
    - "חסרה בדיקה שהכמות קטנה מ-1000"
    - "השכבה העסקית תלויה בשכבת הממשק: זו תלות הפוכה ומעגלית, ואי אפשר להשתמש ב-`OrderService` בלי Controller"
    - "`OrderService` צריכה לרשת מ-`OrdersController` כדי לקרוא ל-`ShowError`"
    - "`ShowError` צריכה להיות `private`"
  answer: 1
  explanation: "ה-Service מחזיק הפניה ל-Controller ומחליט איך להציג שגיאה, ולכן אי אפשר להפעיל אותו מ-API אחר או מבדיקה בלי Controller. נכון שה-Service יזרוק חריגה (למשל `ArgumentException`) או יחזיר תוצאה, וה-Controller יחליט מה להציג. התלות צריכה להיות בכיוון אחד בלבד: מהממשק אל הלוגיקה."
  optionExplanations:
    "0": "זו דרישה עסקית שלא הוגדרה, לא בעיה בתכנון השכבות."
    "2": "שירות אינו סוג של Controller. ירושה רק תחזק את הצימוד בין השכבות."
    "3": "אז ה-Service לא יוכל לקרוא לה בכלל. הבעיה היא שהוא קורא לה מלכתחילה."

- id: cs.software-design.layers.016
  type: single
  difficulty: 3
  prompt: "לאן נכון להעביר את הבדיקה שהקופון קיים ובתוקף ואת חישוב ההנחה?"
  code: |
    public class Coupon
    {
        public string Code { get; set; }
        public decimal Percent { get; set; }
        public DateTime ExpiresAt { get; set; }
    }

    public interface ICouponRepository
    {
        Coupon FindByCode(string code);
    }

    public class CheckoutController
    {
        private readonly ICouponRepository _coupons;

        public CheckoutController(ICouponRepository coupons) => _coupons = coupons;

        public string ApplyCoupon(decimal subtotal, string code)
        {
            var coupon = _coupons.FindByCode(code);
            if (coupon == null || coupon.ExpiresAt < DateTime.Now)
                return "Invalid coupon";
            decimal total = subtotal * (1 - coupon.Percent / 100);
            return $"Total: {total:F2}";
        }
    }
  options:
    - "למתודה ב-`CheckoutService` שמקבלת `ICouponRepository` בבנאי ומחזירה את הסכום אחרי ההנחה"
    - "למתודה במחלקה `Coupon` שתשלוף את עצמה ממסד הנתונים לפי הקוד"
    - "למימוש של `ICouponRepository`, כדי שהשאילתה תחזיר כבר את הסכום הסופי"
    - "להשאיר אותן ב-Controller, כי שם מתקבל הקלט מהמשתמש"
  answer: 0
  explanation: "בדיקת תוקף וחישוב הנחה הם כללים עסקיים, וצריך גם לשלוף את הקופון. מי שמתאם בין כלל עסקי לגישה לנתונים הוא ה-Service. ה-Controller יקרא לשירות ויעצב את התשובה. השירות עצמו יכול להיעזר במתודה פשוטה כמו `coupon.IsExpired(now)`, אבל המודל לא ניגש למסד."
  optionExplanations:
    "1": "מודל שניגש בעצמו למסד מערבב את שכבת הנתונים בתוך שכבת המודלים."
    "2": "ה-Repository אחראי רק על שמירה ושליפה. חישוב הנחה בתוכו מסתיר כלל עסקי בשכבת הנתונים."
    "3": "כך הכלל נשאר בשכבת הממשק, ואפליקציה אחרת תצטרך לשכפל אותו."
