- id: cs.software-design.architecture-assembly.001
  type: architecture
  difficulty: 1
  prompt: "שבצו כל חתימה של החנות המקוונת בקובץ שאליו היא שייכת."
  requirement: "חנות מקוונת: לקוח שולח את סל הקניות, המערכת מחשבת את הסכום, שומרת את ההזמנה במסד הנתונים ומחזירה לדפדפן את מספר ההזמנה."
  targets:
    - id: Models/Order.cs
      desc: מחלקת הנתונים של הזמנה
    - id: Data/OrderRepository.cs
      desc: שמירה ושליפה של הזמנות ממסד הנתונים
    - id: Services/OrderService.cs
      desc: הכללים העסקיים של ביצוע הזמנה
    - id: Controllers/OrdersController.cs
      desc: מקבל בקשות HTTP ומחזיר תשובות
  items:
    - label: "public class Order"
      answer: Models/Order.cs
      why: "מחלקת הנתונים שכל השכבות מעבירות ביניהן."
    - label: "public Order PlaceOrder(int customerId, IReadOnlyList<CartItem> items)"
      answer: Services/OrderService.cs
      why: "התהליך העסקי: יוצר הזמנה מהסל, מחשב סכום ושומר דרך ה-Repository."
    - label: "private decimal CalculateTotal(IReadOnlyList<CartItem> items)"
      answer: Services/OrderService.cs
      why: "מתודת עזר פרטית של ההזמנה, שמחשבת את הסכום מפריטי הסל."
    - label: "public void Save(Order order)"
      answer: Data/OrderRepository.cs
      why: "כתיבה למסד היא אחריות שכבת הנתונים."
    - label: "public Order GetById(int orderId)"
      answer: Data/OrderRepository.cs
      why: "שליפה לפי מזהה, בלי שום החלטה עסקית."
    - label: "public IActionResult Checkout(CheckoutRequest request)"
      answer: Controllers/OrdersController.cs
      why: "`IActionResult` הוא תשובת HTTP, ולכן המתודה שייכת ל-Controller. היא קוראת לשירות ומחזירה את מספר ההזמנה."
  explanation: "בארכיטקטורת שכבות: Controller מתרגם HTTP לקריאה לשירות, Service מכיל את הכללים, Repository מדבר עם המסד ו-Models מחזיקים נתונים. רמזים בחתימה עוזרים לשבץ: `IActionResult` מצביע על Controller, `Save` ו-`GetById` על Repository."

- id: cs.software-design.architecture-assembly.002
  type: architecture
  difficulty: 1
  prompt: "שבצו כל חתימה של מערכת ההשאלות בספרייה העירונית בקובץ המתאים."
  requirement: "ספרייה עירונית: חבר ספרייה שואל ספר לפי ISBN. מותר להחזיק עד שלושה ספרים בבת אחת, ושכבת השירות מכירה את מסד הנתונים רק דרך ממשק."
  targets:
    - id: Models/Book.cs
      desc: מחלקת הנתונים של ספר
    - id: Interfaces/IBookRepository.cs
      desc: החוזה של הגישה לנתוני ספרים והשאלות
    - id: Data/BookRepository.cs
      desc: מימוש הגישה לנתונים עם Entity Framework
    - id: Services/LoanService.cs
      desc: כללי ההשאלה
  items:
    - label: "public class Book"
      answer: Models/Book.cs
      why: "מחלקת הנתונים של ספר."
    - label: "Book FindByIsbn(string isbn)"
      answer: Interfaces/IBookRepository.cs
      why: "בלי משנה גישה ובלי גוף: חבר ממשק."
    - label: "int CountActiveLoans(int memberId)"
      answer: Interfaces/IBookRepository.cs
      why: "שאילתה שהשירות צריך, מוצהרת בחוזה."
    - label: "public BookRepository(LibraryDbContext db)"
      answer: Data/BookRepository.cs
      why: "רק המימוש מכיר את `DbContext` של Entity Framework."
    - label: "public Loan Borrow(int memberId, string isbn)"
      answer: Services/LoanService.cs
      why: "בודק את המגבלה, מוודא שהספר זמין ויוצר השאלה."
    - label: "private const int MaxActiveLoans = 3"
      answer: Services/LoanService.cs
      why: "המגבלה היא כלל עסקי, ולכן הקבוע נמצא ליד הקוד שאוכף אותו."
  explanation: "השירות תלוי ב-`IBookRepository` ולא ב-`BookRepository`, ולכן אפשר לבדוק את כלל שלושת הספרים בלי מסד נתונים. חברי ממשק נכתבים בלי משנה גישה, ומימושים ומחלקות נכתבים עם `public`."

- id: cs.software-design.architecture-assembly.003
  type: architecture
  difficulty: 2
  prompt: "שבצו כל חתימה של העברת הכספים בבנק בקובץ המתאים."
  requirement: "בנק: לקוח מעביר כסף מחשבון לחשבון. קודם בודקים שהבקשה תקינה (סכום חיובי, שני חשבונות שונים). אחר כך מוודאים שיש מספיק יתרה בחשבון המקור, ושומרים את שני החשבונות יחד."
  targets:
    - id: Models/Account.cs
      desc: חשבון בנק והכללים על היתרה שלו
    - id: Validators/TransferRequestValidator.cs
      desc: בדיקת תקינות של הקלט לפני שמתחילים
    - id: Services/TransferService.cs
      desc: ניהול ההעברה בין שני חשבונות
    - id: Data/AccountRepository.cs
      desc: טעינה ושמירה של חשבונות
    - id: Controllers/TransfersController.cs
      desc: נקודת הכניסה של בקשות HTTP
  items:
    - label: "public void Withdraw(decimal amount)"
      answer: Models/Account.cs
      why: "מתודת מופע שמשנה את היתרה של החשבון וזורקת חריגה אם אין מספיק כסף. החשבון שומר על הכללים של עצמו."
    - label: "public void Deposit(decimal amount)"
      answer: Models/Account.cs
      why: "גם הפקדה משנה את המצב של החשבון עצמו."
    - label: "public ValidationResult Validate(TransferRequest request)"
      answer: Validators/TransferRequestValidator.cs
      why: "בודקת את הקלט בלבד, בלי מסד נתונים: סכום חיובי וחשבונות שונים."
    - label: "public void Transfer(int fromAccountId, int toAccountId, decimal amount)"
      answer: Services/TransferService.cs
      why: "מתאמת את התהליך: טוענת שני חשבונות, מושכת, מפקידה ושומרת."
    - label: "public Account GetById(int accountId)"
      answer: Data/AccountRepository.cs
      why: "טעינת חשבון מהמסד."
    - label: "public void SaveAll(params Account[] accounts)"
      answer: Data/AccountRepository.cs
      why: "שמירה של כמה חשבונות יחד, בפעולה אחת מול המסד."
    - label: "[HttpPost] public IActionResult Post(TransferRequest request)"
      answer: Controllers/TransfersController.cs
      why: "מקבל את הבקשה, מפעיל את ה-Validator ואת השירות ומחזיר תשובת HTTP."
  explanation: "יש כאן שלושה סוגי בדיקות, ולכל אחד מקום משלו: תקינות קלט ב-Validator, כלל היתרה בישות `Account`, ותיאום ההעברה ב-Service. ה-Repository רק טוען ושומר, וה-Controller רק מתרגם HTTP."

- id: cs.software-design.architecture-assembly.004
  type: architecture
  difficulty: 2
  prompt: "שבצו כל חתימה של אתר המתכונים (ASP.NET Core MVC) בקובץ המתאים."
  requirement: "אתר מתכונים: דף מתכון מציג את זמן ההכנה בפורמט קריא («שעה ו-20 דקות»), מאפשר לשנות את מספר המנות כך שהכמויות מתעדכנות, ומאפשר לדרג את המתכון מ-1 עד 5."
  targets:
    - id: Controllers/RecipesController.cs
      desc: מקבל בקשות HTTP ובוחר View
    - id: Models/Recipe.cs
      desc: ישות המתכון והחישובים על הנתונים שלה
    - id: ViewModels/RecipeDetailsViewModel.cs
      desc: נתונים מוכנים לתצוגה של דף המתכון
    - id: Services/RecipeService.cs
      desc: כללים עסקיים ושמירה
    - id: Views/Recipes/Details.cshtml
      desc: תבנית Razor של דף המתכון
  items:
    - label: "public IActionResult Details(int id)"
      answer: Controllers/RecipesController.cs
      why: "פעולת GET שמחזירה View."
    - label: "[HttpPost] public IActionResult Rate(int id, int stars)"
      answer: Controllers/RecipesController.cs
      why: "מקבלת את הטופס ומחזירה תשובת HTTP."
    - label: "public Recipe ScaleTo(int servings)"
      answer: Models/Recipe.cs
      why: "מתודת מופע שמחשבת מתכון חדש מהכמויות של המתכון עצמו."
    - label: "public void AddRating(int recipeId, int stars)"
      answer: Services/RecipeService.cs
      why: "בודקת שהדירוג בין 1 ל-5, טוענת את המתכון ושומרת."
    - label: "public string CookingTimeText { get; init; }"
      answer: ViewModels/RecipeDetailsViewModel.cs
      why: "טקסט מעוצב לתצוגה שייך ל-ViewModel. הישות שומרת את הזמן כנתון גולמי."
    - label: "@model RecipeDetailsViewModel"
      answer: Views/Recipes/Details.cshtml
      why: "הצהרת המודל בראש תבנית Razor."
  explanation: "ב-MVC ה-Controller מתאם בין הבקשה, השירות וה-View. חישוב שתלוי רק בנתוני המתכון יכול להיות בישות, כלל עסקי עם שמירה הולך לשירות, וטקסט לתצוגה הולך ל-ViewModel שה-View מקבל."

- id: cs.software-design.architecture-assembly.005
  type: architecture
  difficulty: 2
  prompt: "שבצו כל חתימה של מנהל המשימות (Clean Architecture) בקובץ המתאים."
  requirement: "מנהל משימות בארכיטקטורה נקייה (Clean Architecture): משתמש מסמן משימה כבוצעה. אסור לסמן משימה פעמיים, ושעת הסיום נשמרת. השכבות הפנימיות לא מכירות את EF Core ולא את ASP.NET Core."
  targets:
    - id: Domain/TodoItem.cs
      desc: ישות המשימה והכללים שלה, בלי תלות בשכבה אחרת
    - id: Application/Interfaces/ITodoRepository.cs
      desc: הממשק שהשכבה האפליקטיבית צריכה לאחסון
    - id: Application/Todos/CompleteTodo.cs
      desc: "מקרה השימוש «סימון כבוצעה»: הפקודה וה-Handler שלה"
    - id: Infrastructure/Persistence/EfTodoRepository.cs
      desc: מימוש האחסון עם Entity Framework Core
    - id: Api/Controllers/TodosController.cs
      desc: נקודת הכניסה של בקשות HTTP
  items:
    - label: "public void MarkCompleted(DateTime completedAt)"
      answer: Domain/TodoItem.cs
      why: "הכלל «אסור לסמן פעמיים» שומר על המצב של הישות עצמה, ולכן הוא בשכבת ה-Domain."
    - label: "Task<TodoItem> GetByIdAsync(Guid id, CancellationToken ct)"
      answer: Application/Interfaces/ITodoRepository.cs
      why: "חבר ממשק שהשכבה האפליקטיבית מגדירה, והתשתית מממשת."
    - label: "public record CompleteTodoCommand(Guid TodoId)"
      answer: Application/Todos/CompleteTodo.cs
      why: "הפקודה היא הקלט של מקרה השימוש."
    - label: "public async Task Handle(CompleteTodoCommand command, CancellationToken ct)"
      answer: Application/Todos/CompleteTodo.cs
      why: "ה-Handler טוען את המשימה דרך הממשק, קורא ל-`MarkCompleted` ושומר."
    - label: "public EfTodoRepository(AppDbContext dbContext)"
      answer: Infrastructure/Persistence/EfTodoRepository.cs
      why: "רק שכבת התשתית מכירה את `DbContext`."
    - label: '[HttpPost("{id}/complete")] public async Task<IActionResult> Complete(Guid id)'
      answer: Api/Controllers/TodosController.cs
      why: "נתיב HTTP ו-`IActionResult` שייכים לשכבת ה-Api, שרק שולחת פקודה."
  explanation: "בארכיטקטורה נקייה התלויות מצביעות פנימה: Api ו-Infrastructure תלויות ב-Application, ו-Application תלויה ב-Domain. ה-Domain מחזיק את הכללים של הישות, ה-Application מתאמת מקרי שימוש ומגדירה ממשקים, והתשתית מממשת אותם."

- id: cs.software-design.architecture-assembly.006
  type: architecture
  difficulty: 3
  prompt: "שבצו כל חתימה של מערכת הזמנת החדרים במלון בקובץ המתאים."
  requirement: "מלון בארכיטקטורה נקייה: אורח מזמין חדר לטווח תאריכים אם החדר פנוי, ויכול לבטל בחינם עד 48 שעות לפני ההגעה. הליבה לא מכירה SQL ולא HTTP, וה-API בנוי ב-Minimal API."
  targets:
    - id: Domain/Reservation.cs
      desc: ישות ההזמנה וכללי הביטול שלה
    - id: Application/Abstractions/IRoomCalendar.cs
      desc: ממשק לבדיקת זמינות של חדרים
    - id: Application/Bookings/BookRoom.cs
      desc: "מקרה השימוש «הזמנת חדר»: הפקודה וה-Handler שלה"
    - id: Infrastructure/SqlRoomCalendar.cs
      desc: בדיקת זמינות מול מסד הנתונים
    - id: Api/BookingEndpoints.cs
      desc: מיפוי נתיבי HTTP
  items:
    - label: "public void Cancel(DateTime now)"
      answer: Domain/Reservation.cs
      why: "כלל 48 השעות תלוי רק בתאריך ההגעה של ההזמנה עצמה, ולכן הישות אוכפת אותו."
    - label: "Task<bool> IsRoomFreeAsync(int roomId, DateOnly from, DateOnly to)"
      answer: Application/Abstractions/IRoomCalendar.cs
      why: "בלי משנה גישה ובלי גוף: ההצהרה בממשק."
    - label: "public async Task<bool> IsRoomFreeAsync(int roomId, DateOnly from, DateOnly to)"
      answer: Infrastructure/SqlRoomCalendar.cs
      why: "אותה חתימה עם `public async`: למתודה יש גוף שמריץ שאילתה, ולכן זה המימוש בתשתית."
    - label: "public record BookRoomCommand(int RoomId, Guid GuestId, DateOnly From, DateOnly To)"
      answer: Application/Bookings/BookRoom.cs
      why: "הקלט של מקרה השימוש."
    - label: "public async Task<Guid> Handle(BookRoomCommand command, CancellationToken ct)"
      answer: Application/Bookings/BookRoom.cs
      why: "בודק זמינות דרך `IRoomCalendar`, יוצר `Reservation` ושומר."
    - label: "public static void MapBookingEndpoints(this IEndpointRouteBuilder app)"
      answer: Api/BookingEndpoints.cs
      why: "`IEndpointRouteBuilder` הוא טיפוס של ASP.NET Core, ולכן רק שכבת ה-Api מכירה אותו."
  explanation: "כלל התלות (Dependency Rule): הליבה (Domain ו-Application) לא מכירה אף טיפוס של SQL או HTTP. היא מגדירה את `IRoomCalendar`, והתשתית מממשת אותו. שתי חתימות כמעט זהות מבדילות בין הצהרה בממשק (בלי `public async`) לבין המימוש."

- id: cs.software-design.architecture-assembly.007
  type: architecture
  difficulty: 2
  prompt: "שבצו כל חתימה של אפליקציית הצ'אט (Vertical Slices) בקובץ של הפיצ'ר המתאים."
  requirement: "אפליקציית צ'אט שמאורגנת לפי פיצ'רים (Vertical Slices) ולא לפי שכבות: כל פעולה של המשתמש נמצאת בקובץ אחד עם הבקשה והלוגיקה שלה. משתמש יכול לשלוח הודעה לחדר, ליצור חדר ולחסום משתמש אחר."
  targets:
    - id: Features/Messages/SendMessage.cs
      desc: שליחת הודעה לחדר
    - id: Features/Rooms/CreateRoom.cs
      desc: יצירת חדר צ'אט
    - id: Features/Users/BlockUser.cs
      desc: חסימת משתמש
    - id: Shared/ChatDbContext.cs
      desc: גישה למסד הנתונים, משותפת לכל הפיצ'רים
  items:
    - label: "public record SendMessageRequest(Guid RoomId, string Text)"
      answer: Features/Messages/SendMessage.cs
      why: "הבקשה של פיצ'ר השליחה נמצאת באותו קובץ עם הלוגיקה שלו."
    - label: "public async Task<MessageDto> Handle(SendMessageRequest request, Guid senderId)"
      answer: Features/Messages/SendMessage.cs
      why: "מקבל `SendMessageRequest`, ולכן הוא ה-Handler של שליחת הודעה."
    - label: "public record CreateRoomRequest(string Name, bool IsPrivate)"
      answer: Features/Rooms/CreateRoom.cs
      why: "הבקשה של יצירת חדר."
    - label: "public async Task<RoomDto> Handle(CreateRoomRequest request, Guid ownerId)"
      answer: Features/Rooms/CreateRoom.cs
      why: "מקבל `CreateRoomRequest` ומחזיר את החדר שנוצר."
    - label: "public async Task Handle(BlockUserRequest request, Guid blockerId)"
      answer: Features/Users/BlockUser.cs
      why: "מקבל `BlockUserRequest`."
    - label: "public DbSet<Message> Messages { get; set; }"
      answer: Shared/ChatDbContext.cs
      why: "טבלת ההודעות היא חלק מה-`DbContext` המשותף שכל הפיצ'רים משתמשים בו."
  explanation: "בארגון לפי פיצ'רים (Vertical Slices) שינוי בפעולה אחת נוגע בקובץ אחד, במקום ב-Controller, ב-Service וב-Repository נפרדים. כל המתודות נקראות `Handle`, וטיפוס הבקשה הוא שקובע לאיזה פיצ'ר כל אחת שייכת. רק תשתית שכולם צריכים, כמו ה-`DbContext`, נמצאת בתיקייה משותפת."

- id: cs.software-design.architecture-assembly.008
  type: architecture
  difficulty: 2
  prompt: "שבצו כל חתימה של מערכת הרישום לקורסים, שמבוססת על אירועים, בקובץ המתאים."
  requirement: "פלטפורמת קורסים: אחרי שסטודנט נרשם לקורס, שירות הרישום מפרסם אירוע (Event). מטפלים נפרדים מגיבים לאירוע: אחד שולח מייל פתיחה ואחד פותח גישה לשיעורים. שירות הרישום לא מכיר את המטפלים."
  targets:
    - id: Events/StudentEnrolled.cs
      desc: "נתוני האירוע «סטודנט נרשם לקורס»"
    - id: Events/IEventHandler.cs
      desc: "החוזה הגנרי של מטפל באירוע, `IEventHandler<TEvent>`"
    - id: Enrollment/EnrollmentService.cs
      desc: רישום לקורס ופרסום האירוע
    - id: Handlers/SendWelcomeEmailHandler.cs
      desc: שולח מייל פתיחה
    - id: Handlers/GrantCourseAccessHandler.cs
      desc: פותח לסטודנט גישה לשיעורים
  items:
    - label: "public record StudentEnrolled(int StudentId, int CourseId, DateTime EnrolledAt)"
      answer: Events/StudentEnrolled.cs
      why: "האירוע הוא נתונים בלבד: מה קרה ומתי."
    - label: "Task HandleAsync(TEvent domainEvent)"
      answer: Events/IEventHandler.cs
      why: "חבר ממשק גנרי (בלי משנה גישה ובלי גוף) שכל מטפל מממש."
    - label: "public async Task EnrollAsync(int studentId, int courseId)"
      answer: Enrollment/EnrollmentService.cs
      why: "שומר את הרישום ומפרסם `StudentEnrolled`, בלי לדעת מי יטפל בו."
    - label: "private string BuildWelcomeText(string studentName, string courseTitle)"
      answer: Handlers/SendWelcomeEmailHandler.cs
      why: "ניסוח המייל הוא פרט של מטפל המייל בלבד."
    - label: "private Task UnlockLessonsAsync(int studentId, int courseId)"
      answer: Handlers/GrantCourseAccessHandler.cs
