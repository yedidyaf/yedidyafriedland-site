- id: cs.software-design.architecture-assembly.015
  type: single
  difficulty: 1
  prompt: "איזו מתודה לא שייכת למחלקה `OrderRepository`?"
  code: |
    public class Order
    {
        public int Id { get; set; }
        public string CustomerEmail { get; set; }
    }

    public class OrderRepository
    {
        private readonly Dictionary<int, Order> _orders = new();

        public void Add(Order order) => _orders[order.Id] = order;

        public Order FindById(int id) =>
            _orders.TryGetValue(id, out var order) ? order : null;

        public void SendConfirmationEmail(Order order) =>
            Console.WriteLine($"Sending confirmation to {order.CustomerEmail}");
    }
  options:
    - "`Add(Order order)`"
    - "`FindById(int id)`"
    - "`SendConfirmationEmail(Order order)`"
    - "השדה `_orders`"
  answer: 2
  explanation: "Repository אחראי רק על שמירה ושליפה. שליחת מייל היא תגובה עסקית להזמנה, ולכן היא צריכה להיות ב-Service או במחלקה נפרדת כמו `OrderEmailSender`. כשמשבצים חתימות, שואלים על כל אחת «מה האחריות שלה?» ולא רק «על איזה אובייקט היא עובדת?»."
  optionExplanations:
    "0": "הוספה לאחסון היא בדיוק תפקיד ה-Repository."
    "1": "שליפה לפי מזהה היא תפקיד ה-Repository."
    "3": "השדה הוא האחסון עצמו."

- id: cs.software-design.architecture-assembly.016
  type: truefalse
  difficulty: 1
  prompt: "בארכיטקטורת שכבות, מתודה שמחזירה `IActionResult` שייכת לשכבת ה-Services."
  answer: false
  explanation: "`IActionResult` מייצג תשובת HTTP (סטטוס, View או JSON), ולכן מתודה שמחזירה אותו שייכת ל-Controller. מתודה של Service מחזירה נתונים עסקיים, כמו `Order` או `decimal`, כדי שאפשר יהיה להשתמש בה גם בלי HTTP."
