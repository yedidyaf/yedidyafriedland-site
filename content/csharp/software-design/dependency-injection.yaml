- id: cs.software-design.dependency-injection.012
  type: architecture
  difficulty: 3
  prompt: "שבצו כל מחלקה במשך החיים (Lifetime) המתאים לה ברישום לקונטיינר."
  requirement: "אתר הזמנות ב-ASP.NET Core. לכל מחלקה מתואר איך היא מחזיקה מצב (State). בחרו לכל מחלקה את משך החיים הארוך ביותר שעדיין לא משתף מצב במקום שאסור."
  targets:
    - id: AddSingleton
      desc: מופע אחד לכל חיי האפליקציה
    - id: AddScoped
      desc: מופע אחד לכל בקשת HTTP
    - id: AddTransient
      desc: מופע חדש בכל פעם שמבקשים
  items:
    - label: "public class ExchangeRateCache (מטמון שערי מטבע שמשותף לכל המשתמשים ובטוח לשימוש מקביל)"
      answer: AddSingleton
      why: "המטמון צריך להיות משותף לכולם, ואם היה נוצר מחדש הוא היה מאבד את מה שנשמר בו."
    - label: "public class FeatureFlags (נטען פעם אחת מקובץ ההגדרות בעליית האפליקציה, לקריאה בלבד ולא משתנה עד הפעלה מחדש)"
      answer: AddSingleton
      why: "מצב לקריאה בלבד בטוח לשיתוף בין כל הבקשות, ולכן משך החיים הארוך ביותר מתאים. Scoped היה קורא את הקובץ מחדש בכל בקשה בלי שום תועלת, כי הערכים לא משתנים."
    - label: "public class ShopDbContext : DbContext (עוקב אחרי השינויים של בקשה אחת ואינו בטוח לשימוש מקביל)"
      answer: AddScoped
      why: "כל בקשה צריכה עותק משלה, וכל השירותים באותה בקשה צריכים לחלוק אותו."
    - label: "public class CurrentUserContext (מחזיק את המשתמש המחובר של הבקשה הנוכחית)"
      answer: AddScoped
      why: "המשתמש שונה בכל בקשה, אבל זהה לכל השירותים שמטפלים בה."
    - label: "public class InvoicePdfBuilder (צובר שורות לתוך מסמך אחד, וכל שימוש חייב להתחיל ממסמך ריק)"
      answer: AddTransient
      why: "אם שני שירותים באותה בקשה היו חולקים מופע, השורות שלהם היו מתערבבות. לכן כל צרכן מקבל מופע חדש."
  explanation: "משך החיים נקבע לפי המצב שהמחלקה מחזיקה, ובוחרים את הארוך ביותר שבטוח. מצב משותף ובטוח לכולם: Singleton. מצב של בקשה אחת: Scoped. מצב שאסור לשתף אפילו בתוך בקשה: Transient. בחירה שגויה גורמת לערבוב נתונים בין משתמשים או בין שירותים."

- id: cs.software-design.dependency-injection.013
  type: single
  difficulty: 2
  prompt: "מה החיסרון העיקרי של `WelcomeService` לעומת הזרקה דרך בנאי?"
  code: |
    public interface IEmailSender
    {
        void Send(string to, string body);
    }

    public static class ServiceLocator
    {
        private static readonly Dictionary<Type, object> Services = new();

        public static void Register<T>(T service) => Services[typeof(T)] = service;

        public static T Get<T>() => (T)Services[typeof(T)];
    }

    public class WelcomeService
    {
        public void Welcome(string email)
        {
            var sender = ServiceLocator.Get<IEmailSender>();
            sender.Send(email, "Welcome!");
        }
    }
  options:
    - "התלות ב-`IEmailSender` מוסתרת בתוך המתודה: היא לא מופיעה בחתימה, ואם שכחו לרשום אותה מגלים זאת רק בזמן ריצה"
    - "`ServiceLocator` יוצר מופע חדש של השולח בכל קריאה, ולכן הקוד איטי"
    - "אי אפשר להשתמש בממשק עם `ServiceLocator`, רק במחלקות קונקרטיות"
    - "המתודה `Welcome` חייבת להיות `static` כדי לגשת ל-`ServiceLocator`"
  answer: 0
  explanation: "מאתר שירותים (Service Locator) מסתיר תלויות: מהבנאי של `WelcomeService` אי אפשר לדעת שהיא צריכה שולח מיילים. בבדיקה צריך לזכור לרשום מימוש במילון גלובלי, ובדיקות שונות עלולות להפריע זו לזו. בהזרקה דרך בנאי התלות גלויה בחתימה, ואי אפשר ליצור את המחלקה בלי לספק אותה."
  optionExplanations:
    "1": "`Get` מחזיר את המופע שנרשם. הוא לא יוצר מופע חדש."
    "2": "הקוד עצמו מבקש `IEmailSender`, שהוא ממשק."
    "3": "מתודת מופע יכולה לקרוא למתודה סטטית של מחלקה אחרת."

- id: cs.software-design.dependency-injection.014
  type: truefalse
  difficulty: 2
  prompt: "כדי להשתמש בהזרקה דרך בנאי, חייבים קונטיינר DI כמו זה של ASP.NET Core."
  answer: false
  explanation: "הזרקה דרך בנאי היא פשוט העברת תלויות כפרמטרים: `new OrderService(new SqlOrderRepository())`. אפשר לעשות זאת ידנית ב-`Main` או בבדיקה (Pure DI). הקונטיינר רק חוסך את העבודה הזו ומנהל משך חיים."

- id: cs.software-design.dependency-injection.015
  type: single
  difficulty: 2
  prompt: "באפליקציה שבנויה בהזרקת תלויות, איפה נכון להחליט שהמימוש של `IEmailSender` הוא `SmtpEmailSender`?"
  options:
    - "בכל שירות שצריך לשלוח מייל, בתוך הבנאי שלו"
    - "במקום אחד בנקודת הכניסה לאפליקציה (Composition Root), למשל `Program.cs`"
    - "בתוך הממשק `IEmailSender`, כמימוש ברירת מחדל"
    - "במחלקת המודל `User`, כי המשתמש הוא שמקבל את המייל"
  answer: 1
  explanation: "נקודת ההרכבה (Composition Root) היא המקום היחיד שמכיר את המחלקות הקונקרטיות ומחבר ביניהן, למשל `builder.Services.AddScoped<IEmailSender, SmtpEmailSender>()`. כל שאר הקוד מכיר רק ממשקים, ולכן החלפת מימוש היא שינוי של שורה אחת."
  optionExplanations:
    "0": "אם כל שירות יוצר את המימוש בעצמו, אין הזרקה, והחלפת מימוש מחייבת לשנות את כל השירותים."
    "2": "ממשק שמכיר מימוש מסוים קושר את החוזה לפרט טכני, וזה ההפך מהמטרה."
    "3": "מודל שיוצר שירותי תשתית מערבב שכבות, ולא שייך להחלטה על מימושים."

- id: cs.software-design.dependency-injection.016
  type: single
  difficulty: 3
  prompt: "לבנאי של `OrderManager` מוזרקות שמונה תלויות. מה זה מרמז בדרך כלל, ומה התיקון המומלץ?"
  code: |
    public interface IOrderRepository { }
    public interface ICustomerRepository { }
    public interface IEmailSender { }
    public interface ISmsSender { }
    public interface IPdfGenerator { }
    public interface IPaymentGateway { }
    public interface IInventoryService { }
    public interface IAuditLog { }

    public class OrderManager
    {
        public OrderManager(
            IOrderRepository orders,
            ICustomerRepository customers,
            IEmailSender email,
            ISmsSender sms,
            IPdfGenerator pdf,
            IPaymentGateway payments,
            IInventoryService inventory,
            IAuditLog audit)
        {
        }
    }
  options:
    - "שהמחלקה עושה יותר מדי (הפרה של אחריות יחידה): לפצל אותה לכמה מחלקות ממוקדות, למשל תשלום, התראות ומסמכים"
    - "שצריך להחליף את ההזרקה ב-`ServiceLocator`, כדי שהבנאי יהיה קצר"
    - "שצריך להפוך את כל התלויות לשדות `static`, כדי שלא יהיה צורך להעביר אותן"
    - "שאין שום בעיה: מספר התלויות בבנאי לא אומר דבר על התכנון"
  answer: 0
  explanation: "בנאי עם הרבה תלויות (Constructor Over-injection) הוא סימן שהמחלקה אחראית על יותר מדי דברים. הזרקה דרך בנאי רק חושפת את הבעיה. הפתרון הוא לפצל לשירותים ממוקדים, למשל `OrderNotifier` שמקבל את שולחי המייל וה-SMS, וכך כל מחלקה מקבלת מעט תלויות."
  optionExplanations:
    "1": "Service Locator רק מסתיר את אותן שמונה תלויות, והבעיה נשארת."
    "2": "שדות סטטיים הם מצב גלובלי: קשה לבדוק אותם, ואי אפשר להחליף מימוש לבדיקה אחת."
    "3": "מספר התלויות הוא מדד טוב לכמות האחריות של מחלקה."
