- id: cs.software-design.dependency-injection.001
  type: single
  difficulty: 1
  prompt: "איך `ReminderService` מקבלת את התלות שלה?"
  code: |
    public interface IClock
    {
        DateTime Now { get; }
    }

    public class ReminderService
    {
        private readonly IClock _clock;

        public ReminderService(IClock clock)
        {
            _clock = clock;
        }

        public bool IsOverdue(DateTime dueDate) => _clock.Now > dueDate;
    }
  options:
    - "הזרקה דרך הבנאי - Constructor Injection: מי שיוצר את השירות מעביר לו `IClock`"
    - "השירות יוצר בעצמו את השעון עם `new` בתוך הבנאי"
    - "השירות ניגש לשעון דרך משתנה סטטי גלובלי"
    - "השירות יורש מ-`IClock`, ולכן יש לו את `Now`"
  answer: 0
  explanation: "בהזרקת תלויות (Dependency Injection) המחלקה לא יוצרת את התלויות שלה, אלא מקבלת אותן מבחוץ. הבנאי מצהיר «אני צריכה `IClock`», ומי שיוצר את השירות מחליט איזה שעון לתת: שעון אמיתי באפליקציה או שעון קבוע בבדיקה."
  optionExplanations:
    "1": "אין בקוד שום `new`. הבנאי מקבל את השעון כפרמטר."
    "2": "השדה `_clock` הוא שדה מופע, והוא מקבל את ערכו מהפרמטר."
    "3": "`ReminderService` לא מממשת את `IClock`. היא מחזיקה הפניה לאובייקט שמממש אותו."

- id: cs.software-design.dependency-injection.002
  type: cleaner
  difficulty: 1
  prompt: "איזו גרסה של `SignupService` מאפשרת להחליף את שולח המיילים בלי לשנות את המחלקה?"
  options:
    - |
      var service = new SignupService(new ConsoleEmailSender());
      service.Register("dana@example.com");

      public interface IEmailSender
      {
          void Send(string to, string body);
      }

      public class ConsoleEmailSender : IEmailSender
      {
          public void Send(string to, string body) => Console.WriteLine($"{to}: {body}");
      }

      public class SignupService
      {
          private readonly IEmailSender _sender;

          public SignupService(IEmailSender sender) => _sender = sender;

          public void Register(string email) => _sender.Send(email, "Welcome!");
      }
    - |
      var service = new SignupService();
      service.Register("dana@example.com");

      public interface IEmailSender
      {
          void Send(string to, string body);
      }

      public class ConsoleEmailSender : IEmailSender
      {
          public void Send(string to, string body) => Console.WriteLine($"{to}: {body}");
      }

      public class SignupService
      {
          private readonly IEmailSender _sender = new ConsoleEmailSender();

          public void Register(string email) => _sender.Send(email, "Welcome!");
      }
  answer: 0
  explanation: "בגרסה הראשונה השולח מוזרק דרך הבנאי, ולכן אפשר להעביר שולח SMTP באפליקציה ושולח מדומה בבדיקה. השימוש בממשק לבד לא מספיק: מי שמחליט על המחלקה הקונקרטית צריך להיות מחוץ לשירות."
  optionExplanations:
    "1": "השדה מוגדר מטיפוס הממשק, אבל השירות עדיין יוצר בעצמו `ConsoleEmailSender`. כדי להחליף שולח צריך לשנות את המחלקה."

- id: cs.software-design.dependency-injection.003
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    var service = new GreetingService(new FixedClock(new DateTime(2024, 1, 1, 9, 0, 0)));
    Console.WriteLine(service.Greet("Dana"));

    public interface IClock
    {
        DateTime Now { get; }
    }

    public class FixedClock : IClock
    {
        private readonly DateTime _now;
        public FixedClock(DateTime now) => _now = now;
        public DateTime Now => _now;
    }

    public class GreetingService
    {
        private readonly IClock _clock;
        public GreetingService(IClock clock) => _clock = clock;

        public string Greet(string name) =>
            _clock.Now.Hour < 12 ? $"Good morning, {name}" : $"Good evening, {name}";
    }
  options:
    - "Good morning, Dana"
    - "Good evening, Dana"
    - "תלוי בשעה שבה מריצים את התוכנית"
    - "שגיאת קומפילציה"
  answer: 0
  explanation: "השירות לא קורא ל-`DateTime.Now`, אלא לשעון שהוזרק לו. `FixedClock` מחזיר תמיד 09:00, ולכן התוצאה קבועה. כך בודקים קוד שתלוי בזמן: מזריקים שעון מדומה במקום השעון האמיתי."
  optionExplanations:
    "1": "השעה המוזרקת היא 9, שקטנה מ-12."
    "2": "זה היה נכון אם השירות היה קורא ל-`DateTime.Now`. כאן הזמן מגיע מ-`FixedClock`."
    "3": "`FixedClock` מממש את `IClock`, ולכן אפשר להעביר אותו לבנאי."

- id: cs.software-design.dependency-injection.004
  type: single
  difficulty: 2
  prompt: "`ShopDbContext` עוקב אחרי שינויים באובייקטים שנטענו, ואינו בטוח לשימוש מכמה Threads במקביל. כל השירותים שמטפלים באותה בקשת HTTP צריכים לחלוק אותו, כדי לשמור הכול ב-`SaveChanges` אחד. באיזה משך חיים (Lifetime) לרשום אותו?"
  options:
    - "`AddTransient`"
    - "`AddScoped`"
    - "`AddSingleton`"
    - "שדה `static` במחלקה `Program`"
  answer: 1
  explanation: "Scoped יוצר מופע אחד לכל Scope, וב-ASP.NET Core כל בקשת HTTP היא Scope. כך כל השירותים באותה בקשה חולקים את אותו `DbContext`, ובקשה אחרת מקבלת מופע משלה."
  optionExplanations:
    "0": "Transient נותן מופע חדש לכל שירות, ולכן שני שירותים באותה בקשה לא יחלקו את השינויים."
    "2": "Singleton משותף לכל הבקשות במקביל, ו-`DbContext` אינו בטוח לשימוש כזה."
    "3": "שדה סטטי הוא מופע אחד לכולם, עם אותה בעיה של Singleton, ובלי שהקונטיינר מנהל אותו."

- id: cs.software-design.dependency-injection.005
  type: truefalse
  difficulty: 1
  prompt: "שירות שנרשם כ-Transient נוצר מחדש בכל פעם שמבקשים אותו מהקונטיינר (Container)."
  answer: true
  explanation: "זו ההגדרה של Transient: כל בקשה לשירות, כולל הזרקה לשני בנאים שונים באותה בקשת HTTP, מקבלת מופע חדש. Scoped נותן מופע אחד לכל Scope, ו-Singleton מופע אחד לכל חיי האפליקציה."

- id: cs.software-design.dependency-injection.006
  type: single
  difficulty: 3
  prompt: "`ReportCache` נרשם כ-Singleton ומקבל בבנאי את `ShopDbContext`, שנרשם כ-Scoped. מה הבעיה?"
  options:
    - "ה-Singleton «לוכד» את מופע ה-`DbContext` שקיבל בפעם הראשונה ומשתמש בו בכל הבקשות, הרבה מעבר לבקשה אחת שהוא נועד לה"
    - "אין בעיה: הקונטיינר ייצור `ShopDbContext` חדש בכל פעם ש-`ReportCache` ניגש לשדה"
    - "הקונטיינר יהפוך אוטומטית את `ReportCache` ל-Scoped"
    - "הבעיה היחידה היא ביצועים: כל בקשה תיצור `ReportCache` חדש"
  answer: 0
  explanation: "זו תלות שבויה (Captive Dependency): שירות שחי זמן ארוך מחזיק שירות שאמור לחיות זמן קצר. ה-`DbContext` ישותף בין בקשות במקביל ויחיה כל חיי האפליקציה, עם השינויים שנצברו בו. ASP.NET Core בסביבת פיתוח (Scope Validation) מזהה זאת וזורק חריגה. כלל אצבע: שירות יכול להיות תלוי רק בשירותים שחיים לפחות כמוהו."
  optionExplanations:
    "1": "הבנאי של Singleton רץ פעם אחת, ולכן השדה מקבל מופע אחד ולא משתנה."
    "2": "הקונטיינר לא משנה את משך החיים שנרשם."
    "3": "Singleton נוצר פעם אחת לכל חיי האפליקציה, לא בכל בקשה."

- id: cs.software-design.dependency-injection.007
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    var shared = new VisitCounter();
    var home = new Page(shared);
    var about = new Page(shared);
    var contact = new Page(new VisitCounter());
    home.Visit();
    about.Visit();
    contact.Visit();
    Console.WriteLine(home.Visits);
    Console.WriteLine(contact.Visits);

    public class VisitCounter
    {
        public int Count { get; private set; }
        public void Increment() => Count++;
    }

    public class Page
    {
        private readonly VisitCounter _counter;
        public Page(VisitCounter counter) => _counter = counter;
        public int Visits => _counter.Count;
        public void Visit() => _counter.Increment();
    }
  options: ["2\n1", "1\n1", "3\n1", "2\n2"]
  answer: 0
  explanation: "`home` ו-`about` קיבלו את אותו מופע של `VisitCounter`, ולכן שני הביקורים נספרים באותו מונה (2). `contact` קיבל מונה משלו (1). כך עובד משך חיים משותף, כמו Singleton או Scoped: כל מי שמקבל את אותו מופע רואה את אותו מצב."
  optionExplanations:
    "1": "זה היה נכון אם כל דף היה מקבל מונה חדש. כאן שני הדפים הראשונים חולקים מונה."
    "2": "`contact` קיבל מונה נפרד, ולכן הביקור שלו לא נספר במונה המשותף."
    "3": "המונה של `contact` נפרד, ובו היה ביקור אחד בלבד."

- id: cs.software-design.dependency-injection.008
  type: bug
  difficulty: 2
  prompt: "`InvoiceService` אמורה לשמור כל חשבונית דרך ה-Repository שהוזרק לה, אבל `Issue` נכשלת ב-`NullReferenceException`. באיזו שורה הבאג?"
  code: |
    public interface IInvoiceRepository
    {
        void Save(int invoiceId, decimal amount);
    }

    public class InvoiceService
    {
        private readonly IInvoiceRepository _repository;

        public InvoiceService(IInvoiceRepository repository)
        {
            repository = _repository;
        }

        public void Issue(int invoiceId, decimal amount)
        {
            if (amount <= 0)
                throw new ArgumentException("Amount must be positive");
            _repository.Save(invoiceId, amount);
        }
    }
  answer: 12
  fixed: |
    public interface IInvoiceRepository
    {
        void Save(int invoiceId, decimal amount);
    }

    public class InvoiceService
    {
        private readonly IInvoiceRepository _repository;

        public InvoiceService(IInvoiceRepository repository)
        {
            _repository = repository;
        }

        public void Issue(int invoiceId, decimal amount)
        {
            if (amount <= 0)
                throw new ArgumentException("Amount must be positive");
            _repository.Save(invoiceId, amount);
        }
    }
  explanation: "ההשמה הפוכה: הפרמטר מקבל את ערך השדה (`null`) במקום שהשדה יקבל את התלות שהוזרקה. לכן `_repository` נשאר `null`. בהזרקה דרך בנאי השורה הנכונה היא תמיד `_field = parameter`."

- id: cs.software-design.dependency-injection.009
  type: hierarchy
  difficulty: 1
  prompt: "איזה ממשק מממשת כל מחלקה? חלק מהמחלקות משמשות באפליקציה וחלק בבדיקות."
  targets:
    - id: IEmailSender
      desc: שליחת מייל
    - id: IClock
      desc: השעה הנוכחית
    - id: IPaymentGateway
      desc: חיוב כרטיס אשראי
  items:
    - label: SmtpEmailSender
      answer: IEmailSender
      why: "המימוש האמיתי ששולח דרך שרת SMTP."
    - label: FakeEmailSender
      answer: IEmailSender
      why: "מימוש מדומה לבדיקות ששומר את ההודעות ברשימה במקום לשלוח. הוא מממש את אותו ממשק, ולכן אפשר להזריק אותו במקום האמיתי."
    - label: SystemClock
      answer: IClock
      why: "מחזיר את `DateTime.Now` האמיתי."
    - label: FixedClock
      answer: IClock
      why: "מחזיר תמיד אותה שעה, כדי שבדיקות יהיו צפויות."
    - label: SandboxPaymentGateway
      answer: IPaymentGateway
      why: "מימוש מול סביבת הבדיקות של ספק הסליקה, בלי חיוב אמיתי."
  explanation: "בגלל שהשירותים תלויים בממשקים, לכל ממשק יכולים להיות כמה מימושים: אמיתי לאפליקציה ומדומה (Fake) לבדיקות. השירות לא משתנה, רק מה שמוזרק לו."

- id: cs.software-design.dependency-injection.010
  type: architecture
  difficulty: 2
  prompt: "שבצו כל חתימה של מערכת תזכורות ה-SMS של מרפאת השיניים בקובץ המתאים."
  requirement: "מרפאת שיניים שולחת SMS תזכורת יום לפני כל תור. השירות מקבל את התלויות שלו בבנאי, ובבדיקות מחליפים את שולח ה-SMS האמיתי במימוש מדומה שרק סופר הודעות."
  targets:
    - id: Program.cs
      desc: "נקודת ההרכבה (Composition Root): רישום השירותים בקונטיינר"
    - id: Interfaces/ISmsSender.cs
      desc: החוזה לשליחת SMS
    - id: Infrastructure/HttpSmsSender.cs
      desc: שליחת SMS אמיתית דרך ספק חיצוני
    - id: Services/ReminderService.cs
      desc: לוגיקת התזכורות
    - id: Tests/ReminderServiceTests.cs
      desc: בדיקות יחידה עם שולח מדומה
  items:
    - label: "builder.Services.AddHttpClient<ISmsSender, HttpSmsSender>();"
      answer: Program.cs
      why: "חיבור הממשק למימוש נעשה במקום אחד, בנקודת הכניסה לאפליקציה."
    - label: "void Send(string phoneNumber, string text)"
      answer: Interfaces/ISmsSender.cs
      why: "חבר ממשק בלי משנה גישה ובלי גוף."
    - label: "public HttpSmsSender(HttpClient httpClient, IOptions<SmsOptions> options)"
      answer: Infrastructure/HttpSmsSender.cs
      why: "`HttpClient` והגדרות הספק הם פרטים טכניים של המימוש האמיתי."
    - label: "public int SendRemindersFor(DateOnly day)"
      answer: Services/ReminderService.cs
      why: "הלוגיקה: מוצאת את התורים של היום ושולחת תזכורת לכל אחד דרך `ISmsSender`."
    - label: "[Fact] public void SendRemindersFor_TwoAppointments_SendsTwoMessages()"
      answer: Tests/ReminderServiceTests.cs
      why: "מתודת בדיקה עם `[Fact]` ושם בתבנית מתודה_מצב_תוצאה."
    - label: "private sealed class CountingSmsSender : ISmsSender"
      answer: Tests/ReminderServiceTests.cs
      why: "מימוש מדומה שמשמש רק את הבדיקות, ולכן הוא מוגדר בקובץ הבדיקות ולא בקוד האפליקציה."
  explanation: "השירות תלוי רק ב-`ISmsSender`. בקוד האמיתי `Program.cs` מחבר אותו ל-`HttpSmsSender`, ובבדיקה מעבירים לבנאי `CountingSmsSender`. כך בודקים את הלוגיקה בלי לשלוח SMS אמיתי."

