- id: cs.software-design.design-patterns.001
  type: single
  difficulty: 1
  prompt: "באפליקציית ניווט המשתמש בוחר בזמן ריצה בין מסלול מהיר, מסלול קצר ומסלול בלי כבישי אגרה, ולכל אחד אלגוריתם חישוב אחר. איזו תבנית עיצוב מתאימה?"
  options:
    - "אסטרטגיה - Strategy"
    - "יחידון - Singleton"
    - "מתאם - Adapter"
    - "מאגר - Repository"
  answer: 0
  explanation: "תבנית אסטרטגיה (Strategy) מגדירה ממשק משותף, למשל `IRouteStrategy`, ומחלקה לכל אלגוריתם. הקוד שמשתמש בה מקבל אסטרטגיה ומחליף אותה בזמן ריצה בלי `if` על סוג המסלול."
  optionExplanations:
    "1": "Singleton מבטיח מופע אחד של מחלקה. הוא לא עוזר לבחור בין אלגוריתמים."
    "2": "Adapter מתרגם ממשק קיים לממשק שהקוד שלנו מצפה לו. כאן אין ממשק זר לתרגם."
    "3": "Repository מסתיר גישה לנתונים. בחירת מסלול היא אלגוריתם, לא אחסון."

- id: cs.software-design.design-patterns.002
  type: single
  difficulty: 1
  prompt: "איזו תבנית עיצוב ממומשת במחלקה `StockTicker`?"
  code: |
    public interface IStockObserver
    {
        void PriceChanged(string symbol, decimal price);
    }

    public class StockTicker
    {
        private readonly List<IStockObserver> _observers = new();

        public void Attach(IStockObserver observer) => _observers.Add(observer);

        public void UpdatePrice(string symbol, decimal price)
        {
            foreach (var observer in _observers)
                observer.PriceChanged(symbol, price);
        }
    }
  options:
    - "אסטרטגיה - Strategy"
    - "צופה - Observer"
    - "מפעל - Factory"
    - "מתאם - Adapter"
  answer: 1
  explanation: "בתבנית צופה (Observer) יש נושא (Subject) שמחזיק רשימת נרשמים ומודיע לכולם כשמשהו משתנה. `StockTicker` לא יודעת מי הנרשמים או מה הם עושים עם ההודעה, ולכן אפשר להוסיף נרשמים חדשים בלי לשנות אותה."
  optionExplanations:
    "0": "Strategy מחליפה אלגוריתם אחד. כאן מודיעים לכל הנרשמים, לא בוחרים אחד מהם."
    "2": "אין כאן יצירה של אובייקטים לפי פרמטר."
    "3": "אין כאן תרגום מממשק אחד לאחר."

- id: cs.software-design.design-patterns.003
  type: single
  difficulty: 2
  prompt: "`LegacyThermometer` מגיעה מספרייה חיצונית שאי אפשר לשנות. איזה תפקיד ממלאת `ThermometerSensor`?"
  code: |
    public interface ITemperatureSensor
    {
        double ReadCelsius();
    }

    public class LegacyThermometer
    {
        public double GetFahrenheit() => 98.6;
    }

    public class ThermometerSensor : ITemperatureSensor
    {
        private readonly LegacyThermometer _thermometer;

        public ThermometerSensor(LegacyThermometer thermometer) => _thermometer = thermometer;

        public double ReadCelsius() => (_thermometer.GetFahrenheit() - 32) * 5 / 9;
    }
  options:
    - "מפעל - Factory"
    - "צופה - Observer"
    - "יחידון - Singleton"
    - "מתאם - Adapter"
  answer: 3
  explanation: "מתאם (Adapter) עוטף מחלקה קיימת שהממשק שלה לא מתאים לנו, ומציג אותה דרך הממשק שהקוד שלנו מצפה לו. `ThermometerSensor` מממשת את `ITemperatureSensor` ומתרגמת את הקריאה ל-`GetFahrenheit` של הספרייה הישנה."
  optionExplanations:
    "0": "המחלקה לא יוצרת אובייקטים. היא מקבלת מדחום קיים ומתרגמת את הממשק שלו."
    "1": "אין כאן רשימת נרשמים או הודעה על שינוי."
    "2": "אין כאן הגבלה למופע אחד. אפשר ליצור כמה מתאמים שרוצים."

- id: cs.software-design.design-patterns.004
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    var calculator = new FareCalculator(new StudentDiscount());
    Console.WriteLine(calculator.Fare(20m));
    calculator.Discount = new NoDiscount();
    Console.WriteLine(calculator.Fare(20m));

    interface IDiscount
    {
        decimal Apply(decimal price);
    }

    class NoDiscount : IDiscount
    {
        public decimal Apply(decimal price) => price;
    }

    class StudentDiscount : IDiscount
    {
        public decimal Apply(decimal price) => price / 2;
    }

    class FareCalculator(IDiscount discount)
    {
        public IDiscount Discount { get; set; } = discount;
        public decimal Fare(decimal basePrice) => Discount.Apply(basePrice);
    }
  options: ["10\n20", "10\n10", "20\n20", "20\n10"]
  answer: 0
  explanation: "זו תבנית אסטרטגיה (Strategy): `FareCalculator` מפעילה את האסטרטגיה שמוחזקת כרגע. בקריאה הראשונה זו הנחת סטודנט (10), ואחרי החלפת האסטרטגיה בזמן ריצה מתקבל המחיר המלא (20). המחשבון עצמו לא השתנה."
  optionExplanations:
    "1": "ההחלפה ל-`NoDiscount` משפיעה על הקריאה השנייה, כי `Fare` קוראת את `Discount` בכל פעם מחדש."
    "2": "בקריאה הראשונה האסטרטגיה היא `StudentDiscount`, שמחלקת ב-2."
    "3": "זה הסדר ההפוך: ההנחה פעילה בהתחלה ומוסרת אחר כך."

- id: cs.software-design.design-patterns.005
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    var a = AppConfig.Instance;
    var b = AppConfig.Instance;
    a.Theme = "dark";
    Console.WriteLine(b.Theme);
    Console.WriteLine(AppConfig.Created);

    public sealed class AppConfig
    {
        public static int Created { get; private set; }
        public static AppConfig Instance { get; } = new AppConfig();
        public string Theme { get; set; } = "light";

        private AppConfig() => Created++;
    }
  options: ["dark\n1", "light\n1", "dark\n2", "light\n2"]
  answer: 0
  explanation: "זה יחידון (Singleton): הבנאי פרטי, והמופע היחיד נוצר פעם אחת באתחול של המאפיין הסטטי `Instance`. לכן `a` ו-`b` מצביעים על אותו אובייקט: השינוי דרך `a` נראה דרך `b`, והבנאי רץ פעם אחת בלבד."
  optionExplanations:
    "1": "`a` ו-`b` הם אותו מופע, ולכן השינוי ל-`dark` נראה גם דרך `b`."
    "2": "גישה ל-`Instance` לא יוצרת מופע חדש. המופע נוצר פעם אחת באתחול הסטטי."
    "3": "יש כאן מופע אחד בלבד, ולכן גם הערך וגם המונה שגויים."

- id: cs.software-design.design-patterns.006
  type: single
  difficulty: 2
  prompt: "מה היתרון העיקרי של `NotifierFactory` לקוד שמשתמש בה?"
  code: |
    public interface INotifier
    {
        void Notify(string user, string text);
    }

    public class EmailNotifier : INotifier
    {
        public void Notify(string user, string text) => Console.WriteLine($"Email to {user}: {text}");
    }

    public class SmsNotifier : INotifier
    {
        public void Notify(string user, string text) => Console.WriteLine($"SMS to {user}: {text}");
    }

    public static class NotifierFactory
    {
        public static INotifier Create(string channel) => channel switch
        {
            "email" => new EmailNotifier(),
            "sms" => new SmsNotifier(),
            _ => throw new ArgumentException($"Unknown channel: {channel}")
        };
    }
  options:
    - "הקוד הקורא מקבל `INotifier` ולא צריך לדעת איזו מחלקה קונקרטית נוצרת ואיך"
    - "המפעל מבטיח שבכל התוכנית יהיה רק מופע אחד של כל סוג התראה"
    - "המפעל שולח את ההודעה לכל הערוצים בבת אחת"
    - "המפעל ממיר ממשק של ספרייה חיצונית לממשק שלנו"
  answer: 0
  explanation: "מפעל (Factory) מרכז במקום אחד את ההחלטה איזה אובייקט ליצור. הקוד הקורא עובד רק מול `INotifier`, וכשמוסיפים ערוץ חדש משנים רק את המפעל ולא את כל המקומות שיוצרים התראות."
  optionExplanations:
    "1": "זה Singleton. כאן כל קריאה ל-`Create` יוצרת מופע חדש."
    "2": "זה מזכיר Observer. המפעל מחזיר ערוץ אחד בלבד ולא שולח דבר."
    "3": "זה Adapter. אין כאן ספרייה חיצונית עם ממשק אחר."

- id: cs.software-design.design-patterns.007
  type: cleaner
  difficulty: 2
  prompt: "בכל ספרינט מוסיפים תגובה חדשה לסיום הזמנה (מייל, SMS, נקודות מועדון ועוד). איזו גרסה מתאימה יותר לדרישה הזו?"
  options:
    - |
      var order = new Order(new EmailService(), new SmsService());
      order.Complete();

      public class EmailService
      {
          public void SendReceipt() => Console.WriteLine("email sent");
      }

      public class SmsService
      {
          public void SendReceipt() => Console.WriteLine("sms sent");
      }

      public class Order
      {
          private readonly EmailService _email;
          private readonly SmsService _sms;

          public Order(EmailService email, SmsService sms)
          {
              _email = email;
              _sms = sms;
          }

          public void Complete()
          {
              _email.SendReceipt();
              _sms.SendReceipt();
          }
      }
    - |
      var order = new Order();
      order.Subscribe(new EmailNotifier());
      order.Subscribe(new SmsNotifier());
      order.Complete();

      public interface IOrderListener
      {
          void OnCompleted();
      }

      public class EmailNotifier : IOrderListener
      {
          public void OnCompleted() => Console.WriteLine("email sent");
      }

      public class SmsNotifier : IOrderListener
      {
          public void OnCompleted() => Console.WriteLine("sms sent");
      }

      public class Order
      {
          private readonly List<IOrderListener> _listeners = new();

          public void Subscribe(IOrderListener listener) => _listeners.Add(listener);

          public void Complete()
          {
              foreach (var listener in _listeners)
                  listener.OnCompleted();
          }
      }
  answer: 1
  explanation: "בתבנית צופה (Observer) `Order` מודיעה לכל מי שנרשם, בלי להכיר אותם. תגובה חדשה היא מחלקה חדשה שמממשת `IOrderListener` ונרשמת, ו-`Order` לא משתנה. כשהדרישה היא להוסיף תגובות כל הזמן, זה היתרון המכריע."
  optionExplanations:
    "0": "`Order` מכירה כל שירות בשמו. כל תגובה חדשה מחייבת לשנות את הבנאי, את השדות ואת `Complete`."

- id: cs.software-design.design-patterns.008
  type: hierarchy
  difficulty: 2
  prompt: "בחרו את סוג היחס בין כל זוג מחלקות בתבניות Adapter ו-Strategy."
  targets:
    - id: is-a
      desc: ירושה - Inheritance
    - id: has-a
      desc: הרכבה - Composition
    - id: implements
      desc: מימוש ממשק - Implements
    - id: uses
      desc: שימוש - Dependency
  items:
    - label: "ThermometerAdapter ו-ITemperatureSensor"
      answer: implements
      why: "המתאם מציג את עצמו דרך הממשק שהמערכת מצפה לו."
    - label: "ThermometerAdapter ו-LegacyThermometer (מוחזק בשדה, והקריאות מועברות אליו)"
      answer: has-a
      why: "המתאם עוטף את המחלקה הישנה ומחזיק אותה. הוא לא יורש ממנה."
    - label: "WeatherReport ו-ITemperatureSensor (מתקבל רק כפרמטר במתודה Print)"
      answer: uses
      why: "הדוח לא שומר את החיישן, אלא משתמש בו רק בזמן הקריאה."
    - label: "ExpressShipping ו-ShippingStrategy (מחלקה מופשטת)"
      answer: is-a
      why: "משלוח מהיר הוא סוג של אסטרטגיית משלוח, ויורש מהמחלקה המופשטת."
  explanation: "תבניות עיצוב בנויות מאותם יחסים בסיסיים. Adapter מממש את הממשק שלנו ומחזיק (has-a) את המחלקה הזרה. Strategy יכולה להיות ממשק או מחלקה מופשטת שכל אסטרטגיה יורשת ממנה. שימוש זמני דרך פרמטר הוא תלות (Dependency)."

- id: cs.software-design.design-patterns.009
  type: architecture
  difficulty: 2
  prompt: "שבצו כל חתימה של מערכת התורים במרפאה בקובץ המתאים."
  requirement: "מרפאה: מטופל קובע תור של 20 דקות לרופא, ואסור ששני תורים של אותו רופא יחפפו. שכבת השירות ניגשת לתורים רק דרך תבנית Repository, ולכן היא לא מכירה SQL."
  targets:
    - id: Models/Appointment.cs
      desc: ישות התור והכללים שתלויים רק בזמנים שלו
    - id: Interfaces/IAppointmentRepository.cs
      desc: החוזה של מאגר התורים
    - id: Data/SqlAppointmentRepository.cs
      desc: מימוש המאגר מול SQL
    - id: Services/BookingService.cs
      desc: כללי קביעת תורים
  items:
    - label: "public class Appointment"
      answer: Models/Appointment.cs
      why: "הישות עצמה."
    - label: "public bool OverlapsWith(Appointment other)"
      answer: Models/Appointment.cs
      why: "מתודת מופע: «התור הזה חופף לתור אחר». היא משווה רק את זמני שני התורים, בלי מסד נתונים, ולכן שייכת לישות. השירות קורא לה על התורים שנשלפו."
    - label: "IReadOnlyList<Appointment> GetByDoctor(int doctorId, DateOnly day)"
      answer: Interfaces/IAppointmentRepository.cs
      why: "חבר ממשק (בלי משנה גישה ובלי גוף) לשליפת תורים."
    - label: "void Add(Appointment appointment)"
      answer: Interfaces/IAppointmentRepository.cs
      why: "חבר ממשק לשמירת תור."
    - label: "public SqlAppointmentRepository(string connectionString)"
      answer: Data/SqlAppointmentRepository.cs
      why: "רק המימוש מול SQL צריך מחרוזת חיבור."
    - label: "public Appointment Book(int patientId, int doctorId, DateTime start)"
      answer: Services/BookingService.cs
      why: "שולף את תורי הרופא דרך הממשק, בודק חפיפה ושומר. זה התהליך העסקי."
  explanation: "תבנית מאגר (Repository) מציגה לשירות אוסף של ישויות עם מתודות כמו `GetByDoctor` ו-`Add`, ומסתירה את SQL במימוש. השירות תלוי רק בממשק, ולכן אפשר לבדוק אותו עם מאגר בזיכרון."

- id: cs.software-design.design-patterns.010
  type: architecture
  difficulty: 3
  prompt: "שבצו כל חתימה של מודול התשלומים באפליקציית המשלוחים בקובץ המתאים."
  requirement: "אפליקציית משלוחי אוכל: הלקוח בוחר אמצעי תשלום (כרטיס אשראי או מזומן לשליח). כל אמצעי מחשב עמלה אחרת ומבצע את התשלום בדרך אחרת. שירות ההזמנות מקבל קוד של אמצעי תשלום ולא יודע איזו מחלקה עומדת מאחוריו."
  targets:
    - id: Payments/IPaymentMethod.cs
      desc: החוזה המשותף של אמצעי תשלום (Strategy)
    - id: Payments/CreditCardPayment.cs
      desc: תשלום בכרטיס אשראי
    - id: Payments/CashOnDeliveryPayment.cs
      desc: תשלום במזומן לשליח
    - id: Payments/PaymentMethodFactory.cs
      desc: יוצר את אמצעי התשלום לפי הקוד שהלקוח בחר
    - id: Orders/OrderService.cs
      desc: ביצוע הזמנה
  items:
    - label: "PaymentResult Pay(decimal amount)"
      answer: Payments/IPaymentMethod.cs
      why: "חבר ממשק שכל אמצעי תשלום מממש בדרכו."
    - label: "decimal Fee(decimal orderTotal)"
      answer: Payments/IPaymentMethod.cs
      why: "כל אמצעי מחשב עמלה אחרת, ולכן החתימה היא חלק מהחוזה המשותף."
    - label: "public static IPaymentMethod Create(string methodCode)"
      answer: Payments/PaymentMethodFactory.cs
      why: "מקבלת קוד ומחזירה את הממשק: זו מתודת המפעל."
    - label: "private bool IsCardExpired(DateOnly today)"
      answer: Payments/CreditCardPayment.cs
      why: "תוקף של כרטיס רלוונטי רק לתשלום באשראי."
    - label: "public decimal ChangeToReturn(decimal orderTotal, decimal paidByCustomer)"
      answer: Payments/CashOnDeliveryPayment.cs
      why: "עודף מחזירים רק בתשלום במזומן."
    - label: "public Order PlaceOrder(int customerId, IReadOnlyList<MenuItem> items, string paymentCode)"
      answer: Orders/OrderService.cs
      why: "השירות מקבל קוד, מבקש מהמפעל אמצעי תשלום ועובד מולו דרך הממשק."
  explanation: "שתי תבניות עובדות כאן יחד: כל אמצעי תשלום הוא אסטרטגיה (Strategy) שמממשת `IPaymentMethod`, והמפעל (Factory) בוחר ויוצר את האסטרטגיה לפי הקוד. שירות ההזמנות לא מכיר אף מחלקה קונקרטית, ולכן אמצעי תשלום חדש לא משנה אותו."

- id: cs.software-design.design-patterns.011
  type: architecture
  difficulty: 2
  prompt: "שבצו כל חתימה של מערכת התראות מזג האוויר בקובץ המתאים."
  requirement: "כשמהירות הרוח באזור עוברת 80 קילומטר לשעה, המערכת מודיעה לכל הנרשמים. היום יש שני נרשמים (SMS לתושבים ומפת חדר הבקרה), ובעתיד יתווספו עוד בלי לשנות את רכיב הניטור."
  targets:
    - id: Events/StormDetected.cs
      desc: נתוני האירוע
    - id: Events/IStormSubscriber.cs
      desc: החוזה של מי שרוצה לקבל התראות
    - id: Monitoring/WeatherMonitor.cs
      desc: מקבל מדידות ומודיע לנרשמים
    - id: Subscribers/SmsAlertSubscriber.cs
      desc: שולח SMS לתושבי האזור
    - id: Subscribers/MapDashboardSubscriber.cs
      desc: מסמן אזורים במפת חדר הבקרה
  items:
    - label: "public record StormDetected(string Region, int WindSpeedKmh, DateTime DetectedAt)"
      answer: Events/StormDetected.cs
      why: "הנתונים שעוברים מהמוניטור לנרשמים."
    - label: "void OnStorm(StormDetected storm)"
      answer: Events/IStormSubscriber.cs
      why: "חבר ממשק שכל נרשם מממש."
    - label: "public void Subscribe(IStormSubscriber subscriber)"
      answer: Monitoring/WeatherMonitor.cs
      why: "הנושא (Subject) מנהל את רשימת הנרשמים."
    - label: "public void ProcessReading(string region, int windSpeedKmh)"
      answer: Monitoring/WeatherMonitor.cs
      why: "בודק את הסף, ואם עברו אותו מודיע לכל הנרשמים."
    - label: "private string BuildSmsText(StormDetected storm)"
      answer: Subscribers/SmsAlertSubscriber.cs
      why: "ניסוח הודעת SMS הוא פרט של נרשם ה-SMS בלבד."
    - label: "private void HighlightRegion(string region)"
      answer: Subscribers/MapDashboardSubscriber.cs
      why: "סימון במפה הוא התגובה של נרשם המפה."
  explanation: "בתבנית צופה (Observer) המוניטור יודע רק ש«יש נרשמים» דרך `IStormSubscriber`. כל נרשם מחליט בעצמו מה לעשות עם `StormDetected`, ולכן הוספת נרשם חדש (למשל התראה באפליקציה) היא מחלקה חדשה בלבד."

- id: cs.software-design.design-patterns.012
  type: architecture
  difficulty: 3
  prompt: "שבצו כל חתימה של החיבור לחברת השליחויות בקובץ המתאים."
  requirement: "חנות עוברת לחברת שליחויות שהספרייה שלה מקבלת בקשות XML ומחזירה קוד מעקב כמחרוזת. המערכת שלנו מצפה ל-`IShippingProvider`, שמקבל כתובת ומשקל ומחזיר `ShipmentLabel`. את הספרייה של החברה אסור לשנות."
  targets:
    - id: Shipping/IShippingProvider.cs
      desc: החוזה שהמערכת שלנו מצפה לו
    - id: Vendor/LegacyCourierClient.cs
      desc: הספרייה של חברת השליחויות (אסור לשנות)
    - id: Shipping/LegacyCourierAdapter.cs
      desc: מתרגם בין החוזה שלנו לספרייה של החברה
    - id: Orders/ShipmentService.cs
      desc: שליחת הזמנות למשלוח
  items:
    - label: "ShipmentLabel CreateLabel(Address address, decimal weightKg)"
      answer: Shipping/IShippingProvider.cs
      why: "חבר ממשק בטיפוסים שלנו: כתובת, משקל ותווית."
    - label: "public string SendXmlRequest(string xml)"
      answer: Vendor/LegacyCourierClient.cs
      why: "ה-API הקיים של הספרייה: מחרוזת XML נכנסת ומחרוזת יוצאת."
    - label: "private string ToCourierXml(Address address, decimal weightKg)"
      answer: Shipping/LegacyCourierAdapter.cs
      why: "תרגום מהטיפוסים שלנו לפורמט של הספרייה הוא העבודה של המתאם."
    - label: "private ShipmentLabel ParseTrackingCode(string response)"
      answer: Shipping/LegacyCourierAdapter.cs
      why: "תרגום בכיוון ההפוך: מהתשובה של הספרייה לטיפוס שלנו."
    - label: "public ShipmentLabel ShipOrder(int orderId)"
      answer: Orders/ShipmentService.cs
      why: "השירות טוען את ההזמנה ומשתמש ב-`IShippingProvider` בלי לדעת שיש XML מאחוריו."
  explanation: "מתאם (Adapter) מממש את הממשק שלנו ועוטף את הספרייה הזרה. כל ההמרות, ל-XML ובחזרה, נמצאות בו, ולכן שאר המערכת לא יודעת על החברה הספציפית. מעבר לחברה אחרת יחייב מתאם חדש בלבד."

- id: cs.software-design.design-patterns.013
  type: truefalse
  difficulty: 2
  prompt: "כשקוד ניגש ישירות ל-`AppConfig.Instance` של Singleton, קשה להחליף את המופע במימוש מדומה בבדיקות יחידה."
  answer: true
  explanation: "גישה ישירה למאפיין סטטי קושרת את הקוד למחלקה הקונקרטית, ואין נקודה שבה אפשר להעביר מימוש אחר. לכן במערכות מודרניות מעדיפים לרשום את המחלקה כ-Singleton בקונטיינר ולהזריק אותה דרך ממשק: עדיין מופע אחד, אבל ניתן להחלפה."

- id: cs.software-design.design-patterns.014
  type: truefalse
  difficulty: 1
  prompt: "בתבנית Repository, שכבת השירות כותבת את שאילתות ה-SQL בעצמה ומעבירה אותן ל-Repository להרצה."
  answer: false
  explanation: "המטרה של Repository היא להסתיר את פרטי האחסון. השירות קורא למתודות כמו `FindByEmail(email)`, וה-Repository הוא שיודע לבנות ולהריץ את השאילתה. שירות שכותב SQL תלוי במסד הנתונים."

- id: cs.software-design.design-patterns.015
  type: single
  difficulty: 3
  prompt: "איזו תבנית מממשת המחלקה `TaxRules` עצמה?"
  code: |
    public interface ITaxRule
    {
        decimal Tax(decimal amount);
    }

    public class StandardTax : ITaxRule
    {
        public decimal Tax(decimal amount) => amount * 0.18m;
    }

    public class FreeZoneTax : ITaxRule
    {
        public decimal Tax(decimal amount) => 0m;
    }

    public static class TaxRules
    {
        public static ITaxRule For(string region) =>
            region == "free-zone" ? new FreeZoneTax() : new StandardTax();
    }
  options:
    - "אסטרטגיה - Strategy"
    - "מפעל - Factory"
    - "מתאם - Adapter"
    - "יחידון - Singleton"
  answer: 1
  explanation: "המימושים של `ITaxRule` הם אסטרטגיות, אבל `TaxRules` עצמה לא מחשבת מס: היא מחליטה איזה אובייקט ליצור ומחזירה אותו דרך הממשק. זה התפקיד של מפעל (Factory). שתי התבניות מופיעות כאן יחד, וחשוב להבחין מה התפקיד של כל מחלקה."
  optionExplanations:
    "0": "האסטרטגיות הן `StandardTax` ו-`FreeZoneTax`. `TaxRules` רק בוחרת ויוצרת אותן."
    "2": "אין כאן ממשק זר שמתורגם לממשק שלנו."
    "3": "כל קריאה ל-`For` יוצרת מופע חדש, ואין הגבלה למופע אחד."

- id: cs.software-design.design-patterns.016
  type: bug
  difficulty: 1
  prompt: "המחלקה `Logger` אמורה להיות Singleton: מופע אחד בלבד בכל התוכנית. איזו שורה צריך לתקן?"
  code: |
    public sealed class Logger
    {
        private static readonly Logger _instance = new Logger();
        private readonly List<string> _lines = new();

        public Logger() { }

        public static Logger Instance => _instance;

        public void Log(string message) => _lines.Add(message);

        public int Count => _lines.Count;
    }
  answer: 6
  fixed: |
    public sealed class Logger
    {
        private static readonly Logger _instance = new Logger();
        private readonly List<string> _lines = new();

        private Logger() { }

        public static Logger Instance => _instance;

        public void Log(string message) => _lines.Add(message);

        public int Count => _lines.Count;
    }
  explanation: "בנאי `public` מאפשר לכל אחד לכתוב `new Logger()` וליצור מופעים נוספים, כל אחד עם רשימת שורות משלו. ב-Singleton הבנאי חייב להיות `private`, כך שהדרך היחידה לקבל מופע היא `Logger.Instance`."
