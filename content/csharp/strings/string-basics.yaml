- id: cs.strings.string-basics.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    string s = "hello";
    Console.WriteLine(s.Length);
    Console.WriteLine(s[1]);
  options: ["5\ne", "5\nh", "6\ne", "4\ne"]
  answer: 0
  explanation: "`Length` מחזיר את מספר התווים במחרוזת, כאן 5. האינדקסים (Index) מתחילים מ-0, ולכן `s[1]` הוא התו השני, `e`."
  optionExplanations:
    "1": "`h` נמצא באינדקס 0. האינדקס הראשון במחרוזת הוא 0 ולא 1."
    "2": "ב-C# אין תו סיום נסתר שנספר ב-`Length`. במחרוזת `hello` יש בדיוק 5 תווים."
    "3": "`Length` הוא מספר התווים, לא האינדקס האחרון. האינדקס האחרון הוא `Length - 1`, כלומר 4."

- id: cs.strings.string-basics.002
  type: single
  difficulty: 1
  prompt: "נתון `string s = \"C#\";`. מה הטיפוס של הביטוי `s[0]`?"
  options: ["`char`", "`string`", "`int`", "`bool`"]
  answer: 0
  explanation: "גישה לאינדקס במחרוזת מחזירה תו בודד מטיפוס `char`, ולא מחרוזת באורך 1. ליטרל של תו נכתב בגרשיים בודדים (`'C'`), וליטרל של מחרוזת במירכאות כפולות (`\"C\"`)."
  optionExplanations:
    "1": "מחרוזת היא אוסף של תווים, ואיבר בודד שלה הוא `char`. זה ההבדל מ-Python, שבה תו בודד הוא מחרוזת."
    "2": "`char` אפשר להמיר ל-`int` (קוד התו), אבל הטיפוס של `s[0]` עצמו הוא `char`."

- id: cs.strings.string-basics.004
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    char c = 'A';
    Console.WriteLine(c + 1);
    Console.WriteLine((char)(c + 1));
  options: ["66\nB", "B\nB", "A1\nA1", "66\n66"]
  answer: 0
  explanation: "`char` הוא בעצם מספר (קוד התו). `c + 1` הוא חיבור מספרי שתוצאתו `int`: הקוד של `A` הוא 65, ולכן מודפס 66. רק המרה מפורשת (Cast) חזרה ל-`char` מחזירה תו, `B`."
  optionExplanations:
    "1": "חיבור של `char` ו-`int` מחזיר `int`, לא `char`. בלי המרה מפורשת מודפס מספר."
    "2": "`A1` היה מתקבל מחיבור למחרוזת, למשל `\"A\" + 1`. כאן `c` הוא `char`, וזה חיבור מספרי."
    "3": "ההמרה `(char)` הופכת את 66 חזרה לתו `B`, ולכן השורה השנייה היא אות."

- id: cs.strings.string-basics.005
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    Console.WriteLine('a' + 'b' + "c");
    Console.WriteLine("c" + 'a' + 'b');
  options: ["195c\ncab", "abc\ncab", "195c\nc195", "abc\nc195"]
  answer: 0
  explanation: "האופרטור `+` מחושב משמאל לימין. בשורה הראשונה מחושב קודם `'a' + 'b'`: שני `char`, ולכן חיבור מספרי 97 + 98 = 195, ורק אחר כך שרשור (Concatenation) עם `\"c\"`. בשורה השנייה הצד השמאלי הוא כבר `string`, ולכן כל `+` אחריו משרשר את התווים כטקסט."
  optionExplanations:
    "1": "סדר החישוב הוא משמאל לימין: `'a' + 'b'` מחושב לפני שמופיעה מחרוזת, ולכן הוא חיבור מספרי."
    "2": "אחרי `\"c\" + 'a'` התוצאה היא `string`, ולכן גם `'b'` משורשר כתו ולא מתחבר כמספר."
    "3": "שתי הטעויות יחד: בשורה הראשונה התווים מחוברים כמספרים, ובשנייה הם משורשרים אחרי המחרוזת."

- id: cs.strings.string-basics.007
  type: output
  difficulty: 2
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    string s = "cat";
    s[0] = 'b';
    Console.WriteLine(s);
  options: ["שגיאת קומפילציה", "bat", "cat", "IndexOutOfRangeException"]
  answer: 0
  explanation: "האינדקסר (Indexer) של `string` הוא לקריאה בלבד, כי מחרוזות הן Immutable. הקומפיילר דוחה את ההשמה `s[0] = 'b'`. כדי לקבל `bat` יוצרים מחרוזת חדשה, למשל `s = \"b\" + s.Substring(1);`."
  optionExplanations:
    "1": "זה היה עובד עם מערך `char[]`, אבל לא עם `string`. אי אפשר לשנות תו בתוך מחרוזת קיימת."
    "2": "השגיאה נתפסת כבר בקומפילציה, ולכן התוכנית לא רצה בכלל."
    "3": "האינדקס 0 תקין. הבעיה היא ההשמה עצמה, והיא נתפסת לפני הריצה."

- id: cs.strings.string-basics.009
  type: bug
  difficulty: 1
  prompt: הקוד אמור לספור כמה פעמים מופיע התו `a` במילה. איזו שורה צריך לתקן?
  code: |
    string word = "banana";
    int count = 0;
    for (int i = 0; i <= word.Length; i++)
    {
        if (word[i] == 'a')
        {
            count++;
        }
    }
    Console.WriteLine(count);
  answer: 3
  explanation: "האינדקס האחרון הוא `word.Length - 1`. התנאי `i <= word.Length` מגיע גם ל-`word[6]`, ונזרקת `IndexOutOfRangeException`. זו שגיאת סטייה באחד (Off-by-one), והתיקון הוא `<`."
  fixed: |
    string word = "banana";
    int count = 0;
    for (int i = 0; i < word.Length; i++)
    {
        if (word[i] == 'a')
        {
            count++;
        }
    }
    Console.WriteLine(count);

- id: cs.strings.string-basics.010
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    string s = "abc";
    Console.WriteLine(s[s.Length - 1]);
    Console.WriteLine(s[s.Length]);
  options: ["c\nIndexOutOfRangeException", "c\nArgumentOutOfRangeException", "c", "b\nc"]
  answer: 0
  explanation: "`s.Length` הוא 3, ולכן `s[2]` הוא `c`. האינדקס 3 כבר מחוץ למחרוזת, והאינדקסר של `string` זורק `IndexOutOfRangeException`. C# לא מחזירה ערך ריק במקרה כזה."
  optionExplanations:
    "1": "`ArgumentOutOfRangeException` נזרקת ממתודות כמו `Substring`. גישה ישירה עם `[]` זורקת `IndexOutOfRangeException`."
    "2": "גישה מחוץ לגבולות לא מדפיסה שורה ריקה. היא זורקת חריגה (Exception)."
    "3": "`s.Length - 1` הוא 2, וזה האינדקס של התו האחרון, `c`."

- id: cs.strings.string-basics.013
  type: truefalse
  difficulty: 2
  prompt: "`'A'` ו-`\"A\"` הם אותו ערך ב-C#, ולכן הביטוי `'A' == \"A\"` מחזיר `true`."
  answer: false
  explanation: "`'A'` הוא `char` ו-`\"A\"` הוא `string`, שני טיפוסים שונים. לא מוגדר `==` בין `char` ל-`string`, ולכן הביטוי בכלל לא מתקמפל. כדי להשוות ממירים קודם, למשל `'A'.ToString() == \"A\"`."

- id: cs.strings.string-basics.016
  type: cleaner
  difficulty: 2
  prompt: כל הגרסאות מדפיסות את התו האחרון במילה. איזו גרסה נקייה יותר?
  options:
    - |
      string word = "pencil";
      char last = word[word.Length - 1];
      Console.WriteLine(last);
    - |
      string word = "pencil";
      char last = ' ';
      for (int i = 0; i < word.Length; i++)
      {
          last = word[i];
      }
      Console.WriteLine(last);
  answer: 0
  explanation: "התו האחרון נמצא תמיד באינדקס `Length - 1`, ולכן אפשר לגשת אליו ישירות. הגישה הישירה אומרת בדיוק מה רוצים: \"התו האחרון\"."
  optionExplanations:
    "1": "מעבר על כל התווים כדי למצוא את האחרון מסתיר את הכוונה ועושה עבודה מיותרת."

- id: cs.strings.string-basics.017
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    string s = "Shalom";
    Console.WriteLine(s[0]);
    Console.WriteLine(s.Length);
  options: ["S\n6", "h\n6", "S\n5", "Shalom\n6"]
  answer: 0
  explanation: "האינדקסים במחרוזת מתחילים מ-0, ולכן `s[0]` הוא התו הראשון, `S`. `Length` הוא מספר התווים: 6."
  optionExplanations:
    "1": "`h` נמצא באינדקס 1. האינדקס הראשון הוא 0."
    "2": "`Length` סופר את כל התווים, 6. האינדקס האחרון הוא 5."
    "3": "`s[0]` הוא תו אחד, לא המחרוזת כולה."

- id: cs.strings.string-basics.018
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    string word = "level";
    int count = 0;
    for (int i = 0; i < word.Length; i++)
    {
        if (word[i] == 'e')
            count++;
    }
    Console.WriteLine(count);
  options: ["2", "1", "5", "3"]
  answer: 0
  explanation: "הלולאה עוברת על כל תו במחרוזת לפי האינדקס, ו-`count` גדל בכל פעם שהתו הוא `'e'`. ב-`level` יש שני מופעים של `e`, באינדקסים 1 ו-3."
  optionExplanations:
    "1": "הלולאה ממשיכה עד סוף המחרוזת, ולא עוצרת במופע הראשון."
    "2": "5 הוא אורך המילה. המונה גדל רק כשהתו הוא `'e'`."
    "3": "יש במילה שני `e` ושני `l`, אבל רק `e` נספר."

- id: cs.strings.string-basics.019
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    string s = "abc";
    for (int i = s.Length - 1; i >= 0; i--)
    {
        Console.Write(s[i]);
    }
  options: ["cba", "abc", "cb", "IndexOutOfRangeException"]
  answer: 0
  explanation: "הלולאה מתחילה מהאינדקס האחרון, `Length - 1` (כלומר 2), ויורדת עד 0 כולל. לכן התווים מודפסים מהסוף להתחלה."
  optionExplanations:
    "1": "הלולאה רצה מהסוף להתחלה, כי `i` מתחיל ב-2 ויורד."
    "2": "התנאי `i >= 0` כולל את האינדקס 0, ולכן גם `a` מודפס."
    "3": "האינדקס הגבוה ביותר הוא `Length - 1`, שהוא אינדקס חוקי."

- id: cs.strings.string-basics.020
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    string a = "cat";
    string b = "c" + "at";
    Console.WriteLine(a == b);
  options: ["True", "False", "cat", "שגיאת קומפילציה"]
  answer: 0
  explanation: "ב-C# האופרטור `==` בין שתי מחרוזות משווה את התוכן שלהן, תו אחרי תו. `\"c\" + \"at\"` הוא `\"cat\"`, ולכן התוצאה `True`."
  optionExplanations:
    "1": "`==` על מחרוזות ב-C# משווה תוכן, ולכן שתי מחרוזות עם אותם תווים שוות."
    "2": "`a == b` הוא ביטוי השוואה, והתוצאה שלו `bool`."
    "3": "השוואה של שתי מחרוזות עם `==` חוקית."

- id: cs.strings.string-basics.021
  type: bug
  difficulty: 2
  prompt: "הקוד אמור לבדוק אם המילה היא פלינדרום (נקראת אותו דבר משני הכיוונים) ולהדפיס `True` עבור `noon`. בפועל התוכנית קורסת. איזו שורה צריך לתקן?"
  code: |
    string s = "noon";
    bool isPalindrome = true;
    for (int i = 0; i < s.Length / 2; i++)
    {
        if (s[i] != s[s.Length - i])
            isPalindrome = false;
    }
    Console.WriteLine(isPalindrome);
  answer: 5
  explanation: "כש-`i` הוא 0, הביטוי `s.Length - i` הוא 4, אבל האינדקס האחרון הוא 3, ולכן נזרקת `IndexOutOfRangeException`. התו שמול `s[i]` נמצא באינדקס `s.Length - 1 - i`."
  fixed: |
    string s = "noon";
    bool isPalindrome = true;
    for (int i = 0; i < s.Length / 2; i++)
    {
        if (s[i] != s[s.Length - 1 - i])
            isPalindrome = false;
    }
    Console.WriteLine(isPalindrome);

- id: cs.strings.string-basics.022
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    string s = "";
    for (int i = 0; i < 3; i++)
    {
        s = s + i;
    }
    Console.WriteLine(s);
    Console.WriteLine(s.Length);
  options: ["012\n3", "3\n1", "012\n6", "0\n1"]
  answer: 0
  explanation: "`s` הוא מחרוזת, ולכן `s + i` משרשר את הספרה לסוף המחרוזת. בכל סיבוב נוצרת מחרוזת חדשה ארוכה יותר: `\"0\"`, `\"01\"`, `\"012\"`. האורך הוא 3 תווים."
  optionExplanations:
    "1": "`s` מתחיל כמחרוזת ריקה, ולכן `+` משרשר ולא מחבר."
    "2": "`Length` סופר תווים: יש 3 תווים, `0`, `1` ו-`2`."
    "3": "ההצבה `s = s + i` שומרת את התוצאה, ולכן המחרוזת מתארכת בכל סיבוב."

- id: cs.strings.string-basics.023
  type: single
  difficulty: 1
  prompt: "למחרוזת `s` יש `n` תווים. מה האינדקס של התו האחרון שלה?"
  options: ["`n - 1`", "`n`", "`n + 1`", "`1`"]
  answer: 0
  explanation: "האינדקסים מתחילים מ-0, ולכן מחרוזת באורך `n` משתמשת באינדקסים 0 עד `n - 1`. ניסיון לגשת ל-`s[n]` זורק `IndexOutOfRangeException`."
  optionExplanations:
    "1": "`s[n]` מחוץ לגבולות. האינדקס האחרון קטן ב-1 מהאורך."
    "2": "`n + 1` רחוק עוד יותר מהסוף."
    "3": "1 הוא האינדקס של התו השני."
