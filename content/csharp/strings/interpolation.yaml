- id: cs.strings.interpolation.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    string name = "Dana";
    int age = 30;
    Console.WriteLine($"{name} is {age} years old");
    Console.WriteLine("{name} is {age} years old");
  options:
    - "Dana is 30 years old\n{name} is {age} years old"
    - "Dana is 30 years old\nDana is 30 years old"
    - "{name} is {age} years old\n{name} is {age} years old"
    - "Dana is 30 years old\nname is age years old"
  answer: 0
  explanation: "רק מחרוזת שמתחילה ב-`$` היא מחרוזת אינטרפולציה (String Interpolation), שבה ביטוי בתוך `{}` מוחלף בערכו. בלי `$` הסוגריים המסולסלים הם טקסט רגיל ומודפסים כמו שהם."
  optionExplanations:
    "1": "בלי הקידומת `$` הקומפיילר לא מחליף כלום, והטקסט `{name}` מודפס כפשוטו."
    "2": "בשורה הראשונה יש `$`, ולכן `{name}` ו-`{age}` מוחלפים בערכים."
    "3": "בלי `$` הסוגריים המסולסלים לא נעלמים. הם חלק מהטקסט."

- id: cs.strings.interpolation.002
  type: single
  difficulty: 1
  prompt: "איזו קידומת לפני מחרוזת מאפשרת לשלב בתוכה ביטויים, כמו `{total}`?"
  options: ["`$`", "`@`", "`#`", "`&`"]
  answer: 0
  explanation: "`$` הופכת מחרוזת למחרוזת אינטרפולציה (Interpolated String): כל ביטוי בין `{` ל-`}` מחושב ומוכנס לטקסט."
  optionExplanations:
    "1": "`@` יוצרת מחרוזת מילולית (Verbatim String), שבה `\\` הוא תו רגיל. היא לא מחליפה ביטויים."
    "2": "`#` משמש להנחיות קדם־מעבד (Preprocessor Directives) כמו `#region`, לא למחרוזות."

- id: cs.strings.interpolation.007
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    Console.WriteLine("one\\two");
    Console.WriteLine("say \"hi\"");
    Console.WriteLine("a\nb");
  options:
    - |
      one\two
      say "hi"
      a
      b
    - |
      one\\two
      say \"hi\"
      a\nb
    - |
      one\two
      say "hi"
      a\nb
    - |
      onetwo
      say hi
      a
      b
  answer: 0
  explanation: "תווי בריחה (Escape Sequences) מתחילים ב-`\\` ומייצגים תו אחד: `\\\\` הוא לוכסן הפוך אחד, `\\\"` הוא מירכאה בתוך המחרוזת, ו-`\\n` הוא ירידת שורה. בפלט מופיע התו עצמו, לא רצף הבריחה."
  optionExplanations:
    "1": "רצפי הבריחה קיימים רק בקוד המקור. בזמן ריצה כל רצף הוא תו אחד, והוא מה שמודפס."
    "2": "`\\n` הוא תו ירידת שורה, ולכן `a` ו-`b` מודפסים בשתי שורות."
    "3": "`\\\\` ו-`\\\"` לא מוחקים את התו. הם מכניסים לוכסן ומירכאה למחרוזת."

- id: cs.strings.interpolation.009
  type: cleaner
  difficulty: 1
  prompt: כל הגרסאות מדפיסות את אותה שורה. איזו גרסה נקייה יותר?
  options:
    - |
      string name = "Noa";
      int quantity = 3;
      int total = 60;
      Console.WriteLine($"{name} ordered {quantity} items for {total}");
    - |
      string name = "Noa";
      int quantity = 3;
      int total = 60;
      Console.WriteLine(name + " ordered " + quantity + " items for " + total);
    - |
      string name = "Noa";
      int quantity = 3;
      int total = 60;
      Console.Write(name);
      Console.Write(" ordered ");
      Console.Write(quantity);
      Console.Write(" items for ");
      Console.WriteLine(total);
  answer: 0
  explanation: "באינטרפולציה כל ערך כתוב בדיוק במקום שבו הוא מופיע במשפט, ולכן קל לקרוא את השורה כמו שתיראה בפלט."
  optionExplanations:
    "1": "שרשור עם `+` מפזר את המשפט בין מירכאות רבות, וקל לשכוח רווח."
    "2": "חמש פקודות הדפסה לשורה אחת מסתירות את המשפט השלם."

- id: cs.strings.interpolation.010
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס `Total: 12`. איזו שורה צריך לתקן?"
  code: |
    int total = 5 + 7;
    Console.WriteLine("Total: {total}");
  answer: 2
  explanation: "חסרה הקידומת `$`. בלי `$` המחרוזת רגילה, ומודפס הטקסט `Total: {total}` כמו שהוא. הקוד מתקמפל, ולכן הבאג מתגלה רק בהרצה."
  fixed: |
    int total = 5 + 7;
    Console.WriteLine($"Total: {total}");

- id: cs.strings.interpolation.014
  type: truefalse
  difficulty: 2
  prompt: "בתוך הסוגריים המסולסלים של מחרוזת אינטרפולציה אפשר לכתוב ביטוי שלם, למשל `$\"{a + b}\"` או `$\"{name.Length}\"`, ולא רק שם של משתנה."
  answer: true
  explanation: "כל ביטוי חוקי יכול להופיע בתוך `{}`: חישוב, גישה ל-`Length` או אינדקס. הערך מחושב ומוכנס למחרוזת במקום הסוגריים."

- id: cs.strings.interpolation.017
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    int a = 3;
    int b = 4;
    Console.WriteLine($"{a} + {b} = {a + b}");
  options: ["3 + 4 = 7", "3 + 4 = 34", "{a} + {b} = {a + b}", "7 = 7"]
  answer: 0
  explanation: "באינטרפולציה כל ביטוי בתוך `{}` מחושב ומוכנס למחרוזת. הסימן `+` שמחוץ לסוגריים הוא חלק מהטקסט, ואילו `{a + b}` הוא חיבור של מספרים ונותן 7."
  optionExplanations:
    "1": "`a + b` בתוך הסוגריים הוא חיבור של שני `int`, ולא שרשור."
    "2": "הקידומת `$` גורמת להחלפת הביטויים בערכים שלהם."
    "3": "הטקסט שמחוץ לסוגריים מודפס כמו שהוא, כולל `+` ו-`=`."

- id: cs.strings.interpolation.018
  type: single
  difficulty: 1
  prompt: "איזה רצף בתוך מחרוזת יוצר ירידת שורה?"
  options: ["`\\n`", "`\\t`", "`/n`", "`\\\\`"]
  answer: 0
  explanation: "תו בריחה (Escape Character) מתחיל בלוכסן הפוך `\\`. `\\n` הוא ירידת שורה (New Line), `\\t` הוא טאב, ו-`\\\\` הוא הלוכסן ההפוך עצמו."
  optionExplanations:
    "1": "`\\t` הוא טאב, רווח אופקי, ולא ירידת שורה."
    "2": "תווי בריחה מתחילים בלוכסן הפוך `\\`, לא בלוכסן רגיל."
    "3": "`\\\\` מדפיס לוכסן הפוך אחד."

- id: cs.strings.interpolation.019
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    Console.WriteLine("Line1\nLine2");
    Console.WriteLine("End");
  options: ["Line1\nLine2\nEnd", "Line1\\nLine2\nEnd", "Line1Line2\nEnd", "Line1\nLine2End"]
  answer: 0
  explanation: "`\\n` בתוך המחרוזת הוא תו ירידת שורה, ולכן `Line1` ו-`Line2` מודפסים בשתי שורות. `WriteLine` מוסיפה ירידת שורה בסוף, ולכן `End` בשורה שלישית."
  optionExplanations:
    "1": "`\\n` לא מודפס כשני תווים. הוא תו אחד של ירידת שורה."
    "2": "`\\n` יוצר ירידת שורה בין שני החלקים."
    "3": "`WriteLine` מוסיפה ירידת שורה אחרי `Line2`."

- id: cs.strings.interpolation.020
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int x = 5;
    Console.WriteLine($"{x}{x}");
    Console.WriteLine($"{x + x}");
  options: ["55\n10", "10\n10", "55\n55", "xx\nx + x"]
  answer: 0
  explanation: "`{x}{x}` הם שני ביטויים נפרדים שכל אחד מוכנס כטקסט, זה אחר זה: `55`. `{x + x}` הוא ביטוי אחד, חיבור של מספרים, ולכן מוכנס 10."
  optionExplanations:
    "1": "בשורה הראשונה אין חיבור. כל `{x}` מוחלף ב-5 בנפרד."
    "2": "בשורה השנייה `x + x` מחושב כחיבור של `int`, ולכן 10."
    "3": "הקידומת `$` מחליפה את הביטויים בערכים שלהם."

- id: cs.strings.interpolation.021
  type: bug
  difficulty: 1
  prompt: "הקוד אמור להדפיס `Score: 90`. איזו שורה צריך לתקן?"
  code: |
    int score = 90;
    Console.WriteLine($"Score: score");
  answer: 2
  explanation: "באינטרפולציה רק מה שבתוך סוגריים מסולסלים מוחלף בערך. בלי `{}` המילה `score` היא טקסט רגיל, ומודפס `Score: score`. צריך לכתוב `{score}`."
  fixed: |
    int score = 90;
    Console.WriteLine($"Score: {score}");

- id: cs.strings.interpolation.022
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    int i = 2;
    Console.WriteLine($"{i}{i++}{i}");
  options: ["223", "222", "233", "333"]
  answer: 0
  explanation: "הביטויים מחושבים משמאל לימין. הראשון הוא 2. `i++` מחזיר את הערך הנוכחי (2) ורק אז מגדיל את `i` ל-3. הביטוי השלישי כבר רואה 3. לכן `223`."
  optionExplanations:
    "1": "`i++` מגדיל את `i` מיד אחרי שהערך נקרא, ולכן הביטוי השלישי רואה 3."
    "2": "`i++` מחזיר את הערך שלפני ההגדלה, 2 ולא 3."
    "3": "הביטוי הראשון מחושב לפני ההגדלה."

- id: cs.strings.interpolation.023
  type: truefalse
  difficulty: 1
  prompt: "בתוך מחרוזת רגילה, בלי הקידומת `$`, הטקסט `{age}` מוחלף בערך של המשתנה `age`."
  answer: false
  explanation: "רק מחרוזת עם הקידומת `$` היא מחרוזת אינטרפולציה. במחרוזת רגילה הסוגריים המסולסלים הם תווים כמו כל תו אחר, ומודפסים כמו שהם."

- id: cs.strings.interpolation.024
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    double avg = 7 / 2;
    Console.WriteLine($"Average: {avg}");
  options: ["Average: 3", "Average: 3.5", "Average: 3.0", "Average: {avg}"]
  answer: 0
  explanation: "`7 / 2` היא חלוקה בין שני `int`, ולכן התוצאה 3 עוד לפני שהיא נשמרת ב-`double`. האינטרפולציה רק מציגה את הערך, ו-`double` שלם מודפס בלי נקודה: `3`."
  optionExplanations:
    "1": "החלוקה שלמה, כי 7 ו-2 הם `int`. צריך `7 / 2.0` כדי לקבל 3.5."
    "2": "`double` שלם מודפס בלי `.0`."
    "3": "הקידומת `$` מחליפה את `{avg}` בערך."

- id: cs.strings.interpolation.025
  type: single
  difficulty: 2
  prompt: "איזו שורה מדפיסה בדיוק `Path: C:\\Temp`?"
  options:
    - "`Console.WriteLine(\"Path: C:\\\\Temp\");`"
    - "`Console.WriteLine(\"Path: C:\\Temp\");`"
    - "`Console.WriteLine(\"Path: C:/Temp\");`"
    - "`Console.WriteLine(\"Path: C:\\\\\\\\Temp\");`"
  answer: 0
  explanation: "הלוכסן ההפוך `\\` פותח תו בריחה, ולכן כדי להדפיס לוכסן הפוך אחד כותבים שניים: `\\\\`. `\\T` אינו תו בריחה מוכר, ולכן הוא שגיאת קומפילציה."
  optionExplanations:
    "1": "`\\T` אינו תו בריחה חוקי, והקוד לא מתקמפל."
    "2": "זה מדפיס לוכסן רגיל `/`, לא לוכסן הפוך."
    "3": "ארבעה לוכסנים הפוכים מדפיסים שניים."

- id: cs.strings.interpolation.026
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    string first = "Dana";
    string last = "Levi";
    Console.WriteLine($"{last}, {first}");
  options: ["Levi, Dana", "Dana, Levi", "{last}, {first}", "LeviDana"]
  answer: 0
  explanation: "הערכים מוכנסים בדיוק במקום שבו כתובים הסוגריים, ולפי הסדר שלהם במחרוזת. הפסיק והרווח הם טקסט רגיל ומודפסים כמו שהם."
  optionExplanations:
    "1": "הסדר נקבע לפי המיקום בתוך המחרוזת: `{last}` ראשון."
    "2": "הקידומת `$` מחליפה את הסוגריים בערכים."
    "3": "הפסיק והרווח שבין הסוגריים נשארים בפלט."
