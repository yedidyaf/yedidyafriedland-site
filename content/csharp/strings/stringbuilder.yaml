- id: cs.strings.stringbuilder.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    using System.Text;

    var sb = new StringBuilder();
    sb.Append("Hello");
    sb.Append(' ');
    sb.Append("World");
    Console.WriteLine(sb.ToString());
    Console.WriteLine(sb.Length);
  options: ["Hello World\n11", "HelloWorld\n10", "Hello World\n3", "Hello World\n16"]
  answer: 0
  explanation: "`Append` מוסיפה טקסט לסוף אותו אובייקט `StringBuilder`, ו-`ToString` מחזירה את המחרוזת שנבנתה. `Length` הוא מספר התווים שנבנו בפועל: 5 + 1 + 5 = 11."
  optionExplanations:
    "1": "גם התו `' '` נוסף ונספר. `Append` מוסיפה בדיוק את מה שהועבר לה."
    "2": "`Length` סופר תווים, לא מספר קריאות ל-`Append`."
    "3": "16 היא הקיבולת ההתחלתית (Capacity) של `StringBuilder` ריק, גודל המאגר הפנימי. `Length` הוא מספר התווים שבאמת נמצאים בו."

- id: cs.strings.stringbuilder.002
  type: single
  difficulty: 1
  prompt: "למה שרשור מחרוזת עם `+=` בתוך לולאה ארוכה הוא יקר?"
  options:
    - "כל `+=` יוצר מחרוזת חדשה ומעתיק אליה את כל התווים שנצברו עד עכשיו"
    - "`string` הוא טיפוס ערך, ולכן כל השמה מעתיקה אותו במחסנית"
    - "`+=` נועל את המחרוזת כדי שתהליכונים אחרים לא ישנו אותה"
    - "הקומפיילר לא מסוגל לקמפל `+=` בתוך לולאה, ולכן הוא מפורש בזמן ריצה"
  answer: 0
  explanation: "מחרוזות הן בלתי ניתנות לשינוי (Immutable), ולכן `s += x` לא מאריך את `s` אלא בונה מחרוזת חדשה ומעתיק אליה את הכול. ככל שהמחרוזת גדלה, כל איטרציה מעתיקה יותר תווים. `StringBuilder` מחזיק מאגר (Buffer) שניתן לשינוי ומוסיף אליו בלי להעתיק מחדש בכל פעם."
  optionExplanations:
    "1": "`string` הוא טיפוס הפניה. העלות נובעת מיצירת מחרוזת חדשה והעתקת התוכן, לא מהעתקת ההפניה."
    "2": "אין נעילה בשרשור. מחרוזת לא יכולה להשתנות בכלל, ולכן אין צורך לנעול אותה."
    "3": "`+=` מתקמפל כרגיל לקריאה ל-`string.Concat`. הבעיה היא כמות ההעתקות, לא הקומפילציה."

- id: cs.strings.stringbuilder.003
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    using System.Text;

    var sb = new StringBuilder("abcdef");
    sb.Insert(0, "X");
    sb.Remove(2, 3);
    Console.WriteLine(sb);
  options: ["Xaef", "Xabf", "Xacdef", "abcdef"]
  answer: 0
  explanation: "אחרי `Insert(0, \"X\")` התוכן הוא `Xabcdef`. `Remove(2, 3)` מוחקת שלושה תווים החל מאינדקס 2, כלומר `b`, `c` ו-`d`, ונשאר `Xaef`. הפעולות משנות את האובייקט עצמו, כל אחת על התוצאה של הקודמת."
  optionExplanations:
    "1": "זו התוצאה אם המחיקה מתבצעת לפני ההוספה. הפעולות רצות לפי הסדר, ואחרי ה-`Insert` כל האינדקסים זזים באחד."
    "2": "הפרמטר השני של `Remove` הוא מספר התווים למחיקה, לא אינדקס סיום."
    "3": "בניגוד ל-`string`, `StringBuilder` הוא ניתן לשינוי (Mutable): `Insert` ו-`Remove` משנות אותו גם בלי השמה."

- id: cs.strings.stringbuilder.004
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    using System.Text;

    var a = new StringBuilder("hi");
    var b = a;
    b.Append("!");
    Console.WriteLine(a);
    string s = "hi";
    string t = s;
    t += "!";
    Console.WriteLine(s);
  options: ["hi!\nhi", "hi\nhi", "hi!\nhi!", "hi\nhi!"]
  answer: 0
  explanation: "`a` ו-`b` מפנים לאותו `StringBuilder`, ו-`Append` משנה אותו, ולכן גם `a` רואה `hi!`. עם `string` הפעולה `t += \"!\"` יוצרת מחרוזת חדשה ומפנה אליה את `t` בלבד, ו-`s` ממשיך להפנות ל-`hi`."
  optionExplanations:
    "1": "`b = a` לא מעתיק את ה-`StringBuilder`, אלא את ההפניה אליו. יש אובייקט אחד ושני שמות."
    "2": "`+=` על `string` לא משנה את המחרוזת הקיימת. `s` לא מושפע."
    "3": "ההתנהגות הפוכה: האובייקט המשותף שמשתנה הוא ה-`StringBuilder`, והמחרוזת היא זו שלא משתנה."

- id: cs.strings.stringbuilder.005
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    using System.Text;

    var sb = new StringBuilder();
    sb.Append("a").Append(1).Append(true);
    Console.WriteLine(sb.ToString());
  options: ["a1True", "a1true", "a11", "שגיאת קומפילציה"]
  answer: 0
  explanation: "`Append` מחזירה את אותו `StringBuilder`, ולכן אפשר לשרשר קריאות (Method Chaining). יש לה גרסאות לכל הטיפוסים הבסיסיים, והיא ממירה כל ערך לטקסט בעזרת `ToString`. `true.ToString()` מחזיר `True` עם אות גדולה."
  optionExplanations:
    "1": "ב-C# הערך הבוליאני מומר לטקסט `True` או `False`, עם אות ראשונה גדולה."
    "2": "`true` מומר לטקסט `True`, לא למספר 1."
    "3": "`Append` מחזירה `StringBuilder`, ולכן `sb.Append(\"a\").Append(1)` הוא קוד תקין."

- id: cs.strings.stringbuilder.006
  type: truefalse
  difficulty: 1
  prompt: "בפרויקט קונסול רגיל של .NET 8, כדי לכתוב `new StringBuilder()` בלי שם מלא צריך להוסיף `using System.Text;`."
  answer: true
  explanation: "`StringBuilder` נמצאת במרחב השמות (Namespace) `System.Text`, שאינו חלק מה-Implicit Usings של פרויקט קונסול. בלי `using` יש לכתוב את השם המלא: `new System.Text.StringBuilder()`."

- id: cs.strings.stringbuilder.007
  type: single
  difficulty: 1
  prompt: "באיזה מקרה `StringBuilder` מועיל יותר מכול?"
  options:
    - "בניית דוח של 10,000 שורות, שורה אחרי שורה בלולאה"
    - "חיבור שם פרטי ושם משפחה פעם אחת"
    - "הדפסת הודעה אחת עם שלושה ערכים בעזרת אינטרפולציה"
    - "השוואה בין שתי מחרוזות"
  answer: 0
  explanation: "`StringBuilder` חוסך העתקות כשמוסיפים הרבה חלקים, בעיקר בלולאה שמספר האיטרציות שלה גדול או לא ידוע מראש. לחיבור בודד או לאינטרפולציה אחת `+` או `$` פשוטים וקריאים יותר, והביצועים כמעט זהים."
  optionExplanations:
    "1": "שרשור חד־פעמי יוצר מחרוזת אחת בלבד. `StringBuilder` רק מוסיף קוד בלי תועלת."
    "2": "מחרוזת אינטרפולציה אחת נבנית ביעילות על ידי הקומפיילר. אין כאן לולאה שמצטברת."
    "3": "`StringBuilder` מיועד לבנייה של מחרוזת, לא להשוואה. משווים עם `==` או `Equals`."

- id: cs.strings.stringbuilder.008
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
