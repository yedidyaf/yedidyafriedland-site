    "3": "הקיבולת היא מקום שמור בלבד. `Length` הוא 0 ואין תווים בתוכן."

- id: cs.strings.stringbuilder.013
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    using System.Text;

    var a = new StringBuilder("cat");
    var b = new StringBuilder("cat");
    Console.WriteLine(a == b);
    Console.WriteLine(a.ToString() == b.ToString());
  options: ["False\nTrue", "True\nTrue", "False\nFalse", "True\nFalse"]
  answer: 0
  explanation: "בניגוד ל-`string`, המחלקה `StringBuilder` לא מגדירה מחדש את `==`, ולכן הוא משווה הפניות (Reference Equality): שני אובייקטים שונים, `False`. `ToString` מחזירה שתי מחרוזות, ו-`==` של `string` משווה תוכן: `True`."
  optionExplanations:
    "1": "רק `string` משווה תוכן עם `==`. עבור `StringBuilder` זו השוואת הפניות, ואלה שני אובייקטים נפרדים."
    "2": "אחרי `ToString` משווים שתי מחרוזות, ו-`==` בין מחרוזות משווה את התווים."

- id: cs.strings.stringbuilder.014
  type: truefalse
  difficulty: 3
  prompt: "נתונים שלושה משתני `string`: `a`, `b` ו-`c`. הביטוי `a + b + c` יוצר קודם מחרוזת ביניים עבור `a + b`, ואחר כך מחרוזת חדשה נוספת עם `c`."
  answer: false
  explanation: "הקומפיילר מאחד שרשור של כמה מחרוזות בביטוי אחד לקריאה אחת ל-`string.Concat(a, b, c)`, שמקצה מחרוזת אחת בגודל הסופי. לכן שרשור עם `+` בביטוי בודד הוא יעיל, ואין צורך ב-`StringBuilder`. הבעיה מתחילה כשמשרשרים שוב ושוב בלולאה."

- id: cs.strings.stringbuilder.015
  type: bug
  difficulty: 2
  prompt: "`Reverse` אמורה להחזיר את המחרוזת בסדר הפוך, למשל `cba` עבור `abc`. איזו שורה צריך לתקן?"
  code: |
    using System.Text;

    Console.WriteLine(Reverse("abc"));

    static string Reverse(string text)
    {
        var sb = new StringBuilder(text.Length);
        for (int i = text.Length; i >= 0; i--)
        {
            sb.Append(text[i]);
        }
        return sb.ToString();
    }
  answer: 8
  explanation: "האינדקס האחרון במחרוזת הוא `text.Length - 1`. הלולאה מתחילה מ-`text.Length`, ולכן כבר בגישה הראשונה `text[3]` נזרקת `IndexOutOfRangeException`. שאר הקוד נכון, כולל הקיבולת ההתחלתית שחוסכת הגדלות של המאגר."
  fixed: |
    using System.Text;

    Console.WriteLine(Reverse("abc"));

    static string Reverse(string text)
    {
        var sb = new StringBuilder(text.Length);
        for (int i = text.Length - 1; i >= 0; i--)
        {
            sb.Append(text[i]);
        }
        return sb.ToString();
    }

- id: cs.strings.stringbuilder.016
  type: single
  difficulty: 3
  prompt: "בונים מחרוזת מ-n חלקים קצרים בלולאה. מה סדר הגודל (Big O) של כמות התווים שמועתקים בסך הכול, עם `+=` ועם `StringBuilder`?"
  options:
    - "עם `+=` בערך O(n²), ועם `StringBuilder` בערך O(n)"
    - "בשתי הדרכים O(n), כי כל חלק מועתק פעם אחת"
    - "עם `+=` בערך O(n), ועם `StringBuilder` בערך O(1)"
    - "עם `+=` בערך O(n log n), ועם `StringBuilder` בערך O(n)"
  answer: 0
  explanation: "עם `+=` כל איטרציה מעתיקה את כל מה שנצבר: 1 + 2 + ... + n חלקים, כלומר O(n²). `StringBuilder` מוסיף לסוף המאגר, וכשהמאגר מתמלא הוא מקצה מקום נוסף בלי להעתיק מחדש את מה שכבר נכתב, ולכן סך ההעתקות הוא O(n). ההבדל הזה מורגש כבר באלפי איטרציות."
  optionExplanations:
    "1": "עם `+=` כל חלק מועתק שוב בכל איטרציה מאוחרת יותר, כי בכל פעם נבנית מחרוזת חדשה מההתחלה."
    "2": "גם `StringBuilder` חייב להעתיק כל תו לפחות פעם אחת למאגר, ולכן העלות היא לפחות O(n)."
    "3": "אין כאן חלוקה לחצאים. סכום ההעתקות הולך וגדל בכל איטרציה, ולכן הוא ריבועי."
