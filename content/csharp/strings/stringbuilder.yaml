        sb.Append(i);
        Console.WriteLine(sb);
    }
    sb.Clear();
    Console.WriteLine(sb.Length);
  options: ["1\n12\n123\n0", "1\n2\n3\n0", "1\n12\n123\n3", "123\n123\n123\n0"]
  answer: 0
  explanation: "אותו `StringBuilder` מצטבר בכל איטרציה, ולכן כל הדפסה מראה את כל מה שנוסף עד עכשיו. `Clear` מרוקנת את התוכן, ו-`Length` הופך ל-0."
  optionExplanations:
    "1": "`Append` מוסיפה לתוכן הקיים ולא מחליפה אותו."
    "2": "`Clear` מוחקת את כל התווים, ולכן `Length` הוא 0."
    "3": "כל הדפסה מתבצעת באותו רגע בלולאה ומראה את המצב שהיה אז, לא את המצב הסופי."

- id: cs.strings.stringbuilder.009
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס `Ann, Ben, Dan`. איזו שורה צריך לתקן?"
  code: |
    using System.Text;

    string[] names = { "Ann", "Ben", "Dan" };
    var sb = new StringBuilder();
    foreach (string name in names)
    {
        if (sb.Length == 0)
        {
            sb.Append(", ");
        }
        sb.Append(name);
    }
    Console.WriteLine(sb);
  answer: 7
  explanation: "המפריד צריך לבוא לפני כל שם חוץ מהראשון, כלומר רק כשכבר יש תוכן (`sb.Length > 0`). עם `== 0` הוא נוסף דווקא לפני השם הראשון, ומודפס `, AnnBenDan`."
  fixed: |
    using System.Text;

    string[] names = { "Ann", "Ben", "Dan" };
    var sb = new StringBuilder();
    foreach (string name in names)
    {
        if (sb.Length > 0)
        {
            sb.Append(", ");
        }
        sb.Append(name);
    }
    Console.WriteLine(sb);

