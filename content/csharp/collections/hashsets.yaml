- id: cs.collections.hashsets.010
  type: truefalse
  difficulty: 2
  prompt: "כברירת מחדל, `HashSet<string>` משווה מחרוזות לפי רישיות, ולכן `\"Haifa\"` ו-`\"haifa\"` נשמרים בה כשני איברים שונים."
  answer: true
  explanation: "ההשוואה ברירת המחדל של מחרוזות היא מדויקת ותלויה ברישיות (Case-Sensitive). כדי שהקבוצה תתעלם מרישיות מעבירים לבנאי משווה: `new HashSet<string>(StringComparer.OrdinalIgnoreCase)`."

- id: cs.collections.hashsets.011
  type: bug
  difficulty: 2
  prompt: "הקוד אמור לאסוף את כתובות המייל בלי כפילויות, לפי סדר ההופעה הראשונה, ולהדפיס `2`. באיזו שורה הבאג?"
  code: |
    string[] emails = { "a@x.com", "b@x.com", "a@x.com" };
    var seen = new HashSet<string>();
    var unique = new List<string>();
    foreach (string email in emails)
    {
        if (!seen.Add(email))
            unique.Add(email);
    }
    Console.WriteLine(unique.Count);
  answer: 6
  explanation: "`seen.Add` מחזירה `true` כשהכתובת חדשה. עם `!` התנאי הפוך: הכתובת נכנסת ל-`unique` רק כשהיא כפולה, ולכן מודפס `1`. התנאי הנכון הוא `if (seen.Add(email))`."
  fixed: |
    string[] emails = { "a@x.com", "b@x.com", "a@x.com" };
    var seen = new HashSet<string>();
    var unique = new List<string>();
    foreach (string email in emails)
    {
        if (seen.Add(email))
            unique.Add(email);
    }
    Console.WriteLine(unique.Count);

- id: cs.collections.hashsets.012
  type: bug
  difficulty: 3
  prompt: "הקוד אמור להדפיס כמה מהמוזמנים החשובים הגיעו, מתוך כמה הוזמנו: `2 of 3 VIPs arrived`. באיזו שורה הבאג?"
  code: |
    var vip = new HashSet<int> { 101, 102, 103 };
    var present = new HashSet<int> { 102, 103, 200 };
    var vipPresent = vip;
    vipPresent.IntersectWith(present);
    Console.WriteLine($"{vipPresent.Count} of {vip.Count} VIPs arrived");
  answer: 3
  explanation: "`vipPresent = vip` לא יוצר קבוצה חדשה, אלא הפניה נוספת לאותה קבוצה. `IntersectWith` משנה את הקבוצה במקום, ולכן גם `vip` מצטמצמת ל-2 ומודפס `2 of 2`. כדי לשמור על המקור יוצרים עותק: `new HashSet<int>(vip)`."
  fixed: |
    var vip = new HashSet<int> { 101, 102, 103 };
    var present = new HashSet<int> { 102, 103, 200 };
    var vipPresent = new HashSet<int>(vip);
    vipPresent.IntersectWith(present);
    Console.WriteLine($"{vipPresent.Count} of {vip.Count} VIPs arrived");

