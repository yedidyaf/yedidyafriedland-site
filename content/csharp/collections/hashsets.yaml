  options: ["5\n3", "8\n4", "5\n2", "4\n2"]
  answer: 0
  explanation: "`UnionWith` ו-`IntersectWith` מקבלות כל אוסף (`IEnumerable<T>`), גם רשימה עם כפילויות. האיחוד מוסיף רק את `6`, ו-`a` היא `{1, 2, 3, 4, 6}`. החיתוך מתבצע על `a` המעודכנת ומשאיר את מה שנמצא גם ברשימה: `{2, 4, 6}`."
  optionExplanations:
    "1": "קבוצה לא מכניסה כפילויות, גם כשהן מגיעות מרשימה."
