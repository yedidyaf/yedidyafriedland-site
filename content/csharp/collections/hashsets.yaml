- id: cs.collections.hashsets.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    var tags = new HashSet<string>();
    tags.Add("csharp");
    tags.Add("dotnet");
    tags.Add("csharp");
    Console.WriteLine(tags.Count);
  options: ["2", "3", "1", "ArgumentException"]
  answer: 0
  explanation: "קבוצה (`HashSet<T>`) מחזיקה רק איברים ייחודיים. הוספה של איבר שכבר קיים לא משנה את הקבוצה, ולכן נשארים שני איברים."
  optionExplanations:
    "1": "ברשימה (`List<T>`) היו 3 איברים. `HashSet<T>` מתעלמת מכפילויות."
    "3": "בניגוד ל-`Dictionary.Add`, הוספת איבר קיים לקבוצה לא זורקת חריגה."

- id: cs.collections.hashsets.002
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    var seen = new HashSet<int>();
    Console.WriteLine(seen.Add(5));
    Console.WriteLine(seen.Add(5));
  options: ["True\nFalse", "True\nTrue", "True\nArgumentException", "False\nTrue"]
  answer: 0
  explanation: "`Add` של `HashSet<T>` מחזירה `bool`: `true` אם האיבר נוסף, ו-`false` אם הוא כבר היה בקבוצה. כך אפשר לבדוק ולהוסיף בפעולה אחת."
  optionExplanations:
    "1": "בפעם השנייה `5` כבר בקבוצה, ולכן לא נוסף דבר ומוחזר `false`."
    "2": "כפילות בקבוצה היא לא שגיאה. `Add` פשוט מדווחת שלא הוסיפה."
    "3": "בהוספה הראשונה הקבוצה ריקה, ולכן האיבר נוסף ומוחזר `true`."

- id: cs.collections.hashsets.003
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int[] rolls = { 3, 6, 3, 1, 6, 6 };
    var unique = new HashSet<int>(rolls);
    Console.WriteLine(rolls.Length + " " + unique.Count);
  options: ["6 3", "6 6", "3 3", "6 1"]
  answer: 0
  explanation: "הבנאי של `HashSet<T>` מקבל אוסף ומכניס כל איבר פעם אחת. הערכים השונים הם `3`, `6` ו-`1`, ולכן `Count` הוא 3. המערך המקורי לא משתנה ונשאר באורך 6."
  optionExplanations:
    "1": "הקבוצה מסננת כפילויות כבר בבנייה, ולכן אין בה 6 איברים."
    "2": "יצירת קבוצה מהמערך לא משנה את המערך עצמו."
    "3": "`1` הוא מספר הערכים שהופיעו פעם אחת בלבד. הקבוצה שומרת כל ערך שונה, גם אם חזר."

- id: cs.collections.hashsets.004
  type: single
  difficulty: 2
  prompt: "מה עושה השורה `a.UnionWith(b);`?"
  code: |
    var a = new HashSet<int> { 1, 2, 3 };
    var b = new HashSet<int> { 3, 4 };
    a.UnionWith(b);
  options:
    - "מוסיפה ל-`a` את האיברים של `b` שעוד לא נמצאים בה, ולא מחזירה ערך. `a` היא `{1, 2, 3, 4}`, ו-`b` לא משתנה"
    - "מחזירה קבוצה חדשה `{1, 2, 3, 4}`, ו-`a` ו-`b` לא משתנות"
    - "מוסיפה את האיברים החסרים לשתי הקבוצות, ובסוף גם `a` וגם `b` הן `{1, 2, 3, 4}`"
    - "משאירה ב-`a` רק את האיברים שנמצאים גם ב-`b`, כלומר `{3}`"
  answer: 0
  explanation: "`UnionWith` מבצעת איחוד (Union) ומשנה את הקבוצה שעליה היא נקראת. היא מחזירה `void`, ולכן `var c = a.UnionWith(b);` לא מתקמפל. הקבוצה שמועברת כארגומנט לא משתנה."
  optionExplanations:
    "1": "`UnionWith` לא מחזירה ערך. היא משנה את `a` במקום (In Place)."
    "2": "רק הקבוצה שעליה קוראים למתודה משתנה. `b` נשארת `{3, 4}`."
    "3": "זה תיאור של חיתוך (`IntersectWith`), לא של איחוד."

- id: cs.collections.hashsets.005
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    var alice = new HashSet<string> { "chess", "music", "tennis" };
    var bob = new HashSet<string> { "music", "tennis", "golf" };
    alice.IntersectWith(bob);
    Console.WriteLine(alice.Count);
    Console.WriteLine(alice.Contains("chess"));
    Console.WriteLine(bob.Count);
  options: ["2\nFalse\n3", "3\nTrue\n3", "2\nFalse\n2", "4\nTrue\n3"]
  answer: 0
  explanation: "`IntersectWith` מבצעת חיתוך (Intersection): משאירה ב-`alice` רק את האיברים שנמצאים גם ב-`bob`, כלומר `music` ו-`tennis`. `chess` הוסר, ו-`bob` לא השתנתה."
  optionExplanations:
    "1": "`IntersectWith` משנה את `alice` במקום ולא מחזירה קבוצה חדשה, ולכן `chess` כבר לא בה."
    "2": "החיתוך משנה רק את `alice`. `bob` נשארת עם שלושה איברים."
    "3": "4 איברים הם תוצאה של איחוד (`UnionWith`). חיתוך שומר רק את המשותף."

- id: cs.collections.hashsets.006
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    var points = new HashSet<Point>();
    points.Add(new Point(1, 2));
    points.Add(new Point(1, 2));
    var cells = new HashSet<Cell>();
    cells.Add(new Cell(1, 2));
    cells.Add(new Cell(1, 2));
    Console.WriteLine(points.Count + " " + cells.Count);

    class Point
    {
        public int X;
        public int Y;
        public Point(int x, int y) { X = x; Y = y; }
    }

    record Cell(int X, int Y);
  options: ["2 1", "1 1", "2 2", "1 2"]
  answer: 0
  explanation: "הקבוצה מזהה כפילות בעזרת `GetHashCode` ו-`Equals`. מחלקה רגילה משווה לפי זהות (Reference Equality), ולכן שני אובייקטי `Point` נפרדים הם שני איברים. `record` מקבל שוויון לפי ערך (Value Equality) אוטומטית, ולכן שני ה-`Cell` שווים ונשמר אחד."
  optionExplanations:
    "1": "ל-`Point` אין `Equals` מותאם, ולכן שני אובייקטים עם אותם ערכים עדיין נחשבים שונים."
    "2": "`record` מייצר `Equals` ו-`GetHashCode` לפי הערכים, ולכן ה-`Cell` השני נחשב כפילות."
    "3": "זה הפוך: המחלקה משווה לפי זהות, וה-`record` לפי ערכים."

- id: cs.collections.hashsets.007
  type: single
  difficulty: 1
  prompt: "מה ההבדל המרכזי בין `HashSet<T>` לבין `List<T>`?"
  options:
    - "ב-`HashSet<T>` כל ערך מופיע לכל היותר פעם אחת, ובדיקת `Contains` מהירה מאוד"
    - "`HashSet<T>` שומרת את האיברים ממוינים, ו-`List<T>` לא"
    - "`HashSet<T>` מאפשרת גישה לפי אינדקס מהירה יותר מ-`List<T>`"
    - "`HashSet<T>` יכולה להכיל רק מספרים, ו-`List<T>` כל טיפוס"
  answer: 0
  explanation: "`HashSet<T>` היא קבוצה במובן המתמטי: אין בה כפילויות, ובדיקת שייכות (Membership) בה מהירה בזכות גיבוב (Hashing). מצד שני, אין לה אינדקסים ואין לה סדר מובטח."
  optionExplanations:
    "1": "`HashSet<T>` לא ממיינת ולא מבטיחה שום סדר. אוסף ייחודי וממוין הוא `SortedSet<T>`."
    "2": "ב-`HashSet<T>` אין אינדקסים בכלל. `set[0]` לא מתקמפל."
    "3": "`HashSet<T>` גנרית ועובדת עם כל טיפוס, למשל `HashSet<string>`."

- id: cs.collections.hashsets.008
  type: single
  difficulty: 2
  prompt: "בהרשמה לאתר צריך לבדוק אם שם משתמש כבר תפוס, מתוך מיליון שמות קיימים. למה `HashSet<string>` עדיפה כאן על `List<string>`?"
  options:
    - "`Contains` בקבוצה רצה בממוצע בזמן קבוע (O(1)), וברשימה היא עוברת על השמות אחד-אחד (O(n))"
    - "הקבוצה ממיינת את השמות ומחפשת בהם חיפוש בינארי"
    - "ל-`List<string>` אין מתודה `Contains`"
    - "הקבוצה תופסת פחות זיכרון, ולכן היא מהירה יותר"
  answer: 0
  explanation: "הקבוצה מחשבת את קוד הגיבוב (Hash Code) של המחרוזת והולכת ישר לתא המתאים, בלי לעבור על כל השמות. ברשימה `Contains` משווה לכל איבר לפי הסדר, ועם מיליון שמות ההבדל עצום."
  optionExplanations:
    "1": "`HashSet<T>` לא ממיינת. המהירות באה מגיבוב, לא ממיון."
    "2": "גם ל-`List<T>` יש `Contains`, אבל היא עוברת על כל האיברים."
    "3": "קבוצה בדרך כלל תופסת יותר זיכרון מרשימה. המהירות באה מגיבוב."

- id: cs.collections.hashsets.009
  type: truefalse
  difficulty: 1
  prompt: "אפשר לגשת לאיבר ב-`HashSet<T>` לפי אינדקס, למשל `set[0]`."
