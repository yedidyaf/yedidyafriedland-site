- id: cs.collections.arrays.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    int[] counts = new int[3];
    bool[] flags = new bool[2];
    Console.WriteLine(counts[1]);
    Console.WriteLine(flags[0]);
  options: ["0\nFalse", "0\nfalse", "null\nnull", "שגיאת קומפילציה"]
  answer: 0
  explanation: "מערך חדש מתמלא בערכי ברירת מחדל (Default Values): `0` ל-`int` ו-`false` ל-`bool`. `Console.WriteLine` מדפיס ערך בוליאני באות גדולה: `False`."
  optionExplanations:
    "1": "הערך הוא אכן `false`, אבל ב-C# הוא מודפס כ-`False`, באות גדולה."
    "2": "`null` הוא ברירת המחדל של טיפוסי הפניה. `int` ו-`bool` הם טיפוסי ערך ולא יכולים להיות `null`."
    "3": "איברי מערך מאותחלים אוטומטית, ולכן מותר לקרוא אותם בלי השמה קודמת. רק משתנה מקומי חייב השמה לפני קריאה."

- id: cs.collections.arrays.002
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    int[] nums = { 4, 8, 15, 16 };
    Console.WriteLine(nums.Length);
    Console.WriteLine(nums[nums.Length - 1]);
  options: ["4\n16", "3\n15", "4\n15", "3\n16"]
  answer: 0
  explanation: "`Length` הוא מספר האיברים, 4. האינדקסים מתחילים ב-0, ולכן האיבר האחרון נמצא באינדקס `Length - 1`, כלומר 3, וערכו `16`."
  optionExplanations:
    "1": "`Length` סופר איברים (4), ולא מחזיר את האינדקס האחרון (3)."
    "2": "`nums[3]` הוא האיבר הרביעי, `16`. הבלבול הוא בין אינדקס שמתחיל ב-0 לבין מיקום שמתחיל ב-1."

- id: cs.collections.arrays.003
  type: single
  difficulty: 1
  prompt: מה יקרה כשהשורה השנייה תרוץ?
  code: |
    int[] nums = new int[3];
    int x = nums[3];
  options:
    - "תיזרק `IndexOutOfRangeException`"
    - "תיזרק `ArgumentOutOfRangeException`"
    - "תיזרק `NullReferenceException`"
    - "לא תיזרק חריגה, ו-`x` יקבל `0`"
  answer: 0
  explanation: "במערך באורך 3 האינדקסים החוקיים הם 0 עד 2. גישה מחוץ לגבולות מערך זורקת בזמן ריצה `IndexOutOfRangeException`. הקומפיילר לא בודק את זה."
  optionExplanations:
    "1": "`ArgumentOutOfRangeException` היא החריגה של `List<T>` באינדקס לא חוקי. מערך זורק `IndexOutOfRangeException`."
    "2": "המערך עצמו קיים (נוצר עם `new`), ולכן אין כאן הפניה ל-`null`."
    "3": "C# בודקת גבולות בכל גישה למערך ולא מחזירה ערך ברירת מחדל מחוץ לגבולות."

- id: cs.collections.arrays.006
