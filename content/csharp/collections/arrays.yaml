- id: cs.collections.arrays.020
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס `True` אם `target` נמצא במערך. עבור 8 הוא מדפיס `False`. איזו שורה צריך לתקן?"
  code: |
    int[] nums = { 5, 8, 3 };
    int target = 8;
    bool found = false;
    for (int i = 0; i < nums.Length; i++)
    {
        found = nums[i] == target;
    }
    Console.WriteLine(found);
  answer: 6
  explanation: "בכל סיבוב `found` נדרס בתוצאת ההשוואה של האיבר הנוכחי, ולכן בסוף הוא משקף רק את האיבר האחרון (3). דגל של חיפוש צריך להשתנות רק כשמוצאים: `if (nums[i] == target) found = true;`."
  fixed: |
    int[] nums = { 5, 8, 3 };
    int target = 8;
    bool found = false;
    for (int i = 0; i < nums.Length; i++)
    {
        if (nums[i] == target) found = true;
    }
    Console.WriteLine(found);

