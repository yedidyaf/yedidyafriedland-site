- id: cs.collections.arrays.012
  type: output
  difficulty: 3
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    int[] nums = { 1, 2, 3 };
    foreach (int n in nums)
    {
        n = n * 2;
    }
    Console.WriteLine(nums[0]);
  options: ["שגיאת קומפילציה", "2", "1", "InvalidOperationException"]
  answer: 0
  explanation: "משתנה האיטרציה של `foreach` הוא לקריאה בלבד, ולכן השמה ל-`n` היא שגיאת קומפילציה. כדי לשנות איברים במערך משתמשים בלולאת `for` עם אינדקס: `nums[i] = nums[i] * 2`."
  optionExplanations:
    "1": "גם אילו ההשמה הייתה מותרת, `n` הוא עותק של הערך, ושינוי שלו לא היה משנה את המערך."
    "2": "זה מה שהיה קורה אילו ההשמה לעותק הייתה מותרת. אבל C# חוסמת אותה כבר בקומפילציה."
    "3": "`InvalidOperationException` נזרקת כששינוי מבנה של `List<T>` קורה בזמן `foreach`. כאן הקוד לא מגיע לריצה בכלל."

