    "2": "`Console.WriteLine` לא עוברת על האיברים בעצמה. צריך לולאה."
    "3": "האיברים לא מודפסים בכלל, גם לא צמודים."

- id: cs.collections.arrays.007
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int[,] grid = new int[2, 3];
    Console.WriteLine(grid.Length);
    Console.WriteLine(grid.GetLength(0));
    Console.WriteLine(grid.GetLength(1));
  options: ["6\n2\n3", "2\n2\n3", "6\n3\n2", "2\n3\n2"]
  answer: 0
  explanation: "במערך רב־ממדי (Multidimensional Array) `Length` הוא מספר כל התאים: 2 × 3 = 6. את גודל כל ממד מקבלים עם `GetLength`: ממד 0 הוא השורות (2) וממד 1 הוא העמודות (3)."
  optionExplanations:
    "1": "`Length` לא מחזיר את מספר השורות. הוא סופר את כל התאים בכל הממדים."
    "2": "`GetLength(0)` מחזיר את הממד הראשון בהגדרה `[2, 3]`, כלומר 2."

- id: cs.collections.arrays.009
  type: bug
  difficulty: 1
  prompt: הקוד אמור להדפיס את סכום המחירים במערך. איזו שורה צריך לתקן?
  code: |
    int[] prices = { 30, 45, 25 };
    int total = 0;
    for (int i = 0; i <= prices.Length; i++)
    {
        total += prices[i];
    }
    Console.WriteLine(total);
  answer: 3
  explanation: "התנאי `i <= prices.Length` מגיע גם ל-`i = 3`, ובמערך באורך 3 האינדקס האחרון הוא 2. הגישה `prices[3]` זורקת `IndexOutOfRangeException`. התנאי הנכון הוא `i < prices.Length`."
  fixed: |
    int[] prices = { 30, 45, 25 };
    int total = 0;
    for (int i = 0; i < prices.Length; i++)
    {
        total += prices[i];
    }
    Console.WriteLine(total);

- id: cs.collections.arrays.010
  type: bug
  difficulty: 3
  prompt: "הקוד אמור להפוך את סדר האיברים במערך עצמו (In Place) ולהדפיס `5 4 3 2 1`. איזו שורה צריך לתקן?"
  code: |
    int[] nums = { 1, 2, 3, 4, 5 };
    for (int i = 0; i < nums.Length; i++)
    {
        int j = nums.Length - 1 - i;
        int temp = nums[i];
        nums[i] = nums[j];
        nums[j] = temp;
    }
    for (int i = 0; i < nums.Length; i++)
        Console.Write(nums[i] + " ");
  answer: 2
  explanation: "כל החלפה מטפלת בזוג: איבר מההתחלה ואיבר מהסוף. כשהלולאה עוברת על כל המערך, כל זוג מוחלף פעמיים, ובסוף המערך חוזר לסדר המקורי `1 2 3 4 5`. צריך לעצור באמצע: `i < nums.Length / 2`."
  fixed: |
    int[] nums = { 1, 2, 3, 4, 5 };
    for (int i = 0; i < nums.Length / 2; i++)
    {
        int j = nums.Length - 1 - i;
        int temp = nums[i];
        nums[i] = nums[j];
        nums[j] = temp;
    }
    for (int i = 0; i < nums.Length; i++)
        Console.Write(nums[i] + " ");

