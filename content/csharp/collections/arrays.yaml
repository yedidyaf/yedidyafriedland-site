- id: cs.collections.arrays.015
  type: cleaner
  difficulty: 1
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      int[] scores = { 90, 75, 88 };
      int total = 0;
      foreach (int score in scores)
      {
          total += score;
      }
      Console.WriteLine(total);
    - |
      int[] scores = { 90, 75, 88 };
      int total = 0;
      int i = 0;
      while (i < scores.Length)
      {
          total += scores[i];
          i++;
      }
      Console.WriteLine(total);
    - |
      int[] scores = { 90, 75, 88 };
      int total = 0;
      for (int i = 0; i <= scores.Length - 1; i++)
      {
          total = total + scores[i];
      }
      Console.WriteLine(total);
  answer: 0
  explanation: "כשצריך רק לעבור על כל האיברים ולא צריך את האינדקס, `foreach` הוא הכלי הנכון. אין מונה לנהל ואין סיכוי לטעות בגבול הלולאה (Off-by-One)."
  optionExplanations:
    "1": "לולאת `while` עם מונה ידני מוסיפה שלוש שורות ניהול, ושכחה של `i++` תיצור לולאה אינסופית."
    "2": "התנאי `i <= scores.Length - 1` הוא צורה מסורבלת של `i < scores.Length`, ואין צורך באינדקס בכלל."

