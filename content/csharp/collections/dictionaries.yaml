- id: cs.collections.dictionaries.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    var ages = new Dictionary<string, int>();
    ages["Dana"] = 30;
    ages["Omer"] = 25;
    ages["Dana"] = 31;
    Console.WriteLine(ages.Count);
    Console.WriteLine(ages["Dana"]);
  options: ["2\n31", "3\n31", "3\n30", "ArgumentException"]
  answer: 0
  explanation: "מילון (Dictionary) שומר זוגות של מפתח וערך, וכל מפתח מופיע בו פעם אחת. השמה דרך האינדקסר (`ages[key] = value`) למפתח קיים מחליפה את הערך שלו. לכן יש 2 מפתחות, והערך של `Dana` הוא `31`."
  optionExplanations:
    "1": "השמה למפתח קיים לא מוסיפה זוג חדש. היא דורסת את הערך הקודם."
    "2": "יש רק ערך אחד לכל מפתח. ההשמה האחרונה, `31`, היא שנשארת."
    "3": "`ArgumentException` נזרקת רק מ-`Add` על מפתח קיים. האינדקסר פשוט מחליף את הערך."

- id: cs.collections.dictionaries.002
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    var stock = new Dictionary<string, int>();
    stock.Add("apple", 5);
    try
    {
        stock.Add("apple", 8);
    }
    catch (Exception e)
    {
        Console.WriteLine(e.GetType().Name);
    }
    Console.WriteLine(stock["apple"]);
  options: ["ArgumentException\n5", "8", "ArgumentException\n8", "InvalidOperationException\n5"]
  answer: 0
  explanation: "`Add` עם מפתח שכבר קיים (מפתח כפול - Duplicate Key) זורקת `ArgumentException` ולא משנה את המילון. לכן הערך נשאר `5`. כדי להחליף ערך משתמשים באינדקסר: `stock[\"apple\"] = 8`."
  optionExplanations:
    "1": "`Add` לא דורסת ערך קיים. רק האינדקסר מחליף ערך בשקט."
    "2": "כש-`Add` נכשלת המילון לא משתנה, ולכן הערך נשאר `5`."
    "3": "סוג החריגה הוא `ArgumentException`, כי הארגומנט (המפתח) לא חוקי למילון הזה."

- id: cs.collections.dictionaries.003
  type: single
  difficulty: 1
  prompt: מה יקרה כשהשורה השנייה תרוץ?
  code: |
    var prices = new Dictionary<string, int> { ["tea"] = 8 };
    int p = prices["coffee"];
  options:
    - "תיזרק `KeyNotFoundException`"
    - "`p` יקבל `0`"
    - "`p` יקבל `null`"
    - "תיזרק `IndexOutOfRangeException`"
  answer: 0
  explanation: "קריאה דרך האינדקסר עם מפתח שלא קיים זורקת `KeyNotFoundException`. כשלא בטוחים שהמפתח קיים, משתמשים ב-`TryGetValue` או בודקים קודם עם `ContainsKey`."
  optionExplanations:
    "1": "`0` הוא מה ש-`TryGetValue` מציבה ב-`out` כשהמפתח חסר. האינדקסר זורק חריגה."
    "2": "`int` הוא טיפוס ערך ולא יכול להכיל `null`. וגם כך, האינדקסר זורק חריגה ולא מחזיר ערך."
    "3": "`IndexOutOfRangeException` שייכת למערכים. במילון אין אינדקס מספרי אלא מפתח."

- id: cs.collections.dictionaries.004
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    var prices = new Dictionary<string, int> { ["tea"] = 8 };
    bool found = prices.TryGetValue("coffee", out int price);
    Console.WriteLine(found);
    Console.WriteLine(price);
  options: ["False\n0", "True\n0", "False\n8", "KeyNotFoundException"]
  answer: 0
  explanation: "`TryGetValue` לא זורקת חריגה. היא מחזירה `true` או `false` לפי קיום המפתח, ומציבה את הערך בפרמטר ה-`out`. כשהמפתח חסר מוצב ערך ברירת המחדל של הטיפוס, `0` עבור `int`."
  optionExplanations:
    "1": "`TryGetValue` מחזירה `true` רק כשהמפתח קיים. `coffee` לא נמצא במילון."
    "2": "כשהמפתח חסר, `price` מקבל ברירת מחדל ולא ערך של מפתח אחר."
    "3": "כל המטרה של `TryGetValue` היא לבדוק ולשלוף בלי לזרוק חריגה."

- id: cs.collections.dictionaries.005
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    var codes = new Dictionary<string, int> { ["IL"] = 972, ["US"] = 1 };
    Console.WriteLine(codes.ContainsKey("IL"));
    Console.WriteLine(codes.ContainsKey("il"));
    Console.WriteLine(codes.ContainsKey("972"));
  options: ["True\nFalse\nFalse", "True\nTrue\nFalse", "True\nTrue\nTrue", "True\nFalse\nTrue"]
  answer: 0
  explanation: "`ContainsKey` בודקת רק מפתחות. כברירת מחדל מפתחות מסוג `string` מושווים בדיוק, כולל רישיות (Case-Sensitive), ולכן `il` שונה מ-`IL`. `972` הוא ערך ולא מפתח, וגם הטיפוס שונה: המחרוזת `\"972\"` אינה המספר `972`."
  optionExplanations:
    "1": "ההשוואה תלויה ברישיות. למילון שמתעלם מרישיות מעבירים `StringComparer.OrdinalIgnoreCase` לבנאי."
    "2": "גם `il` וגם `972` אינם מפתחות במילון. ההשוואה תלויה ברישיות, ו-`972` הוא ערך."
    "3": "`ContainsKey` לא מחפשת בערכים. לחיפוש ערך יש `ContainsValue`, והוא איטי כי הוא עובר על כל הזוגות."

- id: cs.collections.dictionaries.006
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    var cart = new Dictionary<string, int> { ["milk"] = 2, ["bread"] = 1, ["eggs"] = 12 };
    int total = 0;
    foreach (var item in cart)
    {
        total += item.Value;
    }
    Console.WriteLine($"{cart.Count} {total}");
  options: ["3 15", "שגיאת קומפילציה", "15 15", "6 15"]
  answer: 0
  explanation: "`foreach` על מילון עובר על זוגות מסוג `KeyValuePair<string, int>`, ולכל זוג יש `Key` ו-`Value`. סכום הערכים הוא 15. `Count` הוא מספר הזוגות במילון, 3."
  optionExplanations:
    "1": "בפייתון לולאה על מילון עוברת על המפתחות. ב-C# היא עוברת על זוגות, ו-`item.Value` הוא `int`, ולכן הקוד מתקמפל."
    "2": "`Count` סופר זוגות של מפתח וערך, לא את סכום הערכים."
    "3": "כל זוג נספר פעם אחת ב-`Count`. המפתח והערך לא נספרים בנפרד."

- id: cs.collections.dictionaries.007
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    var a = new Dictionary<string, int> { ["x"] = 1, ["x"] = 2 };
    Console.WriteLine(a["x"]);
    try
    {
        var b = new Dictionary<string, int> { { "x", 1 }, { "x", 2 } };
    }
    catch (ArgumentException)
    {
        Console.WriteLine("duplicate");
    }
  options: ["2\nduplicate", "1\nduplicate", "2", "ArgumentException"]
  answer: 0
  explanation: "שתי צורות האתחול נראות דומות אבל מתנהגות אחרת. `[\"x\"] = 2` מתורגם להשמה דרך האינדקסר, שדורסת ערך קיים, ולכן `a[\"x\"]` הוא `2`. `{ \"x\", 2 }` מתורגם לקריאה ל-`Add`, שזורקת `ArgumentException` על מפתח כפול."
  optionExplanations:
    "1": "האתחול עם האינדקסר מבוצע לפי הסדר, וההשמה השנייה דורסת את הראשונה."
    "2": "אתחול עם `{ key, value }` קורא ל-`Add`, ו-`Add` לא מאפשרת מפתח כפול."
    "3": "האתחול הראשון משתמש באינדקסר ולכן לא זורק. רק האתחול עם `Add` זורק, ושם החריגה נתפסת."

- id: cs.collections.dictionaries.008
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    string[] words = { "a", "b", "a", "c", "a", "b" };
    var counts = new Dictionary<string, int>();
    foreach (string w in words)
    {
        counts.TryGetValue(w, out int c);
        counts[w] = c + 1;
    }
    Console.WriteLine(counts["b"] + " " + counts.Count);
  options: ["2 3", "1 3", "2 6", "KeyNotFoundException"]
  answer: 0
  explanation: "בפעם הראשונה שמילה מופיעה, `TryGetValue` מציבה ב-`c` את ברירת המחדל `0`, והאינדקסר יוצר את המפתח עם `1`. בפעמים הבאות `c` הוא הספירה הקודמת. `b` מופיעה פעמיים, ויש 3 מילים שונות, ולכן `Count` הוא 3."
  optionExplanations:
    "1": "המונה של `b` עולה בכל הופעה, כי `c` מקבל את הספירה הקודמת לפני ההוספה."
    "2": "`Count` סופר מפתחות ייחודיים, לא את מספר המילים במערך."
    "3": "ההשמה `counts[w] = ...` יוצרת מפתח חדש כשהוא חסר. רק קריאה דרך האינדקסר זורקת על מפתח חסר."

- id: cs.collections.dictionaries.009
  type: bug
  difficulty: 2
  prompt: "הקוד אמור לספור כמה קולות קיבל כל צבע ולהדפיס `2`. באיזו שורה הבאג?"
  code: |
    string[] votes = { "red", "blue", "red" };
    var tally = new Dictionary<string, int>();
    foreach (string v in votes)
    {
        tally[v]++;
    }
    Console.WriteLine(tally["red"]);
  answer: 5
  explanation: "`tally[v]++` קורא קודם את הערך הקיים ורק אחר כך כותב. בפעם הראשונה שצבע מופיע המפתח עוד לא קיים, והקריאה זורקת `KeyNotFoundException`. צריך לטפל במפתח חסר, למשל עם `ContainsKey` או `TryGetValue`."
  fixed: |
    string[] votes = { "red", "blue", "red" };
    var tally = new Dictionary<string, int>();
    foreach (string v in votes)
    {
        tally[v] = tally.ContainsKey(v) ? tally[v] + 1 : 1;
    }
    Console.WriteLine(tally["red"]);

- id: cs.collections.dictionaries.010
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להוסיף איש קשר רק אם השם שלו עוד לא נמצא בספר הטלפונים, ולהדפיס `1`. באיזו שורה הבאג?"
  code: |
    var phoneBook = new Dictionary<string, string>();
    phoneBook["Noa"] = "050-1234567";
    string name = "Noa";
    if (!phoneBook.ContainsValue(name))
    {
        phoneBook.Add(name, "052-7654321");
    }
    Console.WriteLine(phoneBook.Count);
  answer: 4
  explanation: "השם הוא המפתח, ומספר הטלפון הוא הערך. `ContainsValue(name)` מחפשת את `Noa` בין מספרי הטלפון, לא מוצאת, ולכן הקוד קורא ל-`Add` עם מפתח קיים, ש-`Add` זורקת עליו `ArgumentException`. צריך `ContainsKey`, שגם מהירה יותר."
  fixed: |
    var phoneBook = new Dictionary<string, string>();
    phoneBook["Noa"] = "050-1234567";
    string name = "Noa";
    if (!phoneBook.ContainsKey(name))
    {
        phoneBook.Add(name, "052-7654321");
    }
    Console.WriteLine(phoneBook.Count);

- id: cs.collections.dictionaries.011
  type: single
  difficulty: 3
  prompt: "המפתח `\"x\"` כבר קיים במילון `d` מסוג `Dictionary<string, int>`. מה נכון לגבי שלוש הפעולות הבאות?"
  code: |
    var d = new Dictionary<string, int> { ["x"] = 1 };
    d["x"] = 5;
    d.TryAdd("x", 7);
    d.Add("x", 9);
  options:
    - "האינדקסר מחליף ל-`5`, `TryAdd` מחזירה `false` ולא משנה דבר, ו-`Add` זורקת `ArgumentException`"
    - "האינדקסר מחליף ל-`5`, `TryAdd` מחליפה ל-`7`, ו-`Add` מחליפה ל-`9`"
    - "האינדקסר זורק `ArgumentException`, ו-`TryAdd` ו-`Add` לא משנות דבר"
    - "שלוש הפעולות מחליפות את הערך, והערך הסופי הוא `9`"
  answer: 0
  explanation: "שלוש דרכים לכתוב למילון, עם שלוש התנהגויות למפתח קיים: האינדקסר מוסיף או מחליף, `TryAdd` מוסיפה רק אם המפתח חסר ומדווחת ב-`bool`, ו-`Add` מוסיפה רק מפתח חדש וזורקת חריגה על מפתח כפול. בחרו לפי מה שאמור לקרות כשהמפתח כבר קיים."
  optionExplanations:
    "1": "`TryAdd` אף פעם לא מחליפה ערך קיים, ו-`Add` זורקת חריגה על מפתח קיים."
    "2": "האינדקסר הוא הדרך שמותר בה להחליף ערך קיים. הוא לא זורק."
    "3": "רק האינדקסר מחליף. `Add` זורקת לפני שהיא משנה משהו, והערך הסופי הוא `5`."

- id: cs.collections.dictionaries.012
  type: truefalse
  difficulty: 1
  prompt: במילון כל מפתח חייב להיות ייחודי, אבל אותו ערך יכול להופיע תחת כמה מפתחות.
  answer: true
  explanation: "המפתח הוא מה שמזהה את הזוג, ולכן הוא ייחודי. לערכים אין מגבלה כזאת: למשל, במילון של שמות וגילים לשני אנשים יכול להיות אותו גיל."

- id: cs.collections.dictionaries.013
  type: truefalse
  difficulty: 2
  prompt: "`foreach` על `Dictionary<TKey, TValue>` עובר תמיד על הזוגות לפי סדר המפתחות הממוינים."
  answer: false
  explanation: "`Dictionary` לא ממיין את המפתחות, והתיעוד לא מבטיח שום סדר מעבר. אל תסמכו על סדר. כשצריך מעבר לפי מפתחות ממוינים, משתמשים ב-`SortedDictionary<TKey, TValue>` או ממיינים את המפתחות לפני ההדפסה."

- id: cs.collections.dictionaries.014
  type: cleaner
  difficulty: 1
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      var stock = new Dictionary<string, int> { ["apple"] = 5 };
      if (stock.TryGetValue("apple", out int qty))
      {
          Console.WriteLine(qty);
