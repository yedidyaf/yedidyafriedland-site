      var stock = new Dictionary<string, int> { ["apple"] = 5 };
      try
      {
          int qty = stock["apple"];
          Console.WriteLine(qty);
      }
      catch (KeyNotFoundException)
      {
      }
  answer: 0
  explanation: "`TryGetValue` בודקת ושולפת בפעולה אחת: חיפוש אחד במילון, ומפתח שנכתב פעם אחת. זו הדרך המקובלת לקרוא ערך כשהמפתח אולי חסר."
  optionExplanations:
    "1": "`ContainsKey` ואז האינדקסר מחפשים את אותו מפתח פעמיים, והמפתח כתוב פעמיים בקוד."
    "2": "שימוש בחריגה לבקרת זרימה (Exceptions for Control Flow) איטי ומסתיר את הכוונה, ו-`catch` ריק בולע שגיאות."

- id: cs.collections.dictionaries.015
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    var seats = new Dictionary<Seat, string>();
    seats[new Seat(3, 7)] = "Dana";
    Console.WriteLine(seats.ContainsKey(new Seat(3, 7)));

    class Seat
    {
        public int Row { get; }
        public int Number { get; }

        public Seat(int row, int number)
        {
            Row = row;
            Number = number;
        }
    }
  options: ["False", "True", "Dana", "KeyNotFoundException"]
  answer: 0
  explanation: "המילון משווה מפתחות עם `GetHashCode` ו-`Equals`. מחלקה רגילה שלא דורסת אותם משווה לפי זהות (Reference Equality): שני אובייקטים שנוצרו בנפרד הם מפתחות שונים, גם אם השדות שלהם זהים. כדי שזה יעבוד, דורסים את `Equals` ו-`GetHashCode`, או מגדירים את `Seat` כ-`record`."
  optionExplanations:
    "1": "השדות זהים, אבל `new Seat(3, 7)` השני הוא אובייקט אחר, ובלי `Equals` מותאם הוא לא שווה לראשון."
    "2": "`ContainsKey` מחזירה `bool`, לא את הערך."
    "3": "`ContainsKey` לא זורקת על מפתח חסר. היא מחזירה `false`."

- id: cs.collections.dictionaries.016
  type: single
  difficulty: 2
  prompt: "במערכת יש 100,000 תלמידים, וצריך לחפש תלמיד לפי תעודת זהות פעמים רבות. למה `Dictionary<string, Student>` מתאים יותר מ-`List<Student>`?"
  options:
    - "חיפוש לפי מפתח במילון לוקח בממוצע זמן קבוע (O(1)) בזכות גיבוב (Hashing), וברשימה צריך לעבור על התלמידים אחד-אחד (O(n))"
    - "המילון שומר את התלמידים ממוינים לפי תעודת הזהות ומבצע חיפוש בינארי"
    - "המילון תופס פחות זיכרון מרשימה, ולכן החיפוש בו מהיר יותר"
    - "ברשימה אי אפשר לחפש איבר לפי שדה, ולכן אין ברירה אלא להשתמש במילון"
  answer: 0
  explanation: "המילון מחשב מקוד הגיבוב (Hash Code) של המפתח באיזה תא לחפש, ולכן הזמן כמעט לא תלוי במספר האיברים. ברשימה החיפוש עובר על האיברים לפי הסדר, ובממוצע בודק חצי מהם."
  optionExplanations:
    "1": "`Dictionary` לא ממיין. אוסף ממוין לפי מפתח הוא `SortedDictionary`, וזמן החיפוש בו הוא O(log n)."
    "2": "מילון בדרך כלל תופס יותר זיכרון מרשימה. המהירות באה מהגיבוב, לא מחיסכון בזיכרון."
    "3": "אפשר לחפש ברשימה עם לולאה, אבל זה איטי. השאלה היא יעילות, לא אפשרות."
