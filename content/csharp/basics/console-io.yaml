- id: cs.basics.console-io.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    Console.Write("A");
    Console.Write("B");
    Console.WriteLine("C");
    Console.Write("D");
  options: ["ABC\nD", "A\nB\nC\nD", "ABCD", "AB\nC\nD"]
  answer: 0
  explanation: "`Console.Write` מדפיס את הטקסט ונשאר באותה שורה. `Console.WriteLine` מדפיס את הטקסט ואחריו ירידת שורה. לכן A, B ו-C באותה שורה, והירידה אחרי C מעבירה את D לשורה חדשה."
  optionExplanations:
    "1": "`Write` לא מוסיף ירידת שורה, ולכן A ו-B לא בשורות נפרדות."
    "2": "`WriteLine` אחרי C מוסיף ירידת שורה, ולכן D בשורה הבאה."
    "3": "ירידת השורה של `WriteLine` באה אחרי הטקסט שלו, לא לפניו."

- id: cs.basics.console-io.002
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    Console.WriteLine("Total: " + 2 + 3);
    Console.WriteLine(2 + 3 + " items");
  options: ["Total: 23\n5 items", "Total: 5\n5 items", "Total: 23\n23 items", "Total: 5\n23 items"]
  answer: 0
  explanation: "האופרטור `+` מחושב משמאל לימין. בשורה הראשונה `\"Total: \" + 2` הוא כבר מחרוזת, ולכן גם ה-3 משורשר אליה: `Total: 23`. בשורה השנייה `2 + 3` מחושב קודם כחיבור של מספרים (5), ורק אז משורשר לטקסט."
  optionExplanations:
    "1": "ברגע שהצד השמאלי הוא מחרוזת, `+` הוא שרשור. כדי לקבל 5 צריך סוגריים: `\"Total: \" + (2 + 3)`."
    "2": "בשורה השנייה שני האופרנדים הראשונים מספרים, ולכן הם מחוברים לפני שמגיעים למחרוזת."

- id: cs.basics.console-io.003
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    Console.WriteLine("{0} + {0} = {1}", 2, 4);
  options: ["2 + 2 = 4", "2 + 4 = 4", "{0} + {0} = {1}", "2 + 4 = 2"]
  answer: 0
  explanation: "זהו עיצוב מורכב (Composite Formatting): כל `{n}` מוחלף בארגומנט שבמקום ה-n אחרי מחרוזת העיצוב, כשהספירה מתחילה מ-0. `{0}` מופיע פעמיים ושני המופעים מוחלפים ב-2, ו-`{1}` מוחלף ב-4."
  optionExplanations:
    "1": "המספר בסוגריים המסולסלים הוא האינדקס של הארגומנט, לא מספר סידורי של מקום. שני ה-`{0}` מקבלים את אותו ערך."
    "2": "`Console.WriteLine` עם כמה ארגומנטים מפרש את המחרוזת הראשונה כתבנית ומחליף את מצייני המקום (Placeholders)."

- id: cs.basics.console-io.006
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    Console.WriteLine("Hi");
    Console.WriteLine();
    Console.WriteLine("Bye");
  options: ["Hi\n\nBye", "Hi\nBye", "HiBye", "Hi\n()\nBye"]
  answer: 0
  explanation: "`Console.WriteLine()` בלי ארגומנטים מדפיס רק ירידת שורה, ולכן נוצרת שורה ריקה בין `Hi` ל-`Bye`. זו הדרך המקובלת להוסיף רווח אנכי בפלט."
  optionExplanations:
    "1": "הקריאה בלי ארגומנטים לא מתעלמת: היא מוסיפה שורה ריקה."
    "2": "כל `WriteLine` מסיים בירידת שורה, ולכן `Hi` ו-`Bye` לא באותה שורה."

- id: cs.basics.console-io.008
  type: single
  difficulty: 1
  prompt: "מה הטיפוס שמחזירה `Console.ReadLine()`?"
  options: ["`string`", "`int`", "`char`", "`object`"]
  answer: 0
  explanation: "`Console.ReadLine()` קוראת שורה שלמה של טקסט ומחזירה אותה כ-`string`, גם אם המשתמש הקליד ספרות. כדי לקבל מספר צריך להמיר במפורש, למשל עם `int.Parse` או `int.TryParse`."
  optionExplanations:
    "1": "C# לא ממיר את הקלט למספר אוטומטית. `\"42\"` שהוקלד הוא מחרוזת עד שממירים אותו."
    "2": "`ReadLine` קוראת שורה שלמה. לקריאת מקש בודד יש את `Console.ReadKey`."

- id: cs.basics.console-io.009
  type: bug
  difficulty: 2
  prompt: "הקוד אמור לקרוא גיל ולהדפיס את הגיל בשנה הבאה. למשל, לקלט `20` צריך להיות מודפס `Next year: 21`. איזו שורה צריך לתקן?"
  code: |
    Console.Write("Enter your age: ");
    string age = Console.ReadLine();
    Console.WriteLine("Next year: " + age + 1);
  answer: 3
  explanation: "`age` היא מחרוזת, וגם הצד השמאלי של `+` הוא מחרוזת, ולכן `+ 1` משרשר את התו 1 ומודפס `Next year: 201`. צריך להמיר את הקלט למספר ולחבר בתוך סוגריים: `(int.Parse(age) + 1)`."
  fixed: |
    Console.Write("Enter your age: ");
    string age = Console.ReadLine();
    Console.WriteLine("Next year: " + (int.Parse(age) + 1));

- id: cs.basics.console-io.010
  type: bug
  difficulty: 1
  prompt: הקוד אמור להדפיס כותרת, ומתחתיה כל שם בשורה נפרדת. איזו שורה צריך לתקן?
  code: |
    Console.WriteLine("Students:");
    Console.Write("Dana");
    Console.WriteLine("Avi");
  answer: 2
  explanation: "`Console.Write` לא מוסיף ירידת שורה, ולכן `Avi` מודפס צמוד: `DanaAvi`. כדי שכל שם יהיה בשורה משלו, צריך `Console.WriteLine` גם בשורה 2."
  fixed: |
    Console.WriteLine("Students:");
    Console.WriteLine("Dana");
    Console.WriteLine("Avi");

- id: cs.basics.console-io.012
  type: truefalse
  difficulty: 1
  prompt: "`Console.WriteLine` מוסיפה ירידת שורה אחרי הטקסט, ו-`Console.Write` לא מוסיפה."
  answer: true
  explanation: "זה ההבדל היחיד ביניהן. `Write` משאירה את הסמן באותה שורה, ולכן מתאימה למשל להצגת בקשה לפני קלט: `Console.Write(\"Name: \")`. `WriteLine` מסיימת את השורה."

- id: cs.basics.console-io.013
  type: truefalse
  difficulty: 2
  prompt: "`Console.ReadLine()` מחזירה `int` כשהמשתמש מקליד ספרות, ו-`string` כשהוא מקליד אותיות."
  answer: false
  explanation: "לכל מתודה ב-C# יש טיפוס החזרה אחד שנקבע בזמן קומפילציה. `Console.ReadLine()` תמיד מחזירה `string`, גם עבור הקלט `42`. ההמרה למספר היא באחריותכם, למשל עם `int.Parse` או `int.TryParse`."

- id: cs.basics.console-io.014
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    Console.WriteLine('A' + 'B');
    Console.WriteLine("A" + 'B');
  options: ["131\nAB", "AB\nAB", "AB\n131", "131\n131"]
  answer: 0
  explanation: "`'A'` ו-`'B'` הם `char`, ו-`+` בין שני `char` הוא חיבור מספרי של הקודים שלהם: 65 + 66 = 131, מטיפוס `int`. בשורה השנייה `\"A\"` הוא `string`, ולכן `+` הוא שרשור והתו `B` מתווסף לטקסט."
  optionExplanations:
    "1": "גרשיים בודדים יוצרים `char`, לא מחרוזת. בין שני `char` האופרטור `+` מחבר מספרים."
    "2": "זה הפוך: השורה הראשונה היא חיבור מספרי, והשנייה שרשור."
    "3": "כשאחד הצדדים הוא `string`, `+` הוא תמיד שרשור."

- id: cs.basics.console-io.017
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    Console.Write("1 ");
    Console.Write("2 ");
    Console.WriteLine();
    Console.Write("3");
  options: ["1 2\n3", "1 2 3", "1\n2\n3", "1 2\n\n3"]
  answer: 0
  explanation: "`Console.Write` כותבת בלי לרדת שורה, ולכן `1` ו-`2` באותה שורה. `Console.WriteLine()` בלי ארגומנט רק יורדת שורה. לכן `3` מודפס בשורה חדשה."
  optionExplanations:
    "1": "`Console.WriteLine()` בשורה 3 יורדת שורה, ולכן `3` לא באותה שורה."
    "2": "`Console.Write` לא יורדת שורה אחרי הטקסט."
    "3": "יש ירידת שורה אחת בלבד, מ-`Console.WriteLine()`, ולא שורה ריקה."

- id: cs.basics.console-io.018
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int x = 3;
    Console.WriteLine("x = " + x * 2);
  options: ["x = 6", "x = 33", "x = 3 * 2", "שגיאת קומפילציה"]
  answer: 0
  explanation: "כפל קודם לחיבור, ולכן קודם מחושב `x * 2` שערכו 6, ורק אז הוא משורשר לטקסט. עם חיבור זה שונה: `\"x = \" + x + 2` היה מדפיס `x = 32`, כי השרשור מתבצע משמאל לימין."
  optionExplanations:
    "1": "השרשור לא מתבצע לפני הכפל. `x * 2` מחושב ראשון ונותן 6."
    "2": "`x * 2` אינו בתוך מירכאות, ולכן הוא מחושב ולא מודפס כטקסט."
    "3": "שרשור של מחרוזת עם מספר חוקי."

- id: cs.basics.console-io.019
  type: single
  difficulty: 1
  prompt: "המשתמש מקליד `Dana` ולוחץ Enter. מה תהיה השורה השנייה בחלון הקונסול?"
  code: |
    Console.Write("Name: ");
    string name = Console.ReadLine();
    Console.WriteLine("Hello " + name + "!");
  options: ["`Hello Dana!`", "`Hello name!`", "`Name: Hello Dana!`", "`Name: Dana`"]
  answer: 0
  explanation: "`Console.Write` מדפיסה `Name: ` בלי לרדת שורה, והמשתמש מקליד את שמו באותה שורה. הלחיצה על Enter יורדת שורה, ולכן השורה הראשונה היא `Name: Dana`. אחר כך `Console.WriteLine` מדפיסה `Hello Dana!` בשורה השנייה."
  optionExplanations:
    "1": "`name` בלי מירכאות הוא שם של משתנה, ולכן מודפס הערך שלו ולא המילה name."
    "2": "המשתמש לוחץ Enter אחרי שהקליד את השם, ולכן הברכה מופיעה בשורה חדשה."
    "3": "זו השורה הראשונה: הטקסט של `Console.Write` והקלט של המשתמש."

- id: cs.basics.console-io.020
  type: bug
  difficulty: 1
  prompt: "הקוד אמור לקרוא את שם המשתמש ולהדפיס ברכה עם השם, למשל `Hello Dana`. איזו שורה צריך לתקן?"
  code: |
    Console.Write("Enter your name: ");
    string name = Console.ReadLine();
    Console.WriteLine("Hello " + "name");
  answer: 3
  explanation: "`\"name\"` במירכאות הוא טקסט קבוע, ולכן מודפס תמיד `Hello name`. כדי להדפיס את מה שהמשתמש הקליד צריך להשתמש במשתנה עצמו, בלי מירכאות: `\"Hello \" + name`."
  fixed: |
    Console.Write("Enter your name: ");
    string name = Console.ReadLine();
    Console.WriteLine("Hello " + name);

- id: cs.basics.console-io.021
  type: truefalse
  difficulty: 1
  prompt: "הפקודה `Console.WriteLine(5 + 5);` מדפיסה `55`."
  answer: false
  explanation: "שני הצדדים של `+` הם מספרים, ולכן זה חיבור רגיל ומודפס `10`. שרשור קורה רק כשלפחות אחד הצדדים הוא מחרוזת, למשל `\"5\" + 5`."

- id: cs.basics.console-io.022
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    Console.WriteLine("" + 1 + 2);
    Console.WriteLine(1 + 2 + "");
  options: ["12\n3", "3\n3", "12\n12", "3\n12"]
  answer: 0
  explanation: "`+` מחושב משמאל לימין. בשורה הראשונה `\"\" + 1` הוא כבר מחרוזת (`\"1\"`), ולכן גם `+ 2` משרשר: `12`. בשורה השנייה `1 + 2` הוא חיבור של מספרים (3), ורק אחר כך הוא משורשר למחרוזת הריקה: `3`."
  optionExplanations:
    "1": "בשורה הראשונה המחרוזת הריקה באה ראשונה, ולכן כל ה-`+` אחריה הם שרשור."
    "2": "בשורה השנייה החיבור `1 + 2` מתבצע לפני שמגיעים למחרוזת."
    "3": "הסדר הפוך: המחרוזת בהתחלה גורמת לשרשור, ובסוף היא לא משנה את החיבור שכבר קרה."
