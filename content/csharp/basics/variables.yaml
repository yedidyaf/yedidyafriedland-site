- id: cs.basics.variables.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    int x = 5;
    int y = x;
    x = 10;
    Console.WriteLine(y);
  options: ["5", "10", "15", "0"]
  answer: 0
  explanation: "השורה `int y = x;` מעתיקה את הערך שיש ב-`x` באותו רגע (5) לתוך `y`. אחרי ההעתקה אין קשר בין שני המשתנים, ולכן שינוי `x` ל-10 לא משפיע על `y`."
  optionExplanations:
    "1": "הצבה מעתיקה ערך פעם אחת. `y` לא \"עוקב\" אחרי `x` ולא מתעדכן כשהוא משתנה."
    "2": "אין כאן חיבור. `y` קיבל עותק של 5, ו-`x` קיבל ערך חדש בנפרד."

- id: cs.basics.variables.003
  type: output
  difficulty: 1
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    int count = 5;
    count = "five";
    Console.WriteLine(count);
  options: ["five", "5", "5five", "שגיאת קומפילציה"]
  answer: 3
  explanation: "ב-C# הטיפוס של משתנה נקבע בהצהרה ולא משתנה לעולם (Static Typing). `count` הוצהר כ-`int`, ולכן הצבת מחרוזת אליו היא שגיאת קומפילציה. זה שונה משפות כמו Python, שבהן משתנה יכול להחזיק פעם מספר ופעם טקסט."
  optionExplanations:
    "0": "משתנה מטיפוס `int` לא יכול לקבל מחרוזת, ולכן התוכנית לא מגיעה להדפסה."
    "1": "הקומפיילר עוצר כבר בשורה 2, ולכן שום דבר לא מודפס."
    "2": "אין כאן שרשור. השורה השנייה היא הצבה, והיא לא חוקית."

- id: cs.basics.variables.005
  type: bug
  difficulty: 1
  prompt: הקוד אמור להחליף בין הערכים של `a` ו-`b` ולהדפיס `7 3`. איזו שורה צריך לתקן?
  code: |
    int a = 3;
    int b = 7;
    int temp = a;
    a = b;
    b = a;
    Console.WriteLine(a + " " + b);
  answer: 5
  explanation: "בשורה 4 הערך המקורי של `a` נדרס ב-7. לכן בשורה 5 `b = a` מציב שוב 7, והפלט הוא `7 7`. בדיוק בשביל זה שמרנו את הערך המקורי ב-`temp`, וצריך להציב אותו: `b = temp;`."
  fixed: |
    int a = 3;
    int b = 7;
    int temp = a;
    a = b;
    b = temp;
    Console.WriteLine(a + " " + b);

- id: cs.basics.variables.007
  type: output
  difficulty: 2
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    int total;
    Console.WriteLine(total);
  options: ["0", "null", "שגיאת קומפילציה"]
  answer: 2
  explanation: "משתנה מקומי (Local Variable) לא מקבל ערך ברירת מחדל. הקומפיילר דורש השמה ודאית (Definite Assignment) לפני כל קריאה, ולכן קריאה של `total` שלא אותחל היא שגיאת קומפילציה. ערכי ברירת מחדל אוטומטיים קיימים רק לשדות ולאיברי מערך."
  optionExplanations:
    "0": "רק שדות של מחלקה ואיברי מערך מקבלים 0 אוטומטית. משתנה מקומי חייב השמה לפני שימוש."
    "1": "`int` הוא טיפוס ערך ולא יכול להכיל `null` בכלל."

- id: cs.basics.variables.008
  type: single
  difficulty: 3
  tags: [compile-error]
  prompt: איזו מההצהרות בקוד לא מתקמפלת?
  code: |
    const int Max = 100;
    const int Twice = Max * 2;
    const string Title = "Menu";
    int size = 5;
    const int Limit = size + 1;
  options:
    - "`const int Max = 100;`"
    - "`const int Twice = Max * 2;`"
    - "`const string Title = \"Menu\";`"
    - "`const int Limit = size + 1;`"
  answer: 3
  explanation: "ערך של `const` חייב להיות ידוע בזמן קומפילציה (Compile-time Constant). `size` הוא משתנה רגיל, וערכו ידוע רק בזמן ריצה, ולכן `size + 1` לא יכול לאתחל קבוע. ביטוי שבנוי רק מליטרלים ומקבועים אחרים, כמו `Max * 2`, חוקי."
  optionExplanations:
    "1": "`Max` הוא קבוע, ולכן גם `Max * 2` מחושב בזמן קומפילציה. זה חוקי."
    "2": "`string` הוא אחד הטיפוסים שמותר להגדיר כ-`const`, וליטרל מחרוזת ידוע בזמן קומפילציה."

- id: cs.basics.variables.009
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int a = 5;
    double b = 2.0;
    int c = a / 2;
    double d = a / b;
    Console.WriteLine(c);
    Console.WriteLine(d);
  options: ["2\n2.5", "2.5\n2.5", "2\n2", "2.5\n2"]
  answer: 0
  explanation: "`a / 2` היא חלוקה בין שני `int`, ולכן התוצאה שלמה: 2 (החלק העשרוני נחתך). ב-`a / b` אחד הצדדים הוא `double`, ולכן החלוקה עשרונית והתוצאה 2.5."
  optionExplanations:
    "1": "חלוקה של `int` ב-`int` נותנת `int`. התוצאה של `5 / 2` היא 2, ואי אפשר לשמור 2.5 ב-`int`."
    "2": "ב-`a / b` המחלק הוא `double`, ולכן החלוקה עשרונית ולא שלמה."
    "3": "הסדר הפוך: החלוקה השלמה היא `a / 2`, והעשרונית היא `a / b`."

- id: cs.basics.variables.012
  type: single
  difficulty: 2
  prompt: איזה מהשמות הבאים הוא שם חוקי למשתנה ב-C#?
  options: ["`_count`", "`2ndPlace`", "`first-name`", "`class`"]
  answer: 0
  explanation: "מזהה (Identifier) ב-C# מתחיל באות או בקו תחתון, וממשיך באותיות, ספרות וקווים תחתונים. `_count` עומד בכללים. מילים שמורות (Keywords) כמו `class` אסורות כשם, אלא אם מוסיפים להן `@`."
  optionExplanations:
    "1": "שם משתנה לא יכול להתחיל בספרה."
    "2": "המקף מתפרש כאופרטור החיסור, כלומר `first` פחות `name`."
    "3": "`class` היא מילה שמורה. אפשר רק `@class`, וגם זה לא מומלץ."

- id: cs.basics.variables.013
  type: bug
  difficulty: 1
  prompt: הקוד אמור לסכם שלוש רכישות ולהדפיס `60`. איזו שורה צריך לתקן?
  code: |
    int total = 0;
    int purchase = 10;
    total += purchase;
    purchase = 20;
    total += purchase;
    purchase = 30;
    total = purchase;
    Console.WriteLine(total);
  answer: 7
  explanation: "`total = purchase` מחליף את הסכום שנצבר עד עכשיו בערך 30, ולכן מודפס `30`. כדי להוסיף לסכום צריך הצבה מורכבת (Compound Assignment): `total += purchase`, שהיא קיצור של `total = total + purchase`."
  fixed: |
    int total = 0;
    int purchase = 10;
    total += purchase;
    purchase = 20;
    total += purchase;
    purchase = 30;
    total += purchase;
    Console.WriteLine(total);

- id: cs.basics.variables.014
  type: cleaner
  difficulty: 2
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      const double VatRate = 0.17;
      double price = 100;
      double total = price * (1 + VatRate);
      Console.WriteLine(total);
    - |
      double price = 100;
      double total = price * 1.17;
      Console.WriteLine(total);
    - |
      double vat = 0.17;
      double price = 100;
      double total = price * (1 + vat);
      Console.WriteLine(total);
  answer: 0
  explanation: "ערך שלא אמור להשתנות לעולם, כמו שיעור המע\"מ, מתאים ל-`const` עם שם ברור. השם מסביר מה המספר אומר, והקומפיילר מונע שינוי בטעות. לפי המוסכמות של C#, קבועים נכתבים ב-PascalCase."
  optionExplanations:
    "1": "`1.17` הוא מספר קסם (Magic Number): הקורא צריך לנחש שמדובר במע\"מ, ואם השיעור ישתנה צריך לחפש כל מופע שלו."
    "2": "יש שם, אבל משתנה רגיל אפשר לשנות בטעות בהמשך. ערך קבוע צריך להיות מוגדר כ-`const`."

- id: cs.basics.variables.016
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    char letter = 'A';
    int next = letter + 1;
    Console.WriteLine(next);
  options: ["66", "B", "A1", "שגיאת קומפילציה"]
  answer: 0
  explanation: "בחיבור `char` עם `int`, התו מומר לקוד המספרי שלו (65 עבור `'A'`) והתוצאה היא `int`, כאן 66. כדי לקבל את התו `B` צריך המרה מפורשת חזרה לתו: `(char)(letter + 1)`."
  optionExplanations:
    "1": "התוצאה של `char + int` היא מספר. `next` הוא `int`, ולכן מודפס 66 ולא תו."
    "2": "שרשור טקסט קורה רק כשאחד הצדדים הוא `string`. `'A'` הוא `char`, שמתנהג כמו מספר בחשבון."
    "3": "חיבור `char` ו-`int` חוקי, והתוצאה נכנסת ל-`int` בלי המרה."

- id: cs.basics.variables.017
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    int a = 4;
    int b = a * 2;
    a = a + 1;
    Console.WriteLine(a + " " + b);
  options: ["5 8", "5 10", "4 8", "9 8"]
  answer: 0
  explanation: "`b` מחושב פעם אחת, בשורה 2, כשערכו של `a` הוא 4, ולכן `b` שווה 8. השינוי של `a` בשורה 3 לא משנה את `b` בדיעבד. הצבה מעתיקה ערך ברגע שהיא רצה, ולא יוצרת קשר קבוע בין המשתנים."
  optionExplanations:
    "1": "`b` לא מתעדכן כש-`a` משתנה. הוא קיבל את הערך 8 ונשאר איתו."
    "2": "שורה 3 מוסיפה 1 ל-`a`, ולכן `a` כבר 5 בזמן ההדפסה."
    "3": "`a + \" \" + b` הוא שרשור, כי יש באמצע מחרוזת. המספרים לא מתחברים זה לזה."

- id: cs.basics.variables.018
  type: single
  difficulty: 1
  prompt: איזו מההצהרות הבאות מתקמפלת?
  options:
    - "`double d = 5;`"
    - "`int n = 2.5;`"
    - "`char c = \"a\";`"
    - "`string s = 'a';`"
  answer: 0
  explanation: "מותר להציב `int` במשתנה `double`, כי אין אובדן מידע: `d` יקבל 5.0. הכיוון ההפוך (`double` ל-`int`) דורש המרה מפורשת. תו בודד (`char`) נכתב בגרש `'a'`, ומחרוזת (`string`) במירכאות `\"a\"`."
  optionExplanations:
    "1": "`2.5` הוא `double`, והצבה שלו ב-`int` הייתה מאבדת את החלק העשרוני. בלי המרה מפורשת זו שגיאת קומפילציה."
    "2": "`\"a\"` הוא מחרוזת, גם אם יש בה תו אחד. תו בודד נכתב בגרשים: `'a'`."
    "3": "`'a'` הוא `char`, ולא מחרוזת. מחרוזת נכתבת במירכאות: `\"a\"`."

- id: cs.basics.variables.019
  type: truefalse
  difficulty: 1
  prompt: "מותר להצהיר פעמיים על משתנה באותו שם באותו בלוק, למשל `int x = 1;` ואחריה `int x = 2;`."
  answer: false
  explanation: "שם של משתנה חייב להיות ייחודי בבלוק שבו הוא מוצהר. הצהרה שנייה באותו שם היא שגיאת קומפילציה. כדי לשנות את הערך, מציבים בלי לכתוב שוב את הטיפוס: `x = 2;`."

- id: cs.basics.variables.020
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int x = 3;
    x = x * x;
    x = x - 1;
    Console.WriteLine(x);
  options: ["8", "5", "9", "2"]
  answer: 0
  explanation: "הצד הימני מחושב קודם עם הערך הנוכחי, ורק אז נשמר במשתנה. בשורה 2 מחושב `3 * 3` ו-`x` הופך ל-9. בשורה 3 מחושב `9 - 1` ו-`x` הופך ל-8."
  optionExplanations:
    "1": "זה היה נכון אם שורה 2 הייתה מחשבת `3 + 3 - 1`. הכפל `x * x` נותן 9."
    "2": "שורה 3 מחסירה 1 מהערך החדש, ולכן התוצאה 8 ולא 9."
    "3": "החיסור נעשה מהערך המעודכן 9, לא מהערך המקורי 3."

- id: cs.basics.variables.021
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס את השטח (12) ואת ההיקף (14) של מלבן ברוחב 3 ובגובה 4. איזו שורה צריך לתקן?"
  code: |
    int width = 3;
    int height = 4;
    int area = width * height;
    int perimeter = width + height * 2;
    Console.WriteLine(area);
    Console.WriteLine(perimeter);
  answer: 4
  explanation: "כפל קודם לחיבור, ולכן `width + height * 2` מחושב כ-`3 + 8` ונותן 11. ההיקף הוא פעמיים סכום הצלעות, וצריך סוגריים: `2 * (width + height)`."
  fixed: |
    int width = 3;
    int height = 4;
    int area = width * height;
    int perimeter = 2 * (width + height);
    Console.WriteLine(area);
    Console.WriteLine(perimeter);

- id: cs.basics.variables.022
  type: output
  difficulty: 2
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    const int Max = 10;
    Max = 20;
    Console.WriteLine(Max);
  options: ["20", "10", "שגיאת קומפילציה"]
  answer: 2
  explanation: "`const` מגדיר קבוע (Constant): הערך נקבע בהצהרה ואי אפשר לשנות אותו אחר כך. ההצבה בשורה 2 היא שגיאת קומפילציה. משתמשים בקבוע לערכים שלא אמורים להשתנות, כמו ציון מקסימלי."
  optionExplanations:
    "0": "קבוע לא ניתן לשינוי, ולכן התוכנית לא מתקמפלת ולא מדפיסה דבר."
    "1": "הקומפיילר לא מתעלם מההצבה. הוא מסרב לקמפל את התוכנית."
