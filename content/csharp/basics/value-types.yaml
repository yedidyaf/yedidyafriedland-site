- id: cs.basics.value-types.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    bool isAdult = 20 >= 18;
    Console.WriteLine(isAdult);
  options: ["True", "true", "1", "20"]
  answer: 0
  explanation: "ביטוי השוואה מחזיר ערך מטיפוס `bool`. `Console.WriteLine` מדפיס `bool` כ-`True` או `False`, עם אות ראשונה גדולה, למרות שבקוד כותבים `true` ו-`false` באותיות קטנות."
  optionExplanations:
    "1": "בקוד כותבים `true`, אבל ההדפסה של `bool` ב-.NET היא `True` עם אות גדולה."
    "2": "ב-C# `bool` אינו מספר. הוא לא מודפס כ-1, ואין בכלל המרה בינו לבין `int`."

- id: cs.basics.value-types.006
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    char c = 'a';
    c++;
    Console.WriteLine(c);
    Console.WriteLine(c + 1);
  options: ["b\n99", "b\nc", "98\n99", "b\nb1"]
  answer: 0
  explanation: "`char` שומר תו לפי הקוד המספרי שלו. `c++` מגדיל את הקוד ב-1 ומשאיר את הטיפוס `char`, ולכן `c` הוא `'b'` (קוד 98). אבל `c + 1` הוא חיבור של `char` ו-`int`, שתוצאתו `int`, ולכן מודפס המספר 99 ולא תו."
  optionExplanations:
    "1": "`c + 1` מחזיר `int`, ולכן מודפס מספר. כדי לקבל `c` צריך `(char)(c + 1)`."
    "2": "`c++` לא משנה את הטיפוס של `c`. הוא נשאר `char` ומודפס כתו."
    "3": "`'b'` הוא `char` ולא `string`, ולכן `+ 1` הוא חשבון ולא שרשור."

- id: cs.basics.value-types.012
  type: output
  difficulty: 2
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    bool isReady = 1;
    Console.WriteLine(isReady);
  options: ["True", "1", "False", "שגיאת קומפילציה"]
  answer: 3
  explanation: "ב-C# `bool` הוא טיפוס נפרד לגמרי ממספרים: אין המרה בין `int` ל-`bool`. לכן `bool isReady = 1;` היא שגיאת קומפילציה. בשפות כמו C ו-Python 1 נחשב \"אמת\", אבל לא ב-C#. כותבים `true` או `false`."
  optionExplanations:
    "0": "זה היה קורה בשפה שבה 1 נחשב אמת. ב-C# `bool` מקבל רק `true` או `false`."
    "1": "משתנה `bool` לא יכול להחזיק מספר, ולכן התוכנית לא מתקמפלת."
    "2": "אין המרה של 1 ל-`bool` בכלל, לא ל-`True` ולא ל-`False`."

- id: cs.basics.value-types.017
  type: single
  difficulty: 1
  prompt: "באיזה טיפוס הכי מתאים לשמור ממוצע ציונים, למשל `87.5`?"
  options: ["`double`", "`int`", "`char`", "`bool`"]
  answer: 0
  explanation: "`double` שומר מספרים עם חלק עשרוני. ממוצע של ציונים שלמים יכול לצאת לא שלם, ולכן `double` מתאים לו. `int` שומר רק מספרים שלמים."
  optionExplanations:
    "1": "`int` שומר רק מספרים שלמים, ולכן לא יכול להחזיק `87.5`."
    "2": "`char` שומר תו אחד, כמו `'A'`, ולא מספר עם נקודה עשרונית."
    "3": "`bool` שומר רק `true` או `false`."

- id: cs.basics.value-types.018
  type: single
  difficulty: 1
  prompt: באיזה טיפוס הכי מתאים לשמור את התשובה לשאלה "האם התלמיד עבר את המבחן"?
  options: ["`bool`", "`int`", "`string`", "`char`"]
  answer: 0
  explanation: "`bool` הוא טיפוס בוליאני (Boolean) עם שני ערכים בלבד: `true` ו-`false`. הוא מתאים בדיוק לשאלות של כן ולא, וגם לתוצאה של השוואה כמו `grade >= 55`."
  optionExplanations:
    "1": "אפשר לשמור 0 ו-1, אבל `int` מאפשר גם 7 או 100-, וזה לא אומר כלום. `bool` מגביל לשני הערכים הנכונים."
    "2": "מחרוזת כמו `\"yes\"` עלולה להיכתב גם `\"Yes\"` או `\"y\"`. `bool` מונע את הבלבול."
    "3": "`char` כמו `'y'` הוא תו ולא ערך אמת. הוא לא מתאים לתוצאה של השוואה."

- id: cs.basics.value-types.019
  type: single
  difficulty: 1
  prompt: "איזה מהערכים הבאים הוא ערך חוקי לטיפוס `char`?"
  options: ["`'x'`", "`\"x\"`", "`'xy'`", "`x`"]
  answer: 0
  explanation: "`char` מחזיק תו אחד בדיוק, והוא נכתב בין גרשים בודדים: `'x'`. מירכאות כפולות יוצרות `string`, גם כשיש בתוכן תו אחד."
  optionExplanations:
    "1": "`\"x\"` הוא מחרוזת (`string`) באורך 1, לא `char`."
    "2": "`char` מחזיק תו אחד בלבד. `'xy'` הוא שגיאת קומפילציה."
    "3": "בלי גרשים, `x` הוא שם של משתנה ולא תו."

- id: cs.basics.value-types.020
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    double d = 7;
    Console.WriteLine(d);
  options: ["7", "7.0", "7.00", "שגיאת קומפילציה"]
  answer: 0
  explanation: "מותר להציב `int` ב-`double`, ו-`d` מקבל את הערך 7.0. אבל כשמדפיסים `double` שאין לו חלק עשרוני, C# מדפיס אותו בלי נקודה: `7`. הערך הוא עדיין `double`."
  optionExplanations:
    "1": "C# לא מוסיף `.0` בהדפסה של `double` שלם. מודפס `7`."
    "2": "שתי ספרות אחרי הנקודה מופיעות רק כשמבקשים עיצוב מיוחד."
    "3": "הצבה של `int` ב-`double` חוקית, כי אין בה אובדן מידע."

- id: cs.basics.value-types.021
  type: output
  difficulty: 2
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    int total = 10 / 4.0;
    Console.WriteLine(total);
  options: ["2", "2.5", "3", "שגיאת קומפילציה"]
  answer: 3
  explanation: "`4.0` הוא `double`, ולכן התוצאה של `10 / 4.0` היא `double` (2.5). אין המרה מרומזת מ-`double` ל-`int`, כי היא מאבדת את החלק העשרוני, ולכן זו שגיאת קומפילציה. צריך משתנה `double` או המרה מפורשת."
  optionExplanations:
    "0": "C# לא חותך את 2.5 בשקט. בלי המרה מפורשת הקוד לא מתקמפל."
    "1": "2.5 היא אכן תוצאת החלוקה, אבל אי אפשר לשמור אותה ב-`int`."
    "2": "אין עיגול אוטומטי. הקוד לא מתקמפל בכלל."

- id: cs.basics.value-types.022
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    char c = '7';
    int n = c - '0';
    Console.WriteLine(n + 1);
  options: ["8", "56", "71", "שגיאת קומפילציה"]
  answer: 0
  explanation: "הספרות `'0'` עד `'9'` מופיעות ברצף בטבלת התווים, ולכן `c - '0'` נותן את המרחק של התו מ-`'0'`, כלומר את הספרה עצמה: 7. זו דרך נפוצה להפוך תו של ספרה למספר. `7 + 1` הוא 8."
  optionExplanations:
    "1": "56 הוא `'7' + 1` בלי החיסור של `'0'`, כי הקוד של `'7'` הוא 55."
    "2": "אין כאן שרשור. גם `c` וגם `'0'` הם תווים, וחיסור ביניהם נותן מספר."
    "3": "חיסור בין שני `char` חוקי, והתוצאה היא `int`."

- id: cs.basics.value-types.023
  type: truefalse
  difficulty: 1
  prompt: "משתנה מטיפוס `char` מחזיק תו אחד בדיוק, ומשתנה מטיפוס `string` יכול להחזיק רצף של תווים, גם ריק."
  answer: true
  explanation: "`char` הוא תו בודד, כמו `'A'` או `'7'`. `string` הוא רצף של תווים באורך כלשהו, כולל המחרוזת הריקה `\"\"`."

- id: cs.basics.value-types.024
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    string s = "5";
    int n = 5;
    Console.WriteLine(s + n);
    Console.WriteLine(n + n);
  options: ["55\n10", "10\n10", "55\n55", "שגיאת קומפילציה"]
  answer: 0
  explanation: "כשאחד הצדדים של `+` הוא `string`, מתבצע שרשור (Concatenation): `\"5\" + 5` נותן את הטקסט `55`. כששני הצדדים מספרים, `+` הוא חיבור רגיל: 10. הטיפוס של הערכים קובע מה `+` עושה."
  optionExplanations:
    "1": "`s` הוא מחרוזת, ולכן `s + n` משרשר ולא מחבר."
    "2": "`n + n` הוא חיבור של שני `int`, ולכן התוצאה 10."
    "3": "חיבור של `string` ו-`int` חוקי: המספר מומר לטקסט ומשורשר."

- id: cs.basics.value-types.025
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    Console.WriteLine('a' + 'b');
  options: ["195", "ab", "a b", "שגיאת קומפילציה"]
  answer: 0
  explanation: "`'a'` ו-`'b'` הם `char`, לא מחרוזות. בחיבור של שני תווים כל אחד מומר לקוד המספרי שלו (97 ו-98), והתוצאה היא המספר 195. כדי לקבל `ab` צריך שלפחות צד אחד יהיה `string`, למשל `\"a\" + 'b'`."
  optionExplanations:
    "1": "שרשור קורה רק כשאחד הצדדים הוא `string`. שני `char` מתחברים כמו מספרים."
    "2": "אין רווח בשום מקום בביטוי, וגם אין שרשור."
    "3": "חיבור של שני `char` חוקי, והתוצאה היא `int`."

- id: cs.basics.value-types.026
  type: single
  difficulty: 2
  prompt: איזו מההצהרות הבאות לא מתקמפלת?
  options:
    - "`bool ok = 5 == 5;`"
    - "`bool ok = true;`"
    - "`bool ok = \"true\";`"
    - "`string ok = \"true\";`"
  answer: 2
  explanation: "`\"true\"` הוא מחרוזת, ולא ערך בוליאני. משתנה `bool` מקבל רק `true`, `false` או תוצאה של ביטוי השוואה כמו `5 == 5`. מחרוזת אפשר לשמור רק במשתנה `string`."
  optionExplanations:
    "0": "`5 == 5` הוא ביטוי השוואה שערכו `true`, ולכן ההצהרה חוקית."
    "1": "`true` בלי מירכאות הוא הערך הבוליאני עצמו."
    "3": "`ok` כאן הוא `string`, ולכן מותר לשמור בו את הטקסט `\"true\"`."

- id: cs.basics.value-types.027
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס את הממוצע של הציונים 85 ו-90, כלומר `87.5`. איזו שורה צריך לתקן?"
  code: |
    int sum = 85 + 90;
    double average = sum / 2;
    Console.WriteLine(average);
  answer: 2
  explanation: "`sum / 2` היא חלוקה בין שני `int`, ולכן התוצאה שלמה (87) עוד לפני שהיא נשמרת ב-`double`. הטיפוס של המשתנה שמקבל את התוצאה לא משנה את סוג החלוקה. צריך שאחד הצדדים יהיה `double`: `sum / 2.0`."
  fixed: |
    int sum = 85 + 90;
    double average = sum / 2.0;
    Console.WriteLine(average);

- id: cs.basics.value-types.028
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    double x = 2.5;
    double y = x * 2;
    Console.WriteLine(y);
  options: ["5", "5.0", "4", "שגיאת קומפילציה"]
  answer: 0
  explanation: "`2.5 * 2` הוא 5.0, ו-`y` הוא `double`. כשמדפיסים `double` בלי חלק עשרוני, C# מדפיס אותו בלי נקודה: `5`."
  optionExplanations:
    "1": "C# לא מוסיף `.0` בהדפסה של `double` שלם."
    "2": "אין חיתוך של 2.5 ל-2 לפני הכפל. `x` הוא `double` ושומר את 2.5 במלואו."
    "3": "כפל של `double` ב-`int` חוקי, והתוצאה היא `double`."

- id: cs.basics.value-types.029
  type: truefalse
  difficulty: 2
  prompt: "בקוד C# אפשר לכתוב את הערך הבוליאני גם `True` וגם `true`, כי זה אותו ערך."
  answer: false
  explanation: "C# מבחין בין אותיות גדולות לקטנות (Case Sensitive). מילת המפתח היא `true` באותיות קטנות, ו-`True` בקוד היא שגיאת קומפילציה. מה שמבלבל הוא ש-`Console.WriteLine` מדפיס `True` עם אות גדולה."
