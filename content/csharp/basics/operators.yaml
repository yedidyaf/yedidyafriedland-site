- id: cs.basics.operators.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    int a = 7;
    int b = 2;
    Console.WriteLine(a / b);
    Console.WriteLine(a % b);
  options: ["3\n1", "3.5\n1", "3\n0", "3.5\n0.5"]
  answer: 0
  explanation: "חלוקה בין שני `int` היא חלוקה שלמה: 7/2 = 3. השארית `7 % 2` היא 1."

- id: cs.basics.operators.002
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int i = 5;
    int a = i++;
    int b = ++i;
    Console.WriteLine(a + " " + b + " " + i);
  options: ["5 7 7", "6 7 7", "5 6 6", "6 6 7"]
  answer: 0
  explanation: "`i++` (Postfix) מחזיר את הערך הנוכחי ורק אחר כך מגדיל, ולכן `a` הוא 5 ו-`i` הופך ל-6. `++i` (Prefix) מגדיל קודם ומחזיר את הערך החדש, ולכן `i` הופך ל-7 ו-`b` הוא 7."
  optionExplanations:
    "1": "`i++` מחזיר את הערך שלפני ההגדלה, ולכן `a` מקבל 5 ולא 6."
    "2": "גם `i++` וגם `++i` מגדילים את `i`. אחרי שתי ההגדלות `i` הוא 7."
    "3": "`a` מקבל את הערך שלפני ההגדלה הראשונה, 5."

- id: cs.basics.operators.003
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    Console.WriteLine(2 + 3 * 4);
    Console.WriteLine((2 + 3) * 4);
  options: ["14\n20", "20\n20", "14\n14", "20\n14"]
  answer: 0
  explanation: "לכפל יש קדימות (Precedence) גבוהה מלחיבור, כמו במתמטיקה: `2 + 3 * 4` הוא `2 + 12`, כלומר 14. סוגריים משנים את הסדר: `(2 + 3) * 4` הוא `5 * 4`, כלומר 20."
  optionExplanations:
    "1": "החישוב לא נעשה פשוט משמאל לימין. בשורה הראשונה הכפל מתבצע לפני החיבור."

- id: cs.basics.operators.004
  type: single
  difficulty: 2
  prompt: איזה מהביטויים הבאים ערכו `3.5`?
  options: ["`7 / 2.0`", "`7 / 2`", "`7 / 2 + 0.0`", "`7 / 2 * 1.0`"]
  answer: 0
  explanation: "חלוקה עשרונית מתבצעת כשלפחות אחד הצדדים של החלוקה הוא `double`. ב-`7 / 2.0` המחלק הוא `double`, ולכן התוצאה 3.5. בכל שאר הביטויים החלוקה `7 / 2` מתבצעת קודם בין שני `int` ומחזירה 3, ומה שבא אחריה כבר לא מחזיר את החלק שאבד."
  optionExplanations:
    "1": "שני הצדדים `int`, ולכן זו חלוקה שלמה שמחזירה 3."
    "2": "החלוקה מתבצעת לפני החיבור ונותנת 3. הוספת `0.0` הופכת את התוצאה ל-`double`, אבל ערכה 3."
    "3": "`7 / 2` מחושב ראשון ונותן 3, ורק אז הכפל ב-1.0 הופך אותו ל-3.0."

- id: cs.basics.operators.008
  type: single
  difficulty: 3
  prompt: "הכלל: מותר להיכנס אם הגיל לפחות 18, או אם הגיל לפחות 12 ויש מלווה. איזה ביטוי מממש את הכלל נכון?"
  options:
    - "`age >= 18 || age >= 12 && withParent`"
    - "`age >= 18 && age >= 12 || withParent`"
    - "`(age >= 18 || age >= 12) && withParent`"
    - "`age >= 18 || age >= 12 || withParent`"
  answer: 0
  explanation: "ל-`&&` יש קדימות גבוהה מ-`||`, כמו שכפל קודם לחיבור. לכן הביטוי הראשון מתפרש כ-`age >= 18 || (age >= 12 && withParent)`, וזה בדיוק הכלל. גם כשהקדימות עובדת לטובתכם, כדאי להוסיף את הסוגריים במפורש כדי שהקורא לא יצטרך לזכור אותה."
  optionExplanations:
    "1": "זה מתפרש כ-`(age >= 18 && age >= 12) || withParent`, ולכן ילד בן 5 עם מלווה ייכנס."
    "2": "כאן גם מבוגר בן 30 חייב מלווה, כי `&& withParent` חל על הכול."
    "3": "עם `||` בלבד, כל מי שיש לו מלווה נכנס בלי קשר לגיל, וכל מי שמעל 12 נכנס גם בלי מלווה."

- id: cs.basics.operators.009
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    bool a = true;
    bool b = false;
    Console.WriteLine(a && b);
    Console.WriteLine(!a || b);
  options: ["True\nFalse", "False\nFalse", "True\nTrue", "False\nTrue"]
  answer: 1
  explanation: "`&&` (וגם) מחזיר `true` רק כששני הצדדים אמת. `b` שקר, ולכן `a && b` הוא `False`. ב-`!a || b` האופרטור `!` הופך את `a` ל-`false`, וגם `b` הוא `false`, ולכן גם `||` (או) מחזיר `False`."
  optionExplanations:
    "0": "`&&` דורש ששני הצדדים יהיו אמת. מספיק ש-`b` שקר כדי שהתוצאה תהיה `False`."
    "2": "`&&` עם צד אחד שקר נותן `False`, ו-`!a` הוא `false` ולא `true`."
    "3": "`!` הופך את `a` ל-`false` לפני ה-`||`, וגם `b` שקר, ולכן התוצאה `False`."

- id: cs.basics.operators.010
  type: bug
  difficulty: 3
  prompt: "הקוד אמור להדפיס `True` כי 3- הוא מספר אי־זוגי. איזו שורה צריך לתקן?"
  code: |
    int temperature = -3;
    bool isOdd = temperature % 2 == 1;
    Console.WriteLine(isOdd);
  answer: 2
  explanation: "ב-C# השארית שומרת על סימן המחולק, ולכן `-3 % 2` הוא 1- ולא 1. הבדיקה `== 1` נכשלת לכל מספר אי־זוגי שלילי. הבדיקה הנכונה לאי־זוגיות היא `% 2 != 0`, שעובדת גם למספרים שליליים."
  fixed: |
    int temperature = -3;
    bool isOdd = temperature % 2 != 0;
    Console.WriteLine(isOdd);

- id: cs.basics.operators.011
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס את אחוז התשובות הנכונות, `90`. איזו שורה צריך לתקן?"
  code: |
    int correct = 45;
    int total = 50;
    double percent = correct / total * 100;
    Console.WriteLine(percent);
  answer: 3
  explanation: "`correct / total` היא חלוקה בין שני `int`, ולכן 45/50 נותן 0, ו-0 כפול 100 הוא 0. ההצבה למשתנה `double` קורית רק אחרי שהחישוב כבר הסתיים. צריך שאחד האופרנדים יהיה עשרוני לפני החלוקה, למשל `100.0 * correct / total`."
  fixed: |
    int correct = 45;
    int total = 50;
    double percent = 100.0 * correct / total;
    Console.WriteLine(percent);

- id: cs.basics.operators.013
  type: single
  difficulty: 1
  prompt: "מה ערכו של הביטוי `17 % 5`?"
  options: ["2", "3", "3.4", "12"]
  answer: 0
  explanation: "האופרטור `%` (Remainder) מחזיר את השארית של חלוקה שלמה. 5 נכנס ב-17 שלוש פעמים (15), ונשארת שארית 2."
  optionExplanations:
    "1": "3 הוא המנה, התוצאה של `17 / 5`. האופרטור `%` מחזיר את מה שנשאר."
    "2": "3.4 הוא תוצאת החלוקה העשרונית `17 / 5.0`, לא השארית."

- id: cs.basics.operators.014
  type: truefalse
  difficulty: 1
  prompt: "הביטוי `++x` מחזיר את הערך של `x` לפני ההגדלה."
  answer: false
  explanation: "`++x` (Prefix) מגדיל קודם ומחזיר את הערך החדש. מי שמחזיר את הערך הישן הוא `x++` (Postfix). אם `x` הוא 5, `++x` מחזיר 6 ו-`x++` מחזיר 5, ובשני המקרים `x` הופך ל-6."

- id: cs.basics.operators.017
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    int x = 10;
    x += 5;
    x -= 3;
    x *= 2;
    Console.WriteLine(x);
  options: ["24", "12", "17", "14"]
  answer: 0
  explanation: "אופרטורי ההצבה המקוצרים פועלים על הערך הנוכחי: `x += 5` זהה ל-`x = x + 5`. הערך עובר 10, 15, 12 ולבסוף 24."
  optionExplanations:
    "1": "12 הוא הערך לפני השורה האחרונה. `x *= 2` מכפיל אותו ל-24."
    "2": "`*=` מכפיל ב-2, ולא מוסיף 2 או 5."
    "3": "כל שורה פועלת על התוצאה של השורה הקודמת, לא על הערך ההתחלתי 10."

- id: cs.basics.operators.018
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int n = 1234;
    Console.WriteLine(n % 10);
    Console.WriteLine(n / 10);
  options: ["4\n123", "1\n234", "4\n123.4", "123\n4"]
  answer: 0
  explanation: "שארית החלוקה ב-10 היא ספרת האחדות: `1234 % 10` הוא 4. חלוקה שלמה ב-10 מורידה את ספרת האחדות: `1234 / 10` הוא 123. השילוב הזה הוא הדרך הנפוצה לפרק מספר לספרות."
  optionExplanations:
    "1": "`% 10` נותן את הספרה האחרונה, לא הראשונה."
    "2": "`n` ו-10 הם `int`, ולכן החלוקה שלמה והחלק העשרוני נחתך."
    "3": "הסדר הפוך: השורה הראשונה מדפיסה את השארית."

- id: cs.basics.operators.019
  type: single
  difficulty: 2
  prompt: "איזה ביטוי בודק אם המספר השלם `num` הוא זוגי?"
  options: ["`num % 2 == 0`", "`num / 2 == 0`", "`num % 2 == 1`", "`num / 2 == 1`"]
  answer: 0
  explanation: "מספר זוגי מתחלק ב-2 בלי שארית, ולכן `num % 2` שווה 0. האופרטור `%` מחזיר את השארית, ו-`/` מחזיר את המנה."
  optionExplanations:
    "1": "`num / 2 == 0` בודק אם המנה היא 0, וזה נכון רק עבור 0 ו-1, לא עבור כל מספר זוגי."
    "2": "שארית 1 פירושה מספר אי־זוגי (חיובי), כלומר ההפך ממה שנדרש."
    "3": "`num / 2 == 1` נכון רק עבור 2 ו-3."

- id: cs.basics.operators.020
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    bool a = 5 > 3;
    bool b = 2 == 3;
    Console.WriteLine(a && b);
    Console.WriteLine(a || b);
    Console.WriteLine(!b);
  options: ["False\nTrue\nTrue", "True\nTrue\nFalse", "False\nFalse\nTrue", "True\nFalse\nTrue"]
  answer: 0
  explanation: "`a` הוא `true` (5 גדול מ-3) ו-`b` הוא `false` (2 לא שווה ל-3). `&&` דורש ששני הצדדים יהיו אמת, ולכן `False`. `||` מסתפק בצד אחד אמת, ולכן `True`. `!b` הופך `false` ל-`True`."
  optionExplanations:
    "1": "`&&` מחזיר `true` רק כששני הצדדים אמת, ו-`b` שקר."
    "2": "`||` מספיק לו ש-`a` אמת, ולכן התוצאה `True`."
    "3": "`a && b` הוא `False` ו-`a || b` הוא `True`, ולא להפך."

- id: cs.basics.operators.021
  type: truefalse
  difficulty: 1
  prompt: "בביטוי `x = 5` האופרטור `=` בודק אם `x` שווה ל-5."
  answer: false
  explanation: "`=` הוא אופרטור הצבה (Assignment): הוא שם את 5 בתוך `x`. כדי להשוות משתמשים ב-`==`, למשל `x == 5`, שמחזיר `true` או `false`."

- id: cs.basics.operators.022
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    int a = 5;
    int b = a++ + a;
    Console.WriteLine(a + " " + b);
  options: ["6 11", "6 10", "5 10", "6 12"]
  answer: 0
  explanation: "הביטוי מחושב משמאל לימין. `a++` מחזיר 5 ומגדיל את `a` ל-6 מיד. לכן ה-`a` שבצד הימני של החיבור כבר שווה 6, ו-`b` הוא `5 + 6 = 11`."
  optionExplanations:
    "1": "ההגדלה של `a++` קורית מיד אחרי שהערך נקרא, ולא בסוף השורה. ה-`a` השני כבר 6."
    "2": "`a++` מגדיל את `a`, ולכן בהדפסה `a` הוא 6."
    "3": "`a++` מחזיר את הערך הישן 5, ולא את 6."
