  optionExplanations:
    "1": "אחרי ההמרה `d` הוא מספר, ולכן `+ 1` מחבר ולא משרשר."
    "2": "`d` הוא `double` ושומר את החלק העשרוני, ואין חיתוך."
    "3": "`double.Parse` מחזירה `double`, ולכן ההצבה חוקית."

- id: cs.basics.casting.019
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int total = 17;
    int groups = 5;
    Console.WriteLine((double)total / groups);
    Console.WriteLine(total / groups);
  options: ["3.4\n3", "3\n3", "3.4\n3.4", "3\n3.4"]
  answer: 0
  explanation: "בשורה 3 ההמרה `(double)` חלה על `total` לפני החלוקה, ולכן החלוקה עשרונית: 3.4. בשורה 4 שני הצדדים `int`, ולכן החלוקה שלמה: 3. סדר הפעולות קובע: ההמרה מתבצעת לפני החלוקה."
  optionExplanations:
    "1": "`(double)total` מומר לפני החלוקה, ולכן החלוקה בשורה 3 עשרונית."
    "2": "בשורה 4 אין המרה, ושני `int` נותנים חלוקה שלמה."
    "3": "הסדר הפוך: ההמרה נמצאת בשורה 3."

- id: cs.basics.casting.020
  type: single
  difficulty: 2
  prompt: "`x` הוא `double` חיובי. איזה ביטוי מעגל אותו למספר השלם הקרוב ביותר, למשל 7.8 ל-8 ו-7.2 ל-7?"
  options: ["`(int)(x + 0.5)`", "`(int)x`", "`(int)x + 1`", "`(int)x + 0.5`"]
  answer: 0
  explanation: "`(int)` חותך את החלק העשרוני ולא מעגל. כשמוסיפים 0.5 לפני החיתוך, כל מספר שהחלק העשרוני שלו לפחות 0.5 עובר לשלם הבא: 7.8 + 0.5 = 8.3, שנחתך ל-8, ו-7.2 + 0.5 = 7.7, שנחתך ל-7."
  optionExplanations:
    "1": "`(int)x` רק חותך, ולכן 7.8 הופך ל-7."
    "2": "הוספת 1 אחרי החיתוך הופכת גם את 7.2 ל-8."
    "3": "החיבור ב-0.5 מתבצע אחרי החיתוך, והתוצאה בכלל לא שלמה (7.5)."

