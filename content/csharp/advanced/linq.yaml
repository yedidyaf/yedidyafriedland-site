- id: cs.advanced.linq.007
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    var nums = new List<int> { 1, 2, 3 };
    var big = nums.Where(n => n > 1);
    nums.Add(4);
    Console.WriteLine(big.Count());
    nums.Add(5);
    Console.WriteLine(big.Count());
  options: ["3\n4", "2\n2", "3\n3", "2\n3"]
  answer: 0
  explanation: "זו הערכה דחויה (Deferred Execution): `big` הוא לא רשימת תוצאות אלא תיאור של שאילתה. היא רצה מחדש על `nums` בכל פעם שעוברים עליה, כאן בכל קריאה ל-`Count()`. לכן היא רואה את 4 בקריאה הראשונה, ואת 4 ו-5 בשנייה."
  optionExplanations:
    "1": "התוצאה 2 ו-2 מניחה ש-`Where` חישב את התוצאה מיד בשורה 2. הוא רק בונה שאילתה."
    "2": "השאילתה מחושבת מחדש בכל `Count()`, ולכן היא רואה גם את 5."
    "3": "גם החישוב הראשון קורה רק בשורה 4, אחרי שכבר נוספה 4."

- id: cs.advanced.linq.008
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    int calls = 0;
    var query = new[] { 1, 2, 3 }.Select(n => { calls++; return n * 2; });
    Console.WriteLine(calls);
    int sum = query.Sum();
    int max = query.Max();
    Console.WriteLine(calls);
  options: ["0\n6", "3\n3", "0\n3", "3\n6"]
  answer: 0
  explanation: "`Select` לא מפעיל את הלמבדא כשבונים את השאילתה, ולכן בהדפסה הראשונה `calls` הוא 0. `Sum` עובר על השאילתה ומפעיל את הלמבדא 3 פעמים, ו-`Max` עובר עליה שוב מההתחלה ומפעיל אותה עוד 3 פעמים. כדי לחשב פעם אחת בלבד שומרים את התוצאה עם `ToList()`."
  optionExplanations:
    "1": "השאילתה לא רצה בשורה 2, ובנוסף היא רצה פעמיים ולא פעם אחת."
    "2": "כל פעולה שעוברת על שאילתה דחויה מריצה אותה מחדש, כולל הלמבדא שבה."
    "3": "בשורה 2 עדיין לא רץ כלום: `Select` רק בונה את השאילתה."

- id: cs.advanced.linq.009
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    var words = new[] { "bob", "anna", "ben", "amy", "carl" };
    var groups = words.GroupBy(w => w[0]);
    foreach (var g in groups)
        Console.WriteLine($"{g.Key}: {g.Count()}");
  options:
    - "b: 2\na: 2\nc: 1"
    - "a: 2\nb: 2\nc: 1"
    - "b: 1\na: 1\nb: 1\na: 1\nc: 1"
    - "b: 3\na: 2"
  answer: 0
  explanation: "`GroupBy` אוסף את כל האיברים עם אותו מפתח לקבוצה אחת, גם אם הם לא צמודים. הקבוצות מופיעות לפי סדר ההופעה הראשונה של כל מפתח: `b` (מ-`bob`), אחריה `a`, ובסוף `c`. כל קבוצה היא `IGrouping` עם `Key` ועם האיברים שלה."
  optionExplanations:
    "1": "`GroupBy` לא ממיין את המפתחות. הסדר הוא סדר ההופעה הראשונה במקור."
    "2": "`GroupBy` מאחד את כל האיברים עם אותו מפתח, לא רק איברים צמודים."
    "3": "המפתח הוא האות הראשונה, ו-`carl` מתחילה ב-`c`, ולכן יש לו קבוצה משלו."

- id: cs.advanced.linq.010
  type: single
  difficulty: 2
  prompt: "איזה ביטוי מחזיר את סכום ההזמנות של כל קטגוריה?"
  code: |
    var orders = new List<Order>
    {
        new("books", 40), new("toys", 15), new("books", 25)
    };

    record Order(string Category, int Amount);
  options:
    - "`orders.GroupBy(o => o.Category).Select(g => (g.Key, g.Sum(o => o.Amount)))`"
    - "`orders.GroupBy(o => o.Amount).Select(g => (g.Key, g.Count()))`"
    - "`orders.OrderBy(o => o.Category).Sum(o => o.Amount)`"
    - "`orders.Select(o => o.Category).Distinct().Count()`"
  answer: 0
  explanation: "מקבצים לפי `Category`, וכל קבוצה מכילה את ההזמנות שלה, ולכן `g.Sum(o => o.Amount)` מסכם בתוך הקבוצה: `books` עם 65 ו-`toys` עם 15. זו התבנית הקבועה של \"סיכום לפי מפתח\": `GroupBy` ואחריו `Select` עם פעולת צבירה (Aggregation)."
  optionExplanations:
    "1": "זה מקבץ לפי הסכום ולא לפי הקטגוריה, וסופר הזמנות במקום לסכם."
    "2": "מיון לא מקבץ. `Sum` על כל הרשימה מחזיר מספר אחד: 80."
    "3": "זה סופר כמה קטגוריות שונות יש, ולא מסכם סכומים."

- id: cs.advanced.linq.011
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס את הקריאה השלילית הראשונה, או `none` אם אין כזו. כאן הוא קורס. איזו שורה צריך לתקן?"
  code: |
    var readings = new List<int> { 3, 7, 1 };
    int firstNegative = readings.First(r => r < 0);
    Console.WriteLine(firstNegative == 0 ? "none" : firstNegative.ToString());
  answer: 2
  explanation: "`First` זורק `InvalidOperationException` כשאף איבר לא עומד בתנאי. כשהיעדר התאמה הוא מצב תקין, משתמשים ב-`FirstOrDefault`, שמחזיר `0` ל-`int`. כאן `0` לא יכול להיות קריאה שלילית, ולכן הבדיקה בשורה 3 נכונה."
  fixed: |
    var readings = new List<int> { 3, 7, 1 };
    int firstNegative = readings.FirstOrDefault(r => r < 0);
    Console.WriteLine(firstNegative == 0 ? "none" : firstNegative.ToString());

- id: cs.advanced.linq.012
  type: bug
  difficulty: 3
  prompt: "הקוד אמור למחוק מהרשימה את כל המחרוזות הריקות ולהדפיס 2, אבל הוא זורק `InvalidOperationException`. איזו שורה צריך לתקן?"
  code: |
    var names = new List<string> { "dan", "", "noa", "" };
    foreach (var name in names.Where(n => n == ""))
        names.Remove(name);
    Console.WriteLine(names.Count);
  answer: 2
  explanation: "בגלל ההערכה הדחויה, `Where` לא יוצר רשימה חדשה. הוא עובר על `names` עצמה תוך כדי הלולאה. מחיקה מהרשימה בזמן מעבר עליה זורקת `InvalidOperationException`. `ToList()` מחשב את התוצאה מראש לרשימה נפרדת, וכך אפשר למחוק מהמקור בבטחה."
  fixed: |
    var names = new List<string> { "dan", "", "noa", "" };
    foreach (var name in names.Where(n => n == "").ToList())
        names.Remove(name);
    Console.WriteLine(names.Count);

- id: cs.advanced.linq.013
  type: single
  difficulty: 1
  prompt: "מה המשמעות של הערכה דחויה (Deferred Execution) ב-LINQ?"
  options:
    - "השאילתה רצה רק כשעוברים על התוצאה, למשל ב-`foreach` או ב-`ToList()`, ולא בשורה שבה היא נכתבה"
    - "השאילתה רצה ברקע על תהליכון (Thread) אחר"
    - "השאילתה רצה מיד, אבל התוצאה נשמרת בזיכרון מטמון לפעם הבאה"
    - "השאילתה רצה רק אם יש באוסף יותר מאלף איברים"
  answer: 0
  explanation: "אופרטורים כמו `Where`, `Select` ו-`OrderBy` מחזירים תיאור של שאילתה ולא תוצאה. הם רצים רק כשמישהו עובר על התוצאה, ורצים מחדש בכל מעבר. פעולות כמו `ToList()`, `Count()` ו-`First()` מריצות את השאילתה מיד."
  optionExplanations:
    "1": "LINQ to Objects רץ על אותו תהליכון, ברגע שעוברים על התוצאה."
    "2": "אין זיכרון מטמון: כל מעבר מריץ את השאילתה מחדש. כדי לשמור תוצאה קוראים ל-`ToList()`."
    "3": "גודל האוסף לא משנה דבר. ההתנהגות זהה לכל אוסף."

- id: cs.advanced.linq.014
