  optionExplanations:
    "1": "הקוד נכון, אבל ארוך ובנוי מצעדים טכניים (רשימת עזר, `Sort` ואז `Reverse`) שמסתירים את הכוונה הפשוטה."

- id: cs.advanced.linq.016
  type: single
  difficulty: 2
  prompt: "איזה ביטוי בודק בצורה הנכונה והיעילה ביותר אם יש הזמנה עם `Total` גדול מ-1000?"
  options:
    - "`orders.Any(o => o.Total > 1000)`"
    - "`orders.Where(o => o.Total > 1000).Count() > 0`"
    - "`orders.Select(o => o.Total > 1000).Any()`"
    - "`orders.First(o => o.Total > 1000) != null`"
  answer: 0
  explanation: "`Any` עם תנאי עוצר באיבר הראשון שמתאים ומחזיר `bool`, וזה בדיוק מה שנשאל. `Count() > 0` עובר על כל ההתאמות רק כדי לדעת אם יש לפחות אחת."
  optionExplanations:
    "1": "הביטוי נכון, אבל סופר את כל ההתאמות במקום לעצור בראשונה."
    "2": "`Select` מחזיר רצף של `bool` לכל הזמנה, ו-`Any()` בלי תנאי בודק רק שהרצף לא ריק. התוצאה `true` לכל רשימה לא ריקה."
    "3": "`First` זורק חריגה כשאין התאמה, ולכן הביטוי לא יחזיר `false` אף פעם."
