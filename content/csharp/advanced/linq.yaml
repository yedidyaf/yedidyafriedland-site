- id: cs.advanced.linq.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    var nums = new[] { 1, 2, 3, 4, 5 };
    var result = nums.Where(n => n % 2 == 1).Select(n => n * 10);
    Console.WriteLine(string.Join(",", result));
  options: ["10,30,50", "20,40", "10,20,30,40,50", "1,3,5"]
  answer: 0
  explanation: "`Where` מסנן (Filter) ומשאיר רק את האיברים שהתנאי מחזיר עבורם `true`: 1, 3 ו-5. `Select` ממיר (Projection) כל איבר שנשאר לערך חדש: כפול 10."
  optionExplanations:
    "1": "התנאי `n % 2 == 1` נכון למספרים האי־זוגיים, לא לזוגיים."
    "2": "`Where` רץ לפני `Select`, ולכן רק המספרים האי־זוגיים מוכפלים."
    "3": "`Select` לא נעלם: כל איבר שעבר את הסינון מוכפל ב-10."

- id: cs.advanced.linq.002
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    var nums = new[] { 1, 2, 3, 4 };
    var a = nums.Select(n => n + 1).Where(n => n % 2 == 0);
    var b = nums.Where(n => n % 2 == 0).Select(n => n + 1);
    Console.WriteLine(string.Join(" ", a));
    Console.WriteLine(string.Join(" ", b));
  options: ["2 4\n3 5", "3 5\n3 5", "2 4\n2 4", "3 5\n2 4"]
  answer: 0
  explanation: "כל אופרטור פועל על התוצאה של הקודם, ולכן הסדר משנה. ב-`a` קודם מוסיפים 1 (2, 3, 4, 5) ואז מסננים זוגיים: 2 4. ב-`b` קודם מסננים זוגיים (2, 4) ואז מוסיפים 1: 3 5."
  optionExplanations:
    "1": "ב-`a` הסינון רץ על הערכים אחרי ההוספה, ולכן נשארים 2 ו-4."
    "2": "ב-`b` ההוספה רצה אחרי הסינון, ולכן 2 ו-4 הופכים ל-3 ו-5."
    "3": "זה הפוך: `a` מוסיף קודם ומסנן אחר כך, ו-`b` מסנן קודם."

- id: cs.advanced.linq.003
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    var words = new List<string> { "pear", "fig", "apple", "kiwi" };
    var sorted = words.OrderBy(w => w.Length).ThenBy(w => w);
    Console.WriteLine(string.Join(",", sorted));
  options: ["fig,kiwi,pear,apple", "fig,pear,kiwi,apple", "apple,fig,kiwi,pear", "apple,pear,kiwi,fig"]
  answer: 0
  explanation: "`OrderBy` ממיין לפי אורך: `fig` (3), אחריה שתי מילים באורך 4, ובסוף `apple` (5). `ThenBy` קובע את הסדר בתוך קבוצת השוויון לפי סדר אלפביתי, ולכן `kiwi` לפני `pear`."
  optionExplanations:
    "1": "זה היה הסדר בלי `ThenBy`, לפי הסדר המקורי. `ThenBy(w => w)` שם את `kiwi` לפני `pear`."
    "2": "זה מיון אלפביתי בלבד. המפתח הראשי הוא האורך, והאלפבית רק שובר שוויון."
    "3": "זה מיון יורד לפי אורך. `OrderBy` ממיין בסדר עולה."

- id: cs.advanced.linq.004
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    var people = new List<Person>
    {
        new("Noa", 30), new("Ben", 25), new("Dana", 30), new("Avi", 25)
    };
    var names = people.OrderBy(p => p.Age).Select(p => p.Name);
    Console.WriteLine(string.Join(" ", names));

    record Person(string Name, int Age);
  options: ["Ben Avi Noa Dana", "Avi Ben Dana Noa", "Noa Dana Ben Avi", "Avi Ben Noa Dana"]
  answer: 0
  explanation: "`OrderBy` הוא מיון יציב (Stable Sort): איברים עם אותו מפתח שומרים על הסדר המקורי שלהם. בני 25 הם `Ben` ואז `Avi`, ובני 30 הם `Noa` ואז `Dana`. השמות עצמם לא משתתפים במיון, ולכן אין כאן סדר אלפביתי."
  optionExplanations:
    "1": "זה מניח שוויון נשבר לפי שם, אבל המיון הוא רק לפי `Age`. בשביל זה צריך `ThenBy(p => p.Name)`."
    "2": "`OrderBy` ממיין בסדר עולה, ולכן בני 25 קודמים לבני 30."
    "3": "בתוך אותו גיל נשמר הסדר המקורי: `Ben` הופיע לפני `Avi` ברשימה."

- id: cs.advanced.linq.005
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    var nums = new List<int> { 5, 8, 12 };
    Console.WriteLine(nums.FirstOrDefault(n => n > 20));
    Console.WriteLine(nums.First(n => n > 6));
    try
    {
        Console.WriteLine(nums.First(n => n > 20));
    }
    catch (InvalidOperationException)
    {
        Console.WriteLine("error");
    }
  options: ["0\n8\nerror", "null\n8\nerror", "0\n8\n0", "0\n12\nerror"]
  answer: 0
  explanation: "`First` מחזיר את האיבר הראשון שעומד בתנאי, וזורק `InvalidOperationException` כשאין כזה. `FirstOrDefault` מחזיר במקרה כזה את ערך ברירת המחדל של הטיפוס, וב-`int` זה `0`. האיבר הראשון שגדול מ-6 הוא 8."
  optionExplanations:
    "1": "`int` הוא טיפוס ערך ולא יכול להיות `null`. ברירת המחדל שלו היא `0`."
    "2": "רק `FirstOrDefault` מחזיר ברירת מחדל. `First` בלי התאמה זורק חריגה."
    "3": "`First` עוצר באיבר הראשון שמתאים, ו-8 מופיע לפני 12."

- id: cs.advanced.linq.006
  type: truefalse
