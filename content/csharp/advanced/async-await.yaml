- id: cs.advanced.async-await.015
  type: cleaner
  difficulty: 2
  prompt: שני הקטעים מדפיסים `4`. איזה מהם נכון ונקי יותר?
  options:
    - |
      string text = await LoadAsync();
      Console.WriteLine(text.Length);

      async Task<string> LoadAsync()
      {
          await Task.Delay(10);
          return "data";
      }
    - |
      string text = LoadAsync().Result;
      Console.WriteLine(text.Length);

      async Task<string> LoadAsync()
      {
          await Task.Delay(10);
          return "data";
      }
  answer: 0
  explanation: "`await` ממתין בלי לחסום את התהליכון, וזורק את החריגה המקורית אם הטעינה נכשלת. הכלל הוא async לכל אורך הדרך (Async All the Way): קוד שקורא לקוד אסינכרוני צריך להיות אסינכרוני בעצמו."
  optionExplanations:
    "1": "`.Result` חוסם את התהליכון (Sync over Async), עוטף חריגות ב-`AggregateException`, ובאפליקציות עם ממשק משתמש עלול לגרום לקיפאון (Deadlock)."

