- id: cs.advanced.async-await.013
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    Task slow = SlowAsync();
    Task bad = BadAsync();
    try
    {
        await Task.WhenAll(slow, bad);
    }
    catch (Exception e)
    {
        Console.WriteLine(e.GetType().Name);
    }
    Console.WriteLine(slow.IsCompleted);

    async Task SlowAsync() => await Task.Delay(50);
    async Task BadAsync()
    {
        await Task.Delay(10);
        throw new TimeoutException();
    }
  options: ["TimeoutException\nTrue", "AggregateException\nTrue", "TimeoutException\nFalse", "AggregateException\nFalse"]
  answer: 0
  explanation: "`Task.WhenAll` מסתיימת רק אחרי שכל המשימות הסתיימו, גם אם אחת מהן נכשלה מוקדם, ולכן `slow` כבר הושלמה. `await` על משימה שנכשלה זורק את החריגה המקורית הראשונה, ולא את `AggregateException` שעוטפת אותה."
  optionExplanations:
    "1": "`AggregateException` מתקבלת עם `.Wait()` או `.Result`. `await` פורק אותה וזורק את החריגה המקורית."
    "2": "`WhenAll` לא נעצרת בכישלון הראשון. היא ממתינה גם ל-`slow` לפני שהיא נכשלת."
    "3": "גם סוג החריגה שגוי וגם המצב של `slow`: `await` זורק את החריגה המקורית, ו-`WhenAll` מחכה לכולן."

