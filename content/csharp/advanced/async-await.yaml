  optionExplanations:
    "1": "`async void` מתאים רק למטפלי אירועים: אי אפשר להמתין לו או לתפוס את החריגות שלו."
    "2": "`void` לא יכול להיות ארגומנט גנרי, ולכן `Task<void>` לא קיים. בשביל זה יש `Task`."
    "3": "מתודה עם `async` חייבת להחזיר `Task`, `Task<T>`, `void`, `IAsyncEnumerable<T>` או טיפוס דמוי משימה כמו `ValueTask`. `object` לא מותר."
