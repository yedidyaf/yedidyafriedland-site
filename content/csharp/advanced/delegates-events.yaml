- id: cs.advanced.delegates-events.015
  type: cleaner
  difficulty: 1
  prompt: שני הקטעים מדפיסים את אותו פלט. איזה מהם נקי יותר?
  options:
    - |
      var nums = new List<int> { 1, 2, 3, 4, 5, 6 };
      Console.WriteLine(string.Join(",", Filter(nums, n => n % 2 == 0)));
      Console.WriteLine(string.Join(",", Filter(nums, n => n > 4)));

      static List<int> Filter(List<int> items, Func<int, bool> keep)
      {
          var result = new List<int>();
          foreach (int n in items)
              if (keep(n))
                  result.Add(n);
          return result;
      }
    - |
      var nums = new List<int> { 1, 2, 3, 4, 5, 6 };
      Console.WriteLine(string.Join(",", FilterEven(nums)));
      Console.WriteLine(string.Join(",", FilterAboveFour(nums)));

      static List<int> FilterEven(List<int> items)
      {
          var result = new List<int>();
          foreach (int n in items)
              if (n % 2 == 0)
                  result.Add(n);
          return result;
      }

      static List<int> FilterAboveFour(List<int> items)
      {
          var result = new List<int>();
          foreach (int n in items)
              if (n > 4)
                  result.Add(n);
          return result;
      }
  answer: 0
  explanation: "כשרק התנאי משתנה, מעבירים אותו כפרמטר מסוג `Func<int, bool>`. כך יש לולאה אחת, וכל סינון חדש הוא למבדא של שורה אחת ולא מתודה שלמה."
  optionExplanations:
    "1": "שכפול קוד - Duplicated Code: שתי מתודות זהות שנבדלות רק בתנאי, וכל סינון חדש ידרוש עותק נוסף."

- id: cs.advanced.delegates-events.016
  type: single
  difficulty: 3
  prompt: "אובייקט קצר־חיים נרשם לאירוע של אובייקט שחי לאורך כל התוכנית, ולעולם לא מבטל את הרישום. מה התוצאה?"
  options:
    - "המפרסם מחזיק הפניה למנוי דרך הנציג, ולכן המנוי לא משתחרר מהזיכרון והמטפל שלו ממשיך לרוץ"
    - "אוסף הזבל (Garbage Collector) משחרר את המנוי ומבטל את הרישום אוטומטית"
    - "האירוע זורק חריגה בהפעלה הבאה, כי המנוי כבר לא בשימוש"
    - "אין שום השפעה, כי אירועים מחזיקים רק הפניות חלשות (Weak References)"
  answer: 0
  explanation: "נציג שמצביע על מתודת מופע מחזיק הפניה לאובייקט עצמו. כל עוד המפרסם חי, הוא שומר את המנוי בחיים: זו דליפת זיכרון (Memory Leak) קלאסית, והמטפל ממשיך לפעול על אובייקט שאמור היה להיעלם. לכן מבטלים רישום עם `-=` כשהמנוי מסיים את תפקידו."
  optionExplanations:
    "1": "אוסף הזבל לא משחרר אובייקט שיש אליו הפניה, והנציג של המפרסם הוא הפניה כזו."
    "2": "המנוי עדיין קיים בזיכרון, ולכן המטפל פשוט רץ כרגיל."
    "3": "אירועים רגילים ב-C# מחזיקים הפניות חזקות."
