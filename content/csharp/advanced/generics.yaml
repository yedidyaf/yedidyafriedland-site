- id: cs.advanced.generics.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    var a = new Box<int>(3);
    var b = new Box<string>("ab");
    Console.WriteLine(a.Value + 1);
    Console.WriteLine(b.Value + 1);

    class Box<T>
    {
        public T Value { get; }

        public Box(T value) => Value = value;
    }
  options: ["4\nab1", "4\n3", "31\nab1", "שגיאת קומפילציה"]
  answer: 0
  explanation: "`Box<T>` היא מחלקה גנרית (Generic Class): `T` מוחלף בטיפוס אמיתי בכל שימוש. ב-`Box<int>` המאפיין `Value` הוא `int`, ולכן `3 + 1` הוא חיבור מספרי. ב-`Box<string>` הוא `string`, ולכן `+` משרשר ומתקבל `ab1`."
  optionExplanations:
    "1": "`b.Value` הוא מחרוזת, ו-`+` בין מחרוזת למספר הוא שרשור ולא חיבור."
    "2": "`31` היה מתקבל רק אם `Value` היה מחרוזת, אבל ב-`Box<int>` הוא `int` אמיתי."
    "3": "אין כאן בעיה: הקומפיילר יודע את הטיפוס המדויק של `Value` בכל אחד מהמופעים."

- id: cs.advanced.generics.002
  type: single
  difficulty: 1
  prompt: "למה עדיף להשתמש ב-`List<int>` ולא ב-`ArrayList` כדי לשמור מספרים שלמים?"
  options:
    - "הקומפיילר בודק את טיפוס האיברים, ואין עטיפה (Boxing) של כל `int` באובייקט"
    - "`List<int>` יכולה לשמור כל טיפוס, כולל מחרוזות ומספרים יחד"
    - "`ArrayList` היא בגודל קבוע ואי אפשר להוסיף לה איברים"
    - "`List<int>` נשארת ממוינת אוטומטית אחרי כל הוספה"
  answer: 0
  explanation: "`ArrayList` שומרת כל איבר כ-`object`: מספר שלם נעטף (Boxing) בהוספה, וכל קריאה דורשת המרה מפורשת שעלולה להיכשל רק בזמן ריצה. `List<int>` היא אוסף גנרי עם בטיחות טיפוסים (Type Safety): הוספת מחרוזת היא שגיאת קומפילציה, ואין עלות של Boxing."
  optionExplanations:
    "1": "זה בדיוק ההפך: `List<int>` מקבלת רק `int`. דווקא `ArrayList` מקבלת כל דבר."
    "2": "`ArrayList` גדלה אוטומטית, בדיוק כמו `List<T>`."
    "3": "אף אחד מהאוספים לא ממיין אוטומטית. הסדר הוא סדר ההוספה."

- id: cs.advanced.generics.003
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    using System.Collections;

    var list = new ArrayList { 1, "2", 3 };
    int sum = 0;
    try
    {
        foreach (object item in list)
            sum += (int)item;
    }
    catch (InvalidCastException)
    {
        Console.WriteLine("error");
    }
    Console.WriteLine(sum);
  options: ["error\n1", "6", "error\n0", "שגיאת קומפילציה"]
  answer: 0
  explanation: "`ArrayList` מקבלת כל `object`, ולכן הקומפיילר לא מתלונן על `\"2\"`. ההמרה `(int)item` נכשלת רק בזמן ריצה, באיבר השני, אחרי ש-`sum` כבר קיבל 1. עם `List<int>` הוספת `\"2\"` הייתה שגיאת קומפילציה, וזה היתרון של גנריות (Generics)."
  optionExplanations:
    "1": "המרה מ-`object` שמכיל מחרוזת ל-`int` לא מפרשת את הטקסט. היא זורקת `InvalidCastException`."
    "2": "האיבר הראשון כבר נוסף לפני החריגה, והשינוי ב-`sum` לא מתבטל."
    "3": "`ArrayList` מקבלת כל אובייקט, ולכן הבעיה מתגלה רק בזמן ריצה."

- id: cs.advanced.generics.004
  type: output
  difficulty: 2
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    var cache = new Cache<int>();
    Console.WriteLine(cache.Count);

    class Cache<T> where T : class
    {
        private readonly List<T> items = new();

        public int Count => items.Count;
    }
  options: ["0", "שגיאת קומפילציה", "InvalidCastException", "null"]
  answer: 1
  explanation: "האילוץ (Constraint) `where T : class` מתיר רק טיפוסי הפניה (Reference Types). `int` הוא טיפוס ערך, ולכן `Cache<int>` נדחה כבר בקומפילציה. אילוצים נבדקים בזמן קומפילציה, לא בזמן ריצה."
  optionExplanations:
    "0": "התוכנית לא מגיעה לריצה: הקומפיילר דוחה את `Cache<int>` בגלל האילוץ."
    "2": "הפרת אילוץ לא מגיעה לזמן ריצה. הקומפיילר עוצר אותה מראש."
    "3": "`Count` הוא `int` ולא יכול להיות `null`, וממילא הקוד לא מתקמפל."

- id: cs.advanced.generics.005
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    Console.WriteLine(Max(3, 7));
    Console.WriteLine(Max("pear", "apple"));

    static T Max<T>(T a, T b) where T : IComparable<T>
    {
        return a.CompareTo(b) >= 0 ? a : b;
    }
  options: ["7\npear", "7\napple", "3\napple", "שגיאת קומפילציה"]
  answer: 0
  explanation: "המתודה הגנרית (Generic Method) מקבלת כל `T` שמממש `IComparable<T>`, והאילוץ הוא שמאפשר לקרוא ל-`CompareTo`. מספרים מושווים לפי ערך, ומחרוזות לפי סדר מילוני: `pear` באה אחרי `apple`, ולכן היא הגדולה."
  optionExplanations:
    "1": "`apple` קודמת ל-`pear` בסדר המילוני, ולכן היא הקטנה מבין השתיים."
    "2": "`>= 0` בוחר את `a` רק כשהוא גדול או שווה ל-`b`, כלומר המתודה מחזירה את הגדול."
    "3": "בזכות האילוץ `where T : IComparable<T>` מותר לקרוא ל-`CompareTo`, ו-`int` ו-`string` מממשים אותו."

- id: cs.advanced.generics.006
  type: single
  difficulty: 2
  prompt: "מה מאפשר האילוץ `where T : new()` בתוך מחלקה גנרית?"
  options:
    - "ליצור מופע חדש עם `new T()`"
    - "לקבל רק אובייקטים שנוצרו זה עתה ולא אובייקטים קיימים"
    - "להשוות שני ערכים מטיפוס `T` עם `==`"
    - "להבטיח ש-`T` הוא טיפוס הפניה (Reference Type)"
  answer: 0
  explanation: "`new()` דורש של-`T` יהיה בנאי ציבורי ללא פרמטרים, ולכן מותר לכתוב `new T()` בתוך הקוד הגנרי. בלי האילוץ הקומפיילר לא יודע אם קיים בנאי כזה, ו-`new T()` הוא שגיאת קומפילציה."
  optionExplanations:
    "1": "אילוצים עוסקים בטיפוס עצמו, לא באובייקטים מסוימים שמועברים בזמן ריצה."
    "2": "`new()` לא מוסיף אופרטורים. השוואה גנרית נעשית עם `EqualityComparer<T>.Default`."
    "3": "את זה מבטיח `where T : class`. גם `int`, שהוא טיפוס ערך, עומד באילוץ `new()`."

- id: cs.advanced.generics.007
  type: bug
  difficulty: 1
  prompt: המתודה הגנרית אמורה להחליף בין ערכי שני משתנים מכל טיפוס. באיזו שורה הבאג?
  code: |
    int a = 1, b = 2;
    Swap(ref a, ref b);
    Console.WriteLine($"{a} {b}");

    static void Swap<T>(ref T x, ref T y)
    {
        T temp = x;
        x = y;
        y = x;
    }
  answer: 9
  explanation: "אחרי `x = y` הערך המקורי של `x` כבר נדרס, ולכן `y = x` מעתיק חזרה את הערך החדש ושני המשתנים יוצאים 2. בדיוק בשביל זה שמרנו את `temp`. המתודה גנרית, ולכן `T temp` עובד לכל טיפוס בלי לכתוב גרסה נפרדת ל-`int` ול-`string`."
  fixed: |
    int a = 1, b = 2;
    Swap(ref a, ref b);
    Console.WriteLine($"{a} {b}");

    static void Swap<T>(ref T x, ref T y)
    {
        T temp = x;
        x = y;
        y = temp;
    }

