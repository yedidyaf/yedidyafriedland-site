    "3": "`default` בלי טיפוס מפורש מותר כאן, כי טיפוס ההחזרה `T` ידוע לקומפיילר."

- id: cs.advanced.generics.009
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    Counter<int>.Count++;
    Counter<int>.Count++;
    Counter<string>.Count++;
    Console.WriteLine($"{Counter<int>.Count} {Counter<string>.Count}");

    class Counter<T>
    {
        public static int Count;
    }
  options: ["2 1", "3 3", "2 2", "3 1"]
  answer: 0
  explanation: "כל טיפוס סגור (Closed Type), כמו `Counter<int>` ו-`Counter<string>`, הוא טיפוס נפרד בזמן ריצה, ולכל אחד יש שדה `static` משלו. לכן הספירה של `int` לא משותפת עם זו של `string`: 2 ו-1."
  optionExplanations:
    "1": "`3 3` מניח שדה סטטי אחד משותף לכל הגרסאות של `Counter<T>`, אבל לכל טיפוס סגור יש עותק משלו."
    "2": "`Counter<string>.Count` קודם רק פעם אחת. ההגדלות של `Counter<int>` לא משפיעות עליו."
    "3": "`Counter<int>.Count` קודם פעמיים בלבד. ההגדלה של `Counter<string>` שייכת לשדה אחר."

- id: cs.advanced.generics.010
  type: bug
  difficulty: 3
  prompt: "המתודה אמורה לספור כמה פעמים `target` מופיע ברשימה (כאן אמור להיות מודפס 2), אבל מודפס 0. באיזו שורה הבאג?"
  code: |
    var nums = new List<int> { 1, 2, 1, 3 };
    Console.WriteLine(CountOf(nums, 1));

    static int CountOf<T>(List<T> items, T target)
    {
        int count = 0;
        foreach (T item in items)
        {
            if ((object)item == (object)target)
                count++;
        }
        return count;
    }
  answer: 9
  explanation: "`==` לא מוגדר ל-`T` לא מוגבל, ולכן הכותב המיר ל-`object`. אבל `==` בין שני `object` משווה הפניות (Reference Equality): כל `int` נעטף (Boxing) באובייקט חדש, ושני אובייקטים שונים אף פעם לא שווים, ולכן מודפס 0. הדרך הנכונה להשוות ערכים בקוד גנרי היא `EqualityComparer<T>.Default.Equals`, שמשתמשת בהשוואת הערכים של הטיפוס."
  fixed: |
    var nums = new List<int> { 1, 2, 1, 3 };
    Console.WriteLine(CountOf(nums, 1));

    static int CountOf<T>(List<T> items, T target)
    {
        int count = 0;
        foreach (T item in items)
        {
            if (EqualityComparer<T>.Default.Equals(item, target))
                count++;
        }
        return count;
    }

