- id: cs.advanced.generics.012
  type: single
  difficulty: 2
  prompt: "מה יקרה אם נמחק את `where T : IShape` מהקוד?"
  code: |
    Console.WriteLine(TotalArea(new List<Square> { new Square(2), new Square(3) }));

    static double TotalArea<T>(List<T> shapes) where T : IShape
    {
        double total = 0;
        foreach (T shape in shapes)
            total += shape.Area();
        return total;
    }

    interface IShape
    {
        double Area();
    }

    record Square(double Side) : IShape
    {
        public double Area() => Side * Side;
    }
  options:
    - "שגיאת קומפילציה: לטיפוס `T` לא ידועה מתודה בשם `Area`"
    - "הקוד ירוץ וידפיס 13, בדיוק כמו קודם"
    - "חריגה בזמן ריצה, רק אם יועבר טיפוס שאין לו `Area`"
    - "הקוד ירוץ, אבל כל קריאה ל-`Area` תהיה איטית יותר בגלל Boxing"
  answer: 0
  explanation: "בתוך קוד גנרי הקומפיילר מכיר את `T` רק דרך האילוצים שלו. בלי `where T : IShape` הוא יודע רק ש-`T` הוא `object`, ולכן `shape.Area()` היא שגיאת קומפילציה, גם אם כל הקוראים מעבירים `Square`. האילוץ הוא מה שמתיר לקרוא למתודות של הממשק."
  optionExplanations:
    "1": "הקומפיילר לא מסתכל על מי שקורא למתודה. הוא בודק את הגוף הגנרי מול האילוצים בלבד."
    "2": "C# בודקת קוד גנרי בזמן קומפילציה, לא בזמן ריצה כמו שפה דינמית."
    "3": "הקוד לא מגיע לריצה בכלל, כי הגוף הגנרי לא מתקמפל."

