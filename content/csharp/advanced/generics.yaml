- id: cs.advanced.generics.016
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    Console.WriteLine(Describe(5));
    Console.WriteLine(Describe("hi"));
    Console.WriteLine(Describe(2.5));

    static string Describe<T>(T value) => $"{typeof(T).Name}: {value}";
  options:
    - "Int32: 5\nString: hi\nDouble: 2.5"
    - "int: 5\nstring: hi\ndouble: 2.5"
    - "Object: 5\nObject: hi\nObject: 2.5"
    - "T: 5\nT: hi\nT: 2.5"
  answer: 0
  explanation: "הקומפיילר מסיק את `T` מכל ארגומנט: `int`, `string` ו-`double`. `typeof(T)` מחזיר את הטיפוס האמיתי, ו-`Name` מחזיר את שמו ב-.NET: `Int32`, `String`, `Double`. המילים `int`, `string` ו-`double` הן רק כינויים (Aliases) של C# לטיפוסים האלה."
  optionExplanations:
    "1": "`int` הוא כינוי של C#. השם של הטיפוס ב-.NET, ש-`Name` מחזיר, הוא `Int32`."
    "2": "`T` לא הופך ל-`object`. בכל קריאה הוא מקבל את הטיפוס המדויק של הארגומנט."
    "3": "`typeof(T)` מחזיר את הטיפוס שהוצב במקום `T`, לא את שם הפרמטר."
