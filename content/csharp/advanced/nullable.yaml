- id: cs.advanced.nullable.016
  type: single
  difficulty: 3
  prompt: "כש-Nullable Reference Types מופעלים, מה עושה `!` בביטוי `name!.Length`?"
  options:
    - "משתיק את אזהרת הקומפיילר בלבד. אם `name` הוא `null` בזמן ריצה, תיזרק `NullReferenceException`"
    - "בודק בזמן ריצה ש-`name` אינו `null`, וזורק `ArgumentNullException` אם הוא כן"
    - "מחזיר `null` במקום לגשת ל-`Length` אם `name` הוא `null`"
    - "הופך לוגית את הערך של `name` לפני הגישה ל-`Length`"
  answer: 0
  explanation: "`!` הוא אופרטור הסלחנות ל-null (Null-Forgiving Operator): הכותב מבטיח לקומפיילר שהערך אינו `null`, והאזהרה נעלמת. בזמן ריצה הוא לא עושה כלום, ולכן הבטחה שגויה מסתיימת ב-`NullReferenceException`. משתמשים בו רק כשבאמת יודעים יותר מהקומפיילר."
  optionExplanations:
    "1": "`!` לא מוסיף שום בדיקה בזמן ריצה. בדיקה כזו כותבים במפורש, למשל עם `ArgumentNullException.ThrowIfNull`."
    "2": "זה מה ש-`?.` עושה. `!` לא משנה את ההתנהגות בזמן ריצה."
    "3": "`!` כאן הוא אופרטור postfix על טיפוס הפניה, ולא שלילה לוגית של `bool`."
