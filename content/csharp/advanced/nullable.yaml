  answer: 0
  explanation: "`?.` עשוי להחזיר `null`, ולכן כשהחבר הוא טיפוס ערך כמו `int`, הקומפיילר הופך את טיפוס התוצאה ל-`int?`. כך יש מקום לייצג את המקרה ש-`customer` הוא `null`. כאן יודפס `False`."
