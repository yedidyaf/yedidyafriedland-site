- id: cs.clean-code.naming.001
  type: smell
  difficulty: 1
  prompt: איזה ריח קוד בולט כאן?
  code: |
    class Rental
    {
        public double Calc(int d, double p)
        {
            return d * p;
        }
    }
  options:
    - "שם לא ברור - Unclear Name"
    - "מספר קסם - Magic Number"
    - "מתודה ארוכה - Long Method"
    - "רשימת פרמטרים ארוכה - Long Parameter List"
  answer: 0
  explanation: "השמות `Calc`, `d` ו-`p` לא מסבירים מה מחושב ומה המשמעות של כל פרמטר. שם שמסביר כוונה (Intention-Revealing Name), למשל `CalculateTotalPrice(int days, double pricePerDay)`, חוסך מהקורא לנחש ולקרוא את גוף המתודה."
  optionExplanations:
    "1": "אין בקוד מספר מילולי בלי שם; יש רק הכפלה של שני פרמטרים."
    "2": "המתודה היא שורה אחת."
    "3": "שני פרמטרים הם מספר קטן; הבעיה היא השמות שלהם, לא הכמות."

- id: cs.clean-code.naming.002
  type: cleaner
  difficulty: 1
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      const int AdultAge = 18;
      int age = 20;
      bool flag = age >= AdultAge;
      Console.WriteLine(flag);
    - |
      const int AdultAge = 18;
      int age = 20;
      bool isAdult = age >= AdultAge;
      Console.WriteLine(isAdult);
    - |
      const int AdultAge = 18;
      int age = 20;
      bool ageCheckResult = age >= AdultAge;
      Console.WriteLine(ageCheckResult);
  answer: 1
  explanation: "משתנה בוליאני שנקרא כמו שאלת כן/לא (`isAdult`, `hasTicket`, `canEdit`) נקרא בטבעיות בתנאי: `if (isAdult)`. השם אומר מה המשמעות של `true`."
  optionExplanations:
    "0": "`flag` הוא שם כללי שלא אומר מה בדיוק נכון כשהערך הוא `true`."
    "2": "`ageCheckResult` מתאר את התהליך (בדיקת גיל) ולא את המשמעות; `if (ageCheckResult)` לא מסביר מה התגלה בבדיקה."

- id: cs.clean-code.naming.004
  type: single
  difficulty: 2
  prompt: לפי מוסכמות השמות של מיקרוסופט, מה נכון לגבי השמות בקוד?
  code: |
    class OrderCounter
    {
        private int _total;

        public void AddItems(int itemCount)
        {
            int newTotal = _total + itemCount;
            _total = newTotal;
        }
    }
  options:
    - "הפרמטר צריך להיות ItemCount, כי הוא חלק מהחתימה הציבורית של המתודה"
    - "המשתנה המקומי צריך להיות NewTotal, כי כל שם ב-C# נכתב ב-PascalCase"
    - "כל השמות תקינים: PascalCase למחלקה ולמתודה, camelCase לפרמטר ולמשתנה המקומי, ו-camelCase עם קו תחתון לשדה הפרטי"
    - "השדה צריך להיות Total, כי כל שם שמוגדר ישירות בתוך מחלקה נכתב ב-PascalCase"
  answer: 2
  explanation: "ב-C# מחלקות ומתודות נכתבות ב-PascalCase, פרמטרים ומשתנים מקומיים ב-camelCase, ושדות פרטיים ב-camelCase עם קידומת `_`. הקידומת מבדילה מיד בין שדה של העצם לבין משתנה מקומי."
  optionExplanations:
    "0": "פרמטרים נכתבים תמיד ב-camelCase, גם במתודה ציבורית."
    "1": "PascalCase שמור למחלקות, למתודות ולקבועים; משתנה מקומי נכתב ב-camelCase."
    "3": "שדה פרטי נכתב ב-camelCase, ולפי מוסכמות מיקרוסופט עם קו תחתון: `_total`."

- id: cs.clean-code.naming.005
  type: cleaner
  difficulty: 2
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      class Mailer
      {
          public void WelcomeEmail(string customerName)
          {
              Console.WriteLine($"Sending welcome email to {customerName}");
          }
      }
    - |
      class Mailer
      {
          public void SendWelcomeEmail(string customerName)
          {
              Console.WriteLine($"Sending welcome email to {customerName}");
          }
      }
    - |
      class Mailer
      {
          public void DoEmail(string customerName)
          {
              Console.WriteLine($"Sending welcome email to {customerName}");
          }
      }
  answer: 1
  explanation: "מתודה מבצעת פעולה, ולכן שמה צריך להיות צירוף פועל שאומר מה היא עושה: `SendWelcomeEmail`. בקריאה `mailer.SendWelcomeEmail(name)` ברור בלי להציץ בגוף המתודה שנשלח מייל."
  optionExplanations:
    "0": "`WelcomeEmail` הוא שם עצם; הוא נשמע כמו מאפיין שמחזיק מייל, ולא כמו פעולה ששולחת אותו."
    "2": "`Do` הוא פועל ריק, ו-`DoEmail` לא אומר איזה מייל ומה עושים איתו."

- id: cs.clean-code.naming.006
  type: single
  difficulty: 1
  prompt: משתנה מחזיק את מספר ההזמנות שבוטלו. איזה שם הכי מתאים לו?
  options:
    - "cnclOrdCnt"
    - "cancelledOrderCount"
    - "cancelledOrders"
    - "num"
  answer: 1
  explanation: "`cancelledOrderCount` אומר גם מה נספר וגם שזה מספר. קיצורים חוסכים כמה תווים בכתיבה, אבל עולים בזמן קריאה, והקוד נקרא הרבה יותר פעמים משהוא נכתב."
  optionExplanations:
    "0": "קיצורים כמו `cncl` ו-`Cnt` מאלצים את הקורא לפענח את השם."
    "2": "`cancelledOrders` נשמע כמו אוסף של הזמנות, לא כמו מספר; שם מטעה גרוע משם קצר."
    "3": "`num` לא אומר מה נספר."

- id: cs.clean-code.naming.007
  type: truefalse
  difficulty: 2
  prompt: "לפי מוסכמות C# של מיקרוסופט, כדאי להוסיף לשם המשתנה קידומת של הטיפוס שלו, למשל `strName` או `iCount` (סימון הונגרי - Hungarian Notation)."
  answer: false
  explanation: "מיקרוסופט ממליצה במפורש לא להשתמש בסימון הונגרי. הטיפוס כבר ידוע לקומפיילר ומוצג בעורך, והקידומת רק מאריכה את השם והופכת לשקר כשמשנים את הטיפוס. עדיף שם שמתאר משמעות: `customerName`, `retryCount`."

- id: cs.clean-code.naming.008
  type: bug
  difficulty: 1
  prompt: הקוד אמור להדפיס את המחיר לתשלום אחרי ההנחה. איזו שורה צריך לתקן?
  code: |
    double priceBeforeDiscount = 200;
    double discountRate = 0.1;
    double priceAfterDiscount = priceBeforeDiscount * (1 - discountRate);
    Console.WriteLine($"To pay: {priceBeforeDiscount}");
  answer: 4
  fixed: |
    double priceBeforeDiscount = 200;
    double discountRate = 0.1;
    double priceAfterDiscount = priceBeforeDiscount * (1 - discountRate);
    Console.WriteLine($"To pay: {priceAfterDiscount}");
  explanation: "השורה מדפיסה את המחיר לפני ההנחה. בזכות שמות מדויקים, הבאג נקרא כמו משפט שגוי: «לתשלום: המחיר לפני ההנחה». אם המשתנים היו נקראים `p1` ו-`p2`, היה קשה הרבה יותר לראות אותו."

- id: cs.clean-code.naming.009
  type: cleaner
  difficulty: 1
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      string[] stringArray = { "Dana", "Avi" };
      for (int i = 0; i < stringArray.Length; i++)
          Console.WriteLine(stringArray[i]);
    - |
      string[] a = { "Dana", "Avi" };
      for (int i = 0; i < a.Length; i++)
          Console.WriteLine(a[i]);
    - |
      string[] studentNames = { "Dana", "Avi" };
      for (int i = 0; i < studentNames.Length; i++)
          Console.WriteLine(studentNames[i]);
  answer: 2
  explanation: "שם טוב מתאר את המשמעות של הנתונים, לא את הטיפוס שלהם. `studentNames` אומר מה יש במערך, ושם ברבים מתאים למערך שמחזיק הרבה ערכים."
  optionExplanations:
    "0": "`stringArray` חוזר על הטיפוס, שהקומפיילר כבר יודע, ולא אומר של מי השמות."
    "1": "`a` לא אומר כלום על התוכן."

- id: cs.clean-code.naming.010
  type: single
  difficulty: 3
  prompt: איזה שם בקוד הכי כדאי לשנות?
  code: |
    class ReportPrinter
    {
        public void PrintNumbered(string[] lines)
        {
            for (int i = 0; i < lines.Length; i++)
            {
                string tmp = lines[i].ToUpper();
                Console.WriteLine($"{i + 1}. {tmp}");
            }
        }
    }
  options:
    - "i"
    - "tmp"
    - "lines"
    - "PrintNumbered"
  answer: 1
  explanation: "אורך השם צריך להתאים לטווח ההכרה (Scope) ולחשיבות שלו. `tmp` לא אומר מה המשתנה מחזיק; `upperLine` היה מסביר. לעומת זאת, `i` כאינדקס של לולאת `for` קצרה הוא מוסכמה שכולם מכירים."
  optionExplanations:
    "0": "`i` כאינדקס בלולאת `for` קצרה הוא מוסכמה מוכרת; שם ארוך יותר לא היה מוסיף מידע."
    "2": "`lines` הוא שם ברבים שמתאר בדיוק את תוכן המערך."
    "3": "`PrintNumbered` אומר בדיוק מה המתודה עושה: מדפיסה שורות ממוספרות."

- id: cs.clean-code.naming.011
  type: cleaner
  difficulty: 3
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      int timeLimit = 30;
      Console.WriteLine($"You have {timeLimit} to answer");
    - |
      int t = 30; // seconds
      Console.WriteLine($"You have {t} to answer");
    - |
      int timeLimitInSeconds = 30;
      Console.WriteLine($"You have {timeLimitInSeconds} to answer");
  answer: 2
  explanation: "כשמספר מייצג כמות עם יחידות, היחידה היא חלק מהמשמעות ושייכת לשם: `timeLimitInSeconds`. מי שקורא `timeLimit = 2` עלול לחשוב שמדובר בדקות, וזה מקור קלאסי לבאגים."
  optionExplanations:
    "0": "`timeLimit` נקי למראה, אבל לא אומר אם מדובר בשניות או בדקות."
    "1": "ההערה נמצאת רק בשורת ההגדרה; במקומות אחרים שבהם משתמשים ב-`t` לא רואים אותה."

- id: cs.clean-code.naming.012
  type: single
  difficulty: 2
  prompt: "מה השם הטוב ביותר למתודה `DoStuff`?"
  code: |
    class Helper
    {
        public int DoStuff(int[] data)
        {
            int result = 0;
            for (int i = 0; i < data.Length; i++)
                if (data[i] > 0)
                    result++;
            return result;
        }
    }
  options:
    - "ProcessArray"
    - "CountPositiveNumbers"
    - "Count"
    - "HandleData"
  answer: 1
  explanation: "המתודה סופרת מספרים חיוביים, ו-`CountPositiveNumbers` אומר בדיוק את זה. פעלים כלליים כמו `Process` ו-`Handle` מתאימים לכל מתודה, ולכן לא מוסרים כלום. גם `Helper`, `data` ו-`result` הם שמות כלליים שכדאי להחליף."
  optionExplanations:
    "0": "`Process` לא אומר מה נעשה במערך."
    "2": "`Count` לא אומר מה נספר."
    "3": "`HandleData` כללי לגמרי; כל מתודה מטפלת בנתונים כלשהם."

- id: cs.clean-code.naming.013
  type: single
  difficulty: 2
  prompt: מה הבעיה בשמות המתודות?
  code: |
    class Store
    {
        public string GetCustomer(int id)
        {
            return $"Customer {id}";
        }

        public string FetchOrder(int id)
        {
            return $"Order {id}";
        }

        public string RetrieveProduct(int id)
        {
            return $"Product {id}";
        }
    }
  options:
    - "שמות של מתודות צריכים להיות שמות עצם, למשל Customer, Order ו-Product"
    - "השמות ארוכים מדי; עדיף Cust, Ord ו-Prod"
    - "צריך להוסיף לכל שם את הסיומת Method, כדי שיהיה ברור שאלה מתודות"
    - "שלוש מילים שונות מתארות אותה פעולה; עדיף לבחור מילה אחת, למשל Get, ולהשתמש בה בעקביות"
  answer: 3
  explanation: "מילה אחת לכל מושג (One Word per Concept): אם `Get`, `Fetch` ו-`Retrieve` עושות אותו דבר, הקורא יחפש הבדל שלא קיים. כשאוצר המילים עקבי, אפשר לנחש את שם המתודה הבאה בלי לחפש."
  optionExplanations:
    "0": "מתודה מבצעת פעולה, ולכן שמה מתחיל בפועל; שם עצם מתאים למחלקה."
    "1": "השמות קצרים וברורים; קיצורים רק יפגעו בקריאות."
    "2": "הסוגריים בקריאה כבר מראים שזו מתודה; הסיומת רק מאריכה את השם."

- id: cs.clean-code.naming.014
  type: cleaner
  difficulty: 2
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      bool isDisabled = false;
      if (!isDisabled)
          Console.WriteLine("Running");
    - |
      bool isEnabled = true;
      if (isEnabled)
          Console.WriteLine("Running");
    - |
      bool isNotEnabled = false;
      if (isNotEnabled == false)
          Console.WriteLine("Running");
  answer: 1
  explanation: "שם בוליאני חיובי (`isEnabled`) נקרא ישירות בתנאי. שם שלילי מכריח את הקורא לבצע היפוך בראש, וכשמוסיפים עליו `!` או `== false` מתקבלת שלילה כפולה שקל לטעות בה."
  optionExplanations:
    "0": "`!isDisabled` היא שלילה של שם שלילי: «לא מושבת». זה עובד, אבל קשה יותר לקריאה מ-«מופעל»."
    "2": "`isNotEnabled == false` היא שלילה כפולה; גם השם שלילי וגם ההשוואה ל-`false` מיותרת."

- id: cs.clean-code.naming.015
  type: single
  difficulty: 3
  prompt: "מה השם הטוב ביותר למתודה `Find`?"
  code: |
    class Library
    {
        private Book[] books = new Book[100];
        private int bookCount = 0;

        public int Find(int today)
        {
            int result = 0;
            for (int i = 0; i < bookCount; i++)
                if (!books[i].IsReturned() && books[i].GetDueDay() < today)
                    result++;
            return result;
        }
    }

    class Book
    {
        private bool returned;
        private int dueDay;

        public bool IsReturned()
        {
            return returned;
        }

        public int GetDueDay()
        {
            return dueDay;
        }
    }
  options:
    - "CountBooksWhereNotReturnedAndDueDayBeforeToday"
    - "CountOverdueBooks"
    - "CountBooks2"
    - "CountLateItemsNumber"
  answer: 1
  explanation: "שם טוב משתמש בשפת התחום (Domain Language) ואומר מה מקבלים, לא איך זה מחושב. בספרייה לספר כזה קוראים «באיחור» (Overdue). אם כלל האיחור ישתנה, השם `CountOverdueBooks` עדיין יהיה נכון."
  optionExplanations:
    "0": "השם מעתיק את המימוש למילים. הוא ארוך, וכל שינוי בתנאי יהפוך אותו לשקר."
    "2": "מספר בשם לא אומר כלום על ההבדל בין `CountBooks` ל-`CountBooks2`."
    "3": "`Items` כללי מדי, ו-`Number` חוזר על מה ש-`Count` כבר אומר."

- id: cs.clean-code.naming.016
  type: bug
  difficulty: 3
  prompt: המחלקה אמורה לשמור את הערך ההתחלתי שמועבר לבנאי. איזו שורה צריך לתקן?
  code: |
    class Counter
    {
        private int count;

        public Counter(int count)
        {
            count = count;
        }

        public int GetValue()
        {
            return count;
        }
    }
  answer: 7
  fixed: |
    class Counter
    {
        private int count;

        public Counter(int count)
        {
            this.count = count;
        }

        public int GetValue()
        {
            return count;
        }
    }
  explanation: "בתוך הבנאי, `count` מתייחס לפרמטר, שמסתיר (Shadowing) את השדה בעל אותו שם. לכן `count = count` משים את הפרמטר לעצמו, והשדה נשאר `0`. התיקון הוא `this.count = count`; מוסכמה של שדה פרטי עם קו תחתון (`_count`) גם מונעת את הבלבול מראש."

- id: cs.clean-code.naming.017
  type: single
  difficulty: 1
  prompt: מתודה מקבלת מספר שלם ומחזירה `true` אם הוא זוגי. איזה שם הכי מתאים לה?
  options:
    - "Even"
    - "CheckNumber"
    - "IsEven"
    - "EvenOrNot"
  answer: 2
  explanation: "מתודה שמחזירה `bool` נקראת כמו שאלת כן/לא: `IsEven`, `HasTicket`, `CanVote`. כך הקריאה בתנאי נשמעת כמו משפט: `if (IsEven(number))`."
  optionExplanations:
    "0": "`Even` הוא תואר בלבד; לא ברור אם המתודה בודקת, מחזירה מספר זוגי או משהו אחר."
    "1": "`CheckNumber` לא אומר מה בודקים ומה המשמעות של `true`."
    "3": "`EvenOrNot` מסורבל ולא תואם את המוסכמה של `Is` למתודה בוליאנית."

- id: cs.clean-code.naming.018
  type: order
  difficulty: 1
  tags: [algorithm]
  prompt: "סדרו את השורות כך שהתוכנית תספור כמה תלמידים עברו את המבחן."
  code: |
    const int PassingGrade = 55;
    int[] grades = { 90, 45, 72, 55, 100 };
    int passedCount = 0;
    for (int i = 0; i < grades.Length; i++)
    {
        if (grades[i] >= PassingGrade)
            passedCount++;
    }
    Console.WriteLine(passedCount);
  output: "4"
  anyOrder: [[1, 2, 3]]
  explanation: "שמות טובים מספרים את האלגוריתם: הקבוע `PassingGrade` מחליף מספר קסם (Magic Number), `grades` אומר מה יש במערך, ו-`passedCount` אומר מה סופרים. האלגוריתם עצמו הוא ספירה בתנאי, ו-55 עצמו נחשב עובר בגלל `>=`."
