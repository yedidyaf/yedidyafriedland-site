- id: cs.clean-code.naming.001
  type: smell
  difficulty: 1
  prompt: איזה ריח קוד בולט כאן?
  code: |
    class Rental
    {
        public decimal Calc(int d, decimal p)
        {
            return d * p;
        }
    }
  options:
    - "שם לא ברור - Unclear Name"
    - "מספר קסם - Magic Number"
    - "מתודה ארוכה - Long Method"
    - "רשימת פרמטרים ארוכה - Long Parameter List"
  answer: 0
  explanation: "השמות `Calc`, `d` ו-`p` לא מסבירים מה מחושב ומה המשמעות של כל פרמטר. שם שמסביר כוונה (Intention-Revealing Name), למשל `CalculateTotalPrice(int days, decimal pricePerDay)`, חוסך מהקורא לנחש ולקרוא את גוף המתודה."
  optionExplanations:
    "1": "אין בקוד מספר מילולי בלי שם; יש רק הכפלה של שני פרמטרים."
    "2": "המתודה היא שורה אחת."
    "3": "שני פרמטרים הם מספר קטן; הבעיה היא השמות שלהם, לא הכמות."

- id: cs.clean-code.naming.002
  type: cleaner
  difficulty: 1
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      const int AdultAge = 18;
      int age = 20;
      bool flag = age >= AdultAge;
      Console.WriteLine(flag);
    - |
      const int AdultAge = 18;
      int age = 20;
      bool isAdult = age >= AdultAge;
      Console.WriteLine(isAdult);
    - |
      const int AdultAge = 18;
      int age = 20;
      bool ageCheckResult = age >= AdultAge;
      Console.WriteLine(ageCheckResult);
  answer: 1
  explanation: "משתנה בוליאני שנקרא כמו שאלת כן/לא (`isAdult`, `hasTicket`, `canEdit`) נקרא בטבעיות בתנאי: `if (isAdult)`. השם אומר מה המשמעות של `true`."
  optionExplanations:
    "0": "`flag` הוא שם כללי שלא אומר מה בדיוק נכון כשהערך הוא `true`."
    "2": "`ageCheckResult` מתאר את התהליך (בדיקת גיל) ולא את המשמעות; `if (ageCheckResult)` לא מסביר מה התגלה בבדיקה."

- id: cs.clean-code.naming.003
  type: single
  difficulty: 1
  prompt: "איזה שם מתאים לממשק (Interface) של רכיב ששולח התראות, לפי מוסכמות C#?"
  options:
    - "NotificationSenderInterface"
    - "iNotificationSender"
    - "INotificationSender"
    - "NotificationSender"
  answer: 2
  explanation: "ב-.NET שם של ממשק מתחיל ב-`I` גדולה ואחריה שם ב-PascalCase, כמו `IDisposable` ו-`IComparable`. כך רואים מיד שמדובר בחוזה ולא במחלקה, ומחלקה שמממשת אותו יכולה לקבל שם מדויק כמו `EmailNotificationSender`."
  optionExplanations:
    "0": "הסיומת `Interface` ארוכה ולא מקובלת; המוסכמה היא הקידומת `I`."
    "1": "שמות טיפוסים ב-C# נכתבים ב-PascalCase, ולכן גם הקידומת היא `I` גדולה."
    "3": "בלי הקידומת `I` השם נראה כמו שם של מחלקה, ולא של ממשק."

- id: cs.clean-code.naming.004
  type: single
  difficulty: 2
  prompt: לפי מוסכמות השמות של מיקרוסופט, מה נכון לגבי השמות בקוד?
  code: |
    class OrderService
    {
        private readonly List<string> _items = new();

        public int CountItems(string orderId)
        {
            int itemCount = _items.Count(item => item.StartsWith(orderId));
            return itemCount;
        }
    }
  options:
    - "הפרמטר צריך להיות OrderId, כי הוא חלק מהחתימה הציבורית של המתודה"
    - "המשתנה המקומי צריך להיות ItemCount, כי כל שם ב-C# נכתב ב-PascalCase"
    - "כל השמות תקינים: PascalCase למחלקה ולמתודה, camelCase לפרמטר ולמשתנה המקומי, ו-camelCase עם קו תחתון לשדה הפרטי"
    - "השדה צריך להיות Items, כי שדות נכתבים בדיוק כמו מאפיינים"
  answer: 2
  explanation: "ב-C# טיפוסים ומתודות נכתבים ב-PascalCase, פרמטרים ומשתנים מקומיים ב-camelCase, ושדות פרטיים ב-camelCase עם קידומת `_`. הקידומת מבדילה מיד בין שדה של האובייקט לבין משתנה מקומי."
  optionExplanations:
    "0": "פרמטרים נכתבים תמיד ב-camelCase, גם במתודה ציבורית."
    "1": "PascalCase שמור לטיפוסים ולחברים כמו מתודות ומאפיינים; משתנה מקומי נכתב ב-camelCase."
    "3": "PascalCase מתאים למאפיין ציבורי. שדה פרטי נכתב `_items`, וכך לא מתבלבלים בינו לבין מאפיין."

- id: cs.clean-code.naming.005
  type: cleaner
  difficulty: 2
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      class Mailer
      {
          public void WelcomeEmail(string customerName)
          {
              Console.WriteLine($"Sending welcome email to {customerName}");
          }
      }
    - |
      class Mailer
      {
          public void SendWelcomeEmail(string customerName)
          {
              Console.WriteLine($"Sending welcome email to {customerName}");
          }
      }
    - |
      class Mailer
      {
          public void DoEmail(string customerName)
          {
              Console.WriteLine($"Sending welcome email to {customerName}");
          }
      }
  answer: 1
  explanation: "מתודה מבצעת פעולה, ולכן שמה צריך להיות צירוף פועל שאומר מה היא עושה: `SendWelcomeEmail`. בקריאה `mailer.SendWelcomeEmail(name)` ברור בלי להציץ בגוף המתודה שנשלח מייל."
  optionExplanations:
    "0": "`WelcomeEmail` הוא שם עצם; הוא נשמע כמו מאפיין שמחזיק מייל, ולא כמו פעולה ששולחת אותו."
    "2": "`Do` הוא פועל ריק, ו-`DoEmail` לא אומר איזה מייל ומה עושים איתו."

- id: cs.clean-code.naming.006
  type: single
  difficulty: 1
  prompt: משתנה מחזיק את מספר ההזמנות שבוטלו. איזה שם הכי מתאים לו?
  options:
    - "cnclOrdCnt"
    - "cancelledOrderCount"
    - "cancelledOrders"
    - "num"
  answer: 1
  explanation: "`cancelledOrderCount` אומר גם מה נספר וגם שזה מספר. קיצורים חוסכים כמה תווים בכתיבה, אבל עולים בזמן קריאה, והקוד נקרא הרבה יותר פעמים משהוא נכתב."
  optionExplanations:
    "0": "קיצורים כמו `cncl` ו-`Cnt` מאלצים את הקורא לפענח את השם."
    "2": "`cancelledOrders` נשמע כמו אוסף של הזמנות, לא כמו מספר; שם מטעה גרוע משם קצר."
    "3": "`num` לא אומר מה נספר."

- id: cs.clean-code.naming.007
  type: truefalse
  difficulty: 2
  prompt: "לפי מוסכמות C# של מיקרוסופט, כדאי להוסיף לשם המשתנה קידומת של הטיפוס שלו, למשל `strName` או `iCount` (סימון הונגרי - Hungarian Notation)."
  answer: false
  explanation: "מיקרוסופט ממליצה במפורש לא להשתמש בסימון הונגרי. הטיפוס כבר ידוע לקומפיילר ומוצג בעורך, והקידומת רק מאריכה את השם והופכת לשקר כשמשנים את הטיפוס. עדיף שם שמתאר משמעות: `customerName`, `retryCount`."

- id: cs.clean-code.naming.008
  type: bug
  difficulty: 1
  prompt: הקוד אמור להדפיס את המחיר לתשלום אחרי ההנחה. באיזו שורה הבאג?
  code: |
    decimal priceBeforeDiscount = 200m;
    decimal discountRate = 0.1m;
    decimal priceAfterDiscount = priceBeforeDiscount * (1 - discountRate);
    Console.WriteLine($"To pay: {priceBeforeDiscount}");
  answer: 4
  fixed: |
    decimal priceBeforeDiscount = 200m;
    decimal discountRate = 0.1m;
    decimal priceAfterDiscount = priceBeforeDiscount * (1 - discountRate);
    Console.WriteLine($"To pay: {priceAfterDiscount}");
  explanation: "השורה מדפיסה את המחיר לפני ההנחה. בזכות שמות מדויקים, הבאג נקרא כמו משפט שגוי: «לתשלום: המחיר לפני ההנחה». אם המשתנים היו נקראים `p1` ו-`p2`, היה קשה הרבה יותר לראות אותו."

- id: cs.clean-code.naming.009
  type: cleaner
  difficulty: 1
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      List<string> listOfStrings = new() { "Dana", "Avi" };
      foreach (string str in listOfStrings)
          Console.WriteLine(str);
    - |
      List<string> l = new() { "Dana", "Avi" };
      foreach (string s in l)
          Console.WriteLine(s);
    - |
      List<string> studentNames = new() { "Dana", "Avi" };
      foreach (string name in studentNames)
          Console.WriteLine(name);
  answer: 2
  explanation: "שם טוב מתאר את המשמעות של הנתונים, לא את הטיפוס שלהם. `studentNames` אומר מה יש ברשימה, והשם ביחיד `name` לכל איבר הופך את הלולאה לקריאה כמו משפט."
  optionExplanations:
    "0": "`listOfStrings` ו-`str` חוזרים על הטיפוס, שהקומפיילר כבר יודע, ולא אומרים של מי השמות."
    "1": "`l` ו-`s` לא אומרים כלום, ו-`l` גם נראית כמו הספרה 1."

- id: cs.clean-code.naming.010
  type: single
  difficulty: 3
  prompt: איזה שם בקוד הכי כדאי לשנות?
  code: |
    class ReportPrinter
    {
        public void PrintNumbered(List<string> lines)
        {
            for (int i = 0; i < lines.Count; i++)
            {
                string tmp = lines[i].Trim();
                Console.WriteLine($"{i + 1}. {tmp}");
            }
        }
    }
  options:
    - "i"
    - "tmp"
    - "lines"
    - "PrintNumbered"
  answer: 1
  explanation: "אורך השם צריך להתאים לטווח ההכרה (Scope) ולחשיבות שלו. `tmp` לא אומר מה המשתנה מחזיק; `trimmedLine` היה מסביר. לעומת זאת, `i` כאינדקס של לולאת `for` קצרה הוא מוסכמה שכולם מכירים."
  optionExplanations:
    "0": "`i` כאינדקס בלולאת `for` קצרה הוא מוסכמה מוכרת; שם ארוך יותר לא היה מוסיף מידע."
    "2": "`lines` הוא שם ברבים שמתאר בדיוק את תוכן הרשימה."
    "3": "`PrintNumbered` אומר בדיוק מה המתודה עושה: מדפיסה שורות ממוספרות."

- id: cs.clean-code.naming.011
  type: cleaner
  difficulty: 3
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      class HttpSettings
      {
          public int Timeout { get; set; } = 30;
      }
    - |
      class HttpSettings
      {
          public int T { get; set; } = 30; // seconds
      }
    - |
      class HttpSettings
      {
          public int TimeoutInSeconds { get; set; } = 30;
      }
  answer: 2
  explanation: "כשמספר מייצג כמות עם יחידות, היחידה היא חלק מהמשמעות ושייכת לשם: `TimeoutInSeconds`. מי שכותב `settings.Timeout = 5000` בטוח שמדובר במילישניות. אם אפשר לשנות טיפוס, `TimeSpan` מבטא את היחידה בטיפוס עצמו."
  optionExplanations:
    "0": "`Timeout` קצר ונקי למראה, אבל לא אומר אם מדובר בשניות או במילישניות, וזה מקור קלאסי לבאגים."
    "1": "ההערה נמצאת רק בהגדרה; במקום שבו משתמשים ב-`T` לא רואים אותה."

- id: cs.clean-code.naming.012
  type: single
  difficulty: 2
  prompt: "מה השם הטוב ביותר למתודה `DoStuff`?"
  code: |
    class Helper
    {
        public int DoStuff(List<int> data)
        {
            return data.Count(x => x > 0);
        }
    }
  options:
    - "ProcessList"
    - "CountPositiveNumbers"
    - "Count"
    - "HandleData"
  answer: 1
  explanation: "המתודה סופרת מספרים חיוביים, ו-`CountPositiveNumbers` אומר בדיוק את זה. פעלים כלליים כמו `Process` ו-`Handle` מתאימים לכל מתודה, ולכן לא מוסרים כלום. גם `Helper` ו-`data` הם שמות כלליים שכדאי להחליף."
  optionExplanations:
    "0": "`Process` לא אומר מה נעשה ברשימה."
    "2": "`Count` לא אומר מה נספר, ומתבלבל עם `Count` של LINQ."
    "3": "`HandleData` כללי לגמרי; כל מתודה מטפלת בנתונים כלשהם."

- id: cs.clean-code.naming.013
  type: single
  difficulty: 2
  prompt: מה הבעיה בשמות המתודות?
  code: |
    class StoreRepository
    {
        public string GetCustomer(int id) => $"Customer {id}";
        public string FetchOrder(int id) => $"Order {id}";
        public string RetrieveProduct(int id) => $"Product {id}";
    }
  options:
    - "שמות של מתודות צריכים להיות שמות עצם, למשל Customer, Order ו-Product"
    - "השמות ארוכים מדי; עדיף Cust, Ord ו-Prod"
    - "חסרה למתודות הקידומת I"
    - "שלוש מילים שונות מתארות אותה פעולה; עדיף לבחור מילה אחת, למשל Get, ולהשתמש בה בעקביות"
  answer: 3
  explanation: "מילה אחת לכל מושג (One Word per Concept): אם `Get`, `Fetch` ו-`Retrieve` עושות אותו דבר, הקורא יחפש הבדל שלא קיים. כשהאוצר מילים עקבי, אפשר לנחש את שם המתודה הבאה בלי לחפש."
  optionExplanations:
    "0": "מתודה מבצעת פעולה, ולכן שמה מתחיל בפועל; שם עצם מתאים למאפיין או למחלקה."
    "1": "השמות קצרים וברורים; קיצורים רק יפגעו בקריאות."
    "2": "הקידומת `I` שמורה לשמות של ממשקים, לא למתודות."

- id: cs.clean-code.naming.014
  type: cleaner
  difficulty: 2
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      var feature = new Feature { IsDisabled = false };
      if (!feature.IsDisabled)
          Console.WriteLine("Running");

      class Feature
      {
          public bool IsDisabled { get; set; }
      }
    - |
      var feature = new Feature { IsEnabled = true };
      if (feature.IsEnabled)
          Console.WriteLine("Running");

      class Feature
      {
          public bool IsEnabled { get; set; }
      }
    - |
      var feature = new Feature { IsNotEnabled = false };
      if (feature.IsNotEnabled == false)
          Console.WriteLine("Running");

      class Feature
      {
          public bool IsNotEnabled { get; set; }
      }
  answer: 1
  explanation: "שם בוליאני חיובי (`IsEnabled`) נקרא ישירות בתנאי. שם שלילי מכריח את הקורא לבצע היפוך בראש, וכשמוסיפים עליו `!` או `== false` מתקבלת שלילה כפולה שקל לטעות בה."
  optionExplanations:
    "0": "`!feature.IsDisabled` היא שלילה של שם שלילי: «לא מושבת». זה עובד, אבל קשה יותר לקריאה מ-«מופעל»."
    "2": "`IsNotEnabled == false` היא שלילה כפולה; גם השם שלילי וגם ההשוואה ל-`false` מיותרת."

- id: cs.clean-code.naming.015
  type: single
  difficulty: 3
  prompt: "מה השם הטוב ביותר למתודה `Find`?"
  code: |
    class Library
    {
        private readonly List<Book> _books = new();

        public List<Book> Find(DateTime today) =>
            _books.Where(b => !b.IsReturned && b.DueDate < today).ToList();
    }

    class Book
    {
        public bool IsReturned { get; set; }
        public DateTime DueDate { get; set; }
    }
  options:
    - "GetBooksWhereNotReturnedAndDueDateBeforeToday"
    - "GetOverdueBooks"
    - "GetBooks2"
    - "GetLateItemsList"
  answer: 1
  explanation: "שם טוב משתמש בשפת התחום (Domain Language) ואומר מה מקבלים, לא איך זה מחושב. בספרייה לספר כזה קוראים «באיחור» (Overdue). אם כלל האיחור ישתנה, השם `GetOverdueBooks` עדיין יהיה נכון."
  optionExplanations:
    "0": "השם מעתיק את המימוש למילים. הוא ארוך, וכל שינוי בתנאי יהפוך אותו לשקר."
    "2": "מספר בשם לא אומר כלום על ההבדל בין `GetBooks` ל-`GetBooks2`."
    "3": "`Items` כללי מדי, ו-`List` חוזר על טיפוס ההחזרה שכבר מופיע בחתימה."

- id: cs.clean-code.naming.016
  type: bug
  difficulty: 3
  prompt: המחלקה אמורה לשמור את הערך ההתחלתי שמועבר לבנאי. באיזו שורה הבאג?
  code: |
    class Counter
    {
        private int count;

        public Counter(int count)
        {
            count = count;
        }

        public int Value => count;
    }
  answer: 7
  fixed: |
    class Counter
    {
        private int _count;

        public Counter(int count)
        {
            _count = count;
        }

        public int Value => _count;
    }
  explanation: "בתוך הבנאי, `count` מתייחס לפרמטר, שמסתיר (Shadowing) את השדה בעל אותו שם. לכן `count = count` משים את הפרמטר לעצמו, והשדה נשאר `0`. תיקון מינימלי הוא `this.count = count`, אבל המוסכמה של שדה פרטי עם קו תחתון (`_count`) מונעת את הבלבול מראש."
