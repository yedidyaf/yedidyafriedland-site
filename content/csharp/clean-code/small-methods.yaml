    "2": "עדכון שדות הוא תופעת לוואי; המתודה לא מחזירה כלום, והתוצאה תלויה בסדר הקריאות."
    "3": "מערך מאבד את השמות; הקורא צריך לזכור שאינדקס 2 הוא הממוצע, וגם הנמוך והגבוה נשמרים כ-`double`."

- id: cs.clean-code.small-methods.015
  type: cleaner
  difficulty: 2
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      Console.WriteLine(Distance(0, 0, 3, 4));

      static double Distance(int x1, int y1, int x2, int y2)
      {
          int dx = x2 - x1;
          int dy = y2 - y1;
          return Math.Sqrt(dx * dx + dy * dy);
      }
    - |
      Point from = new Point(0, 0);
      Point to = new Point(3, 4);
      Console.WriteLine(from.DistanceTo(to));

      class Point
      {
          private int x;
          private int y;

          public Point(int x, int y)
          {
              this.x = x;
              this.y = y;
          }

          public double DistanceTo(Point other)
          {
              int dx = other.x - x;
              int dy = other.y - y;
              return Math.Sqrt(dx * dx + dy * dy);
          }
      }
  answer: 1
  explanation: "ארבעה פרמטרים מטיפוס `int` הם הזמנה להחליף סדר, למשל `Distance(0, 3, 0, 4)`, בלי שהקומפיילר ישים לב. מחלקה `Point` מקבצת ערכים שבאים יחד, נותנת להם שם, ומשמשת בית טבעי לחישוב שלהם (`DistanceTo`)."
  optionExplanations:
    "0": "רשימת פרמטרים מאותו טיפוס: קשה לקרוא את הקריאה וקל לטעות בסדר."

- id: cs.clean-code.small-methods.016
  type: bug
  difficulty: 3
  prompt: "הקוד אמור להדפיס `Dana,Avi`. איזו שורה צריך לתקן?"
  code: |
    string[] names = { "dana", "avi" };
    for (int i = 0; i < names.Length; i++)
        Capitalize(names[i]);
    Console.WriteLine(names[0] + "," + names[1]);

    static string Capitalize(string name)
    {
        return name.Substring(0, 1).ToUpper() + name.Substring(1);
    }
  answer: 3
  fixed: |
    string[] names = { "dana", "avi" };
    for (int i = 0; i < names.Length; i++)
        names[i] = Capitalize(names[i]);
    Console.WriteLine(names[0] + "," + names[1]);

    static string Capitalize(string name)
    {
        return name.Substring(0, 1).ToUpper() + name.Substring(1);
    }
  explanation: "`Capitalize` לא משנה את הקלט, כי מחרוזות ב-C# אינן ניתנות לשינוי (Immutable); היא מחזירה מחרוזת חדשה. זה עיצוב טוב, בלי תופעות לוואי, אבל מי שקורא לה חייב להשתמש בערך שחוזר. כאן הוא נזרק, והמערך מודפס כמו שהיה: `dana,avi`."

- id: cs.clean-code.small-methods.017
  type: order
  difficulty: 2
  tags: [algorithm]
  prompt: "סדרו את השורות כך שהתוכנית תחשב ממוצע בעזרת שתי מתודות קטנות."
  code: |
    Console.WriteLine(Average(new int[] { 80, 90, 100 }));
    static int Sum(int[] arr)
    {
        int sum = 0;
        for (int i = 0; i < arr.Length; i++)
            sum += arr[i];
        return sum;
    }
    static double Average(int[] arr)
    {
        return (double)Sum(arr) / arr.Length;
    }
  output: "90"
  anyOrder: [[1, [2, 8], [9, 12]]]
  explanation: "כל מתודה עושה דבר אחד: `Sum` סוכמת, ו-`Average` משתמשת בה ומחלקת. ההמרה `(double)` מונעת חילוק שלמים. 90.0 מודפס ב-C# בתור `90`."
