- id: cs.clean-code.small-methods.014
  type: single
  difficulty: 2
  prompt: צריך לחשב את הציון הנמוך, את הגבוה ואת הממוצע של מערך ציונים. איזה עיצוב הכי נקי?
  options:
    - "שלוש מתודות: int GetMin(int[] scores), int GetMax(int[] scores) ו-double GetAverage(int[] scores)"
    - "מתודה אחת void Summarize(int[] scores), שמחשבת את שלושת הערכים ומדפיסה אותם"
    - "מתודה אחת void Summarize(int[] scores), שמעדכנת שלושה שדות min, max ו-average במחלקה"
    - "מתודה אחת double[] Summarize(int[] scores), שמחזירה מערך של שלושה ערכים"
