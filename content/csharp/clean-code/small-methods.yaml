- id: cs.clean-code.small-methods.001
  type: smell
  difficulty: 1
  prompt: איזה ריח קוד בולט כאן?
  code: |
    class StudentRegistry
    {
        public void AddStudent(string firstName, string lastName, string email, string phone,
            string street, string city, string zipCode, int birthYear)
        {
            Console.WriteLine($"Adding {firstName} {lastName}");
        }
    }
  options:
    - "מחלקת אל - God Class"
    - "רשימת פרמטרים ארוכה - Long Parameter List"
    - "מספר קסם - Magic Number"
    - "שכפול קוד - Duplicated Code"
  answer: 1
  explanation: "שמונה פרמטרים, שבעה מהם מחרוזות, קשה לזכור לפי הסדר וקל להחליף ביניהם בלי שהקומפיילר ישים לב. מקבצים ערכים שבאים יחד לעצם אחד, למשל מחלקה `Address` עם השדות `street`, `city` ו-`zipCode`, ומעבירים אותו כפרמטר אחד."
  optionExplanations:
    "0": "במחלקה יש מתודה אחת; הבעיה היא בחתימה שלה, לא בכמות האחריות של המחלקה."
    "2": "אין בקוד מספרים מילוליים."
    "3": "אין כאן קוד שחוזר על עצמו."

- id: cs.clean-code.small-methods.002
  type: smell
  difficulty: 2
  prompt: איזה ריח קוד בולט כאן?
  code: |
    class LoginService
    {
        private string savedPassword = "1234";
        private string currentUser = "";

        public bool CheckPassword(string userName, string password)
        {
            bool isValid = password == savedPassword;
            if (isValid)
                currentUser = userName;
            return isValid;
        }
    }
  options:
    - "רשימת פרמטרים ארוכה - Long Parameter List"
    - "שכפול קוד - Duplicated Code"
    - "תופעת לוואי נסתרת - Hidden Side Effect"
    - "קינון עמוק - Deep Nesting"
  answer: 2
  explanation: "השם `CheckPassword` מבטיח בדיקה בלבד, אבל המתודה גם מחברת את המשתמש (משנה את `currentUser`). מי שיקרא לה רק כדי לבדוק סיסמה יחבר משתמש בלי כוונה. מפרידים בין שאלה לפקודה (Command-Query Separation): `CheckPassword` שרק מחזירה תשובה, ו-`LogIn` שמשנה מצב."
  optionExplanations:
    "0": "שני פרמטרים הם מספר קטן וסביר."
    "1": "אין קוד שחוזר על עצמו."
    "3": "יש רק `if` אחד, בלי קינון."

- id: cs.clean-code.small-methods.003
  type: smell
  difficulty: 2
  prompt: איזה ריח קוד בולט כאן?
  code: |
    new ReportService().Export("Sales", true);

    class ReportService
    {
        public void Export(string report, bool asPdf)
        {
            if (asPdf)
                Console.WriteLine($"PDF: {report}");
            else
                Console.WriteLine($"CSV: {report}");
        }
    }
  options:
    - "דגל בוליאני - Flag Argument"
    - "רשימת פרמטרים ארוכה - Long Parameter List"
    - "קוד מת - Dead Code"
    - "מחלקת אל - God Class"
  answer: 0
  explanation: "פרמטר `bool` שבוחר בין שתי התנהגויות אומר שהמתודה עושה שני דברים. בקריאה `Export(\"Sales\", true)` אי אפשר לדעת מה `true` אומר. עדיף שתי מתודות עם שמות ברורים: `ExportAsPdf` ו-`ExportAsCsv`."
  optionExplanations:
    "1": "שני פרמטרים הם לא רשימה ארוכה; הבעיה היא התפקיד של הפרמטר הבוליאני."
    "2": "שני הענפים נגישים, תלוי בערך של הדגל."
    "3": "למחלקה יש מתודה אחת ואחריות אחת: ייצוא."

- id: cs.clean-code.small-methods.004
  type: single
  difficulty: 2
  prompt: "איזו שורה במתודה `Checkout` שוברת את רמת ההפשטה האחידה (Single Level of Abstraction)?"
  code: |
    class CheckoutService
    {
        public void Checkout(double[] prices)
        {
            EnsureNotEmpty(prices);
            double total = CalculateTotal(prices);
            if (total > 500) total = total * 0.9;
            SendConfirmation(total);
        }

        private static void EnsureNotEmpty(double[] prices) { }

        private static double CalculateTotal(double[] prices)
        {
            double sum = 0;
            for (int i = 0; i < prices.Length; i++)
                sum += prices[i];
            return sum;
        }

        private static void SendConfirmation(double total) { }
    }
  options:
    - "EnsureNotEmpty(prices);"
    - "double total = CalculateTotal(prices);"
    - "if (total > 500) total = total * 0.9;"
    - "SendConfirmation(total);"
  answer: 2
  explanation: "שאר השורות הן צעדים עם שם שאומרים מה קורה. שורת ההנחה צוללת לפרטים: סף, אחוז והשמה. חלצו אותה למתודה `ApplyBigOrderDiscount(total)`, וכך `Checkout` תיקרא כמו רשימת צעדים ברמה אחת."
  optionExplanations:
    "0": "זו קריאה לצעד עם שם ברור, באותה רמה כמו שאר הצעדים."
    "1": "החישוב מוסתר מאחורי שם ברור; זה בדיוק הסגנון הרצוי."
    "3": "זו קריאה לצעד עם שם ברור, באותה רמה כמו שאר הצעדים."

- id: cs.clean-code.small-methods.005
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    Session session = new Session(600);
    Console.WriteLine(session.IsExpired(660));
    Console.WriteLine(session.IsExpired(660));

    class Session
    {
        private const int TimeoutMinutes = 30;
        private int lastAccessMinute;

        public Session(int lastAccessMinute)
        {
            this.lastAccessMinute = lastAccessMinute;
        }

        public bool IsExpired(int nowMinute)
        {
            bool expired = nowMinute - lastAccessMinute > TimeoutMinutes;
            lastAccessMinute = nowMinute;
            return expired;
        }
    }
  options:
    - "True\nTrue"
    - "True\nFalse"
    - "False\nFalse"
    - "False\nTrue"
  answer: 1
  explanation: "בקריאה הראשונה עברו 60 דקות, ולכן `True`. אבל `IsExpired` גם מעדכנת את `lastAccessMinute` ל-660, ולכן בקריאה השנייה עברו 0 דקות ומודפס `False`. מתודה ששמה שאלה לא צריכה לשנות מצב (תופעת לוואי נסתרת); את העדכון כדאי להעביר למתודה נפרדת כמו `Touch(nowMinute)`."
  optionExplanations:
    "0": "זו התשובה הצפויה ממתודה שרק בודקת, אבל `IsExpired` משנה את `lastAccessMinute` בכל קריאה."
    "2": "בקריאה הראשונה ההפרש הוא 60 דקות, יותר מ-30."

- id: cs.clean-code.small-methods.006
  type: bug
  difficulty: 1
  prompt: "הקוד אמור להדפיס `Dana Levi`. איזו שורה צריך לתקן?"
  code: |
    string firstName = "Dana";
    string lastName = "Levi";
    Console.WriteLine(FullName(lastName, firstName));

    static string FullName(string firstName, string lastName)
    {
        return $"{firstName} {lastName}";
    }
  answer: 3
  fixed: |
    string firstName = "Dana";
    string lastName = "Levi";
    Console.WriteLine(FullName(firstName, lastName));

    static string FullName(string firstName, string lastName)
    {
        return $"{firstName} {lastName}";
    }
  explanation: "הארגומנטים הועברו בסדר הפוך, ומודפס `Levi Dana`. כשכמה פרמטרים הם מאותו טיפוס, הקומפיילר לא יתפוס החלפה. ככל שיש פחות פרמטרים, כך קל יותר להימנע מטעות כזו."

- id: cs.clean-code.small-methods.007
  type: bug
  difficulty: 3
  prompt: "הקוד אמור להדפיס `20 10`: המתודה מחזירה מערך חדש עם ערכים כפולים, בלי לשנות את המערך המקורי. איזו שורה צריך לתקן?"
  code: |
    int[] prices = { 10, 20, 30 };
    int[] doubled = DoubledCopy(prices);
    Console.WriteLine(doubled[0] + " " + prices[0]);

    static int[] DoubledCopy(int[] numbers)
    {
        int[] copy = numbers;
        for (int i = 0; i < numbers.Length; i++)
            copy[i] = numbers[i] * 2;
        return copy;
    }
  answer: 7
  fixed: |
    int[] prices = { 10, 20, 30 };
    int[] doubled = DoubledCopy(prices);
    Console.WriteLine(doubled[0] + " " + prices[0]);

    static int[] DoubledCopy(int[] numbers)
    {
        int[] copy = new int[numbers.Length];
        for (int i = 0; i < numbers.Length; i++)
            copy[i] = numbers[i] * 2;
        return copy;
    }
  explanation: "מערך הוא טיפוס הפניה, ולכן `copy = numbers` לא מעתיק את המערך אלא מפנה לאותו מערך. הלולאה משנה את המערך של מי שקרא למתודה, ומודפס `20 20`. זו תופעת לוואי מפתיעה שסותרת את השם `DoubledCopy`; `new int[numbers.Length]` יוצר מערך חדש באמת."

- id: cs.clean-code.small-methods.008
  type: single
  difficulty: 1
  prompt: "מתודה נקראת `ValidateAndSaveOrder`. מה המילה `And` בשם מרמזת?"
  options:
    - "שהמתודה חייבת להחזיר bool"
    - "שהשם מצוין ואין מה לשפר, כי הוא מתאר את כל מה שהמתודה עושה"
    - "שהמתודה עושה יותר מדבר אחד, וכדאי לשקול לפצל אותה ל-ValidateOrder ול-SaveOrder"
    - "שהמתודה צריכה להיות static"
  answer: 2
  explanation: "מתודה צריכה לעשות דבר אחד. `And` בשם הוא סימן מובהק לשתי אחריויות. כשהן מופרדות, אפשר לבדוק תקינות בלי לשמור, לבדוק כל חלק לחוד, ולשנות אחד בלי לגעת בשני."
  optionExplanations:
    "0": "השם לא אומר דבר על טיפוס ההחזרה."
    "1": "שם כן הוא דבר טוב, אבל כאן הוא חושף שהמתודה עושה שני דברים; השם מדויק, העיצוב לא."
    "3": "השם לא קשור לשאלה אם המתודה סטטית."

- id: cs.clean-code.small-methods.009
  type: cleaner
  difficulty: 1
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      class TicketPricing
      {
          public double Price(int age, bool isStudent, double basePrice)
          {
              if (age < 12 || age >= 67 || (isStudent && age < 27))
                  return basePrice / 2;
              return basePrice;
          }
      }
    - |
      class TicketPricing
      {
          public double Price(int age, bool isStudent, double basePrice)
          {
              // children, seniors and young students pay half price
              if (age < 12 || age >= 67 || (isStudent && age < 27))
                  return basePrice / 2;
              return basePrice;
          }
      }
    - |
      class TicketPricing
      {
          public double Price(int age, bool isStudent, double basePrice)
          {
              if (IsEligibleForDiscount(age, isStudent))
                  return basePrice / 2;
              return basePrice;
          }

          private static bool IsEligibleForDiscount(int age, bool isStudent)
          {
              return age < 12 || age >= 67 || (isStudent && age < 27);
          }
      }
  answer: 2
  explanation: "חילוץ תנאי מורכב למתודה עם שם (Decompose Conditional) הופך את `Price` לקריאה כמו משפט: «אם זכאי להנחה, חצי מחיר». הפרטים של מי זכאי נמצאים במקום אחד עם שם, ואפשר לבדוק ולשנות אותם לחוד."
  optionExplanations:
    "0": "הקורא צריך לפענח שלושה תנאים כדי להבין מה הם אומרים יחד."
    "1": "הערה מסבירה את התנאי, אבל שם של מתודה עושה את זה בלי סכנה שההערה תתיישן."

- id: cs.clean-code.small-methods.010
  type: cleaner
  difficulty: 2
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      PriceCalculator calculator = new PriceCalculator();
      calculator.Calculate(5, 3);
      Console.WriteLine(calculator.GetResult());

      class PriceCalculator
      {
          private double result;

          public void Calculate(double unitPrice, int quantity)
          {
              result = unitPrice * quantity;
          }

          public double GetResult()
          {
              return result;
          }
      }
    - |
      PriceCalculator calculator = new PriceCalculator();
      Console.WriteLine(calculator.Calculate(5, 3));

      class PriceCalculator
      {
          public double Calculate(double unitPrice, int quantity)
          {
              return unitPrice * quantity;
          }
      }
  answer: 1
  explanation: "מתודה שמחשבת ערך צריכה להחזיר אותו. כשהתוצאה נשמרת בשדה, נוצר צימוד בזמן (Temporal Coupling): חייבים לקרוא ל-`Calculate` לפני `GetResult`, ו-`result` נשאר עם ערך ישן עד הקריאה הבאה."
  optionExplanations:
    "0": "המצב הנסתר בשדה `result` מאלץ סדר קריאות מסוים, ושום דבר בחתימה לא מגלה את זה."

- id: cs.clean-code.small-methods.011
  type: cleaner
  difficulty: 3
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      Console.WriteLine(Bmi(80, 2));

      static double Bmi(double weightKilograms, double heightMeters)
      {
          return Divide(weightKilograms, Square(heightMeters));
      }

      static double Square(double x)
      {
          return x * x;
      }

      static double Divide(double a, double b)
      {
          return a / b;
      }
    - |
      Console.WriteLine(Bmi(80, 2));

      static double Bmi(double weightKilograms, double heightMeters)
      {
          return weightKilograms / (heightMeters * heightMeters);
      }
    - |
      Console.WriteLine(80 / (2.0 * 2.0));
  answer: 1
  explanation: "מתודה קטנה עם שם שמסביר את הנוסחה (`Bmi`) היא האיזון הנכון. «מתודות קטנות» לא אומר לפרק כל אופרטור למתודה: חילוץ כדאי כשהשם מוסיף משמעות שלא רואים בקוד עצמו."
  optionExplanations:
    "0": "`Divide` ו-`Square` לא מוסיפות מידע על `/` ו-`*`; הן רק מאלצות את הקורא לקפוץ בין מתודות."
    "2": "בלי מתודה עם שם, הקורא צריך לנחש מה החישוב, והמספרים `80` ו-`2.0` הם מספרי קסם."

- id: cs.clean-code.small-methods.012
  type: truefalse
  difficulty: 1
  prompt: מתודה של שלוש שורות בהכרח עושה דבר אחד בלבד.
  answer: false
  explanation: "אורך הוא רק סימן. מתודה `IsValid` של שלוש שורות יכולה גם לבדוק תקינות וגם לכתוב ללוג או לשנות שדה. השאלה היא אם אפשר לתאר את מה שהיא עושה במשפט אחד בלי «וגם», ואם כל השורות באותה רמת הפשטה."

