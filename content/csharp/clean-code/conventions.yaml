- id: cs.clean-code.conventions.001
  type: single
  difficulty: 1
  prompt: איך נכון לקרוא לקבוע ציבורי שמחזיק את מספר הניסיונות המרבי, לפי מוסכמות השמות של מיקרוסופט ל-C#?
  options:
    - "MAX_RETRIES"
    - "maxRetries"
    - "MaxRetries"
    - "kMaxRetries"
  answer: 2
  explanation: "ב-C# קבועים נכתבים ב-PascalCase, כמו שאר החברים הציבוריים: `int.MaxValue`, `Math.PI`. אותיות גדולות עם קו תחתון הן מוסכמה של C, של Java ושל Python."
  optionExplanations:
    "0": "SCREAMING_CASE מקובל ב-Java וב-Python, אבל לא ב-C#."
    "1": "camelCase שמור לפרמטרים, למשתנים מקומיים ולשדות פרטיים, לא לקבוע ציבורי."
    "3": "קידומת `k` היא מוסכמה של C++ אצל חלק מהצוותים, לא של C#."

- id: cs.clean-code.conventions.002
  type: single
  difficulty: 3
  prompt: איזה שם בקוד לא תואם את מוסכמות השמות של מיקרוסופט?
  code: |
    public class CustomerList
    {
        public const int MaxCustomers = 100;
        private int _count;

        public int getCount()
        {
            return _count;
        }

        public void AddCustomer(string name)
        {
            _count++;
        }
    }
  options:
    - "MaxCustomers"
    - "_count"
    - "getCount"
    - "AddCustomer"
  answer: 2
  explanation: "`getCount` היא מתודה ציבורית, ומתודות נכתבות ב-PascalCase: `GetCount`. שאר השמות תקינים: קבוע ציבורי ומתודה ב-PascalCase, ושדה פרטי ב-camelCase עם קו תחתון."
  optionExplanations:
    "0": "קבועים ב-C# נכתבים ב-PascalCase, לא באותיות גדולות."
    "1": "שדה פרטי נכתב ב-camelCase עם קידומת `_`; זו בדיוק המוסכמה."
    "3": "מתודה ציבורית ב-PascalCase עם פועל בתחילתה; תקין."

- id: cs.clean-code.conventions.004
  type: truefalse
  difficulty: 2
  prompt: בדומה ל-Java, הקומפיילר של C# מחייב ששם הקובץ יהיה זהה לשם המחלקה הציבורית שבו.
  answer: false
  explanation: "C# לא אוכפת קשר בין שם הקובץ לשם המחלקה. זו מוסכמה, ולא דרישה של הקומפיילר: טיפוס אחד בכל קובץ, ושם הקובץ כשם הטיפוס (`OrderService` בקובץ `OrderService.cs`). כך קל למצוא כל מחלקה בפרויקט."

- id: cs.clean-code.conventions.006
  type: single
  difficulty: 1
  prompt: "איזה סגנון של סוגריים מסולסלים תואם את מוסכמות הקוד של מיקרוסופט ל-C#?"
  options:
    - |
      if (isValid) {
          Save();
      }
    - |
      if (isValid)
      {
          Save();
      }
    - |
      if (isValid)
          {
          Save();
          }
  answer: 1
  explanation: "ב-C# מקובל סגנון Allman: כל סוגר מסולסל, פותח וסוגר, בשורה משלו ובאותה הזחה כמו הפקודה שהוא שייך אליה. זה גם סגנון ברירת המחדל של Visual Studio."
  optionExplanations:
    "0": "סוגר פותח בסוף השורה (K&R) מקובל ב-Java וב-JavaScript, לא במוסכמות של C#."
    "2": "הסוגריים מוזחים פנימה, וזה לא תואם אף מוסכמה מקובלת."

- id: cs.clean-code.conventions.007
  type: cleaner
  difficulty: 1
  prompt: לפי מוסכמות הקוד של מיקרוסופט ל-C#, איזו גרסה נקייה יותר?
  options:
    - |
      int width = 4, height = 3; int area = width * height; Console.WriteLine(area);
    - |
      int width = 4;
      int height = 3;
      int area = width * height;
      Console.WriteLine(area);
    - |
      int width = 4; int height = 3;
      int area = width * height; Console.WriteLine(area);
  answer: 1
  explanation: "מוסכמות מיקרוסופט: פקודה אחת בכל שורה, והצהרה אחת בכל שורה. כך העין עוברת מלמעלה למטה, ההבדלים בין גרסאות ב-git ברורים, ונקודת עצירה בדיבאגר נופלת על פקודה אחת."
  optionExplanations:
    "0": "הכול בשורה אחת: קשה לקרוא ולשים נקודת עצירה על פקודה מסוימת."
    "2": "שתי פקודות בכל שורה; קל לפספס את השנייה בקריאה מהירה."

- id: cs.clean-code.conventions.010
  type: single
  difficulty: 2
  prompt: "איזו טענה על `string` ועל `String` נכונה?"
  options:
    - "String מהיר יותר, כי הוא שם המחלקה האמיתית"
    - "string הוא טיפוס ערך, ו-String הוא טיפוס הפניה"
    - "שניהם אותו טיפוס, System.String, והמוסכמה היא להשתמש במילה השמורה string, גם בקריאות כמו string.Compare"
    - "string מתאים להצהרה על משתנים, אבל חובה לכתוב String כשקוראים למתודה סטטית כמו String.Compare"
  answer: 2
  explanation: "`string` הוא כינוי (Alias) של `System.String`, בדיוק כמו ש-`int` הוא `System.Int32`. אין הבדל בביצועים או בהתנהגות. מוסכמות מיקרוסופט ממליצות להשתמש במילות המפתח של השפה בכל מקום: `string name`, `string.Compare(...)`, `int.Parse(...)`."
  optionExplanations:
    "0": "הקומפיילר מתרגם את שניהם לאותו טיפוס בדיוק; אין הבדל בביצועים."
    "1": "שניהם אותו טיפוס, ומחרוזת היא טיפוס הפניה."
    "3": "`string.Compare` עובד ומקובל; המוסכמה היא מילת המפתח גם בקריאה למתודות סטטיות."

- id: cs.clean-code.conventions.011
  type: cleaner
  difficulty: 1
  prompt: לפי מוסכמות הקוד של מיקרוסופט ל-C#, איזו גרסה נקייה יותר?
  options:
    - |
      class PageCounter
      {
          private int Visits;

          public void RecordVisit()
          {
              Visits++;
          }

          public string Describe()
          {
              return $"{Visits} visits";
          }
      }
    - |
      class PageCounter
      {
          private int m_visits;

          public void RecordVisit()
          {
              m_visits++;
          }

          public string Describe()
          {
              return $"{m_visits} visits";
          }
      }
    - |
      class PageCounter
      {
          private int _visits;

          public void RecordVisit()
          {
              _visits++;
          }

          public string Describe()
          {
              return $"{_visits} visits";
          }
      }
  answer: 2
  explanation: "מוסכמות מיקרוסופט: שדה פרטי נכתב ב-camelCase עם קידומת `_`. כך רואים מיד בתוך מתודה שמדובר בשדה של האובייקט ולא במשתנה מקומי או בפרמטר."
  optionExplanations:
    "0": "`Visits` ב-PascalCase נראה כמו מאפיין ציבורי."
    "1": "הקידומת `m_` היא מוסכמה ישנה מ-C++, ולא מקובלת ב-C# מודרני."

- id: cs.clean-code.conventions.014
  type: cleaner
  difficulty: 1
  prompt: לפי מוסכמות הקוד של מיקרוסופט ל-C#, איזו גרסה נקייה יותר?
  options:
    - |
      string name = "Dana";
      int quantity = 3;
      Console.WriteLine(name + " ordered " + quantity + " items");
    - |
      string name = "Dana";
      int quantity = 3;
      Console.WriteLine($"{name} ordered {quantity} items");
    - |
      string name = "Dana";
      int quantity = 3;
      Console.Write(name);
      Console.Write(" ordered ");
      Console.Write(quantity);
      Console.WriteLine(" items");
  answer: 1
  explanation: "מוסכמות מיקרוסופט ממליצות על אינטרפולציה (String Interpolation) לבניית מחרוזות קצרות. הערכים מופיעים בדיוק במקום שבו יודפסו, והמשפט כולו נקרא ברצף אחד."
  optionExplanations:
    "0": "שרשור עם `+` מפזר את המשפט בין מרכאות, וקל לשכוח רווח."
    "2": "ארבע פקודות הדפסה למשפט אחד: קשה לראות מה יודפס בסוף."

- id: cs.clean-code.conventions.015
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    Console.WriteLine(Describe(30, false));

    static string Describe(int temperature, bool isRaining)
    {
        string result = "Nice day";
        if (temperature > 25)
            if (isRaining)
                result = "Hot and rainy";
        else
            result = "Cold";
        return result;
    }
  options:
    - "Nice day"
    - "Cold"
    - "Hot and rainy"
    - "שגיאת קומפילציה"
  answer: 1
  explanation: "ההזחה מטעה: `else` שייך תמיד ל-`if` הקרוב ביותר, כלומר ל-`if (isRaining)`. לכן ביום חם ויבש מודפס `Cold`. זו הסיבה שמומלץ להשתמש בסוגריים מסולסלים בתנאים מקוננים: הם קובעים את המבנה במפורש, וההזחה לא יכולה לשקר."
  optionExplanations:
    "0": "זה מה שההזחה מרמזת, אבל הקומפיילר מתעלם מהזחה ומצמיד את `else` ל-`if` הפנימי."
    "2": "`isRaining` הוא `false`, ולכן ההשמה הזו לא מתבצעת."
    "3": "הקוד תקין תחבירית; ב-C# ההזחה לא משפיעה על המשמעות."

- id: cs.clean-code.conventions.016
  type: single
  difficulty: 2
  prompt: איזה שם מחלקה תואם את הנחיות השמות של .NET?
  options:
    - "HTMLParser"
    - "HtmlParser"
    - "Htmlparser"
    - "HTML_Parser"
  answer: 1
  explanation: "בהנחיות של .NET, ראשי תיבות של שלוש אותיות ומעלה נכתבים כמילה רגילה ב-PascalCase: `HtmlParser`, `XmlReader`, `HttpClient`. רק ראשי תיבות של שתי אותיות נשארים באותיות גדולות, כמו `IO` ב-`System.IO`."
  optionExplanations:
    "0": "ראשי תיבות ארוכים באותיות גדולות מקשים לראות איפה נגמרת מילה אחת ומתחילה הבאה."
    "2": "`Parser` היא מילה נפרדת, ולכן מתחילה באות גדולה."
    "3": "קו תחתון לא משמש בשמות של מחלקות ב-C#."

- id: cs.clean-code.conventions.017
  type: single
  difficulty: 1
  prompt: לפי מוסכמות השמות של מיקרוסופט, איך נכתב שם של פרמטר שמחזיק את שם התלמיד?
  options:
    - "StudentName"
    - "studentName"
    - "student_name"
    - "STUDENTNAME"
  answer: 1
  explanation: "פרמטרים ומשתנים מקומיים נכתבים ב-camelCase: המילה הראשונה באות קטנה, וכל מילה נוספת מתחילה באות גדולה. PascalCase שמור למחלקות, למתודות ולקבועים."
  optionExplanations:
    "0": "PascalCase מתאים למחלקות ולמתודות, לא לפרמטרים."
    "2": "קו תחתון בין מילים (snake_case) מקובל ב-Python, לא ב-C#."
    "3": "אותיות גדולות בלבד מקשות לראות איפה מילה נגמרת, ולא משמשות בשמות ב-C#."

- id: cs.clean-code.conventions.018
  type: cleaner
  difficulty: 1
  prompt: לפי מוסכמות הקוד של מיקרוסופט ל-C#, איזו גרסה נקייה יותר?
  options:
    - |
      int sum = 0;
      for (int i = 1; i <= 5; i++)
      {
      sum += i;
      Console.WriteLine(sum);
      }
    - |
      int sum = 0;
      for (int i = 1; i <= 5; i++)
      {
          sum += i;
          Console.WriteLine(sum);
      }
    - |
      int sum = 0;
        for (int i = 1; i <= 5; i++)
      {
          sum += i;
              Console.WriteLine(sum);
      }
  answer: 1
  explanation: "כל רמת קינון מוזחת בארבעה רווחים, וכל השורות באותה רמה מתחילות באותו טור. ההזחה מראה במבט אחד אילו פקודות נמצאות בתוך הלולאה."
  optionExplanations:
    "0": "גוף הלולאה לא מוזח, ולכן קשה לראות אילו פקודות חוזרות."
    "2": "הזחה לא עקבית מטעה: היא מרמזת על מבנה שלא קיים בקוד."

- id: cs.clean-code.conventions.019
  type: truefalse
  difficulty: 2
  prompt: הקומפיילר של C# מתעלם מהזחה, ולכן קוד עם הזחה שגויה יכול לעבור קומפילציה ולרוץ.
  answer: true
  explanation: "ב-C# המבנה נקבע לפי סוגריים מסולסלים ונקודה-פסיק, לא לפי הזחה (בניגוד ל-Python). לכן הזחה שגויה לא תיתפס על ידי הקומפיילר, אבל היא עלולה להטעות את מי שקורא את הקוד ולהסתיר באגים."

- id: cs.clean-code.conventions.020
  type: single
  difficulty: 2
  prompt: איזו הערה כתובה לפי מוסכמות ההערות של מיקרוסופט ל-C#?
  options:
    - |
      int average = sum / count; //average
    - |
      //compute the average
      int average = sum / count;
    - |
      // Compute the average of the grades.
      int average = sum / count;
    - |
      /******* AVERAGE *******/
      int average = sum / count;
  answer: 2
  explanation: "לפי המוסכמות: הערה בשורה משלה מעל הקוד, ולא בסוף שורת קוד; רווח אחד אחרי `//`; הטקסט מתחיל באות גדולה ומסתיים בנקודה. הערה מסודרת קלה לקריאה ולא נבלעת בקוד."
  optionExplanations:
    "0": "ההערה בסוף שורת קוד ובלי רווח אחרי `//`, וגם רק חוזרת על שם המשתנה."
    "1": "חסר רווח אחרי `//`, והטקסט לא מתחיל באות גדולה."
    "3": "מסגרת של כוכביות היא קישוט שלא מקובל במוסכמות של C#."

- id: cs.clean-code.conventions.021
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    int[] grades = { 40, 50, 75 };
    int failed = 0;
    for (int i = 0; i < grades.Length; i++)
        if (grades[i] < 55)
            Console.WriteLine("Failed: " + grades[i]);
            failed++;
    Console.WriteLine(failed);
  options:
    - "Failed: 40\nFailed: 50\n2"
    - "Failed: 40\nFailed: 50\n1"
    - "Failed: 40\nFailed: 50\n3"
    - "שגיאת קומפילציה"
  answer: 1
  explanation: "בלי סוגריים מסולסלים, גוף הלולאה הוא רק פקודת ה-`if`, וגוף ה-`if` הוא רק ההדפסה. `failed++` נמצא אחרי הלולאה, למרות ההזחה, ולכן הוא רץ פעם אחת בלבד. זו הסיבה שהמוסכמות ממליצות על סוגריים מסולסלים גם סביב פקודה אחת."
  optionExplanations:
    "0": "זה מה שההזחה מרמזת, אבל הקומפיילר מתעלם מהזחה: `failed++` לא נמצא בתוך ה-`if`."
    "2": "`failed++` לא נמצא גם בתוך הלולאה, ולכן הוא לא רץ שלוש פעמים."
    "3": "הקוד תקין תחבירית; הזחה מטעה לא גורמת לשגיאת קומפילציה ב-C#."

- id: cs.clean-code.conventions.022
  type: single
  difficulty: 2
  prompt: איזה שם מתאים למחלקה שמייצגת תלמיד אחד, לפי מוסכמות השמות של מיקרוסופט?
  options:
    - "student"
    - "Students"
    - "clsStudent"
    - "Student"
  answer: 3
  explanation: "שם של מחלקה נכתב ב-PascalCase, ביחיד ובלי קידומות: `Student`. כל עצם של המחלקה הוא תלמיד אחד, ולכן `Student s = new Student(...)` נקרא בטבעיות. שם ברבים מתאים למשתנה שמחזיק אוסף, למשל `Student[] students`."
  optionExplanations:
    "0": "שמות של מחלקות נכתבים ב-PascalCase, כלומר מתחילים באות גדולה."
    "1": "שם ברבים מטעה: נראה שהמחלקה מייצגת קבוצה של תלמידים."
    "2": "קידומת `cls` היא סימן הונגרי (Hungarian Notation) ישן שלא מקובל ב-C#."
