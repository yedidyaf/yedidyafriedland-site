          public bool Withdraw(double amount)
          {
              if (amount > 0)
              {
                  if (amount <= balance)
                  {
                      balance -= amount;
                      return true;
                  }
                  else
                  {
                      return false;
                  }
              }
              else
              {
                  return false;
              }
          }
      }
    - |
      class Account
      {
          private double balance = 100;

          public bool Withdraw(double amount)
          {
              if (amount <= 0)
                  return false;
              if (amount > balance)
                  return false;

              balance -= amount;
              return true;
          }
      }
  answer: 1
  explanation: "סעיפי שמירה (Guard Clauses) מטפלים במקרים הלא תקינים בהתחלה ויוצאים מיד. מה שנשאר בסוף המתודה, בלי הזחה, הוא המסלול הרגיל: `balance -= amount`. כל יציאה כתובה צמוד לתנאי שגורם לה."
  optionExplanations:
    "0": "הקינון מרחיק כל `return false` מהתנאי שלו, והפעולה העיקרית קבורה ברמת ההזחה העמוקה ביותר."

