- id: cs.clean-code.code-smells.011
  type: cleaner
  difficulty: 3
  prompt: במערכת של חנות מחברים סכומי כסף בכמה מטבעות, במקומות רבים בקוד. איזו גרסה נקייה יותר?
  options:
    - |
      decimal priceAmount = 50m;
      string priceCurrency = "ILS";
      decimal taxAmount = 9m;
      string taxCurrency = "ILS";
      if (taxCurrency != priceCurrency)
          throw new InvalidOperationException("Currency mismatch.");
      Console.WriteLine($"{priceAmount + taxAmount} {priceCurrency}");
    - |
      var price = new Money(50m, "ILS");
      var tax = new Money(9m, "ILS");
      Console.WriteLine(price.Add(tax));

      record Money(decimal Amount, string Currency)
      {
          public Money Add(Money other)
          {
              if (other.Currency != Currency)
                  throw new InvalidOperationException("Currency mismatch.");
              return this with { Amount = Amount + other.Amount };
          }

          public override string ToString() => $"{Amount} {Currency}";
      }
  answer: 1
  explanation: "סכום ומטבע הם מושג אחד, כסף, ולכן מגיע להם טיפוס משלהם. `Money` מחזיק את שני הערכים יחד ומרכז את הכלל «אסור לחבר מטבעות שונים» במקום אחד. זה התיקון לאובססיית טיפוסים פרימיטיביים (Primitive Obsession)."
  optionExplanations:
    "0": "כל מקום שמחבר סכומים צריך לזכור את בדיקת המטבע; במקום אחד ישכחו, ויחברו שקלים עם דולרים."

- id: cs.clean-code.code-smells.012
  type: single
  difficulty: 2
  prompt: בכל פעם שמוסיפים צורה, צריך לשנות את המתודה הזו ועוד מתודות דומות (היקף, ציור). מה התיקון המתאים ביותר?
  code: |
    class AreaCalculator
    {
        public double Area(string shape, double size)
        {
            switch (shape)
            {
                case "circle": return Math.PI * size * size;
                case "square": return size * size;
                case "triangle": return Math.Sqrt(3) / 4 * size * size;
                default: throw new ArgumentException("Unknown shape.");
            }
        }
    }
  options:
    - "להחליף את ה-switch בשרשרת של if ו-else if"
    - "להעביר את שמות הצורות לקבועים ולהשאיר את ה-switch"
    - "להגדיר ממשק IShape עם מתודה Area, ומחלקה לכל צורה שמממשת אותה"
    - "להוסיף הערה מעל כל case שמסבירה את הנוסחה"
  answer: 2
  explanation: "`switch` על סוג שחוזר בכמה מתודות הוא ריח מוכר (Switch Statements): כל צורה חדשה מחייבת לעבור על כל ה-switch-ים. עם פולימורפיזם (Polymorphism), כל צורה יודעת לחשב את השטח שלה, וצורה חדשה היא מחלקה חדשה בלי לגעת בקוד קיים."
  optionExplanations:
    "0": "if ו-else if הם אותו מבנה בתחביר אחר; הבעיה נשארת."
    "1": "קבועים מונעים שגיאות כתיב, אבל עדיין צריך לעדכן כל switch בכל צורה חדשה."
    "3": "הערות לא משנות את המבנה, וכל צורה חדשה עדיין מחייבת לשנות כמה מתודות."

- id: cs.clean-code.code-smells.013
  type: bug
  difficulty: 2
  prompt: תקופת הניסיון היא 14 ימים. באיזו שורה הבאג?
  code: |
    class Subscription
    {
        public bool IsTrialOver(int daysSinceSignup) => daysSinceSignup >= 14;

        public int TrialDaysLeft(int daysSinceSignup) => Math.Max(0, 30 - daysSinceSignup);
    }
  answer: 5
  fixed: |
    class Subscription
    {
        private const int TrialDays = 14;

        public bool IsTrialOver(int daysSinceSignup) => daysSinceSignup >= TrialDays;

        public int TrialDaysLeft(int daysSinceSignup) => Math.Max(0, TrialDays - daysSinceSignup);
    }
  explanation: "`TrialDaysLeft` מחשבת לפי 30 ימים, ולכן אחרי 20 ימים הניסיון נגמר אבל המשתמש רואה שנשארו לו 10. התיקון המינימלי הוא להחליף את `30` ב-`14`; התיקון הנכון באמת הוא קבוע אחד `TrialDays`, כדי שמספרי קסם לא יוכלו להתרחק זה מזה."

- id: cs.clean-code.code-smells.014
  type: bug
  difficulty: 3
  prompt: "המתודה עברה רפקטורינג מקינון עמוק לסעיפי שמירה (Guard Clauses). היא אמורה לזרוק חריגה רק כשאין מספיק מלאי. באיזו שורה הבאג?"
  code: |
    class Inventory
    {
        private int _stock = 10;

        public void Remove(int quantity)
        {
            if (quantity <= 0)
                throw new ArgumentOutOfRangeException(nameof(quantity));
            if (quantity < _stock)
                throw new InvalidOperationException("Not enough stock.");

            _stock -= quantity;
        }
    }
  answer: 9
  fixed: |
    class Inventory
    {
        private int _stock = 10;

        public void Remove(int quantity)
        {
            if (quantity <= 0)
                throw new ArgumentOutOfRangeException(nameof(quantity));
            if (quantity > _stock)
                throw new InvalidOperationException("Not enough stock.");

            _stock -= quantity;
        }
    }
  explanation: "בגרסה המקוננת התנאי היה «אם `quantity <= _stock`, הורד מהמלאי». סעיף שמירה בודק את ההפך, ולכן צריך לשלול את התנאי: `quantity > _stock`. כאן נכתב `<`, והמתודה זורקת חריגה דווקא כשיש מספיק מלאי. בהיפוך תנאים לסעיפי שמירה, בדקו את מקרי הקצה."

- id: cs.clean-code.code-smells.015
  type: truefalse
  difficulty: 1
  prompt: "קוד שהוצא להערה (Commented-Out Code) כדאי להשאיר בקובץ, למקרה שנצטרך אותו שוב."
