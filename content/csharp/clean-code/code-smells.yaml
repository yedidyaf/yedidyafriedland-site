- id: cs.clean-code.code-smells.005
  type: smell
  difficulty: 3
  prompt: איזה ריח קוד בולט כאן?
  code: |
    class Shipment
    {
        private const double KilogramsPerPound = 0.4536;
        private double weightValue;
        private string weightUnit;

        public Shipment(double weightValue, string weightUnit)
        {
            this.weightValue = weightValue;
            this.weightUnit = weightUnit;
        }

        public double GetWeightInKilograms()
        {
            if (weightUnit == "lb")
                return weightValue * KilogramsPerPound;
            return weightValue;
        }
    }
  options:
    - "מספר קסם - Magic Number"
    - "מחלקת אל - God Class"
    - "אובססיית טיפוסים פרימיטיביים - Primitive Obsession"
    - "קוד מת - Dead Code"
  answer: 2
  explanation: "משקל מיוצג כ-`double` ועוד `string` ליחידה. כל מקום שמשתמש במשקל צריך לזכור לבדוק את היחידה, וכלום לא מונע יחידה כמו `\"kilo\"` או `\"LB\"`. מחלקה קטנה `Weight` מרכזת את ההמרות ואת הבדיקות במקום אחד, ושאר הקוד עובד עם משקל ולא עם זוג ערכים."
  optionExplanations:
    "0": "מקדם ההמרה מוגדר כקבוע עם שם."
    "1": "המחלקה קטנה ועוסקת בנושא אחד."
    "3": "כל החברים במחלקה בשימוש."

- id: cs.clean-code.code-smells.006
