- id: cs.clean-code.code-smells.001
  type: smell
  difficulty: 1
  prompt: איזה ריח קוד בולט כאן?
  code: |
    class ParkingLot
    {
        public int Fee(int minutes)
        {
            if (minutes <= 15)
                return 0;
            return (minutes / 60 + 1) * 12;
        }
    }
  options:
    - "מספר קסם - Magic Number"
    - "קינון עמוק - Deep Nesting"
    - "מחלקת אל - God Class"
    - "קוד מת - Dead Code"
  answer: 0
  explanation: "`15` ו-`12` מופיעים בלי שם, והקורא צריך לנחש שהם דקות החניה החינמיות והמחיר לשעה. קבועים עם שם, `FreeMinutes` ו-`HourlyRate`, מסבירים את הכוונה ומאפשרים לשנות תעריף במקום אחד."
  optionExplanations:
    "1": "יש `if` אחד, בלי קינון."
    "2": "למחלקה יש מתודה אחת ואחריות אחת."
    "3": "כל שורה בקוד יכולה לרוץ."

- id: cs.clean-code.code-smells.002
  type: smell
  difficulty: 1
  prompt: איזה ריח קוד בולט כאן?
  code: |
    class ShippingService
    {
        public bool CanShip(Order order)
        {
            if (order != null)
            {
                if (order.IsPaid())
                {
                    if (order.GetAddress() != "")
                    {
                        if (!order.IsCancelled())
                            return true;
                    }
                }
            }
            return false;
        }
    }

    class Order
    {
        private bool paid;
        private string address = "";
        private bool cancelled;

        public bool IsPaid() { return paid; }
        public string GetAddress() { return address; }
        public bool IsCancelled() { return cancelled; }
    }
  options:
    - "מתודה ארוכה - Long Method"
    - "קינון עמוק - Deep Nesting"
    - "קנאת תכונות - Feature Envy"
    - "שכפול קוד - Duplicated Code"
  answer: 1
  explanation: "ארבע רמות של `if` מקוננים מאלצות את הקורא להחזיק את כל התנאים בראש בבת אחת. אפשר להחליף אותם בסעיפי שמירה (Guard Clauses) שיוצאים מוקדם, או כאן פשוט בביטוי אחד: `return order != null && order.IsPaid() && order.GetAddress() != \"\" && !order.IsCancelled();`."
  optionExplanations:
    "0": "המתודה לא ארוכה; היא נראית ארוכה בגלל הסוגריים של הקינון."
    "2": "בדיקת מצב של הזמנה במחלקת משלוחים סבירה; הבעיה הבולטת היא המבנה."
    "3": "כל תנאי בודק דבר אחר; אין חזרה."

- id: cs.clean-code.code-smells.003
