- id: cs.clean-code.code-smells.009
  type: smell
  difficulty: 2
  prompt: איזה ריח קוד בולט כאן?
  code: |
    class GradeReport
    {
        public void Print(string csvLine)
        {
            string[] parts = csvLine.Split(',');
            string studentName = parts[0].Trim();
            List<int> grades = new();
            for (int i = 1; i < parts.Length; i++)
                grades.Add(int.Parse(parts[i]));

            if (grades.Count == 0)
                throw new ArgumentException("No grades.", nameof(csvLine));

            double average = grades.Average();
            int best = grades.Max();
            int worst = grades.Min();

