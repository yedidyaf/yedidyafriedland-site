- id: cs.clean-code.code-smells.016
  type: single
  difficulty: 2
  prompt: איזו הערה בקוד שווה להשאיר?
  code: |
    class PaymentGateway
    {
        // Gateway class
        private const int MaxDecimals = 2;

        // Rounds the amount
        public double Prepare(double amount)
        {
            // The bank rejects amounts with more than 2 digits after the point
            return Math.Round(amount, MaxDecimals);
        }
    }
  options:
    - "// Gateway class"
    - "// Rounds the amount"
    - "// The bank rejects amounts with more than 2 digits after the point"
  answer: 2
  explanation: "הערה טובה מסבירה למה, מידע שאי אפשר לקרוא מהקוד: כאן, דרישה של מערכת חיצונית. בלעדיה, מישהו עלול «לפשט» ולמחוק את העיגול. שתי ההערות האחרות רק חוזרות על מה שהקוד כבר אומר."
  optionExplanations:
    "0": "שם המחלקה כבר אומר את זה; זו הערה מיותרת (Redundant Comment)."
    "1": "`Math.Round` כבר אומר שמעגלים; ההערה לא מוסיפה למה."
