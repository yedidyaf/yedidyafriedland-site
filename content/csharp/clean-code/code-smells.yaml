- id: cs.clean-code.code-smells.011
  type: cleaner
  difficulty: 3
  prompt: במערכת של חנות מחברים סכומי כסף בכמה מטבעות, במקומות רבים בקוד. איזו גרסה נקייה יותר?
  options:
    - |
      double priceAmount = 50;
      string priceCurrency = "ILS";
      double taxAmount = 9;
      string taxCurrency = "ILS";
      if (taxCurrency == priceCurrency)
          Console.WriteLine($"{priceAmount + taxAmount} {priceCurrency}");
    - |
      Money price = new Money(50, "ILS");
      Money tax = new Money(9, "ILS");
      if (price.SameCurrency(tax))
          Console.WriteLine(price.Add(tax));

      class Money
      {
          private double amount;
          private string currency;

          public Money(double amount, string currency)
          {
              this.amount = amount;
              this.currency = currency;
          }

          public bool SameCurrency(Money other)
          {
              return currency == other.currency;
          }

          public Money Add(Money other)
          {
              return new Money(amount + other.amount, currency);
          }

          public override string ToString()
          {
              return $"{amount} {currency}";
          }
      }
  answer: 1
  explanation: "סכום ומטבע הם מושג אחד, כסף, ולכן מגיעה להם מחלקה משלהם. `Money` מחזיקה את שני הערכים יחד, ונותנת שם לפעולות עליהם: `SameCurrency` ו-`Add`. זה התיקון לאובססיית טיפוסים פרימיטיביים (Primitive Obsession)."
  optionExplanations:
    "0": "כל מקום בקוד צריך לנהל זוג משתנים לכל סכום, וקל לחבר סכום של מטבע אחד עם שם של מטבע אחר."

