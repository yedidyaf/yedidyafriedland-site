- id: cs.clean-code.code-smells.014
  type: bug
  difficulty: 3
  prompt: "המתודה עברה רפקטורינג מקינון עמוק לסעיפי שמירה (Guard Clauses). היא אמורה להחזיר `false` רק כשהכמות לא חיובית או כשאין מספיק מלאי. איזו שורה צריך לתקן?"
  code: |
    class Inventory
    {
        private int stock = 10;

        public bool Remove(int quantity)
        {
            if (quantity <= 0)
                return false;
            if (quantity < stock)
                return false;

            stock -= quantity;
            return true;
        }
    }
  answer: 9
  fixed: |
    class Inventory
    {
        private int stock = 10;

        public bool Remove(int quantity)
        {
            if (quantity <= 0)
                return false;
            if (quantity > stock)
                return false;

            stock -= quantity;
            return true;
        }
    }
  explanation: "בגרסה המקוננת התנאי היה «אם `quantity <= stock`, הורד מהמלאי». סעיף שמירה בודק את ההפך, ולכן צריך לשלול את התנאי: `quantity > stock`. כאן נכתב `<`, והמתודה נכשלת דווקא כשיש מספיק מלאי. בהיפוך תנאים לסעיפי שמירה, בדקו את מקרי הקצה."

