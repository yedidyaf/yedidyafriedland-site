- id: cs.clean-code.code-smells.005
  type: smell
  difficulty: 3
  prompt: איזה ריח קוד בולט כאן?
  code: |
    class Shipment
    {
        private const double KilogramsPerPound = 0.4536;

        public double WeightValue { get; set; }
        public string WeightUnit { get; set; }

        public double WeightInKilograms() =>
            WeightUnit == "lb" ? WeightValue * KilogramsPerPound : WeightValue;
    }
  options:
    - "מספר קסם - Magic Number"
    - "מחלקת אל - God Class"
    - "אובססיית טיפוסים פרימיטיביים - Primitive Obsession"
    - "קוד מת - Dead Code"
  answer: 2
  explanation: "משקל מיוצג כ-`double` ועוד `string` ליחידה. כל מקום שמשתמש במשקל צריך לזכור לבדוק את היחידה, וכלום לא מונע יחידה כמו `\"kilo\"` או `\"LB\"`. טיפוס ערך (Value Object), למשל `record Weight` עם יחידה מסוג `enum`, מרכז את ההמרות ואת הבדיקות במקום אחד."
  optionExplanations:
    "0": "מקדם ההמרה מוגדר כקבוע עם שם."
    "1": "המחלקה קטנה ועוסקת בנושא אחד."
    "3": "כל החברים במחלקה בשימוש."

- id: cs.clean-code.code-smells.006
  type: smell
