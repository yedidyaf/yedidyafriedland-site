  optionExplanations:
    "0": "if ו-else if הם אותו מבנה בתחביר אחר; הבעיה נשארת."
    "1": "קבועים מונעים שגיאות כתיב, אבל עדיין צריך לעדכן כל switch בכל צורה חדשה."
    "3": "הערות לא משנות את המבנה, וכל צורה חדשה עדיין מחייבת לשנות כמה מתודות."

