    class Invoice
    {
        public decimal UnitPrice { get; set; }
        public int Quantity { get; set; }
        public decimal DiscountRate { get; set; }
    }
  options:
    - "מחלקת אל - God Class"
    - "שכפול קוד - Duplicated Code"
    - "קנאת תכונות - Feature Envy"
    - "רשימת פרמטרים ארוכה - Long Parameter List"
  answer: 2
  explanation: "המתודה `Total` משתמשת רק בנתונים של `Invoice` ולא בשום דבר של `InvoicePrinter`: היא «מקנאה» במחלקה אחרת (Feature Envy). מעבירים אותה למחלקה שהנתונים שלה (Move Method): מאפיין `invoice.Total`, וכך החשבונית אחראית על החישוב של עצמה."
  optionExplanations:
    "0": "המחלקה קטנה מאוד; הבעיה היא שהמתודה נמצאת במחלקה הלא נכונה."
    "1": "אין קוד שחוזר על עצמו."
