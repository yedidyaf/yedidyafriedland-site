- id: cs.clean-code.code-smells.009
  type: smell
  difficulty: 2
  prompt: איזה ריח קוד בולט כאן?
  code: |
    class GradeReport
    {
        public void Print(string line)
        {
            string[] parts = line.Split(',');
            string studentName = parts[0];

            int sum = 0;
            int best = int.Parse(parts[1]);
            int worst = best;
            for (int i = 1; i < parts.Length; i++)
            {
                int grade = int.Parse(parts[i]);
                sum += grade;
                if (grade > best)
                    best = grade;
                if (grade < worst)
                    worst = grade;
            }
            double average = (double)sum / (parts.Length - 1);

            Console.WriteLine($"Student: {studentName}");
            Console.WriteLine($"Average: {average}");
            Console.WriteLine($"Best: {best}, Worst: {worst}");
        }
    }
  options:
    - "מחלקת אל - God Class"
    - "קינון עמוק - Deep Nesting"
    - "מתודה ארוכה - Long Method"
    - "שכפול קוד - Duplicated Code"
  answer: 2
  explanation: "המתודה מפענחת שורה, מחשבת סכום, מקסימום, מינימום וממוצע, ומדפיסה: כמה שלבים, והשורות הריקות מסמנות בדיוק איפה הם נפרדים. כל שלב הוא מתודה שמחכה לחילוץ (Extract Method): `ParseGrades`, `FindBest`, `FindWorst`, `PrintSummary`. אז `Print` תקרא כמו רשימת צעדים."
  optionExplanations:
    "0": "למחלקה יש מתודה אחת ונושא אחד; הבעיה היא שהמתודה עצמה עושה הרבה."
    "1": "יש לכל היותר `if` אחד בתוך לולאה; זה לא קינון עמוק."
    "3": "אף קטע לא חוזר על עצמו."

