    - |
      class Product
      {
          public string Name { get; }
          public decimal Price { get; }
          public int Stock { get; }

          public Product(string name, decimal price) : this(name, price, 0) { }

          public Product(string name, decimal price, int stock)
          {
              Name = name;
              Price = price;
              Stock = stock;
          }
      }
  answer: 1
  explanation: "שרשור בנאים עם `: this(...)` משאיר את האתחול במקום אחד. כשיוסיפו בדיקה, למשל שהמחיר לא שלילי, היא תחול על שני הבנאים בלי לשכפל אותה."
  optionExplanations:
    "0": "האתחול משוכפל בשני הבנאים; בדיקה שתתווסף לאחד מהם בלבד תיצור אובייקטים לא תקינים דרך השני."

- id: cs.clean-code.dry.010
  type: bug
  difficulty: 3
  prompt: באתר ובסניף, קנייה של 10 יחידות או יותר מקבלת הנחה של 10%. באיזו שורה הבאג?
  code: |
    class Pricing
    {
        private const int BulkQuantity = 10;
        private const decimal BulkPriceFactor = 0.9m;

        public decimal OnlineTotal(decimal price, int quantity)
        {
            decimal total = price * quantity;
            return quantity >= BulkQuantity ? total * BulkPriceFactor : total;
        }

        public decimal StoreTotal(decimal price, int quantity)
        {
            decimal total = price * quantity;
            return quantity > BulkQuantity ? total * BulkPriceFactor : total;
        }
    }
  answer: 15
  fixed: |
    class Pricing
    {
        private const int BulkQuantity = 10;
        private const decimal BulkPriceFactor = 0.9m;

        public decimal OnlineTotal(decimal price, int quantity)
        {
            decimal total = price * quantity;
            return quantity >= BulkQuantity ? total * BulkPriceFactor : total;
        }

        public decimal StoreTotal(decimal price, int quantity)
        {
            decimal total = price * quantity;
            return quantity >= BulkQuantity ? total * BulkPriceFactor : total;
        }
    }
  explanation: "בסניף נכתב `>` במקום `>=`, ולכן מי שקונה בדיוק 10 יחידות לא מקבל הנחה. זה מה שקורה כשאותו כלל משוכפל: העותקים מתרחקים זה מזה. מתודה אחת, למשל `ApplyBulkDiscount(total, quantity)`, הייתה מבטיחה כלל אחד לשני הערוצים."

- id: cs.clean-code.dry.011
  type: truefalse
  difficulty: 1
  prompt: לפי DRY, כל שני קטעי קוד שנראים זהים חייבים להתאחד למתודה אחת.
  answer: false
  explanation: "DRY עוסק בשכפול של ידע, לא של טקסט. שני קטעים יכולים להיראות זהים במקרה ולהשתנות בעתיד מסיבות שונות. כלל אצבע מקובל הוא כלל השלוש (Rule of Three): מחכים להופעה השלישית, כשכבר ברור מה באמת משותף, ורק אז מפשטים."

- id: cs.clean-code.dry.012
  type: cleaner
  difficulty: 2
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      class OrderService
      {
          private const decimal MemberPriceFactor = 0.9m;

          public decimal Checkout(decimal price, bool isMember)
          {
              decimal total;
              if (isMember)
              {
                  total = price * MemberPriceFactor;
                  Console.WriteLine("Saving order...");
              }
              else
              {
                  total = price;
                  Console.WriteLine("Saving order...");
              }
              return total;
          }
      }
    - |
      class OrderService
      {
          private const decimal MemberPriceFactor = 0.9m;

          public decimal Checkout(decimal price, bool isMember)
          {
              decimal total = isMember ? price * MemberPriceFactor : price;
              Console.WriteLine("Saving order...");
              return total;
          }
      }
  answer: 1
  explanation: "כששני הענפים של `if` מסתיימים באותה פקודה, היא לא שייכת לתנאי. מוציאים אותה החוצה (Consolidate Duplicate Conditional Fragments), ונשאר רק מה שבאמת שונה: חישוב המחיר."
  optionExplanations:
    "0": "ההדפסה משוכפלת בשני הענפים, והקורא צריך להשוות ביניהם כדי לגלות מה שונה."

- id: cs.clean-code.dry.013
  type: single
  difficulty: 1
  prompt: מה השינוי הטוב ביותר לקוד?
  code: |
    Console.WriteLine("==========");
    Console.WriteLine("Sales");
    Console.WriteLine("==========");
    Console.WriteLine("Total: 1200");
    Console.WriteLine("==========");
    Console.WriteLine("Refunds");
    Console.WriteLine("==========");
    Console.WriteLine("Total: 300");
  options:
    - "להוסיף הערה מעל כל כותרת"
    - "לחלץ מתודה (Extract Method) בשם PrintHeader(string title) ולקרוא לה פעמיים"
    - "ליצור מחלקה נפרדת לכל כותרת: SalesHeader ו-RefundsHeader"
    - "להשאיר את הקוד כמו שהוא, כי שורות הדפסה לא נחשבות שכפול"
  answer: 1
  explanation: "שלוש השורות של הכותרת חוזרות, וההבדל היחיד הוא הטקסט. מתודה עם פרמטר לחלק המשתנה מגדירה את עיצוב הכותרת פעם אחת, וכל קריאה אומרת מה היא עושה: `PrintHeader(\"Sales\")`."
  optionExplanations:
    "0": "הערות לא מסירות את השכפול; שינוי העיצוב עדיין יחייב לעדכן כמה מקומות."
    "2": "מחלקה לכל כותרת מכפילה את הקוד במקום לצמצם אותו."
    "3": "עיצוב הכותרת הוא ידע שמשוכפל; אם ירצו לשנות את קו ההפרדה, צריך לשנות ארבע שורות."

- id: cs.clean-code.dry.014
  type: single
  difficulty: 2
  prompt: שיעור המע״מ משתנה מ-18% ל-17%. כמה מספרים בקוד צריך לשנות?
  code: |
    class Invoice
    {
        public decimal Net { get; set; }

        public decimal Vat() => Net * 0.18m;
        public decimal Gross() => Net * 1.18m;
        public string Summary() => $"VAT: {Net * 0.18m}, Gross: {Net + Net * 0.18m}";
    }
  options:
    - "1"
    - "2"
    - "3"
    - "4"
  answer: 3
  explanation: "אותו ידע מופיע ארבע פעמים: שלוש פעמים `0.18m` ופעם אחת בצורה אחרת, `1.18m`, שקל לפספס בחיפוש. עם קבוע אחד `VatRate`, ועם `Gross() => Net + Vat()` ו-`Summary` שמשתמשת ב-`Vat()` וב-`Gross()`, השינוי הוא במקום אחד."
  optionExplanations:
    "0": "זה המצב הרצוי, אבל כאן השיעור לא מוגדר במקום אחד."
    "1": "יש יותר מופעים: גם ב-`Summary`, ושם השיעור מופיע פעמיים."
    "2": "קל לפספס את `1.18m` ב-`Gross`, שהוא אותו שיעור בצורה אחרת."

- id: cs.clean-code.dry.015
  type: single
  difficulty: 3
  prompt: האם יש כאן הפרה של DRY?
  code: |
    class UserForm
    {
        public bool IsValid(string userName) => userName.Length <= 20;

        public string Hint() => "Up to 20 characters";
    }
  options:
    - "לא, כי אין בקוד שתי שורות זהות"
    - "כן: שתי המתודות משתמשות ב-=>, וזה שכפול תחבירי"
    - "לא, כי אחד המופעים נמצא בתוך מחרוזת, ומחרוזות לא נחשבות קוד"
    - "כן: הידע «אורך מקסימלי 20» מופיע פעמיים, ואם ישנו אותו במקום אחד ההודעה תשקר"
  answer: 3
  explanation: "שכפול של ידע לא חייב להיראות כמו שורות זהות. אם הכלל ישתנה ל-30 רק ב-`IsValid`, המשתמש יראה הודעה שגויה. קבוע אחד `MaxUserNameLength`, שמשמש גם בבדיקה וגם בהודעה (`$\"Up to {MaxUserNameLength} characters\"`), פותר את זה."
  optionExplanations:
    "0": "DRY עוסק בידע, לא בטקסט זהה; כאן אותו מספר מופיע בשני מקומות."
    "1": "תחביר משותף הוא לא ידע; אין סיבה להימנע משימוש ב-`=>`."
    "2": "המספר בתוך ההודעה הוא אותו כלל עסקי, ולכן הוא חלק מהשכפול."

- id: cs.clean-code.dry.016
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להעתיק את כתובת המשלוח לכתובת החיוב ולהדפיס `Haifa 3100000`. באיזו שורה הבאג?"
  code: |
