    - "להשאיר שתי מתודות נפרדות, כל אחת עם קבועים משלה, כי זה דמיון מקרי ולא אותו ידע"
    - "לאחד אותן למתודה אחת עם פרמטר bool isProduct"
    - "למחוק את אחת המתודות, כי קוד כפול הוא תמיד באג"
