- id: cs.clean-code.dry.014
  type: single
  difficulty: 2
  prompt: שיעור המע״מ משתנה מ-18% ל-17%. כמה מספרים בקוד צריך לשנות?
  code: |
    class Invoice
    {
        private double net;

        public Invoice(double net)
        {
            this.net = net;
        }

        public double Vat()
        {
            return net * 0.18;
        }

        public double Gross()
        {
            return net * 1.18;
        }

        public string Summary()
        {
            return $"VAT: {net * 0.18}, Gross: {net + net * 0.18}";
        }
    }
  options:
    - "1"
    - "2"
    - "3"
    - "4"
  answer: 3
  explanation: "אותו ידע מופיע ארבע פעמים: שלוש פעמים `0.18` ופעם אחת בצורה אחרת, `1.18`, שקל לפספס בחיפוש. עם קבוע אחד `VatRate`, עם `Gross` שמחזירה `net + Vat()`, ועם `Summary` שמשתמשת ב-`Vat()` וב-`Gross()`, השינוי הוא במקום אחד."
  optionExplanations:
    "0": "זה המצב הרצוי, אבל כאן השיעור לא מוגדר במקום אחד."
    "1": "יש יותר מופעים: גם ב-`Summary`, ושם השיעור מופיע פעמיים."
    "2": "קל לפספס את `1.18` ב-`Gross`, שהוא אותו שיעור בצורה אחרת."

