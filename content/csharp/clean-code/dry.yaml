- id: cs.clean-code.dry.006
  type: cleaner
  difficulty: 3
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      class Notifier
      {
          public string WelcomeMessage(string name)
          {
              return $"Welcome, {name}!";
          }

          public string GoodbyeMessage(string name)
          {
              return $"Goodbye, {name}.";
          }
      }
    - |
      class Notifier
      {
          public string WelcomeMessage(string name)
          {
              return BuildMessage(name, true);
          }

          public string GoodbyeMessage(string name)
          {
              return BuildMessage(name, false);
          }

          private static string BuildMessage(string name, bool isWelcome)
          {
              string greeting = "Goodbye";
              string ending = ".";
              if (isWelcome)
              {
                  greeting = "Welcome";
                  ending = "!";
              }
              return $"{greeting}, {name}{ending}";
          }
      }
  answer: 0
  explanation: "שתי ההודעות דומות במבנה, אבל הן לא אותו ידע. ההפשטה בגרסה השנייה ארוכה יותר, מסתמכת על דגל בוליאני, ומקשה לראות מה כל הודעה אומרת. זו הפשטה מוקדמת (Premature Abstraction): שכפול קטן וברור עדיף עליה."
  optionExplanations:
    "1": "ההפשטה לא חוסכת שינויים עתידיים, רק מסבכת: כל הודעה חדשה תדרוש עוד דגל או עוד תנאי."

- id: cs.clean-code.dry.007
  type: smell
  difficulty: 2
  prompt: איזה ריח קוד בולט כאן?
  code: |
    class InvoiceService
    {
        private const double VatRate = 0.18;

        public void Print(double subtotal, double discount)
        {
            double total = (subtotal - discount) * (1 + VatRate);
            Console.WriteLine($"Total: {total}");
        }

        public void Email(double subtotal, double discount, string address)
        {
            double total = (subtotal - discount) * (1 + VatRate);
            Console.WriteLine($"To {address}: total {total}");
        }
    }
  options:
    - "קנאת תכונות - Feature Envy"
    - "שכפול קוד - Duplicated Code"
    - "מספר קסם - Magic Number"
    - "מתודה ארוכה - Long Method"
  answer: 1
  explanation: "החישוב של סך החשבונית מופיע פעמיים. זה אותו ידע עסקי: אם ישנו את סדר ההנחה והמע״מ במקום אחד בלבד, החשבונית המודפסת והחשבונית במייל יציגו סכומים שונים. חלצו `CalculateTotal(subtotal, discount)` ששתי המתודות משתמשות בה."
  optionExplanations:
    "0": "המתודות עובדות על הפרמטרים שלהן ועל קבוע של המחלקה, לא על נתונים של מחלקה אחרת."
    "2": "שיעור המע״מ מוגדר כקבוע עם שם."
    "3": "כל מתודה היא שתי שורות."

