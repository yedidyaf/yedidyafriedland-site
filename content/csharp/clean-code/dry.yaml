  explanation: "שכפול של ידע לא חייב להיראות כמו שורות זהות. אם הכלל ישתנה ל-30 רק ב-`IsValid`, המשתמש יראה הודעה שגויה. קבוע אחד `MaxUserNameLength`, שמשמש גם בבדיקה וגם בהודעה (`$\"Up to {MaxUserNameLength} characters\"`), פותר את זה."
  optionExplanations:
    "0": "DRY עוסק בידע, לא בטקסט זהה; כאן אותו מספר מופיע בשני מקומות."
    "1": "תחביר משותף הוא לא ידע; אין סיבה להימנע מ-`public`."
    "2": "המספר בתוך ההודעה הוא אותו כלל עסקי, ולכן הוא חלק מהשכפול."

