- id: cs.clean-code.dry.001
  type: smell
  difficulty: 1
  prompt: איזה ריח קוד בולט כאן?
  code: |
    class PriceCalculator
    {
        private const double StudentDiscount = 0.2;
        private const double SeniorDiscount = 0.3;

        public double StudentPrice(double price)
        {
            if (price < 0)
                return 0;
            return price * (1 - StudentDiscount);
        }

        public double SeniorPrice(double price)
        {
            if (price < 0)
                return 0;
            return price * (1 - SeniorDiscount);
        }
    }
  options:
    - "מספר קסם - Magic Number"
    - "מחלקת אל - God Class"
    - "שכפול קוד - Duplicated Code"
    - "רשימת פרמטרים ארוכה - Long Parameter List"
  answer: 2
  explanation: "שתי המתודות זהות חוץ משיעור ההנחה. כל שינוי בבדיקה או בנוסחה יצטרך להיעשות פעמיים. חלצו מתודה משותפת (Extract Method), למשל `ApplyDiscount(double price, double rate)`, ושתי המתודות יקראו לה."
  optionExplanations:
    "0": "שיעורי ההנחה כבר מוגדרים כקבועים עם שם."
    "1": "המחלקה קטנה ועוסקת בנושא אחד: חישוב מחירים."
    "3": "לכל מתודה יש פרמטר אחד."

- id: cs.clean-code.dry.002
  type: cleaner
  difficulty: 1
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      class AccountService
      {
          public void Register(string email)
          {
              if (email.Length < 5 || !email.Contains("@"))
              {
                  Console.WriteLine("Invalid email");
                  return;
              }
              Console.WriteLine($"Registered {email}");
          }

          public void ChangeEmail(string email)
          {
              if (email.Length < 5 || !email.Contains("@"))
              {
                  Console.WriteLine("Invalid email");
                  return;
              }
              Console.WriteLine($"Changed to {email}");
          }
      }
    - |
      class AccountService
      {
          public void Register(string email)
          {
              if (!IsValidEmail(email))
              {
                  Console.WriteLine("Invalid email");
                  return;
              }
              Console.WriteLine($"Registered {email}");
          }

          public void ChangeEmail(string email)
          {
              if (!IsValidEmail(email))
              {
                  Console.WriteLine("Invalid email");
                  return;
              }
              Console.WriteLine($"Changed to {email}");
          }

          private static bool IsValidEmail(string email)
          {
              return email.Length >= 5 && email.Contains("@");
          }
      }
  answer: 1
  explanation: "הכלל «מהי כתובת מייל תקינה» הוא ידע אחד, ולכן צריך לגור במקום אחד. כשיחמירו את הבדיקה, ישנו רק את `IsValidEmail`, ואין סכנה ששתי המתודות יבדקו דברים שונים."
  optionExplanations:
    "0": "הבדיקה משוכפלת; שינוי עתידי יחייב לזכור לעדכן שני מקומות."

