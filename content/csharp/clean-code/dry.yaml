- id: cs.clean-code.dry.001
  type: smell
  difficulty: 1
  prompt: איזה ריח קוד בולט כאן?
  code: |
    class PriceCalculator
    {
        private const decimal StudentDiscount = 0.2m;
        private const decimal SeniorDiscount = 0.3m;

        public decimal StudentPrice(decimal price)
        {
            if (price < 0)
                throw new ArgumentOutOfRangeException(nameof(price));
            return price * (1 - StudentDiscount);
        }

        public decimal SeniorPrice(decimal price)
        {
            if (price < 0)
                throw new ArgumentOutOfRangeException(nameof(price));
            return price * (1 - SeniorDiscount);
        }
    }
  options:
    - "מספר קסם - Magic Number"
    - "מחלקת אל - God Class"
    - "שכפול קוד - Duplicated Code"
    - "רשימת פרמטרים ארוכה - Long Parameter List"
  answer: 2
  explanation: "שתי המתודות זהות חוץ משיעור ההנחה. כל שינוי בבדיקה או בנוסחה יצטרך להיעשות פעמיים. חלצו מתודה משותפת (Extract Method), למשל `ApplyDiscount(decimal price, decimal rate)`, ושתי המתודות יקראו לה."
  optionExplanations:
    "0": "שיעורי ההנחה כבר מוגדרים כקבועים עם שם."
    "1": "המחלקה קטנה ועוסקת בנושא אחד: חישוב מחירים."
    "3": "לכל מתודה יש פרמטר אחד."

- id: cs.clean-code.dry.002
  type: cleaner
  difficulty: 1
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      class AccountService
      {
          public void Register(string email)
          {
              if (string.IsNullOrWhiteSpace(email) || !email.Contains('@'))
                  throw new ArgumentException("Invalid email.", nameof(email));
              Console.WriteLine($"Registered {email}");
          }

          public void ChangeEmail(string email)
          {
              if (string.IsNullOrWhiteSpace(email) || !email.Contains('@'))
                  throw new ArgumentException("Invalid email.", nameof(email));
              Console.WriteLine($"Changed to {email}");
          }
      }
    - |
      class AccountService
      {
          public void Register(string email)
          {
              EnsureValidEmail(email);
              Console.WriteLine($"Registered {email}");
          }

          public void ChangeEmail(string email)
          {
              EnsureValidEmail(email);
              Console.WriteLine($"Changed to {email}");
          }

          private static void EnsureValidEmail(string email)
          {
              if (string.IsNullOrWhiteSpace(email) || !email.Contains('@'))
                  throw new ArgumentException("Invalid email.", nameof(email));
          }
      }
  answer: 1
  explanation: "הכלל «מהי כתובת מייל תקינה» הוא ידע אחד, ולכן צריך לגור במקום אחד. כשיחמירו את הבדיקה, ישנו רק את `EnsureValidEmail`, ואין סכנה ששתי המתודות יבדקו דברים שונים."
  optionExplanations:
    "0": "הבדיקה משוכפלת; שינוי עתידי יחייב לזכור לעדכן שני מקומות."

- id: cs.clean-code.dry.003
  type: bug
  difficulty: 2
  prompt: הקוד אמור להדפיס את הממוצע של כל מקצוע. באיזו שורה הבאג?
  code: |
    int[] mathGrades = { 90, 80 };
    int[] englishGrades = { 70, 100, 85 };
    Console.WriteLine($"Math: {mathGrades.Sum() / (double)mathGrades.Length}");
    Console.WriteLine($"English: {englishGrades.Sum() / (double)mathGrades.Length}");
  answer: 4
  fixed: |
    int[] mathGrades = { 90, 80 };
    int[] englishGrades = { 70, 100, 85 };
    Console.WriteLine($"Math: {mathGrades.Sum() / (double)mathGrades.Length}");
    Console.WriteLine($"English: {englishGrades.Sum() / (double)englishGrades.Length}");
  explanation: "השורה הועתקה מהשורה הקודמת, ורק חלק מהשמות עודכן: הסכום של אנגלית מחולק במספר הציונים במתמטיקה. זה באג קלאסי של העתק-הדבק. כשהחישוב כתוב פעם אחת, למשל עם `grades.Average()` או מתודה `Average(int[] grades)`, אין מה לשכוח לעדכן."

- id: cs.clean-code.dry.004
  type: single
  difficulty: 3
  prompt: שם משתמש וקוד מוצר הם דרישות של שני צוותים שונים, וכל אחת מהן עשויה להשתנות בנפרד. מה כדאי לעשות עם הדמיון בין המתודות?
  code: |
    class Validation
    {
        public bool IsValidUserName(string userName) =>
            userName.Length >= 3 && userName.Length <= 20;

        public bool IsValidProductCode(string code) =>
            code.Length >= 3 && code.Length <= 20;
    }
  options:
    - "לאחד אותן למתודה אחת IsValidLength ולקרוא לה משני המקומות"
    - "להשאיר שתי מתודות נפרדות, כל אחת עם קבועים משלה, כי זה דמיון מקרי ולא אותו ידע"
    - "לאחד אותן למתודה אחת עם פרמטר bool isProduct"
    - "למחוק את אחת המתודות, כי קוד כפול הוא תמיד באג"
  answer: 1
  explanation: "DRY עוסק בידע, לא בקוד שנראה דומה. אלה שני כללים עסקיים שבמקרה זהים היום. איחוד שלהם יוצר צימוד: כשצוות אחד ירצה 30 תווים, המתודה המשותפת תתחיל לקבל דגלים ותנאים. שכפול קטן עדיף על הפשטה מוקדמת (Premature Abstraction)."
  optionExplanations:
    "0": "האיחוד קושר שני כללים שמשתנים מסיבות שונות; ביום שאחד ישתנה, צריך יהיה לפרק אותו שוב."
    "2": "דגל בוליאני שבוחר בין שני כללים הוא סימן שהם לא באמת אותו דבר."
    "3": "שתי המתודות נחוצות; קוד שנראה דומה הוא לא בהכרח באג או שכפול של ידע."

- id: cs.clean-code.dry.005
  type: cleaner
  difficulty: 2
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      Console.WriteLine("{0,-10}|{1,5}", "Apples", 3);
      Console.WriteLine("{0,-10}|{1,5}", "Bananas", 12);
      Console.WriteLine("{0,-10}|{1,5}", "Cherries", 40);
    - |
      PrintRow("Apples", 3);
      PrintRow("Bananas", 12);
      PrintRow("Cherries", 40);

      static void PrintRow(string product, int quantity) =>
          Console.WriteLine("{0,-10}|{1,5}", product, quantity);
  answer: 1
  explanation: "פורמט השורה הוא ידע אחד: רוחב העמודות והמפריד. כשהוא כתוב במתודה אחת עם שם, שינוי רוחב עמודה נעשה במקום אחד, והקריאות אומרות מה הן עושות: `PrintRow`."
  optionExplanations:
    "0": "מחרוזת הפורמט משוכפלת שלוש פעמים; שינוי שלה מחייב לעדכן כל שורה ולא לפספס אף אחת."

- id: cs.clean-code.dry.006
  type: cleaner
  difficulty: 3
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      class Notifier
      {
          public string WelcomeMessage(string name) => $"Welcome, {name}!";
          public string GoodbyeMessage(string name) => $"Goodbye, {name}.";
      }
    - |
      class Notifier
      {
          public string WelcomeMessage(string name) => BuildMessage(name, true);
          public string GoodbyeMessage(string name) => BuildMessage(name, false);

          private static string BuildMessage(string name, bool isWelcome)
          {
              string greeting = isWelcome ? "Welcome" : "Goodbye";
              string ending = isWelcome ? "!" : ".";
              return $"{greeting}, {name}{ending}";
          }
      }
  answer: 0
  explanation: "שתי ההודעות דומות במבנה, אבל הן לא אותו ידע. ההפשטה בגרסה השנייה ארוכה יותר, מסתמכת על דגל בוליאני, ומקשה לראות מה כל הודעה אומרת. זו הפשטה מוקדמת (Premature Abstraction): שכפול קטן וברור עדיף עליה."
  optionExplanations:
    "1": "ההפשטה לא חוסכת שינויים עתידיים, רק מסבכת: כל הודעה חדשה תדרוש עוד דגל או עוד תנאי."

- id: cs.clean-code.dry.007
  type: smell
  difficulty: 2
  prompt: איזה ריח קוד בולט כאן?
  code: |
    class InvoiceService
    {
        private const decimal VatRate = 0.18m;

        public void Print(decimal subtotal, decimal discount)
        {
            decimal total = (subtotal - discount) * (1 + VatRate);
            Console.WriteLine($"Total: {total:F2}");
        }

        public void Email(decimal subtotal, decimal discount, string address)
        {
            decimal total = (subtotal - discount) * (1 + VatRate);
            Console.WriteLine($"To {address}: total {total:F2}");
        }
    }
  options:
    - "קנאת תכונות - Feature Envy"
    - "שכפול קוד - Duplicated Code"
    - "מספר קסם - Magic Number"
    - "מתודה ארוכה - Long Method"
  answer: 1
  explanation: "החישוב של סך החשבונית מופיע פעמיים. זה אותו ידע עסקי: אם ישנו את סדר ההנחה והמע״מ במקום אחד בלבד, החשבונית המודפסת והחשבונית במייל יציגו סכומים שונים. חלצו `CalculateTotal(subtotal, discount)` ששתי המתודות משתמשות בה."
  optionExplanations:
    "0": "המתודות עובדות על הפרמטרים שלהן ועל קבוע של המחלקה, לא על נתונים של מחלקה אחרת."
    "2": "שיעור המע״מ מוגדר כקבוע עם שם."
    "3": "כל מתודה היא שתי שורות."

- id: cs.clean-code.dry.008
  type: single
  difficulty: 1
  prompt: "מה המשמעות של העיקרון DRY (Don't Repeat Yourself)?"
  options:
    - "אסור ששתי שורות בקוד ייראו זהות"
    - "כל מתודה צריכה להיקרא ממקום אחד בלבד"
    - "לכל פיסת ידע במערכת צריך להיות ייצוג אחד, ברור ומוסמך"
    - "צריך לכתוב כמה שפחות הערות בקוד"
  answer: 2
  explanation: "DRY עוסק בידע: כלל עסקי, נוסחה, פורמט או ערך קבוע צריכים להיות מוגדרים במקום אחד. כך שינוי נעשה פעם אחת, ואין סכנה ששני עותקים יתחילו לסתור זה את זה."
  optionExplanations:
    "0": "שתי שורות יכולות להיראות זהות במקרה ולייצג דברים שונים; DRY לא דורש לאחד אותן."
    "1": "להפך: מתודה שנקראת מכמה מקומות היא בדיוק הדרך להימנע משכפול."
    "3": "DRY לא עוסק בהערות."

- id: cs.clean-code.dry.009
  type: cleaner
  difficulty: 2
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      class Product
      {
          public string Name { get; }
          public decimal Price { get; }
          public int Stock { get; }

          public Product(string name, decimal price)
          {
              Name = name;
              Price = price;
              Stock = 0;
          }

          public Product(string name, decimal price, int stock)
          {
              Name = name;
              Price = price;
              Stock = stock;
