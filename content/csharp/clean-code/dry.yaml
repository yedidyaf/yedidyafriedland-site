  answer: 4
  fixed: |
    var shipping = new Address { City = "Haifa", ZipCode = "3100000" };
    var billing = new Address();
    billing.City = shipping.City;
    billing.ZipCode = shipping.ZipCode;
    Console.WriteLine($"{billing.City} {billing.ZipCode}");

    class Address
    {
        public string City { get; set; }
        public string ZipCode { get; set; }
    }
  explanation: "השורה הועתקה מהשורה הקודמת ורק חלק ממנה עודכן, ולכן `billing.ZipCode` מקבל את עצמו (`null`). העתקה ידנית של שדה אחרי שדה חוזרת על אותו דפוס ומזמינה באגים כאלה; מתודה אחת כמו `CopyFrom(Address other)`, או `record` עם `with`, כותבת את ההעתקה פעם אחת."
