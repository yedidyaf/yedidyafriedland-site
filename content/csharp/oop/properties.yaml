    p.Price = -5;
    Console.WriteLine(p.Price);

    class Product
    {
        private decimal price;

        public decimal Price
        {
            get => price;
            set
            {
                if (price < 0)
                    throw new ArgumentException("Price cannot be negative");
                price = value;
            }
        }
    }
  answer: 14
  fixed: |
    var p = new Product();
    p.Price = -5;
    Console.WriteLine(p.Price);

    class Product
    {
        private decimal price;

        public decimal Price
        {
            get => price;
            set
            {
                if (value < 0)
