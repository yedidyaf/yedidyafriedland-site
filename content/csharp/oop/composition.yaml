- id: cs.oop.composition.017
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    Bike bike = new Bike(26, 24);
    Console.WriteLine(bike.TotalSize());

    class Wheel
    {
        private int size;

        public Wheel(int size)
        {
            this.size = size;
        }

        public int GetSize()
        {
            return size;
        }
    }

    class Bike
    {
        private Wheel front;
        private Wheel back;

        public Bike(int frontSize, int backSize)
        {
            front = new Wheel(frontSize);
            back = new Wheel(backSize);
        }

        public int TotalSize()
        {
            return front.GetSize() + back.GetSize();
        }
    }
  options: ["50", "26", "2624", "NullReferenceException"]
  answer: 0
  explanation: "לאופניים יש שני גלגלים, כל אחד עצם נפרד של `Wheel`. הבנאי של `Bike` יוצר אותם, ו-`TotalSize` שואלת כל גלגל על הגודל שלו ומחברת: `26 + 24 = 50`."
  optionExplanations:
    "1": "יש שני גלגלים, וכל אחד שומר גודל משלו."
    "2": "`GetSize` מחזירה `int`, ולכן `+` מחבר ולא משרשר."
    "3": "הבנאי יוצר את שני הגלגלים לפני שקוראים ל-`TotalSize`."

- id: cs.oop.composition.018
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    Classroom room = new Classroom(3);
    room.Add(new Student(90));
    room.Add(new Student(80));
    Console.WriteLine(room.Average());

    class Student
    {
        private int grade;

        public Student(int grade)
        {
            this.grade = grade;
        }

        public int GetGrade()
        {
            return grade;
        }
    }

    class Classroom
    {
        private Student[] students;
        private int count;

        public Classroom(int size)
        {
            students = new Student[size];
            count = 0;
        }

        public void Add(Student s)
        {
            students[count] = s;
            count++;
        }

        public double Average()
        {
            int sum = 0;
            for (int i = 0; i < count; i++)
                sum += students[i].GetGrade();
            return (double)sum / count;
        }
    }
  options: ["85", "56.666666666666664", "NullReferenceException", "170"]
  answer: 0
  explanation: "הכיתה מחזיקה מערך של תלמידים ומונה `count` של התאים המלאים. הלולאה עוברת רק עד `count`, ולכן התא השלישי, שעדיין `null`, לא נגע. הממוצע הוא `170 / 2 = 85`."
  optionExplanations:
    "1": "זה היה הממוצע אם מחלקים ב-3, גודל המערך. החלוקה היא ב-`count`, מספר התלמידים שנוספו."
    "2": "הלולאה רצה עד `count` ולא עד `students.Length`, ולכן לא ניגשת לתא הריק."
    "3": "170 הוא הסכום. הפעולה מחזירה את הממוצע."

- id: cs.oop.composition.019
  type: truefalse
  difficulty: 1
