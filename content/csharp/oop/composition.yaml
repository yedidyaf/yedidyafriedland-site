- id: cs.oop.composition.013
  type: smell
  difficulty: 2
  prompt: איזה ריח קוד בולט כאן?
  code: |
    class Bird
    {
        public virtual void Eat()
        {
            Console.WriteLine("Eating");
        }

        public virtual void Fly()
        {
            Console.WriteLine("Flying");
        }
    }

    class Penguin : Bird
    {
        public override void Fly()
        {
            Console.WriteLine("Error: penguins can't fly");
        }
    }
  options:
    - "ירושה שנדחית - Refused Bequest"
    - "מספר קסם - Magic Number"
    - "קוד מת - Dead Code"
    - "שם לא ברור - Unclear Name"
  answer: 0
  explanation: "`Penguin` יורשת יכולת שהיא לא רוצה, ודוחה אותה בהדפסת שגיאה. קוד שעובד עם `Bird` ויקרא ל-`Fly` ייכשל דווקא עם פינגווין. התיקון: להוציא את התעופה מ-`Bird` למחלקה נפרדת, למשל `FlyingBird : Bird`, שרק ציפורים מעופפות יורשות ממנה."
  optionExplanations:
    "1": "אין בקוד מספרים ללא שם."
    "2": "כל המתודות נקראות או נדרסות. הבעיה היא ירושה של התנהגות שלא מתאימה."
    "3": "השמות ברורים. הבעיה בהיררכיה, לא בשמות."

- id: cs.oop.composition.015
  type: bug
  difficulty: 3
  prompt: "הקוד אמור להדפיס `Order A-17 placed`, אבל נזרקת `NullReferenceException`. איזו שורה צריך לתקן?"
  code: |
    ConsoleLogger logger = new ConsoleLogger();
    OrderService service = new OrderService(logger);
    service.Place("A-17");

    class ConsoleLogger
    {
        public void Log(string message)
        {
            Console.WriteLine(message);
        }
    }

    class OrderService
    {
        private ConsoleLogger logger;

        public OrderService(ConsoleLogger logger)
        {
            logger = this.logger;
        }

        public void Place(string id)
        {
            logger.Log($"Order {id} placed");
        }
    }
  answer: 19
  fixed: |
    ConsoleLogger logger = new ConsoleLogger();
    OrderService service = new OrderService(logger);
    service.Place("A-17");

    class ConsoleLogger
    {
        public void Log(string message)
        {
            Console.WriteLine(message);
        }
    }

    class OrderService
    {
        private ConsoleLogger logger;

        public OrderService(ConsoleLogger logger)
        {
            this.logger = logger;
        }

        public void Place(string id)
        {
            logger.Log($"Order {id} placed");
        }
    }
  explanation: "ההשמה הפוכה: `logger = this.logger` מציבה בפרמטר את ערך השדה, שהוא עדיין `null`. השדה לא מקבל את הרכיב, ו-`Place` קוראת ל-`Log` על `null`. ברכיב שמגיע דרך הבנאי, השדה תמיד בצד שמאל: `this.logger = logger`."

