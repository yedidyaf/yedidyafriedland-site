- id: cs.oop.inheritance.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    var dog = new Dog();
    dog.Eat();
    dog.Bark();

    class Animal
    {
        public void Eat() => Console.WriteLine("Eating");
    }

    class Dog : Animal
    {
        public void Bark() => Console.WriteLine("Woof");
    }
  options: ["Eating\nWoof", "Woof", "Woof\nEating", "שגיאת קומפילציה"]
  answer: 0
  explanation: "`Dog : Animal` אומר ש-`Dog` יורשת (Inheritance) מ-`Animal`. מחלקה יורשת (Derived Class) מקבלת את החברים הציבוריים של מחלקת הבסיס (Base Class), ולכן `dog.Eat()` עובד כאילו `Eat` הוגדרה ב-`Dog`. הסדר בפלט הוא סדר הקריאות."
  optionExplanations:
    "1": "`Eat` עוברת בירושה ל-`Dog`, ולכן הקריאה לה מדפיסה `Eating`."
    "2": "הפלט נקבע לפי סדר הקריאות בקוד, לא לפי סדר ההגדרות במחלקות."
    "3": "אין צורך להגדיר את `Eat` מחדש ב-`Dog`. היא נורשת מ-`Animal`."

- id: cs.oop.inheritance.002
  type: single
  difficulty: 1
  prompt: "מכמה מחלקות בסיס יכולה מחלקה ב-C# לרשת ישירות?"
  options:
    - "ממחלקה אחת בלבד, אבל היא יכולה לממש כמה ממשקים"
    - "מכמה מחלקות שרוצים, מופרדות בפסיקים"
    - "משתי מחלקות לכל היותר"
    - "מאף מחלקה; ב-C# יורשים רק מממשקים"
  answer: 0
  explanation: "C# תומכת בירושה יחידה (Single Inheritance) של מחלקות: `class B : A`. אפשר להוסיף אחרי מחלקת הבסיס כמה ממשקים שרוצים: `class B : A, IX, IY`. כשצריך יכולות מכמה מקורות, משתמשים בממשקים או בהרכבה."
  optionExplanations:
    "1": "`class Duck : Flyer, Swimmer` כששתיהן מחלקות הוא שגיאת קומפילציה. ירושה מרובה של מחלקות קיימת ב-C++, לא ב-C#."
    "2": "אין ב-C# מגבלה של שתיים. המגבלה היא מחלקת בסיס אחת."
    "3": "ירושה ממחלקה היא חלק בסיסי של C#, וכל מחלקה יורשת לפחות מ-`object`."

- id: cs.oop.inheritance.003
  type: single
  difficulty: 1
  prompt: "מאילו מקומות מותר לגשת לשדה `balance`?"
  code: |
    class BankAccount
    {
        protected decimal balance;
    }

    class SavingsAccount : BankAccount
    {
        public void AddInterest() => balance *= 1.02m;
    }

    class Report
    {
    }
  options:
    - "מתוך `BankAccount` ומתוך מחלקות שיורשות ממנה, כמו `SavingsAccount`"
    - "מכל מקום בתוכנית, כולל `Report`, כי הוא לא `private`"
    - "רק מתוך `BankAccount` עצמה"
    - "מכל מחלקה באותו פרויקט, כולל `Report`"
  answer: 0
  explanation: "`protected` נמצא בין `private` ל-`public`: המחלקה עצמה ומחלקות שיורשות ממנה רואות את החבר, אבל קוד חיצוני כמו `Report` לא. כך מחלקה יורשת יכולה להשתמש במצב הפנימי בלי לחשוף אותו לכולם."
  optionExplanations:
    "1": "\"לא `private`\" לא אומר `public`. `protected` חוסם גישה מקוד שלא יורש מהמחלקה."
    "2": "כך מתנהג `private`. עם `protected` גם `SavingsAccount` רשאית לגשת."
    "3": "גישה לכל הפרויקט היא `internal`, לא `protected`."

- id: cs.oop.inheritance.004
  type: hierarchy
  difficulty: 1
  prompt: לכל זוג מחלקות, בחרו את סוג היחס הנכון ביניהן.
  targets:
    - id: is-a
      desc: ירושה - Inheritance
    - id: has-a
      desc: הרכבה - Composition
  items:
    - label: "Manager ו-Employee"
      answer: is-a
      why: מנהל הוא סוג של עובד, ולכן Manager יכולה לרשת מ-Employee.
    - label: "Employee ו-Address"
      answer: has-a
      why: לעובד יש כתובת. כתובת היא לא סוג של עובד.
    - label: "Truck ו-Vehicle"
      answer: is-a
      why: משאית היא סוג של כלי רכב.
    - label: "Order ו-OrderLine"
      answer: has-a
      why: הזמנה מכילה שורות הזמנה.
    - label: "Square ו-Shape"
      answer: is-a
      why: ריבוע הוא סוג של צורה.
  explanation: "ירושה מתאימה כשמשפט «X הוא סוג של Y» נכון (is-a). כשנכון לומר «ל-X יש Y», ה-Y צריך להיות שדה בתוך X (has-a), לא מחלקת בסיס."

- id: cs.oop.inheritance.005
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    Dog d = new Dog();
    Animal a = d;
    Console.WriteLine(a is Dog);
    Console.WriteLine(d is Animal);
    Console.WriteLine(new Animal() is Dog);

    class Animal { }

    class Dog : Animal { }
  options: ["True\nTrue\nFalse", "False\nTrue\nFalse", "True\nTrue\nTrue", "True\nFalse\nFalse"]
  answer: 0
  explanation: "`is` בודק את הטיפוס של האובייקט בזמן ריצה. `a` מצביע על אובייקט `Dog`, ולכן `a is Dog` אמת. כל `Dog` הוא גם `Animal` (is-a), אבל `Animal` רגיל הוא לא `Dog`: הירושה עובדת בכיוון אחד בלבד."
  optionExplanations:
    "1": "טיפוס המשתנה `Animal` לא משנה את האובייקט עצמו, שנשאר `Dog`."
    "2": "כל כלב הוא חיה, אבל לא כל חיה היא כלב. אובייקט שנוצר כ-`Animal` אינו `Dog`."
    "3": "`Dog` יורשת מ-`Animal`, ולכן כל `Dog` הוא גם `Animal`."

- id: cs.oop.inheritance.006
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    new SportsCar();

    class Vehicle
    {
        public Vehicle() => Console.WriteLine("Vehicle");
    }

    class Car : Vehicle
    {
        public Car() => Console.WriteLine("Car");
    }

    class SportsCar : Car
    {
        public SportsCar() => Console.WriteLine("SportsCar");
    }
  options: ["Vehicle\nCar\nSportsCar", "SportsCar\nCar\nVehicle", "SportsCar", "Car\nSportsCar"]
  answer: 0
  explanation: "לפני שגוף הבנאי של מחלקה רץ, רץ הבנאי של מחלקת הבסיס שלה. לכן הבנאים רצים מלמעלה למטה: קודם `Vehicle`, אחר כך `Car`, ובסוף `SportsCar`. החלק הבסיסי של האובייקט נבנה לפני החלק שמרחיב אותו."
  optionExplanations:
    "1": "זה הסדר שבו הבנאים נקראים, אבל הגוף של כל בנאי רץ רק אחרי שהבנאי של הבסיס שלו הסתיים."
    "2": "גם בלי `: base()` מפורש, הבנאי בלי הפרמטרים של מחלקת הבסיס נקרא אוטומטית."
    "3": "הקריאה האוטומטית לבנאי הבסיס ממשיכה עד ראש ההיררכיה, כולל `Vehicle`."

- id: cs.oop.inheritance.007
  type: output
  difficulty: 2
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    var m = new Manager("Rina", 3);
    Console.WriteLine(m.Name);

    class Employee
    {
        public string Name { get; }

        public Employee(string name) => Name = name;
    }

    class Manager : Employee
    {
        public int TeamSize { get; }

        public Manager(string name, int teamSize) => TeamSize = teamSize;
    }
  options: ["Rina", "שגיאת קומפילציה", "null", "שגיאה בזמן ריצה"]
  answer: 1
  explanation: "בנאי של `Manager` בלי `: base(...)` מנסה לקרוא לבנאי בלי פרמטרים של `Employee`, אבל אין כזה: יש רק `Employee(string name)`. לכן זו שגיאת קומפילציה. התיקון: `public Manager(string name, int teamSize) : base(name)`."
  optionExplanations:
    "0": "הפרמטר `name` של `Manager` לא מועבר ל-`Employee` מעצמו. צריך להעביר אותו במפורש עם `base(name)`."
    "2": "הקוד לא מגיע לריצה, כי לא קיים בנאי בסיס שאפשר לקרוא לו בלי ארגומנטים."

- id: cs.oop.inheritance.008
  type: single
  difficulty: 2
  prompt: "מה התפקיד של `: base(name)` בבנאי `public Manager(string name) : base(name)`?"
  options:
    - "קורא לבנאי של מחלקת הבסיס עם `name`, לפני שגוף הבנאי של `Manager` רץ"
    - "קורא לבנאי של מחלקת הבסיס אחרי שגוף הבנאי של `Manager` מסתיים"
    - "יוצר אובייקט נפרד מטיפוס הבסיס ושומר אותו בשדה של `Manager`"
    - "מגדיר ש-`Manager` יורשת מהמחלקה ששמה `name`"
  answer: 0
  explanation: "`base(...)` בחתימת הבנאי בוחר איזה בנאי של מחלקת הבסיס יופעל ועם אילו ארגומנטים. הוא רץ ראשון, כך שהחלק הבסיסי של האובייקט מאותחל לפני הקוד של `Manager`. נוצר אובייקט אחד בלבד."
  optionExplanations:
    "1": "בנאי הבסיס רץ תמיד לפני גוף הבנאי של המחלקה היורשת, לא אחריו."
    "2": "ירושה לא יוצרת אובייקט נוסף. זה אותו אובייקט, והחלק הבסיסי שלו מאותחל על ידי בנאי הבסיס."
    "3": "מחלקת הבסיס נקבעת בהצהרת המחלקה (`class Manager : Employee`), לא בבנאי."

- id: cs.oop.inheritance.009
  type: truefalse
  difficulty: 2
  prompt: "אפשר לרשת ממחלקה שמוגדרת `sealed`, בתנאי שהמחלקה היורשת נמצאת באותו קובץ."
  answer: false
  explanation: "`sealed` (חתומה) אומר שאף מחלקה לא יכולה לרשת ממנה, בלי חריגים של קובץ או פרויקט. משתמשים בזה כשהמחלקה לא תוכננה להרחבה, כמו `string` ב-.NET. ניסיון לרשת ממנה הוא שגיאת קומפילציה."

- id: cs.oop.inheritance.010
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס `User (admin)`, אבל התוכנית קורסת עם `StackOverflowException`. איזו שורה צריך לתקן?"
  code: |
    var admin = new Admin();
    Console.WriteLine(admin.Describe());

    class User
    {
        public virtual string Describe() => "User";
    }

    class Admin : User
    {
        public override string Describe() => Describe() + " (admin)";
    }
  answer: 11
  fixed: |
    var admin = new Admin();
    Console.WriteLine(admin.Describe());

    class User
    {
        public virtual string Describe() => "User";
    }

    class Admin : User
    {
        public override string Describe() => base.Describe() + " (admin)";
    }
  explanation: "בתוך `Admin`, הקריאה `Describe()` היא `this.Describe()`, כלומר הגרסה של `Admin` עצמה, וזו רקורסיה אינסופית. כדי להפעיל את הגרסה של מחלקת הבסיס צריך `base.Describe()`."

- id: cs.oop.inheritance.011
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס 16, השטח של ריבוע שצלעו 4, אבל מדפיס 4. איזו שורה צריך לתקן?"
  code: |
    var square = new Square(4);
    Console.WriteLine(square.Area());

    class Rectangle
    {
        public int Width { get; }
        public int Height { get; }

        public Rectangle(int width, int height)
        {
            Width = width;
            Height = height;
        }

        public int Area() => Width * Height;
    }

    class Square : Rectangle
    {
        public Square(int side) : base(side, 1) { }
    }
  answer: 20
  fixed: |
    var square = new Square(4);
    Console.WriteLine(square.Area());

    class Rectangle
    {
        public int Width { get; }
        public int Height { get; }

        public Rectangle(int width, int height)
        {
            Width = width;
            Height = height;
        }

        public int Area() => Width * Height;
    }

    class Square : Rectangle
    {
        public Square(int side) : base(side, side) { }
    }
  explanation: "`Square` לא שומרת נתונים משלה: היא מעבירה את המידות לבנאי של `Rectangle` דרך `base(...)`. היא מעבירה `1` כגובה, ולכן השטח `4 * 1`. ריבוע הוא מלבן שהרוחב והגובה שלו שווים, ולכן צריך `base(side, side)`."

- id: cs.oop.inheritance.012
  type: hierarchy
  difficulty: 2
  prompt: "לפי הקוד, ממי יורשת כל מחלקה ישירות?"
  code: |
    class Shape { }
    class Polygon : Shape { }
    class Triangle : Polygon { }
    class Circle : Shape { }

    class Drawing
    {
        private List<Shape> shapes = new();
    }

    class Layer : Drawing { }
  targets:
    - id: Shape
    - id: Polygon
    - id: Drawing
    - id: "object (אין מחלקת בסיס מפורשת)"
  items:
    - label: Polygon
      answer: Shape
    - label: Triangle
      answer: Polygon
      why: Triangle יורשת ישירות מ-Polygon, ודרכה גם (בעקיפין) מ-Shape.
    - label: Circle
      answer: Shape
    - label: Drawing
      answer: "object (אין מחלקת בסיס מפורשת)"
      why: Drawing מחזיקה רשימת צורות (has-a), אבל לא יורשת מאף צורה.
    - label: Layer
      answer: Drawing
    - label: Shape
      answer: "object (אין מחלקת בסיס מפורשת)"
  explanation: "מחלקת הבסיס הישירה היא מה שכתוב אחרי הנקודתיים. מחלקה בלי נקודתיים יורשת מ-`object`. שדה מטיפוס `List<Shape>` הוא הרכבה, לא ירושה."

- id: cs.oop.inheritance.013
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    new Derived();

    class Base
    {
        public Base() => Console.WriteLine("Base ctor");
    }

    class Derived : Base
    {
        private int x = Log("Derived field");

        public Derived() => Console.WriteLine("Derived ctor");

        static int Log(string msg) { Console.WriteLine(msg); return 0; }
    }
  options:
    - "Derived field\nBase ctor\nDerived ctor"
    - "Base ctor\nDerived field\nDerived ctor"
    - "Base ctor\nDerived ctor\nDerived field"
    - "Derived ctor\nDerived field\nBase ctor"
  answer: 0
  explanation: "ב-C# הסדר ביצירת אובייקט יורש הוא: אתחולי השדות (Field Initializers) של המחלקה היורשת, אחר כך הבנאי של מחלקת הבסיס, ובסוף גוף הבנאי של המחלקה היורשת. לכן `Derived field` מודפס עוד לפני `Base ctor`."
  optionExplanations:
    "1": "כך זה עובד ב-Java. ב-C# אתחולי השדות של המחלקה היורשת רצים לפני הקריאה לבנאי הבסיס."
    "2": "אתחולי שדות רצים תמיד לפני גוף הבנאי של אותה מחלקה."
    "3": "גוף הבנאי של `Derived` רץ אחרון, אחרי שבנאי הבסיס הסתיים."

- id: cs.oop.inheritance.014
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    Console.WriteLine(new C().Name());

    class A
    {
        public virtual string Name() => "A";
    }

    class B : A
    {
        public override string Name() => "B" + base.Name();
    }

    class C : B
    {
        public override string Name() => "C" + base.Name();
    }
  options: ["CBA", "CA", "ABC", "C"]
  answer: 0
  explanation: "`base` מתייחס למחלקת הבסיס הישירה. `C.Name` קוראת ל-`B.Name`, שקוראת ל-`A.Name`. התוצאה נבנית מבפנים החוצה: `\"C\" + (\"B\" + \"A\")`."
  optionExplanations:
    "1": "`base` ב-`C` הוא `B`, לא ראש ההיררכיה. `B.Name` מוסיפה את ה-`B` שלה."
    "2": "כל גרסה כותבת את האות שלה לפני תוצאת `base`, ולכן `C` ראשונה."
    "3": "`base.Name()` כן נקראת, ומחזירה את התוצאה של מחלקת הבסיס."

- id: cs.oop.inheritance.015
  type: truefalse
  difficulty: 3
  prompt: "אובייקט של מחלקה יורשת מכיל גם את השדות ה-`private` של מחלקת הבסיס, אבל הקוד של המחלקה היורשת לא יכול לגשת אליהם ישירות בשמם."
  answer: true
  explanation: "השדות ה-`private` של הבסיס קיימים בכל אובייקט יורש, ומתודות של הבסיס שהמחלקה היורשת קוראת להן עובדות איתם. אבל `private` נגיש רק מתוך המחלקה שבה הוא הוגדר. כדי לאפשר גישה ליורשות מגדירים `protected`, או חושפים מאפיין."

- id: cs.oop.inheritance.016
  type: hierarchy
  difficulty: 3
  prompt: "לפי הקוד, מהי מחלקת הבסיס הישירה של כל מחלקה?"
  code: |
    interface IAuditable { }

    class Entity { }
    class Account : Entity, IAuditable { }
    class SavingsAccount : Account { }
    class Transaction : IAuditable { }

    class Bank
    {
        private List<Account> accounts = new();
    }
  targets:
    - id: Entity
    - id: Account
    - id: IAuditable
    - id: "object (אין מחלקת בסיס מפורשת)"
  items:
    - label: Account
      answer: Entity
      why: אחרי הנקודתיים מופיעה קודם מחלקת הבסיס Entity, ואחריה ממשק שהיא מממשת.
    - label: SavingsAccount
      answer: Account
    - label: Transaction
      answer: "object (אין מחלקת בסיס מפורשת)"
      why: IAuditable הוא ממשק, לא מחלקה. Transaction מממשת אותו, ומחלקת הבסיס שלה היא object.
    - label: Bank
      answer: "object (אין מחלקת בסיס מפורשת)"
      why: Bank מחזיקה רשימת חשבונות (has-a), אבל לא יורשת מ-Account.
    - label: Entity
      answer: "object (אין מחלקת בסיס מפורשת)"
  explanation: "ברשימה שאחרי הנקודתיים, מחלקה (אם יש) חייבת להופיע ראשונה, וכל השאר ממשקים. ממשק אף פעם לא מחלקת בסיס: מחלקה שמופיעים אחריה רק ממשקים יורשת מ-`object`."
