- id: cs.oop.inheritance.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    Dog dog = new Dog();
    dog.Eat();
    dog.Bark();

    class Animal
    {
        public void Eat()
        {
            Console.WriteLine("Eating");
        }
    }

    class Dog : Animal
    {
        public void Bark()
        {
            Console.WriteLine("Woof");
        }
    }
  options: ["Eating\nWoof", "Woof", "Woof\nEating", "שגיאת קומפילציה"]
  answer: 0
  explanation: "`Dog : Animal` אומר ש-`Dog` יורשת (Inheritance) מ-`Animal`. מחלקה יורשת (Derived Class) מקבלת את החברים הציבוריים של מחלקת הבסיס (Base Class), ולכן `dog.Eat()` עובד כאילו `Eat` הוגדרה ב-`Dog`. הסדר בפלט הוא סדר הקריאות."
  optionExplanations:
    "1": "`Eat` עוברת בירושה ל-`Dog`, ולכן הקריאה לה מדפיסה `Eating`."
    "2": "הפלט נקבע לפי סדר הקריאות בקוד, לא לפי סדר ההגדרות במחלקות."
    "3": "אין צורך להגדיר את `Eat` מחדש ב-`Dog`. היא נורשת מ-`Animal`."

- id: cs.oop.inheritance.002
  type: single
  difficulty: 1
  prompt: "מכמה מחלקות בסיס יכולה מחלקה ב-C# לרשת ישירות?"
  options:
    - "ממחלקה אחת בלבד, אבל היא יכולה לממש כמה ממשקים"
    - "מכמה מחלקות שרוצים, מופרדות בפסיקים"
    - "משתי מחלקות לכל היותר"
    - "מאף מחלקה; ב-C# יורשים רק מממשקים"
  answer: 0
  explanation: "C# תומכת בירושה יחידה (Single Inheritance) של מחלקות: `class B : A`. אפשר להוסיף אחרי מחלקת הבסיס כמה ממשקים שרוצים: `class B : A, IX, IY`. כשצריך יכולות מכמה מקורות, משתמשים בממשקים או בהרכבה."
  optionExplanations:
    "1": "`class Duck : Flyer, Swimmer` כששתיהן מחלקות הוא שגיאת קומפילציה. ירושה מרובה של מחלקות קיימת ב-C++, לא ב-C#."
    "2": "אין ב-C# מגבלה של שתיים. המגבלה היא מחלקת בסיס אחת."
    "3": "ירושה ממחלקה היא חלק בסיסי של C#, וכל מחלקה יורשת לפחות מ-`object`."

- id: cs.oop.inheritance.003
  type: single
  difficulty: 1
  prompt: "מאילו מקומות מותר לגשת לשדה `balance`?"
  code: |
    class BankAccount
    {
        protected double balance;
    }

    class SavingsAccount : BankAccount
    {
        public void AddInterest()
        {
            balance *= 1.02;
        }
    }

    class Report
    {
    }
  options:
    - "מתוך `BankAccount` ומתוך מחלקות שיורשות ממנה, כמו `SavingsAccount`"
    - "מכל מקום בתוכנית, כולל `Report`, כי הוא לא `private`"
    - "רק מתוך `BankAccount` עצמה"
    - "רק מתוך מחלקות שיורשות ממנה, ולא מתוך `BankAccount` עצמה"
  answer: 0
  explanation: "`protected` נמצא בין `private` ל-`public`: המחלקה עצמה ומחלקות שיורשות ממנה רואות את החבר, אבל קוד חיצוני כמו `Report` לא. כך מחלקה יורשת יכולה להשתמש במצב הפנימי בלי לחשוף אותו לכולם."
  optionExplanations:
    "1": "\"לא `private`\" לא אומר `public`. `protected` חוסם גישה מקוד שלא יורש מהמחלקה."
    "2": "כך מתנהג `private`. עם `protected` גם `SavingsAccount` רשאית לגשת."
    "3": "המחלקה עצמה תמיד רשאית לגשת לחברים שלה, גם `protected` וגם `private`."

- id: cs.oop.inheritance.004
  type: hierarchy
  difficulty: 1
  prompt: לכל זוג מחלקות, בחרו את סוג היחס הנכון ביניהן.
  targets:
    - id: is-a
      desc: ירושה - Inheritance
    - id: has-a
      desc: הרכבה - Composition
  items:
    - label: "Manager ו-Employee"
      answer: is-a
      why: מנהל הוא סוג של עובד, ולכן Manager יכולה לרשת מ-Employee.
    - label: "Employee ו-Address"
      answer: has-a
      why: לעובד יש כתובת. כתובת היא לא סוג של עובד.
    - label: "Truck ו-Vehicle"
      answer: is-a
      why: משאית היא סוג של כלי רכב.
    - label: "Order ו-OrderLine"
      answer: has-a
      why: הזמנה מכילה שורות הזמנה.
    - label: "Square ו-Shape"
      answer: is-a
      why: ריבוע הוא סוג של צורה.
  explanation: "ירושה מתאימה כשמשפט «X הוא סוג של Y» נכון (is-a). כשנכון לומר «ל-X יש Y», ה-Y צריך להיות שדה בתוך X (has-a), לא מחלקת בסיס."

- id: cs.oop.inheritance.006
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    new SportsCar();

    class Vehicle
    {
        public Vehicle()
        {
            Console.WriteLine("Vehicle");
        }
    }

    class Car : Vehicle
    {
        public Car()
        {
            Console.WriteLine("Car");
        }
    }

    class SportsCar : Car
    {
        public SportsCar()
        {
            Console.WriteLine("SportsCar");
        }
    }
  options: ["Vehicle\nCar\nSportsCar", "SportsCar\nCar\nVehicle", "SportsCar", "Car\nSportsCar"]
  answer: 0
  explanation: "לפני שגוף הבנאי של מחלקה רץ, רץ הבנאי של מחלקת הבסיס שלה. לכן הבנאים רצים מלמעלה למטה: קודם `Vehicle`, אחר כך `Car`, ובסוף `SportsCar`. החלק הבסיסי של האובייקט נבנה לפני החלק שמרחיב אותו."
  optionExplanations:
    "1": "זה הסדר שבו הבנאים נקראים, אבל הגוף של כל בנאי רץ רק אחרי שהבנאי של הבסיס שלו הסתיים."
    "2": "גם בלי `: base()` מפורש, הבנאי בלי הפרמטרים של מחלקת הבסיס נקרא אוטומטית."
    "3": "הקריאה האוטומטית לבנאי הבסיס ממשיכה עד ראש ההיררכיה, כולל `Vehicle`."

- id: cs.oop.inheritance.007
  type: output
  difficulty: 2
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    Manager m = new Manager("Rina", 3);
    Console.WriteLine(m.GetName());

    class Employee
    {
        private string name;

        public Employee(string name)
        {
            this.name = name;
        }

        public string GetName()
        {
            return name;
        }
    }

    class Manager : Employee
    {
        private int teamSize;

        public Manager(string name, int teamSize)
        {
            this.teamSize = teamSize;
        }
    }
  options: ["Rina", "שגיאת קומפילציה", "null", "שגיאה בזמן ריצה"]
  answer: 1
  explanation: "בנאי של `Manager` בלי `: base(...)` מנסה לקרוא לבנאי בלי פרמטרים של `Employee`, אבל אין כזה: יש רק `Employee(string name)`. לכן זו שגיאת קומפילציה. התיקון: `public Manager(string name, int teamSize) : base(name)`."
  optionExplanations:
    "0": "הפרמטר `name` של `Manager` לא מועבר ל-`Employee` מעצמו. צריך להעביר אותו במפורש עם `base(name)`."
    "2": "הקוד לא מגיע לריצה, כי לא קיים בנאי בסיס שאפשר לקרוא לו בלי ארגומנטים."
    "3": "הבעיה מתגלה כבר בקומפילציה, לא בזמן ריצה."

- id: cs.oop.inheritance.008
  type: single
  difficulty: 2
  prompt: "מה התפקיד של `: base(name)` בבנאי `public Manager(string name) : base(name)`?"
  options:
    - "קורא לבנאי של מחלקת הבסיס עם `name`, לפני שגוף הבנאי של `Manager` רץ"
    - "קורא לבנאי של מחלקת הבסיס אחרי שגוף הבנאי של `Manager` מסתיים"
    - "יוצר אובייקט נפרד מטיפוס הבסיס ושומר אותו בשדה של `Manager`"
    - "מגדיר ש-`Manager` יורשת מהמחלקה ששמה `name`"
  answer: 0
  explanation: "`base(...)` בחתימת הבנאי בוחר איזה בנאי של מחלקת הבסיס יופעל ועם אילו ארגומנטים. הוא רץ ראשון, כך שהחלק הבסיסי של האובייקט מאותחל לפני הקוד של `Manager`. נוצר אובייקט אחד בלבד."
  optionExplanations:
    "1": "בנאי הבסיס רץ תמיד לפני גוף הבנאי של המחלקה היורשת, לא אחריו."
    "2": "ירושה לא יוצרת אובייקט נוסף. זה אותו אובייקט, והחלק הבסיסי שלו מאותחל על ידי בנאי הבסיס."
    "3": "מחלקת הבסיס נקבעת בהצהרת המחלקה (`class Manager : Employee`), לא בבנאי."

- id: cs.oop.inheritance.011
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס 16, השטח של ריבוע שצלעו 4, אבל מדפיס 4. איזו שורה צריך לתקן?"
  code: |
    Square square = new Square(4);
    Console.WriteLine(square.Area());

    class Rectangle
    {
        private int width;
        private int height;

        public Rectangle(int width, int height)
        {
            this.width = width;
            this.height = height;
        }

        public int Area()
        {
            return width * height;
        }
    }

    class Square : Rectangle
    {
        public Square(int side) : base(side, 1)
        {
        }
    }
  answer: 23
  explanation: "`Square` לא שומרת נתונים משלה: היא מעבירה את המידות לבנאי של `Rectangle` דרך `base(...)`. היא מעבירה `1` כגובה, ולכן השטח `4 * 1`. ריבוע הוא מלבן שהרוחב והגובה שלו שווים, ולכן צריך `base(side, side)`."
  fixed: |
    Square square = new Square(4);
    Console.WriteLine(square.Area());

    class Rectangle
    {
        private int width;
        private int height;

        public Rectangle(int width, int height)
        {
            this.width = width;
            this.height = height;
        }

        public int Area()
        {
            return width * height;
        }
    }

    class Square : Rectangle
    {
        public Square(int side) : base(side, side)
        {
        }
    }

- id: cs.oop.inheritance.012
  type: hierarchy
  difficulty: 2
  prompt: "לפי הקוד, ממי יורשת כל מחלקה ישירות?"
  code: |
    class Shape { }
    class Polygon : Shape { }
    class Triangle : Polygon { }
    class Circle : Shape { }

    class Drawing
    {
        private Shape[] shapes;
    }

    class Layer : Drawing { }
  targets:
    - id: Shape
    - id: Polygon
    - id: Drawing
    - id: "object (אין מחלקת בסיס מפורשת)"
  items:
    - label: Polygon
      answer: Shape
    - label: Triangle
      answer: Polygon
      why: Triangle יורשת ישירות מ-Polygon, ודרכה גם (בעקיפין) מ-Shape.
    - label: Circle
      answer: Shape
    - label: Drawing
      answer: "object (אין מחלקת בסיס מפורשת)"
      why: Drawing מחזיקה רשימת צורות (has-a), אבל לא יורשת מאף צורה.
    - label: Layer
      answer: Drawing
    - label: Shape
      answer: "object (אין מחלקת בסיס מפורשת)"
  explanation: "מחלקת הבסיס הישירה היא מה שכתוב אחרי הנקודתיים. מחלקה בלי נקודתיים יורשת מ-`object`. שדה מטיפוס `Shape[]` הוא הרכבה, לא ירושה."

- id: cs.oop.inheritance.015
  type: truefalse
  difficulty: 3
  prompt: "אובייקט של מחלקה יורשת מכיל גם את השדות ה-`private` של מחלקת הבסיס, אבל הקוד של המחלקה היורשת לא יכול לגשת אליהם ישירות בשמם."
  answer: true
  explanation: "השדות ה-`private` של הבסיס קיימים בכל אובייקט יורש, ומתודות של הבסיס שהמחלקה היורשת קוראת להן עובדות איתם. אבל `private` נגיש רק מתוך המחלקה שבה הוא הוגדר. כדי לאפשר גישה ליורשות מגדירים `protected`, או חושפים מאפיין."

- id: cs.oop.inheritance.016
  type: hierarchy
  difficulty: 3
  prompt: "לפי הקוד, מהי מחלקת הבסיס הישירה של כל מחלקה?"
  code: |
    class Entity { }
    class Account : Entity { }
    class SavingsAccount : Account { }
    class Transaction { }

    class Bank : Entity
    {
        private Account[] accounts;
    }
  targets:
    - id: Entity
      desc: מחלקת בסיס כללית
    - id: Account
      desc: חשבון
    - id: "object (אין מחלקת בסיס מפורשת)"
      desc: אין נקודתיים בהגדרה
  items:
    - label: Account
      answer: Entity
    - label: SavingsAccount
      answer: Account
      why: "`SavingsAccount` יורשת ישירות מ-`Account`, ורק דרכה מ-`Entity`. מחלקת הבסיס הישירה היא זו שכתובה אחרי הנקודתיים."
    - label: Transaction
      answer: "object (אין מחלקת בסיס מפורשת)"
    - label: Bank
      answer: Entity
      why: "השדה `Account[] accounts` הוא הרכבה (Has-a): בנק מחזיק חשבונות. הוא לא הופך את `Bank` ליורשת של `Account`."
    - label: Entity
      answer: "object (אין מחלקת בסיס מפורשת)"
  explanation: "מחלקת הבסיס הישירה היא מה שכתוב אחרי הנקודתיים. מחלקה בלי נקודתיים יורשת מ-`object`. שדה מטיפוס של מחלקה אחרת הוא הרכבה, לא ירושה."

- id: cs.oop.inheritance.017
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    Student s = new Student("Dana", 90);
    Console.WriteLine(s.Info());

    class Person
    {
        protected string name;

        public Person(string name)
        {
            this.name = name;
        }
    }

    class Student : Person
    {
        private int grade;

        public Student(string name, int grade) : base(name)
        {
            this.grade = grade;
        }

        public string Info()
        {
            return name + " " + grade;
        }
    }
  options: ["Dana 90", " 90", "שגיאת קומפילציה", "Dana"]
  answer: 0
  explanation: "`base(name)` מעביר את השם לבנאי של `Person`, שמציב אותו בשדה `name`. השדה מוגדר `protected`, ולכן `Student` רשאית לגשת אליו ישירות בפעולה `Info`."
  optionExplanations:
    "1": "`base(name)` מעביר את השם לבנאי הבסיס, ולכן `name` לא ריק."
    "2": "שדה `protected` נגיש מתוך מחלקה יורשת."
    "3": "`Info` מחזירה גם את הציון."

- id: cs.oop.inheritance.018
