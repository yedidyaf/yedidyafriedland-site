- id: cs.oop.inheritance.021
  type: truefalse
  difficulty: 1
  prompt: "מחלקה יורשת מקבלת את כל הפעולות ה-`public` של מחלקת הבסיס שלה."
  answer: true
  explanation: "ירושה (Inheritance) פירושה שהמחלקה היורשת מקבלת את מה שהוגדר במחלקת הבסיס. פעולות `public` אפשר להפעיל על עצם של היורשת כאילו הוגדרו בה."
