  answer: 15
  fixed: |
    var product = new Product("Pen", 5);
    Console.WriteLine(product);

    class Product
    {
        public string Name { get; }
        public decimal Price { get; }

        public Product(string name, decimal price)
        {
            Name = name;
            Price = price;
        }

        public override string ToString() => $"{Name}: {Price}";
    }
  explanation: "`Console.WriteLine(object)` קוראת ל-`ToString`, שהיא מתודה וירטואלית של `object`. בלי `override`, המתודה ב-`Product` רק מסתירה את המקורית (הקומפיילר מזהיר על כך), ולכן נקראת הגרסה של `object`, שמחזירה את שם הטיפוס. עם `override` ההדפסה תשתמש בגרסה של `Product`."
