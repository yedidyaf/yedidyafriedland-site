    Shape[] shapes = { new Square(2), new Rect(2, 3), new Square(1) };
    int total = 0;
    for (int i = 0; i < shapes.Length; i++)
        total += shapes[i].Area();
    Console.WriteLine(total);

    class Shape
    {
        public virtual int Area()
        {
            return 0;
        }
    }

    class Square : Shape
    {
        private int side;

        public Square(int side)
        {
            this.side = side;
        }

        public override int Area()
        {
            return side * side;
        }
    }

    class Rect : Shape
    {
        private int w;
        private int h;

        public Rect(int w, int h)
        {
            this.w = w;
            this.h = h;
        }

        public override int Area()
        {
            return w * h;
        }
    }
