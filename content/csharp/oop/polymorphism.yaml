- id: cs.oop.polymorphism.001
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    Animal a = new Dog();
    a.Speak();

    class Animal
    {
        public virtual void Speak()
        {
            Console.WriteLine("...");
        }
    }

    class Dog : Animal
    {
        public override void Speak()
        {
            Console.WriteLine("Woof");
        }
    }
  options: ["Woof", "...", "שגיאת קומפילציה", "לא יודפס כלום"]
  answer: 0
  explanation: "`Speak` מוגדרת `virtual` ונדרסת עם `override`. בזמן ריצה האובייקט הוא `Dog`, ולכן נקראת הגרסה של `Dog`, גם כשההפניה היא מטיפוס `Animal`."

- id: cs.oop.polymorphism.003
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    Shape[] shapes = { new Circle(), new Square(), new Shape() };
    foreach (Shape s in shapes)
        Console.WriteLine(s.Name());

    class Shape
    {
        public virtual string Name()
        {
            return "Shape";
        }
    }

    class Circle : Shape
    {
        public override string Name()
        {
            return "Circle";
        }
    }

    class Square : Shape
    {
        public override string Name()
        {
            return "Square";
        }
    }
  options: ["Circle\nSquare\nShape", "Shape\nShape\nShape", "Circle\nSquare", "שגיאת קומפילציה"]
  answer: 0
  explanation: "זה פולימורפיזם (Polymorphism): אותה קריאה `s.Name()` מפעילה גרסה שונה לפי הטיפוס האמיתי של כל אובייקט ברשימה. מערך מטיפוס `Shape[]` יכול להחזיק כל אובייקט שהוא `Shape`, כולל מחלקות יורשות."
  optionExplanations:
    "1": "עם `virtual` ו-`override` ההחלטה נעשית לפי האובייקט בזמן ריצה, לא לפי טיפוס המערך."
    "2": "גם `new Shape()` הוא איבר במערך, והוא מדפיס את הגרסה של `Shape`."
    "3": "אובייקט של מחלקה יורשת מתאים למקום שבו מצופה טיפוס הבסיס, ולכן אפשר להכניס `Circle` למערך `Shape[]`."

- id: cs.oop.polymorphism.004
  type: single
  difficulty: 1
  prompt: "בקוד `Animal a = new Dog(); a.Speak();`, מה התנאי לכך שתרוץ הגרסה של `Speak` שמוגדרת ב-`Dog`?"
  options:
    - "`Speak` מוגדרת `virtual` (או `abstract`) ב-`Animal`, ו-`Dog` דורסת אותה עם `override`"
    - "מספיק ש-`Dog` תגדיר מתודה `Speak` עם המילה `new`"
    - "מספיק שהאובייקט נוצר עם `new Dog()`, בלי קשר להגדרת המתודות"
    - "`Dog` צריכה להיות מוגדרת `sealed`"
  answer: 0
  explanation: "קישור דינמי (Dynamic Dispatch) קורה רק למתודות וירטואליות. `virtual` בבסיס מאפשר דריסה, ו-`override` ביורשת מבצע אותה. בלי זוג המילים האלה, הקומפיילר בוחר את המתודה לפי טיפוס ההפניה, `Animal`."
  optionExplanations:
    "1": "`new` מסתיר את המתודה של הבסיס ולא דורס אותה. דרך הפניה מטיפוס `Animal` תרוץ הגרסה של `Animal`."
    "2": "כשהמתודה לא וירטואלית, הטיפוס האמיתי של האובייקט לא משפיע על הבחירה."
    "3": "`sealed` רק מונע ירושה מ-`Dog`. הוא לא קשור לבחירת המתודה."

- id: cs.oop.polymorphism.005
  type: truefalse
  difficulty: 1
  prompt: "ב-C#, כמו ב-Java, כל מתודה של מחלקה היא וירטואלית כברירת מחדל, ומחלקה יורשת יכולה לדרוס אותה עם `override`."
  answer: false
  explanation: "ב-C# מתודות אינן וירטואליות כברירת מחדל. כדי לאפשר דריסה (Override) מחלקת הבסיס חייבת לסמן את המתודה `virtual` (או `abstract`). `override` על מתודה רגילה הוא שגיאת קומפילציה."

- id: cs.oop.polymorphism.006
  type: hierarchy
  difficulty: 1
  prompt: "לפי הקוד, ממי יורשת כל מחלקה ישירות?"
  code: |
    class Notification
    {
        public virtual void Send() { }
    }

    class EmailNotification : Notification
    {
        public override void Send() { }
    }

    class SmsNotification : Notification { }
    class UrgentEmail : EmailNotification { }

    class NotificationCenter
    {
        private Notification[] queue;
    }
  targets:
    - id: Notification
    - id: EmailNotification
    - id: "object (אין מחלקת בסיס מפורשת)"
  items:
    - label: EmailNotification
      answer: Notification
    - label: SmsNotification
      answer: Notification
      why: גם בלי override, SmsNotification יורשת מ-Notification ומשתמשת בגרסה שלה.
    - label: UrgentEmail
      answer: EmailNotification
    - label: NotificationCenter
      answer: "object (אין מחלקת בסיס מפורשת)"
      why: NotificationCenter מחזיקה תור של התראות (has-a) ושולחת אותן דרך הפניה מטיפוס הבסיס.
    - label: Notification
      answer: "object (אין מחלקת בסיס מפורשת)"
  explanation: "כל ההתראות יורשות מ-`Notification`, ולכן אפשר להחזיק אותן במערך אחד מטיפוס הבסיס ולקרוא ל-`Send` בלי לדעת את הסוג המדויק. `NotificationCenter` לא יורשת מאף התראה: היא משתמשת בהן."

- id: cs.oop.polymorphism.007
  type: single
  difficulty: 2
  tags: [compile-error]
  prompt: "למה השורה `a.Fetch();` לא מתקמפלת?"
  code: |
    Animal a = new Dog();
    a.Fetch();

    class Animal
    {
        public virtual void Speak()
        {
            Console.WriteLine("...");
        }
    }

    class Dog : Animal
    {
        public void Fetch()
        {
            Console.WriteLine("Fetching");
        }
    }
  options:
    - "הקומפיילר בודק אילו מתודות זמינות לפי טיפוס ההפניה, `Animal`, ול-`Animal` אין `Fetch`"
    - "`Fetch` לא מוגדרת `virtual`, ולכן אי אפשר לקרוא לה"
    - "האובייקט שנוצר הוא בפועל `Animal` ולא `Dog`"
    - "מתודות של מחלקה יורשת נגישות רק מתוך המחלקה עצמה"
  answer: 0
  explanation: "בזמן קומפילציה ידוע רק טיפוס ההפניה (`Animal`). האובייקט אכן `Dog`, אבל דרך `Animal` אפשר לקרוא רק למה ש-`Animal` מגדירה. כדי לקרוא ל-`Fetch` צריך המרה, למשל `if (a is Dog d) d.Fetch();`."
  optionExplanations:
    "1": "`virtual` נדרש רק לדריסה. מתודה רגילה של `Dog` נקראת בלי בעיה דרך הפניה מטיפוס `Dog`."
    "2": "האובייקט הוא `Dog`. הבעיה היא טיפוס ההפניה, לא האובייקט."
    "3": "`Fetch` מוגדרת `public`, ולכן נגישה מכל מקום דרך הפניה מטיפוס `Dog`."

- id: cs.oop.polymorphism.008
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    Animal a = new Cat();
    Console.WriteLine(a.Name());
    Dog d = (Dog)a;
    Console.WriteLine("done");

    class Animal
    {
        public virtual string Name()
        {
            return "Animal";
        }
    }

    class Dog : Animal
    {
        public override string Name()
        {
            return "Dog";
        }
    }

    class Cat : Animal
    {
        public override string Name()
        {
            return "Cat";
        }
    }
  options: ["Cat\nInvalidCastException", "Cat\ndone", "Animal\nInvalidCastException", "שגיאת קומפילציה"]
  answer: 0
  explanation: "`a.Name()` מפעילה את הגרסה של `Cat`. ההמרה `(Dog)a` מתקמפלת, כי `Animal` יכול להיות `Dog`, אבל בזמן ריצה האובייקט הוא `Cat`, ולכן נזרקת `InvalidCastException`. המרה כלפי מטה (Downcast) בודקת את האובייקט האמיתי; `as` או `is` הם הדרך הבטוחה."
  optionExplanations:
    "1": "המרה לא משנה את האובייקט. `Cat` לא יכול להפוך ל-`Dog`, והתוכנית נעצרת לפני `done`."
    "2": "`Name` וירטואלית ונדרסת ב-`Cat`, ולכן מודפס `Cat` ולא `Animal`."
    "3": "המרה מטיפוס בסיס לטיפוס יורש מותרת בקומפילציה. הבדיקה נעשית רק בזמן ריצה."

- id: cs.oop.polymorphism.009
  type: hierarchy
  difficulty: 2
  prompt: לפי הקוד, בחרו לכל זוג את היחס ביניהם.
  code: |
    class Exporter
    {
        public virtual string Export(string data)
