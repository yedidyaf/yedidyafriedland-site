- id: cs.oop.polymorphism.010
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס עמלה לכל אמצעי תשלום. עבור תשלום במזומן העמלה צריכה להיות 1, אבל מודפס 0. איזו שורה צריך לתקן?"
  code: |
    Payment[] payments = { new CardPayment(), new CashPayment() };
    for (int i = 0; i < payments.Length; i++)
        Console.WriteLine(payments[i].Fee(100));

    class Payment
    {
        public virtual double Fee(double amount)
        {
            return 0;
        }
    }

    class CardPayment : Payment
    {
        public override double Fee(double amount)
        {
            return amount * 0.02;
        }
    }

    class CashPayment : Payment
    {
        public double Fee(double amount)
        {
            return 1;
        }
    }
  answer: 23
  explanation: "בלי `override`, הפעולה `Fee` ב-`CashPayment` לא דורסת את הגרסה של `Payment`, אלא מסתירה אותה (הקומפיילר מזהיר על כך). בלולאה כל איבר הוא מטיפוס `Payment`, ולכן עבור `CashPayment` נקראת הגרסה של `Payment`, שמחזירה 0. עם `override` הקריאה דרך הבסיס תגיע לגרסה של `CashPayment`."
  fixed: |
    Payment[] payments = { new CardPayment(), new CashPayment() };
    for (int i = 0; i < payments.Length; i++)
        Console.WriteLine(payments[i].Fee(100));

    class Payment
    {
        public virtual double Fee(double amount)
        {
            return 0;
        }
    }

    class CardPayment : Payment
    {
        public override double Fee(double amount)
        {
            return amount * 0.02;
        }
    }

    class CashPayment : Payment
    {
        public override double Fee(double amount)
        {
            return 1;
        }
    }

- id: cs.oop.polymorphism.011
  type: cleaner
  difficulty: 2
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      class Shape
      {
          public virtual double Area()
          {
              return 0;
          }
      }

      class Circle : Shape
      {
          public double Radius { get; init; }
          public override double Area()
          {
              return Math.PI * Radius * Radius;
          }
      }

      class Square : Shape
      {
          public double Side { get; init; }
          public override double Area()
          {
              return Side * Side;
          }
      }
    - |
      class Shape
      {
          public double Area()
          {
              if (this is Circle c) return Math.PI * c.Radius * c.Radius;
              if (this is Square s) return s.Side * s.Side;
              return 0;
          }
      }

      class Circle : Shape { public double Radius { get; init; } }

      class Square : Shape { public double Side { get; init; } }
  answer: 0
  explanation: "בגרסה הפולימורפית כל צורה יודעת לחשב את השטח של עצמה. הוספת `Triangle` היא מחלקה חדשה עם `override`, בלי לגעת בקוד קיים. זה עקרון פתוח/סגור (Open/Closed)."
  optionExplanations:
    "1": "שרשרת בדיקות `is` מחליפה את הפולימורפיזם: מחלקת הבסיס צריכה להכיר כל יורשת, וכל צורה חדשה מחייבת לשנות את `Shape`. צורה ששוכחים להוסיף מחזירה 0 בשקט."

