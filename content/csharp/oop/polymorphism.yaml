- id: cs.oop.polymorphism.016
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס `Pen: 5`, אבל מודפס שם המחלקה במקום זה. איזו שורה צריך לתקן?"
  code: |
    Product product = new Product("Pen", 5);
    Console.WriteLine(product);

    class Product
    {
        private string name;
        private int price;

        public Product(string name, int price)
        {
            this.name = name;
            this.price = price;
        }

        public string ToString()
        {
            return name + ": " + price;
        }
    }
  answer: 15
  explanation: "`Console.WriteLine` שמקבלת עצם קוראת ל-`ToString`, שהיא פעולה וירטואלית של `object`. בלי `override`, הפעולה ב-`Product` רק מסתירה את המקורית (הקומפיילר מזהיר על כך), ולכן נקראת הגרסה של `object`, שמחזירה את שם המחלקה. צריך `public override string ToString()`."
  fixed: |
    Product product = new Product("Pen", 5);
    Console.WriteLine(product);

    class Product
    {
        private string name;
        private int price;

        public Product(string name, int price)
        {
            this.name = name;
            this.price = price;
        }

        public override string ToString()
        {
            return name + ": " + price;
        }
    }

- id: cs.oop.polymorphism.017
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס `User (admin)`, אבל התוכנית קורסת עם `StackOverflowException`. איזו שורה צריך לתקן?"
  code: |
    Admin admin = new Admin();
    Console.WriteLine(admin.Describe());

    class User
    {
        public virtual string Describe()
        {
            return "User";
        }
    }

    class Admin : User
    {
        public override string Describe()
        {
            return Describe() + " (admin)";
        }
    }
  answer: 16
  explanation: "בתוך `Admin`, הקריאה `Describe()` היא `this.Describe()`, כלומר הגרסה של `Admin` עצמה, וזו רקורסיה אינסופית. כדי להפעיל את הגרסה של מחלקת הבסיס צריך `base.Describe()`."
  fixed: |
    Admin admin = new Admin();
    Console.WriteLine(admin.Describe());

    class User
    {
        public virtual string Describe()
        {
            return "User";
        }
    }

    class Admin : User
    {
        public override string Describe()
        {
            return base.Describe() + " (admin)";
        }
    }

- id: cs.oop.polymorphism.018
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    A obj = new C();
    Console.WriteLine(obj.Name());

    class A
    {
        public virtual string Name()
        {
            return "A";
        }
    }

    class B : A
    {
        public override string Name()
        {
            return "B" + base.Name();
        }
    }

    class C : B
    {
        public override string Name()
        {
            return "C" + base.Name();
        }
    }
  options: ["CBA", "CA", "ABC", "A"]
  answer: 0
  explanation: "ההפניה מטיפוס `A`, אבל העצם הוא `C`, ולכן נקראת הגרסה של `C`. `base` מתייחס למחלקת הבסיס הישירה: `C.Name` קוראת ל-`B.Name`, שקוראת ל-`A.Name`. התוצאה נבנית מבפנים החוצה: `\"C\" + (\"B\" + \"A\")`."
  optionExplanations:
    "1": "`base` ב-`C` הוא `B`, לא ראש ההיררכיה. `B.Name` מוסיפה את ה-`B` שלה."
    "2": "כל גרסה כותבת את האות שלה לפני תוצאת `base`, ולכן `C` ראשונה."
    "3": "`Name` וירטואלית, ולכן טיפוס ההפניה `A` לא קובע איזו גרסה תרוץ."

- id: cs.oop.polymorphism.019
