  optionExplanations:
    "1": "`SetGrade` מעדכנת את השדה, ולכן הקריאה השנייה ל-`GetGrade` מחזירה את הערך החדש."
    "2": "`SetGrade` מקבלת את הערך המלא, `80 + 5`, ולא רק את התוספת."
    "3": "הגישה לשדה הפרטי נעשית דרך פעולות `public`, וזה חוקי."

