- id: cs.oop.classes-objects.011
  type: single
  difficulty: 2
  tags: [compile-error]
  prompt: למה הקוד הבא לא מתקמפל?
  code: |
    class Temperature
    {
        private double celsius;

        public static double ToFahrenheit()
        {
            return celsius * 9 / 5 + 32;
        }
    }
  options:
    - "מתודה `static` לא שייכת לאף אובייקט, ולכן אין לה `celsius` לגשת אליו"
    - "שדה `private` לא נגיש מתוך מתודה `public` של אותה מחלקה"
    - "מתודה `static` חייבת להחזיר `void`"
    - "אסור לערבב `double` ו-`int` באותו ביטוי חשבוני"
  answer: 0
  explanation: "`celsius` הוא שדה מופע: לכל אובייקט `Temperature` יש ערך משלו. מתודה `static` נקראת על המחלקה (`Temperature.ToFahrenheit()`) בלי אובייקט, ולכן לא ברור של מי ה-`celsius`. הפתרון: להסיר את `static`, או לקבל את הטמפרטורה כפרמטר."
  optionExplanations:
    "1": "`private` מגביל גישה מחוץ למחלקה בלבד. כל מתודה בתוך המחלקה יכולה לגשת לשדות ה-`private` שלה."
    "2": "מתודה `static` יכולה להחזיר כל טיפוס, למשל `double`."
    "3": "`int` מומר אוטומטית ל-`double` בחישוב, וזה תקין."

- id: cs.oop.classes-objects.012
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס 1, אבל נזרקת `NullReferenceException`. איזו שורה צריך לתקן?"
  code: |
    Cart cart = new Cart();
    cart.Add("apple");
    Console.WriteLine(cart.GetCount());

    class Cart
    {
        private string[] items;
        private int count;

        public void Add(string item)
        {
            items[count] = item;
            count++;
        }

        public int GetCount()
        {
            return count;
        }
    }
  answer: 7
  explanation: "השדה `items` הוא מערך, כלומר טיפוס הפניה, וערך ברירת המחדל שלו הוא `null`. הצהרה על השדה לא יוצרת את המערך. צריך ליצור אותו, בשורת ההצהרה או בבנאי, למשל `private string[] items = new string[10];`."
  fixed: |
    Cart cart = new Cart();
    cart.Add("apple");
    Console.WriteLine(cart.GetCount());

    class Cart
    {
        private string[] items = new string[10];
        private int count;

        public void Add(string item)
        {
            items[count] = item;
            count++;
        }

        public int GetCount()
        {
            return count;
        }
    }

