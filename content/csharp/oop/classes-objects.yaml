    "2": "`this(1)` אכן מפעיל את הבנאי השני, ולכן `X` מקבל 1."

- id: cs.oop.classes-objects.016
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    var orders = new List<Order>();
    for (int i = 0; i < 3; i++)
        orders.Add(new Order());
    Console.WriteLine(orders[0].Id + orders[2].Id);
    Console.WriteLine(Order.NextId);

    class Order
    {
        public static int NextId = 100;
        public int Id = NextId++;
    }
  options: ["202\n103", "202\n102", "300\n103", "100102\n103"]
  answer: 0
  explanation: "`NextId` הוא `static` ומאותחל פעם אחת ל-100. אתחול השדה `Id` רץ בכל יצירת אובייקט: הראשון מקבל 100, השני 101, השלישי 102, ו-`NextId` מתקדם ל-103. הסכום `100 + 102` הוא 202, כי זה חיבור של שני `int`."
  optionExplanations:
    "1": "`NextId++` מחזיר את הערך הישן ואז מקדם. אחרי שלושה אובייקטים הערך הוא 103."
    "2": "אתחול שדה מופע רץ מחדש לכל אובייקט, ולכן לא כל ה-`Id` שווים 100."
    "3": "`Id` הוא `int`, ולכן `+` הוא חיבור מספרי ולא שרשור מחרוזות."
