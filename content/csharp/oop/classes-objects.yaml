- id: cs.oop.classes-objects.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    Counter a = new Counter();
    Counter b = a;
    b.Count = 5;
    Console.WriteLine(a.Count);

    class Counter
    {
        public int Count;
    }
  options: ["5", "0", "null", "שגיאת קומפילציה"]
  answer: 0
  explanation: "מחלקה (Class) היא טיפוס הפניה (Reference Type). השורה `Counter b = a;` לא יוצרת אובייקט חדש, אלא מעתיקה את ההפניה, ולכן `a` ו-`b` מצביעים על אותו אובייקט. השינוי דרך `b` נראה גם דרך `a`."
  optionExplanations:
    "1": "`0` היה מודפס אילו ההשמה הייתה מעתיקה את האובייקט, כמו ב-struct. מחלקה מועתקת לפי הפניה."
    "2": "`a` מצביע על אובייקט קיים, והשדה `Count` מטיפוס `int` לא יכול להיות `null`."

- id: cs.oop.classes-objects.002
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    var box = new Box();
    Console.WriteLine(box.Size);
    Console.WriteLine(box.Label == null);

    class Box
    {
        public int Size;
        public string Label;
    }
  options: ["0\nTrue", "0\nFalse", "null\nTrue", "שגיאת קומפילציה"]
  answer: 0
  explanation: "שדות (Fields) של מחלקה מקבלים ערך ברירת מחדל אוטומטית: `0` עבור `int` ו-`null` עבור טיפוס הפניה כמו `string`. רק משתנים מקומיים חייבים השמה לפני קריאה."
  optionExplanations:
    "1": "שדה `string` שלא אותחל הוא `null`, לא מחרוזת ריקה, ולכן ההשוואה מחזירה `True`."
    "3": "החובה לאתחל לפני שימוש חלה על משתנים מקומיים בלבד, לא על שדות."

- id: cs.oop.classes-objects.003
  type: single
  difficulty: 1
  prompt: "למה מתייחסת המילה `this` בתוך מתודת מופע?"
  options:
    - "לאובייקט הנוכחי, זה שעליו נקראה המתודה"
    - "למחלקה עצמה, בדומה לגישה דרך `static`"
    - "לאובייקט האחרון שנוצר מהמחלקה"
    - "למחלקת הבסיס של המחלקה הנוכחית"
  answer: 0
  explanation: "`this` הוא הפניה לאובייקט הנוכחי. בקריאה `a.Print()` המילה `this` בתוך `Print` היא `a`. משתמשים בה בעיקר כדי להבחין בין שדה לפרמטר באותו שם: `this.name = name;`."
  optionExplanations:
    "1": "במתודה `static` אין אובייקט נוכחי, ולכן אי אפשר להשתמש בה ב-`this`."
    "2": "`this` תלוי באובייקט שעליו נקראה המתודה, לא בסדר יצירת האובייקטים."
    "3": "למחלקת הבסיס פונים עם `base`, לא עם `this`."

- id: cs.oop.classes-objects.004
  type: output
  difficulty: 1
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    var account = new Account();
    account.balance = 100;
    Console.WriteLine(account.balance);

    class Account
    {
        private int balance;
    }
  options: ["100", "0", "שגיאת קומפילציה", "שגיאה בזמן ריצה"]
  answer: 2
  explanation: "השדה `balance` מוגדר `private`, ולכן אפשר לגשת אליו רק מתוך הקוד של המחלקה `Account`. גישה מבחוץ היא שגיאת קומפילציה, לא שגיאה בזמן ריצה. זו הכימוס (Encapsulation): המחלקה מחליטה מה חשוף."
  optionExplanations:
    "0": "הקוד לא מגיע לשלב הריצה: הקומפיילר חוסם גישה לחבר `private` מחוץ למחלקה."
    "3": "הרשאות גישה נבדקות בזמן קומפילציה, ולכן התוכנית לא נבנית בכלל."

- id: cs.oop.classes-objects.005
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    var a = new Ticket();
    var b = new Ticket();
    var c = new Ticket();
    Console.WriteLine($"{a.Number} {Ticket.Issued}");

    class Ticket
    {
        public static int Issued;
        public int Number;

        public Ticket()
        {
            Issued++;
            Number = Issued;
        }
    }
  options: ["1 3", "3 3", "1 1", "3 1"]
  answer: 0
  explanation: "שדה `static` שייך למחלקה ויש ממנו עותק אחד, משותף לכל האובייקטים. שדה מופע (Instance Field) כמו `Number` נפרד לכל אובייקט. `a` קיבל `Number = 1` כשנוצר, ו-`Issued` הגיע ל-3 אחרי שלושה אובייקטים."
  optionExplanations:
    "1": "`Number` של `a` נקבע פעם אחת בבנאי שלו, ולא מתעדכן כשנוצרים אובייקטים אחרים."
    "2": "`Issued` הוא `static`, ולכן כל שלושת הבנאים מקדמים את אותו מונה."
    "3": "המספרים הפוכים: המונה המשותף הוא 3, והמספר של האובייקט הראשון הוא 1."

- id: cs.oop.classes-objects.006
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    var counter = new Counter();
    counter.Add(2).Add(3);
    Console.WriteLine(counter.Total);

    class Counter
    {
        public int Total;

        public Counter Add(int n)
        {
            Total += n;
            return this;
        }
    }
  options: ["5", "2", "3", "שגיאת קומפילציה"]
  answer: 0
  explanation: "`Add` מחזירה `this`, כלומר את אותו אובייקט. לכן `Add(3)` נקראת על אותו `counter`, והסכום הוא 5. זו שרשרת קריאות (Method Chaining)."
  optionExplanations:
    "1": "`return this` לא מחזיר עותק אלא הפניה לאותו אובייקט, ולכן גם הקריאה השנייה משנה את `counter`."
    "3": "מתודה יכולה להחזיר את טיפוס המחלקה שלה, ו-`return this` הוא קוד תקין."

- id: cs.oop.classes-objects.007
  type: single
  difficulty: 2
  prompt: כמה אובייקטים מטיפוס `Car` נוצרים בקוד?
  code: |
    Car a = new Car();
    Car b = a;
    Car c = new Car();
    Car d = c;
    Car e = null;

    class Car
    {
    }
  options: ["2", "4", "5", "3"]
  answer: 0
  explanation: "אובייקט נוצר רק עם `new`. יש כאן שתי קריאות ל-`new Car()`. המשתנים `b` ו-`d` רק מחזיקים הפניה לאובייקט קיים, ו-`e` לא מצביע על שום אובייקט."
  optionExplanations:
    "1": "השמה כמו `Car b = a;` מעתיקה הפניה, לא יוצרת אובייקט."
    "2": "משתנה הוא לא אובייקט. חמישה משתנים יכולים להצביע על שני אובייקטים בלבד, או על אף אחד (`null`)."

- id: cs.oop.classes-objects.008
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס את שטח המלבן, 12, אבל מדפיס 0. איזו שורה צריך לתקן?"
  code: |
    var rect = new Rectangle(3, 4);
    Console.WriteLine(rect.Area());

    class Rectangle
    {
        private int width;
        private int height;

        public Rectangle(int width, int height)
        {
            this.width = width;
            height = height;
        }

        public int Area() => width * height;
    }
  answer: 12
  fixed: |
    var rect = new Rectangle(3, 4);
    Console.WriteLine(rect.Area());

    class Rectangle
    {
        private int width;
        private int height;

        public Rectangle(int width, int height)
        {
            this.width = width;
            this.height = height;
        }

        public int Area() => width * height;
    }
  explanation: "בתוך הבנאי, השם `height` מתייחס לפרמטר, שמסתיר את השדה באותו שם. `height = height;` מציב את הפרמטר בעצמו, והשדה נשאר 0. צריך `this.height = height;` כדי לפנות לשדה של האובייקט."

- id: cs.oop.classes-objects.009
  type: truefalse
  difficulty: 2
  prompt: "אם מגדירים במחלקה בנאי עם פרמטרים בלבד, הקומפיילר עדיין מוסיף לה אוטומטית בנאי ריק בלי פרמטרים."
  answer: false
  explanation: "הקומפיילר מוסיף בנאי ברירת מחדל (Default Constructor) רק כשאין במחלקה אף בנאי. ברגע שמגדירים בנאי כלשהו, `new Person()` בלי ארגומנטים לא יתקמפל, אלא אם מגדירים גם בנאי ריק במפורש."

