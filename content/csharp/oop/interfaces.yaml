- id: cs.oop.interfaces.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    var duck = new Duck();
    IFlyer flyer = duck;
    ISwimmer swimmer = duck;
    flyer.Fly();
    swimmer.Swim();

    interface IFlyer { void Fly(); }
    interface ISwimmer { void Swim(); }

    class Duck : IFlyer, ISwimmer
    {
        public void Fly() => Console.WriteLine("Flying");
        public void Swim() => Console.WriteLine("Swimming");
    }
  options: ["Flying\nSwimming", "שגיאת קומפילציה", "Flying", "Swimming\nFlying"]
  answer: 0
  explanation: "מחלקה יכולה לממש כמה ממשקים (Interfaces) בבת אחת. `Duck` מקיימת את שני החוזים, ולכן אפשר להציב אותה גם במשתנה `IFlyer` וגם במשתנה `ISwimmer`. כל משתנה נותן גישה למה שהממשק שלו מגדיר."
  optionExplanations:
    "1": "המגבלה של \"בסיס אחד בלבד\" חלה על מחלקות. ממשקים אפשר לממש כמה שרוצים."
    "2": "שתי הקריאות מתבצעות, כל אחת דרך הממשק שלה, על אותו אובייקט."
    "3": "הפלט לפי סדר הקריאות בקוד: קודם `Fly`, אחר כך `Swim`."

- id: cs.oop.interfaces.002
  type: single
  difficulty: 1
  prompt: מה ממשק (interface) מגדיר ב-C#?
  options:
    - "חוזה: אילו מתודות ומאפיינים כל מחלקה שמממשת אותו חייבת לספק"
    - "מחלקה רגילה שאפשר ליצור ממנה אובייקטים עם `new`"
    - "שדות מופע שמשותפים לכל המחלקות שמממשות אותו"
    - "מחלקת בסיס שממנה יורשים שדות ובנאים"
  answer: 0
  explanation: "ממשק מתאר מה אובייקט יודע לעשות, בלי לקבוע איך. מחלקה שכותבת `: IShape` מתחייבת לממש את כל החברים שלו, והקומפיילר אוכף זאת. כך קוד יכול לעבוד מול `IShape` בלי להכיר את המחלקות עצמן."
  optionExplanations:
    "1": "`new IShape()` הוא שגיאת קומפילציה. יוצרים אובייקט ממחלקה שמממשת את הממשק."
    "2": "ממשק לא יכול להכיל שדות מופע. הוא מגדיר חברים כמו מתודות ומאפיינים, לא מצב."
    "3": "ממשק אינו מחלקת בסיס: אין לו בנאי מופע ואין לו שדות מופע."

- id: cs.oop.interfaces.003
  type: truefalse
  difficulty: 1
  prompt: "מחלקה ב-C# יכולה לרשת ממחלקת בסיס אחת, ובאותו זמן לממש כמה ממשקים."
  answer: true
  explanation: "ההצהרה `class Contractor : Employee, IPayable, IComparable<Contractor>` חוקית: מחלקת בסיס אחת (חייבת להופיע ראשונה), ואחריה כל מספר של ממשקים. כך מקבלים קוד משותף מהבסיס ויכולות נוספות מהממשקים."

- id: cs.oop.interfaces.004
  type: hierarchy
  difficulty: 1
  prompt: לפי הקוד, בחרו לכל זוג את היחס ביניהם.
  code: |
    interface IPayable
    {
        decimal Amount();
    }

    class Employee { }

    class Contractor : Employee, IPayable
    {
        public decimal Amount() => 1000;
    }

    class Invoice : IPayable
    {
        public decimal Amount() => 250;
    }

    class Payroll
    {
        private readonly List<IPayable> payables = new();
    }
  targets:
    - id: is-a
      desc: ירושה - Inheritance
    - id: implements
      desc: מימוש ממשק - Implements
    - id: has-a
      desc: הרכבה - Composition
  items:
    - label: "Contractor ו-Employee"
      answer: is-a
      why: Employee היא מחלקה, ו-Contractor יורשת ממנה.
    - label: "Contractor ו-IPayable"
      answer: implements
    - label: "Invoice ו-IPayable"
      answer: implements
      why: חשבונית ועובד קבלן לא קשורים זה לזה, אבל שניהם מקיימים את אותו חוזה.
    - label: "Payroll ו-IPayable"
      answer: has-a
      why: Payroll מחזיקה רשימה של IPayable, היא לא מממשת את הממשק.
  explanation: "אחרי הנקודתיים, מחלקה מציינת ירושה (is-a) וממשק מציין מימוש (implements). שדה או רשימה מטיפוס מסוים הם הרכבה (has-a). `Payroll` עובדת מול הממשק, ולכן היא מקבלת גם עובדים וגם חשבוניות."

- id: cs.oop.interfaces.005
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    var items = new List<IPriced> { new Book(), new Coffee(), new Book() };
    decimal total = 0;
    foreach (var item in items)
        total += item.Price;
    Console.WriteLine(total);

    interface IPriced
    {
        decimal Price { get; }
    }

    class Book : IPriced { public decimal Price => 40; }
    class Coffee : IPriced { public decimal Price => 12.5m; }
  options: ["92.5", "92", "52.5", "שגיאת קומפילציה"]
  answer: 0
  explanation: "ממשק יכול להגדיר גם מאפיינים, לא רק מתודות. הרשימה מטיפוס `List<IPriced>` מחזיקה אובייקטים שונים שמקיימים את אותו חוזה, והלולאה מחברת `40 + 12.5 + 40`."
  optionExplanations:
    "1": "`total` מטיפוס `decimal`, ולכן החלק העשרוני של 12.5 נשמר."
    "2": "יש ברשימה שני ספרים, וכל אחד מהם נספר."
    "3": "ממשק יכול להגדיר מאפיין עם `get`, והמחלקות מממשות אותו כמאפיין מחושב."

- id: cs.oop.interfaces.006
  type: output
  difficulty: 2
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    IFlyer flyer = new Duck();
    flyer.Swim();

    interface IFlyer { void Fly(); }
    interface ISwimmer { void Swim(); }

    class Duck : IFlyer, ISwimmer
    {
        public void Fly() => Console.WriteLine("Flying");
        public void Swim() => Console.WriteLine("Swimming");
    }
  options: ["Swimming", "שגיאת קומפילציה", "Flying", "שגיאה בזמן ריצה"]
  answer: 1
  explanation: "המשתנה `flyer` הוא מטיפוס `IFlyer`, והקומפיילר מאפשר דרכו רק את מה ש-`IFlyer` מגדיר: `Fly`. שהאובייקט עצמו הוא `Duck` שיודע לשחות לא משנה. כדי לשחות צריך הפניה מטיפוס `ISwimmer` או `Duck`."
  optionExplanations:
    "0": "האובייקט אכן יודע לשחות, אבל הקומפיילר בודק לפי טיפוס המשתנה, `IFlyer`."
    "3": "הבדיקה נעשית בזמן קומפילציה, ולכן התוכנית לא נבנית בכלל."

- id: cs.oop.interfaces.007
  type: single
  difficulty: 2
  prompt: "המחלקות `Invoice`, `Photo` ו-`Song` לא קשורות זו לזו, ולחלקן כבר יש מחלקת בסיס. כולן צריכות לדעת להישמר לקובץ. מה הפתרון המתאים?"
  options:
    - "ממשק `ISaveable` עם מתודה `Save`, שכל אחת מהן מממשת"
    - "מחלקת בסיס `Saveable` שכולן יורשות ממנה"
    - "להעתיק מתודת `Save` לכל מחלקה, בלי טיפוס משותף"
    - "לגרום ל-`Photo` ול-`Song` לרשת מ-`Invoice`"
  answer: 0
  explanation: "כשמחלקות לא קשורות צריכות יכולת משותפת, ממשק הוא הכלי: אין ביניהן יחס is-a, ולמחלקה יכולה להיות רק מחלקת בסיס אחת. עם `ISaveable` אפשר גם לכתוב קוד שמקבל `ISaveable` ושומר כל אחת מהן."
  optionExplanations:
    "1": "למחלקות שכבר יש להן בסיס אי אפשר להוסיף בסיס שני, ותמונה ושיר הם לא \"סוג של\" אובייקט שמיר."
    "2": "בלי טיפוס משותף אי אפשר לכתוב קוד אחד שמקבל כל אובייקט שיודע להישמר."
    "3": "תמונה היא לא סוג של חשבונית. ירושה כזו יוצרת יחס is-a שקרי רק כדי לשתף מתודה."

- id: cs.oop.interfaces.008
  type: single
  difficulty: 2
  tags: [compile-error]
  prompt: למה הקוד הבא לא מתקמפל?
  code: |
    interface ICounter
    {
        int count;
        void Increment();
    }
  options:
    - "ממשק לא יכול להכיל שדות מופע; הוא מגדיר התנהגות, לא מצב"
    - "חסרה המילה `public` לפני `void Increment()`"
    - "שם של ממשק חייב להסתיים ב-`able`"
    - "ממשק חייב להכיל לפחות מאפיין אחד"
  answer: 0
  explanation: "ממשק הוא חוזה: הוא מגדיר מתודות, מאפיינים ואירועים, אבל לא שדות מופע. אם המימוש צריך מונה, השדה נמצא במחלקה שמממשת. אם החוזה צריך לחשוף את הערך, מגדירים מאפיין: `int Count { get; }`."
  optionExplanations:
    "1": "חברי ממשק הם `public` כברירת מחדל, ולכן אין צורך לכתוב זאת."
