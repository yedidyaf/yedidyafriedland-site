- id: cs.oop.interfaces.010
  type: bug
  difficulty: 2
  prompt: "הקוד אמור למיין את השחקנים לפי ניקוד בסדר עולה ולהדפיס `Ben, Gal, Avi`, אבל מדפיס `Avi, Gal, Ben`. באיזו שורה הבאג?"
  code: |
    var players = new List<Player> { new("Avi", 30), new("Ben", 10), new("Gal", 20) };
    players.Sort();
    Console.WriteLine(string.Join(", ", players.Select(p => p.Name)));

    class Player : IComparable<Player>
    {
        public string Name { get; }
        public int Score { get; }

        public Player(string name, int score) { Name = name; Score = score; }

        public int CompareTo(Player other) => other.Score.CompareTo(Score);
    }
  answer: 12
  fixed: |
    var players = new List<Player> { new("Avi", 30), new("Ben", 10), new("Gal", 20) };
    players.Sort();
    Console.WriteLine(string.Join(", ", players.Select(p => p.Name)));

    class Player : IComparable<Player>
    {
        public string Name { get; }
        public int Score { get; }

        public Player(string name, int score) { Name = name; Score = score; }

        public int CompareTo(Player other) => Score.CompareTo(other.Score);
    }
  explanation: "`List.Sort()` משתמשת בחוזה של הממשק `IComparable<Player>`: `CompareTo` מחזירה מספר שלילי כשהאובייקט הנוכחי צריך לבוא לפני `other`. הקוד משווה בסדר הפוך (`other` מול `this`), ולכן המיון יורד. התיקון: `Score.CompareTo(other.Score)`."

- id: cs.oop.interfaces.011
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס מחיר אחרי 20% הנחה לסטודנט, אבל מדפיס את המחיר המלא, 100. באיזו שורה הבאג?"
  code: |
    IDiscount discount = new StudentDiscount();
    Console.WriteLine(discount.Apply(100));

    interface IDiscount
    {
        decimal Apply(decimal price) => price;
    }

    class StudentDiscount : IDiscount
    {
        public decimal Aply(decimal price) => price * 0.8m;
    }
  answer: 11
  fixed: |
    IDiscount discount = new StudentDiscount();
    Console.WriteLine(discount.Apply(100));

    interface IDiscount
    {
        decimal Apply(decimal price) => price;
    }

    class StudentDiscount : IDiscount
    {
        public decimal Apply(decimal price) => price * 0.8m;
    }
  explanation: "בגלל שגיאת הכתיב `Aply`, המתודה לא מממשת את `Apply` של הממשק אלא היא מתודה חדשה. ל-`Apply` יש מימוש ברירת מחדל (Default Implementation) בממשק, ולכן הקומפיילר לא מתלונן, והקריאה דרך `IDiscount` מחזירה את המחיר כמו שהוא. זה המחיר של מימוש ברירת מחדל: הוא לא מכריח את המחלקה לממש."

- id: cs.oop.interfaces.012
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    object[] items = { new Circle(), new Square(), new BigCircle(), new TextBox() };
    int count = 0;
    foreach (var item in items)
        if (item is IResizable)
            count++;
    Console.WriteLine(count);

    interface IResizable { void Resize(double factor); }

    class Shape { }
    class Circle : Shape, IResizable { public void Resize(double factor) { } }
    class Square : Shape { }
    class BigCircle : Circle { }
    class TextBox : IResizable { public void Resize(double factor) { } }
  options: ["3", "2", "4", "1"]
  answer: 0
  explanation: "`Circle` ו-`TextBox` מממשות את `IResizable` ישירות. `BigCircle` יורשת מ-`Circle`, ולכן היא מממשת את הממשק גם בלי לכתוב אותו. `Square` יורשת מ-`Shape`, שלא מממשת אותו, ולכן היא לא נספרת."
  optionExplanations:
    "1": "מחלקה יורשת מממשת את כל הממשקים של מחלקת הבסיס שלה, ולכן `BigCircle` נספרת."
    "2": "`Square` ו-`Circle` הן אחיות. הממשק ש-`Circle` מממשת לא עובר ל-`Square`."
    "3": "`TextBox` לא קשורה ל-`Shape`, אבל היא מממשת את הממשק בעצמה ולכן נספרת."

- id: cs.oop.interfaces.013
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    ILogger a = new PlainLogger();
    ILogger b = new LoudLogger();
    a.Info("x");
    b.Info("y");

    interface ILogger
    {
        void Write(string m);
        void Info(string m) => Write("info: " + m);
    }

    class PlainLogger : ILogger
    {
        public void Write(string m) => Console.WriteLine(m);
    }

    class LoudLogger : ILogger
    {
        public void Write(string m) => Console.WriteLine(m);
        public void Info(string m) => Write("INFO: " + m.ToUpper());
    }
  options: ["info: x\nINFO: Y", "info: x\ninfo: y", "x\ny", "שגיאת קומפילציה"]
  answer: 0
  explanation: "`Info` היא מתודה עם מימוש ברירת מחדל (Default Interface Method). `PlainLogger` לא מממשת אותה, ולכן רץ המימוש של הממשק, שקורא ל-`Write` של המחלקה. `LoudLogger` מגדירה `Info` ציבורית באותה חתימה, וזה המימוש שלה לממשק, ולכן הוא רץ."
  optionExplanations:
    "1": "מתודה ציבורית במחלקה שמתאימה לחתימה מממשת את חבר הממשק, גם אם יש לו מימוש ברירת מחדל."
    "2": "גם `Info` של הממשק וגם זו של `LoudLogger` מוסיפות קידומת לפני הקריאה ל-`Write`."
    "3": "מאז C# 8 ממשק יכול להכיל מתודה עם גוף, ומחלקה לא חייבת לממש אותה."

- id: cs.oop.interfaces.014
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    var device = new Printer();
    ((IPrinter)device).Print();
    ((IScanner)device).Print();
    device.Print();

    interface IPrinter { void Print(); }
    interface IScanner { void Print(); }

    class Printer : IPrinter, IScanner
    {
        public void Print() => Console.WriteLine("Printer");
        void IScanner.Print() => Console.WriteLine("Scanner");
    }
  options: ["Printer\nScanner\nPrinter", "Printer\nPrinter\nPrinter", "Printer\nScanner\nScanner", "שגיאת קומפילציה"]
  answer: 0
  explanation: "כששני ממשקים מגדירים מתודה באותה חתימה, אפשר לממש אחד מהם במפורש: `void IScanner.Print()`. מימוש מפורש (Explicit Implementation) נקרא רק דרך הפניה מטיפוס `IScanner`. דרך `IPrinter` ודרך `Printer` עצמה רצה המתודה הציבורית."
  optionExplanations:
    "1": "המימוש המפורש `IScanner.Print` גובר על המתודה הציבורית כשהקריאה היא דרך `IScanner`."
    "2": "דרך משתנה מטיפוס `Printer` אי אפשר בכלל לראות את המימוש המפורש, ולכן נקראת המתודה הציבורית."
    "3": "מימוש שני ממשקים עם אותה מתודה חוקי, ומימוש מפורש פותר את ההתנגשות."

- id: cs.oop.interfaces.015
  type: truefalse
  difficulty: 3
  tags: [compile-error]
  prompt: "בקוד הבא, הקריאה `logger.Info(\"ready\")` בשורה השנייה מתקמפלת, כי `ConsoleLogger` מממשת את `ILogger`, שיש בו מימוש ברירת מחדל ל-`Info`."
  code: |
    var logger = new ConsoleLogger();
    logger.Info("ready");

    interface ILogger
    {
        void Write(string m);
        void Info(string m) => Write("info: " + m);
    }

    class ConsoleLogger : ILogger
    {
        public void Write(string m) => Console.WriteLine(m);
    }
  answer: false
  explanation: "מימוש ברירת מחדל בממשק לא עובר בירושה למחלקה. הוא נגיש רק דרך הפניה מטיפוס הממשק. `logger` הוא מטיפוס `ConsoleLogger`, ולכן `Info` לא קיימת עבורו. `ILogger logger = new ConsoleLogger();` היה מתקמפל."

- id: cs.oop.interfaces.016
  type: hierarchy
  difficulty: 3
  prompt: "לכל טיפוס, בחרו ממי הוא יורש ישירות: מחלקת הבסיס עבור מחלקה, או הממשק שהוא מרחיב עבור ממשק."
  code: |
    interface IEntity
    {
        int Id { get; }
    }

    interface IAuditable : IEntity
    {
        DateTime CreatedAt { get; }
    }

    class BaseEntity : IEntity
    {
        public int Id { get; init; }
    }

    class Order : BaseEntity, IAuditable
    {
        public DateTime CreatedAt { get; init; }
    }

    class Customer : BaseEntity { }
  targets:
    - id: IEntity
    - id: IAuditable
    - id: BaseEntity
    - id: "object (אין מחלקת בסיס מפורשת)"
  items:
    - label: IAuditable
      answer: IEntity
      why: ממשק יכול להרחיב ממשק אחר. מי שמממש את IAuditable חייב לספק גם את Id.
    - label: BaseEntity
      answer: "object (אין מחלקת בסיס מפורשת)"
      why: BaseEntity מממשת את IEntity, אבל ממשק אינו מחלקת בסיס. הבסיס שלה הוא object.
    - label: Order
      answer: BaseEntity
      why: Order יורשת מ-BaseEntity ומממשת את IAuditable. את Id היא מקבלת בירושה מ-BaseEntity.
    - label: Customer
      answer: BaseEntity
  explanation: "בין ממשקים יש ירושה (`IAuditable : IEntity`). מחלקה יורשת ממחלקה אחת בלבד, וממשקים שהיא מממשת אינם מחלקות בסיס. `Order` מקיימת את `IAuditable` בעזרת מאפיין משלה (`CreatedAt`) ומאפיין שירשה (`Id`)."
