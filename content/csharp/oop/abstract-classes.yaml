    "2": "לא נוצר אובייקט באף תא. תאים של מערך מטיפוס הפניה מתחילים ב-`null`."
    "3": "גודל המערך נקבע ביצירה, 2, גם אם התאים ריקים."

- id: cs.oop.abstract-classes.015
  type: single
  difficulty: 3
  prompt: "מה אפשר להגדיר במחלקה מופשטת, ואי אפשר להגדיר בממשק (C# 12)?"
  options:
    - "שדות מופע ובנאי מופע (Instance Constructors)"
    - "מתודות עם מימוש"
    - "מאפיינים"
    - "מתודות שכל מחלקה יורשת חייבת לממש"
  answer: 0
  explanation: "מחלקה מופשטת יכולה להחזיק מצב (שדות מופע) ולאתחל אותו בבנאי, וממשק לא. מנגד, מחלקה יורשת ממחלקה מופשטת אחת בלבד, אבל יכולה לממש כמה ממשקים. אם צריך מצב וקוד משותף לקבוצה קרובה של מחלקות, בוחרים מחלקה מופשטת; אם צריך יכולת שמחלקות לא קשורות יחלקו, בוחרים ממשק."
