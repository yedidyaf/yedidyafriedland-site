    "2": "גם ממשק יכול להגדיר מאפיינים, למשל `decimal Price { get; }`."
    "3": "גם חברי ממשק בלי מימוש מחייבים כל מחלקה שמממשת אותו לספק להם מימוש."

- id: cs.oop.abstract-classes.016
  type: hierarchy
  difficulty: 3
  prompt: "לכל מחלקה, בחרו אם אפשר ליצור ממנה אובייקט עם `new`."
  code: |
    abstract class Shape
    {
        public abstract double Area();
    }

    abstract class Polygon : Shape
    {
        public int Sides { get; init; }
    }

    class Triangle : Polygon
    {
        public double Base { get; init; }
        public double Height { get; init; }
        public override double Area() => Base * Height / 2;
    }

    abstract class Logger
    {
        public void Log(string message) => Console.WriteLine(message);
    }

    class Circle : Shape
    {
        public double Radius { get; init; }
        public override double Area() => Math.PI * Radius * Radius;
    }
  targets:
    - id: "אפשר ליצור עם new"
    - id: "אי אפשר ליצור עם new"
  items:
    - label: Shape
      answer: "אי אפשר ליצור עם new"
    - label: Polygon
      answer: "אי אפשר ליצור עם new"
      why: Polygon מוגדרת abstract ולא מממשת את Area. מותר לה, כי היא מופשטת בעצמה.
    - label: Triangle
      answer: "אפשר ליצור עם new"
      why: Triangle קונקרטית ומשלימה את Area שעברה אליה דרך Polygon.
    - label: Logger
      answer: "אי אפשר ליצור עם new"
      why: אין ב-Logger אף מתודה מופשטת, אבל היא מוגדרת abstract, וזה מספיק כדי לאסור new.
    - label: Circle
      answer: "אפשר ליצור עם new"
  explanation: "המילה `abstract` על המחלקה היא שקובעת אם אפשר ליצור ממנה מופע, לא מספר המתודות החסרות. מחלקה קונקרטית בתחתית ההיררכיה חייבת לממש כל מתודה מופשטת שלא מומשה בדרך, גם כזו שהוגדרה שתי רמות מעליה."
