- id: cs.control-flow.loop-control.011
  type: truefalse
  difficulty: 2
  prompt: "בלולאת `for`, אחרי `continue` עדיין מתבצע חלק הקידום (למשל `i++`), ורק אז נבדק התנאי."
  answer: true
  explanation: "`continue` מדלג רק על שאר הגוף. בלולאת `for` הוא קופץ לחלק הקידום, ולכן הלולאה לא נתקעת. בלולאת `while` אין חלק קידום נפרד: אם `i++` כתוב בסוף הגוף, `continue` שלפניו ידלג גם עליו, והלולאה עלולה להפוך לאינסופית."

- id: cs.control-flow.loop-control.012
  type: bug
  difficulty: 1
  prompt: הקוד אמור להדפיס את כל המספרים שאינם שליליים, ולדלג רק על השליליים. באיזו שורה הבאג?
  code: |
    int[] values = { 4, -1, 7, -3, 9 };
    foreach (int v in values)
    {
        if (v < 0)
            break;
        Console.WriteLine(v);
    }
  answer: 5
  explanation: "`break` עוצר את הלולאה כולה במספר השלילי הראשון, ולכן רק 4 מודפס. כדי לדלג על איבר אחד ולהמשיך לבאים צריך `continue`."
  fixed: |
    int[] values = { 4, -1, 7, -3, 9 };
    foreach (int v in values)
    {
        if (v < 0)
            continue;
        Console.WriteLine(v);
    }

- id: cs.control-flow.loop-control.013
  type: bug
  difficulty: 2
  prompt: הקוד אמור להדפיס לוח כפל בגודל 3 על 3. באיזו שורה הבאג?
  code: |
    for (int i = 1; i <= 3; i++)
    {
        for (int j = 1; j <= 3; i++)
        {
            Console.Write(i * j + " ");
        }
        Console.WriteLine();
    }
  answer: 3
  explanation: "הלולאה הפנימית מקדמת את `i` במקום את `j`. לכן `j` נשאר 1, התנאי `j <= 3` תמיד אמת, והלולאה הפנימית לא נעצרת לעולם. בלולאות מקוננות, כל לולאה צריכה לקדם את המשתנה שלה. זו טעות העתק־הדבק נפוצה."
  fixed: |
    for (int i = 1; i <= 3; i++)
    {
        for (int j = 1; j <= 3; j++)
        {
            Console.Write(i * j + " ");
        }
        Console.WriteLine();
    }

- id: cs.control-flow.loop-control.014
  type: bug
  difficulty: 3
  prompt: "המתודה אמורה לבדוק אם `n` הוא מספר ראשוני. באיזו שורה הבאג?"
  code: |
    bool IsPrime(int n)
    {
        if (n < 2)
            return false;
        for (int d = 2; d * d < n; d++)
        {
            if (n % d == 0)
                return false;
        }
        return true;
    }
  answer: 5
  explanation: "מספיק לבדוק מחלקים עד השורש של `n`, אבל את השורש עצמו חייבים לבדוק. עם `d * d < n`, עבור `n = 9` הלולאה לא בודקת את `d = 3`, כי `9 < 9` שקר, ו-9 מוחזר כראשוני (וכך גם 4, 25 ו-49). תנאי העצירה הנכון הוא `d * d <= n`."
  fixed: |
    bool IsPrime(int n)
    {
        if (n < 2)
            return false;
        for (int d = 2; d * d <= n; d++)
        {
            if (n % d == 0)
                return false;
        }
        return true;
    }

- id: cs.control-flow.loop-control.015
  type: cleaner
  difficulty: 2
  prompt: שלוש הגרסאות בודקות אם `target` נמצא במערך. איזו נקייה יותר?
  options:
    - |
      bool Contains(int[] values, int target)
      {
          bool found = false;
          for (int i = 0; i < values.Length; i++)
          {
              if (values[i] == target)
                  found = true;
          }
          return found;
      }
    - |
      bool Contains(int[] values, int target)
      {
          bool found = false;
          int i = 0;
          while (i < values.Length && !found)
          {
              if (values[i] == target)
                  found = true;
              i++;
          }
          return found;
      }
    - |
      bool Contains(int[] values, int target)
      {
          foreach (int value in values)
          {
              if (value == target)
                  return true;
          }
          return false;
      }
  answer: 2
  explanation: "`return true` ברגע שהערך נמצא עוצר את החיפוש ומחזיר את התשובה בבת אחת, בלי משתנה דגל ובלי אינדקס. אם הלולאה הסתיימה, הערך לא נמצא. זו יציאה מוקדמת (Early Return), הדרך הקריאה ביותר לעצור לולאת חיפוש."
  optionExplanations:
    "0": "הגרסה ממשיכה לעבור על כל המערך גם אחרי שהערך נמצא, ומשתנה הדגל מוסיף מצב שהקורא צריך לעקוב אחריו."
    "1": "תנאי עצירה כפול, דגל ואינדקס ידני משיגים את מה ש-`return` עושה בשורה אחת."

- id: cs.control-flow.loop-control.016
  type: single
  difficulty: 3
  prompt: מה הבעיה בלולאה הבאה?
  code: |
    for (double x = 0; x != 1.0; x += 0.1)
    {
        Console.WriteLine(x);
    }
  options:
    - "הלולאה תרוץ 10 פעמים בדיוק ותיעצר כש-`x` יהיה `1.0`"
    - "הלולאה לא תיעצר, כי בגלל שגיאות עיגול `x` לעולם לא יהיה שווה בדיוק ל-`1.0`"
    - "שגיאת קומפילציה, כי משתנה של לולאת `for` חייב להיות מטיפוס `int`"
    - "הלולאה תרוץ 11 פעמים, כי היא כוללת גם את `1.0`"
  answer: 1
  explanation: "`0.1` לא ניתן לייצוג מדויק ב-`double`. אחרי עשר הוספות `x` הוא `0.9999999999999999` ולא `1.0`, ובסיבוב הבא הוא כבר גדול מ-1, כך ש-`x != 1.0` נשאר אמת לתמיד. תנאי עצירה עם `!=` על מספרים עשרוניים מסוכן: משתמשים ב-`x < 1.0`, או במונה שלם."
  optionExplanations:
    "0": "זה היה נכון בחשבון מדויק, אבל `double` צובר שגיאות עיגול, ו-`x` מדלג מעל `1.0` בלי להיות שווה לו."
    "2": "משתנה לולאה יכול להיות מכל טיפוס, גם `double`."
    "3": "`x` אף פעם לא שווה ל-`1.0`, ובכל מקרה תנאי `!=` לא היה מריץ סיבוב עם `x == 1.0`."
