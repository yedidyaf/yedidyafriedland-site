- id: cs.control-flow.loop-control.019
  type: order
  difficulty: 2
  tags: [algorithm]
  prompt: "סדרו את השורות כך שהלולאות המקוננות ידפיסו משולש של כוכביות."
  code: |
    for (int i = 1; i <= 3; i++)
    {
        for (int j = 1; j <= i; j++)
        {
            Console.Write("*");
        }
        Console.WriteLine();
    }
  output: "*\n**\n***"
  explanation: "הלולאה החיצונית קובעת את מספר השורה `i`, והפנימית מדפיסה `i` כוכביות באותה שורה עם `Console.Write`. ירידת השורה `Console.WriteLine()` נמצאת אחרי הלולאה הפנימית ובתוך החיצונית: פעם אחת בכל שורה."
