- id: cs.control-flow.loop-control.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    for (int i = 1; i <= 10; i++)
    {
        if (i == 4)
            break;
        Console.Write(i);
    }
  options: ["1234", "123", "12345678910", "1235678910"]
  answer: 1
  explanation: "`break` מסיים את הלולאה מיד. כש-`i` הוא 4, ה-`break` רץ לפני ההדפסה, והלולאה נגמרת בלי לחזור אליה."
  optionExplanations:
    "0": "`break` נמצא לפני `Console.Write`, ולכן 4 לא מודפס."
    "3": "דילוג על 4 בלבד והמשך הלולאה הוא מה ש-`continue` עושה, לא `break`."

- id: cs.control-flow.loop-control.002
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    for (int i = 1; i <= 6; i++)
    {
        if (i % 3 == 0)
            continue;
        Console.Write(i);
    }
  options: ["12", "36", "1245", "123456"]
  answer: 2
  explanation: "`continue` מדלג על שאר הגוף בסיבוב הנוכחי וממשיך לסיבוב הבא. עבור 3 ו-6, שמתחלקים ב-3, ההדפסה מדולגת, ושאר המספרים מודפסים."
  optionExplanations:
    "0": "12 הוא מה שהיה מודפס עם `break`, שעוצר את הלולאה כולה כש-`i` הוא 3."
    "1": "36 הם בדיוק המספרים שמדולגים. התנאי קובע מתי לדלג, לא מה להדפיס."

- id: cs.control-flow.loop-control.003
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    for (int i = 1; i <= 3; i++)
    {
        for (int j = 1; j <= 3; j++)
        {
            if (j == 2)
                break;
            Console.Write(i + "" + j + " ");
        }
    }
  options: ["11", "11 21 31", "11 13 21 23 31 33", "11 12 21 22 31 32"]
  answer: 1
  explanation: "`break` יוצא רק מהלולאה הפנימית ביותר שבה הוא נמצא. בכל סיבוב של `i` הלולאה הפנימית מדפיסה את `j = 1` ונעצרת ב-`j = 2`, ואז הלולאה החיצונית ממשיכה ל-`i` הבא."
  optionExplanations:
    "0": "התשובה הזו מניחה ש-`break` יוצא מכל הלולאות המקוננות. הוא יוצא רק מהפנימית."
    "2": "זה הפלט עם `continue`, שמדלג רק על `j = 2` וממשיך ל-`j = 3`."
    "3": "ה-`break` רץ כש-`j == 2`, לפני ההדפסה, ולכן `j = 2` לא מודפס."

- id: cs.control-flow.loop-control.004
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    for (int i = 0; i < 4; i++)
    {
        switch (i)
        {
            case 2:
                break;
            default:
                Console.Write(i);
                break;
        }
    }
  options: ["013", "01", "0123", "2"]
  answer: 0
  explanation: "`break` יוצא מהמבנה הפנימי ביותר שעוטף אותו, ובתוך `switch` זה ה-`switch` ולא הלולאה. עבור `i = 2` ה-`break` רק מסיים את ה-`switch` בלי להדפיס, והלולאה ממשיכה ל-3. כדי לצאת מהלולאה מתוך `switch` משתמשים בדגל, ב-`return`, או בשרשרת `if` במקום `switch`."
  optionExplanations:
    "1": "01 מניח שה-`break` ב-`case 2` יוצא מהלולאה. הוא יוצא רק מה-`switch`."
    "2": "עבור 2 נבחר `case 2`, שבו אין הדפסה. `default` רץ רק לערכים שאין להם `case`."

- id: cs.control-flow.loop-control.005
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    bool found = false;
    for (int i = 1; i <= 3 && !found; i++)
    {
        for (int j = 1; j <= 3; j++)
        {
            if (i * j == 4)
            {
                found = true;
                break;
            }
        }
        Console.Write(i);
    }
  options: ["1", "12", "123", "2"]
  answer: 1
  explanation: "כש-`i = 2` ו-`j = 2` המכפלה היא 4: הדגל (Flag) `found` נדלק וה-`break` יוצא רק מהלולאה הפנימית. לכן `Console.Write(i)` עדיין רץ ומדפיס 2. היציאה מהלולאה החיצונית קורית רק בבדיקת התנאי הבא, כש-`!found` הוא `false`. זו דרך מקובלת לעצור לולאות מקוננות."
  optionExplanations:
    "0": "1 מניח שה-`break` עוצר מיד גם את הלולאה החיצונית, לפני ההדפסה של 2."
    "2": "123 מתעלם מכך שתנאי העצירה של הלולאה החיצונית כולל גם את `!found`."
    "3": "בסיבוב `i = 1` אף מכפלה אינה 4, והלולאה הפנימית מסתיימת כרגיל, ולכן 1 מודפס."

- id: cs.control-flow.loop-control.006
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int n = 1;
    while (true)
    {
        n *= 3;
        if (n > 50)
            break;
    }
    Console.WriteLine(n);
  options: ["27", "50", "243", "81"]
  answer: 3
  explanation: "`while (true)` לא נעצרת מעצמה: תנאי העצירה נמצא בתוך הגוף. `n` עובר את הערכים 3, 9, 27 ו-81, ורק 81 גדול מ-50, ואז `break` יוצא מהלולאה. הבדיקה באה אחרי ההכפלה, ולכן מודפס הערך הראשון שעבר את הגבול."
  optionExplanations:
    "0": "27 הוא הערך האחרון שלא עבר את 50. ההכפלה ל-81 קורית לפני הבדיקה שמפעילה את `break`."
    "1": "50 הוא הגבול בתנאי, לא ערך ש-`n` מקבל. `n` הוא תמיד חזקה של 3."
    "2": "אחרי `break` הלולאה נגמרת מיד, ולכן אין הכפלה נוספת ל-243."

- id: cs.control-flow.loop-control.008
  type: single
  difficulty: 1
  prompt: "מה עושה `continue` בתוך לולאה?"
  options:
    - "מדלג על שאר הגוף בסיבוב הנוכחי ועובר לסיבוב הבא"
    - "יוצא מהלולאה וממשיך לקוד שאחריה"
    - "מתחיל את הלולאה מחדש מהסיבוב הראשון"
    - "ממשיך לסיבוב הבא בלי לבדוק את תנאי הלולאה"
  answer: 0
  explanation: "`continue` מסיים רק את הסיבוב הנוכחי. הלולאה ממשיכה כרגיל: בלולאת `for` מתבצע הקידום ואז נבדק התנאי, וב-`while` נבדק התנאי. כדי לצאת מהלולאה כולה משתמשים ב-`break`."
  optionExplanations:
    "1": "זה התיאור של `break`."
    "2": "`continue` לא מאפס את הלולאה. המונה ממשיך מהמקום שבו היה."
    "3": "התנאי נבדק כרגיל לפני הסיבוב הבא, ואם הוא שקר הלולאה נגמרת."

- id: cs.control-flow.loop-control.009
  type: single
  difficulty: 2
  prompt: כתבתם שתי לולאות מקוננות, ואתם רוצים לצאת משתיהן ברגע שנמצא ערך מסוים. איזו דרך עובדת ב-C#?
  options:
    - "לכתוב `break 2;` כדי לצאת משתי רמות"
    - "לתת תווית ללולאה החיצונית ולכתוב `break outer;`, כמו ב-Java"
    - "להשתמש במשתנה בוליאני (דגל) שמקבל `true` כשנמצא הערך, ולבדוק אותו בתנאי של הלולאה החיצונית"
    - "לכתוב `break;` פעמיים ברצף"
  answer: 2
  explanation: "ב-C# `break` יוצא תמיד מלולאה אחת בלבד, ואין `break` עם מספר או עם תווית. הדרך המקובלת היא דגל (Flag): הלולאה הפנימית מציבה בו `true` ויוצאת עם `break`, והתנאי של הלולאה החיצונית בודק אותו, למשל `i < n && !found`."
  optionExplanations:
    "0": "`break 2` קיים ב-PHP. ב-C# זו שגיאת קומפילציה."
    "1": "ל-C# אין `break` עם תווית."
    "3": "ה-`break` הראשון יוצא מהלולאה הפנימית, והשני לא ירוץ אף פעם, כי אי אפשר להגיע אליו (Unreachable Code)."

- id: cs.control-flow.loop-control.010
  type: truefalse
  difficulty: 1
