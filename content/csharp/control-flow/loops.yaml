- id: cs.control-flow.loops.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    for (int i = 0; i < 3; i++)
    {
        Console.Write(i);
    }
  options: ["012", "0123", "123", "0\n1\n2"]
  answer: 0
  explanation: "לולאת `for` מאתחלת את `i` ל-0, בודקת את התנאי לפני כל סיבוב ומקדמת את `i` בסוף כל סיבוב. כש-`i` מגיע ל-3 התנאי `i < 3` נכשל והלולאה נגמרת. `Console.Write` לא יורד שורה, ולכן הספרות צמודות."
  optionExplanations:
    "1": "3 לא מודפס: התנאי נבדק לפני הסיבוב, ו-`3 < 3` שקר."
    "2": "הלולאה מתחילה ב-`i = 0`, ולכן 0 הוא הערך הראשון שמודפס."
    "3": "`Console.Write`, בניגוד ל-`Console.WriteLine`, לא מוסיף ירידת שורה."

- id: cs.control-flow.loops.002
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int count = 5;
    do
    {
        Console.WriteLine("run " + count);
        count++;
    } while (count < 5);
    Console.WriteLine(count);
  options: ["5", "run 5\n6", "run 5\n5", "שגיאת קומפילציה"]
  answer: 1
  explanation: "בלולאת `do-while` התנאי נבדק בסוף כל סיבוב, ולכן הגוף רץ לפחות פעם אחת, גם כשהתנאי שקר מההתחלה. הגוף מדפיס `run 5` ומקדם את `count` ל-6. אז `6 < 5` שקר והלולאה נגמרת."
  optionExplanations:
    "0": "זה הפלט של לולאת `while`, שבודקת את התנאי לפני הסיבוב הראשון. `do-while` מריצה את הגוף קודם."
    "2": "`count++` רץ בתוך הגוף לפני בדיקת התנאי, ולכן `count` כבר 6 כשהלולאה נגמרת."

- id: cs.control-flow.loops.003
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    int i;
    for (i = 1; i <= 10; i *= 2)
    {
        Console.Write(i + " ");
    }
    Console.WriteLine();
    Console.WriteLine(i);
  options: ["1 2 4 8\n8", "1 2 4 8\n16", "1 2 4 8 16\n16", "2 4 8\n16"]
  answer: 1
  explanation: "חלק הקידום `i *= 2` רץ אחרי כל סיבוב, ורק אחריו נבדק התנאי. אחרי ההדפסה של 8, `i` הופך ל-16, התנאי `16 <= 10` נכשל והלולאה נעצרת, אבל `i` נשאר 16. כאן `i` הוצהר מחוץ ללולאה, ולכן הוא נגיש גם אחריה."
  optionExplanations:
    "0": "הקידום מתבצע לפני הבדיקה שמסיימת את הלולאה, ולכן `i` הוא 16 ולא הערך האחרון שהודפס."
    "2": "16 לא מודפס, כי התנאי `16 <= 10` נבדק לפני הסיבוב ונכשל."
    "3": "הקידום רץ רק בסוף הסיבוב, ולכן בסיבוב הראשון `i` עדיין 1."

- id: cs.control-flow.loops.006
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int number = 1234;
    int sum = 0;
    while (number > 0)
    {
        sum += number % 10;
        number /= 10;
    }
    Console.WriteLine(sum);
  options: ["4321", "10", "1234", "4"]
  answer: 1
  explanation: "`number % 10` מחזיר את הספרה האחרונה, ו-`number /= 10` מסיר אותה (חלוקה שלמה). הלולאה מחברת 4 + 3 + 2 + 1 ועוצרת כש-`number` מגיע ל-0. לולאת `while` מתאימה כאן, כי מספר הסיבובים תלוי במספר הספרות ואינו ידוע מראש."
  optionExplanations:
    "0": "4321 הוא היפוך המספר, שדורש `sum = sum * 10 + number % 10`. כאן הספרות רק מחוברות."
    "3": "4 הוא רק הספרה הראשונה שנאספת. הלולאה ממשיכה כל עוד `number > 0`."

- id: cs.control-flow.loops.007
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    int limit = 3;
    for (int i = 0; i < limit; i++)
    {
        Console.Write(i);
        if (i == 1)
            limit = 5;
    }
  options: ["012", "01234", "01", "0123"]
  answer: 1
  explanation: "התנאי של `for` מחושב מחדש לפני כל סיבוב, עם הערך הנוכחי של `limit`. כש-`i` הוא 1, `limit` משתנה ל-5, ולכן הלולאה ממשיכה עד `i = 4`. הגבול לא «מוקפא» ברגע שהלולאה מתחילה."
  optionExplanations:
    "0": "012 מניח שהתנאי מחושב פעם אחת בלבד, בתחילת הלולאה."
    "3": "התנאי `i < 5` מתקיים גם עבור 4, ולכן 4 מודפס."

- id: cs.control-flow.loops.009
  type: single
  difficulty: 2
  prompt: תוכנית צריכה לבקש מהמשתמש סיסמה, ולבקש שוב כל עוד הסיסמה שגויה. איזו לולאה מתאימה ביותר?
  options: ["`for`", "`foreach`", "`while`", "`do-while`"]
  answer: 3
  explanation: "את הסיסמה צריך לבקש לפחות פעם אחת, ורק אחר כך לבדוק אם לחזור. זו בדיוק `do-while`: הגוף רץ ואז נבדק התנאי. עם `while` צריך לבקש את הקלט פעם אחת לפני הלולאה ופעם בתוכה, כלומר לשכפל קוד."
  optionExplanations:
    "0": "`for` מתאימה כשמספר הסיבובים ידוע מראש. כאן הוא תלוי במשתמש."
    "1": "`foreach` עוברת על אוסף קיים. כאן אין אוסף, יש קלט שחוזר עד שמתקיים תנאי."
    "2": "`while` אפשרית, אבל מחייבת לבקש את הסיסמה גם לפני הלולאה, כך שהקריאה משוכפלת."

- id: cs.control-flow.loops.010
  type: single
  difficulty: 2
  prompt: "באיזה מקרה לולאת `while` מתאימה יותר מלולאת `for`?"
  options:
    - "כשעוברים על כל איברי מערך לפי הסדר"
    - "כשמספר הסיבובים אינו ידוע מראש ותלוי בתנאי שמשתנה בתוך הלולאה"
    - "כשצריך לחזור על פעולה בדיוק 10 פעמים"
    - "כשהגוף חייב לרוץ לפחות פעם אחת, גם אם התנאי שקר"
  answer: 1
  explanation: "`while` מבטאת «כל עוד התנאי מתקיים», ולכן היא טבעית כשלא יודעים מראש כמה סיבובים יהיו, למשל עד שהמספר מגיע ל-0 או עד שנמצא ערך. `for` מתאימה למונה עם התחלה, גבול וקידום ידועים, ו-`foreach` למעבר על אוסף."
  optionExplanations:
    "0": "למעבר על כל איברי אוסף הכלי הטבעי הוא `foreach`."
    "2": "מספר סיבובים ידוע הוא המקרה הקלאסי של `for`, שבה המונה, הגבול והקידום כתובים בשורה אחת."
    "3": "זה התיאור של `do-while`. לולאת `while` בודקת את התנאי לפני הסיבוב הראשון."

- id: cs.control-flow.loops.011
  type: truefalse
  difficulty: 1
  prompt: "בלולאת `while`, אם התנאי שקר כבר בבדיקה הראשונה, גוף הלולאה לא ירוץ אף פעם."
  answer: true
  explanation: "`while` בודקת את התנאי לפני כל סיבוב, כולל הראשון, ולכן הגוף יכול לרוץ אפס פעמים. זה ההבדל המרכזי מ-`do-while`, שבודקת את התנאי בסוף הסיבוב ולכן מריצה את הגוף לפחות פעם אחת."

- id: cs.control-flow.loops.013
  type: bug
  difficulty: 1
  prompt: "הקוד אמור להדפיס את סכום המספרים מ-1 עד `n`, כולל `n`. עבור `n = 5` צריך להיות מודפס `15`. איזו שורה צריך לתקן?"
  code: |
    int n = 5;
    int sum = 0;
    for (int i = 1; i < n; i++)
    {
        sum += i;
    }
    Console.WriteLine(sum);
  answer: 3
  explanation: "התנאי `i < n` עוצר לפני `n`, כך שהמספר האחרון לא נכנס לסכום ומודפס 10 במקום 15. זו טעות «פחות אחד» (Off-by-one). כשהגבול כלול, התנאי הוא `i <= n`."
  fixed: |
    int n = 5;
    int sum = 0;
    for (int i = 1; i <= n; i++)
    {
        sum += i;
    }
    Console.WriteLine(sum);

- id: cs.control-flow.loops.017
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    int sum = 0;
    for (int i = 1; i <= 4; i++)
    {
        sum += i;
    }
    Console.WriteLine(sum);
  options: ["10", "6", "4", "1234"]
  answer: 0
  explanation: "`sum` הוא צובר (Accumulator): בכל סיבוב מוסיפים לו את `i`. הוא עובר 1, 3, 6 ולבסוף 10. התנאי `i <= 4` כולל את 4."
  optionExplanations:
    "1": "6 הוא הסכום עד 3. התנאי `i <= 4` כולל גם את 4."
    "2": "4 הוא מספר הסיבובים, לא הסכום."
    "3": "`sum` ו-`i` הם מספרים, ולכן `+=` מחבר ולא משרשר."

- id: cs.control-flow.loops.018
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    int i = 10;
    while (i > 0)
    {
        Console.Write(i + " ");
        i -= 3;
    }
  options: ["10 7 4 1", "10 7 4 1 -2", "10 7 4", "7 4 1"]
  answer: 0
  explanation: "התנאי נבדק לפני כל סיבוב. אחרי ההדפסה של 1, `i` הופך ל-2-, התנאי `-2 > 0` שקר, והלולאה נגמרת בלי להדפיס אותו."
  optionExplanations:
    "1": "2- לא מודפס, כי התנאי נבדק לפני הגוף ומחזיר שקר."
    "2": "כש-`i` הוא 1, התנאי `1 > 0` עדיין אמת, ולכן 1 מודפס."
    "3": "ההדפסה באה לפני החיסור, ולכן 10 מודפס ראשון."

- id: cs.control-flow.loops.019
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int count = 0;
    for (int i = 1; i <= 20; i++)
    {
        if (i % 4 == 0)
            count++;
    }
    Console.WriteLine(count);
  options: ["5", "4", "20", "6"]
  answer: 0
  explanation: "`count` הוא מונה (Counter): הוא גדל ב-1 רק כשהתנאי מתקיים. בין 1 ל-20 יש 5 כפולות של 4: 4, 8, 12, 16 ו-20."
  optionExplanations:
    "1": "התנאי `i <= 20` כולל את 20, שגם הוא כפולה של 4."
    "2": "המונה גדל רק כשהתנאי מתקיים, לא בכל סיבוב."
    "3": "0 לא נבדק, כי הלולאה מתחילה מ-1."

- id: cs.control-flow.loops.020
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    for (int i = 1; i <= 3; i++)
    {
        for (int j = 1; j <= i; j++)
        {
            Console.Write("*");
        }
        Console.WriteLine();
    }
  options: ["*\n**\n***", "***\n***\n***", "***\n**\n*", "******"]
  answer: 0
  explanation: "בלולאות מקוננות (Nested Loops) הלולאה הפנימית רצה מההתחלה בכל סיבוב של החיצונית. הגבול של הפנימית הוא `i`, ולכן בשורה הראשונה כוכבית אחת, בשנייה שתיים ובשלישית שלוש."
  optionExplanations:
    "1": "הגבול של הלולאה הפנימית הוא `i`, ולא 3, ולכן אורך השורה משתנה."
    "2": "`i` גדל מ-1 ל-3, ולכן השורות מתארכות ולא מתקצרות."
    "3": "`Console.WriteLine()` אחרי הלולאה הפנימית יורדת שורה בכל סיבוב של החיצונית."

- id: cs.control-flow.loops.021
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס את המכפלה של המספרים מ-1 עד 5, כלומר `120`. בפועל מודפס `0`. איזו שורה צריך לתקן?"
  code: |
    int product = 0;
    for (int i = 1; i <= 5; i++)
    {
        product *= i;
    }
    Console.WriteLine(product);
  answer: 1
  explanation: "צובר של מכפלה חייב להתחיל מ-1, האיבר הנייטרלי של כפל. כשמתחילים מ-0, כל כפל נותן 0 והתוצאה נשארת 0. צובר של סכום מתחיל מ-0, וצובר של מכפלה מתחיל מ-1."
  fixed: |
    int product = 1;
    for (int i = 1; i <= 5; i++)
    {
        product *= i;
    }
    Console.WriteLine(product);

- id: cs.control-flow.loops.022
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    int a = 0;
    int b = 1;
    for (int i = 0; i < 5; i++)
    {
        int t = a + b;
        a = b;
        b = t;
    }
    Console.WriteLine(a);
  options: ["5", "8", "3", "13"]
  answer: 0
  explanation: "זו סדרת פיבונאצ'י: בכל סיבוב `a` מקבל את הערך של `b`, ו-`b` מקבל את הסכום. אחרי כל סיבוב `a` הוא 1, 1, 2, 3 ולבסוף 5. כדאי לעקוב בטבלה עם עמודה לכל משתנה."
  optionExplanations:
    "1": "8 הוא הערך של `b` בסוף, לא של `a`."
    "2": "3 הוא הערך של `a` אחרי ארבעה סיבובים, אבל הלולאה רצה חמש פעמים (0 עד 4)."
    "3": "13 היה מתקבל אחרי שבעה סיבובים."

- id: cs.control-flow.loops.023
  type: cleaner
  difficulty: 1
  prompt: שתי הגרסאות מדפיסות את המספרים מ-1 עד 10. איזו נקייה יותר?
  options:
    - |
      for (int i = 1; i <= 10; i++)
      {
          Console.WriteLine(i);
      }
    - |
      int i = 1;
      while (true)
      {
          if (i > 10)
              break;
          Console.WriteLine(i);
          i++;
      }
  answer: 0
  explanation: "כשמספר הסיבובים ידוע מראש, `for` מרכזת בשורה אחת את כל מה שמנהל את הלולאה: ערך התחלתי, תנאי וקידום. כך רואים מיד כמה פעמים היא רצה."
  optionExplanations:
    "1": "`while (true)` עם `break` מפזר את תנאי העצירה בתוך הגוף, והקורא צריך לחפש אותו."
