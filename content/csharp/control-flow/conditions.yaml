- id: cs.control-flow.conditions.023
  type: order
  difficulty: 2
  tags: [algorithm]
  prompt: "סדרו את השורות כך שהתוכנית תחשב ערך מוחלט, ותדפיס אם הוא זוגי או אי-זוגי."
  code: |
    int x = -7;
    if (x < 0)
        x = -x;
    if (x % 2 == 0)
        Console.WriteLine(x + " even");
    else
        Console.WriteLine(x + " odd");
  output: "7 odd"
  explanation: "ערך מוחלט (Absolute Value): אם המספר שלילי, הופכים את הסימן שלו. זה חייב לקרות לפני ההדפסה, אחרת יודפס `-7`. בבדיקת הזוגיות, ה-`else` שייך ל-`if` שלפניו, ולכן ההדפסה של `odd` באה אחרי `else`."
