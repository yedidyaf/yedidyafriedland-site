- id: cs.control-flow.conditions.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    int score = 85;
    if (score >= 60)
        Console.WriteLine("Pass");
    else if (score >= 80)
        Console.WriteLine("Good");
    else
        Console.WriteLine("Fail");
  options: ["Pass", "Good", "Pass\nGood", "Fail"]
  answer: 0
  explanation: "בשרשרת `if` / `else if` / `else` התנאים נבדקים לפי הסדר, ורק הבלוק של התנאי הראשון שמתקיים רץ. `85 >= 60` מתקיים כבר בבדיקה הראשונה, ולכן שאר הענפים לא נבדקים בכלל, גם אם `score >= 80` נכון."
  optionExplanations:
    "1": "`Good` היה מודפס רק אם `score >= 80` היה נבדק ראשון. בסדר הזה הענף אף פעם לא ירוץ, כי כל ציון של 80 ומעלה כבר עונה על התנאי הראשון."
    "2": "רק ענף אחד בשרשרת רץ. אחרי שתנאי מתקיים, כל ה-`else` שאחריו מדולגים."

- id: cs.control-flow.conditions.004
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int count = 0;
    int total = 50;
    if (count == 0 || total / count < 10)
        Console.WriteLine("low");
    else
        Console.WriteLine("high");
  options: ["high", "DivideByZeroException", "low", "שגיאת קומפילציה"]
  answer: 2
  explanation: "ב-`||` מספיק שאגף אחד יהיה אמת. `count == 0` אמת, ולכן `total / count` לא מחושב כלל ואין חלוקה באפס. זו תבנית נפוצה: שמים את בדיקת השמירה ראשונה, כדי שהאגף המסוכן ירוץ רק כשהוא בטוח."
  optionExplanations:
    "0": "`high` דורש ששני האגפים יהיו שקר, אבל `count == 0` אמת."
    "1": "החלוקה באפס הייתה קורית רק אם `total / count` היה מחושב. ב-`||` האגף הימני מדולג כשהשמאלי אמת."

- id: cs.control-flow.conditions.006
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int n = 5;
    if (n > 10)
        Console.WriteLine("big");
        Console.WriteLine("checked");
    Console.WriteLine("done");
  options: ["done", "checked\ndone", "big\nchecked\ndone", "big\ndone"]
  answer: 1
  explanation: "בלי סוגריים מסולסלים `{}`, גוף ה-`if` הוא רק הפקודה הראשונה שאחריו. ההזחה של השורה השנייה מטעה: הקומפיילר מתעלם מהזחה, ו-`Console.WriteLine(\"checked\")` רץ תמיד. לכן מומלץ לשים סוגריים מסולסלים גם סביב פקודה אחת."
  optionExplanations:
    "0": "התשובה הזו מניחה ש-`checked` שייכת ל-`if` בגלל ההזחה. ב-C# ההזחה לא משפיעה על המשמעות."
    "2": "`5 > 10` שקר, ולכן `big` לא מודפס."

- id: cs.control-flow.conditions.007
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    int a = 5, b = 0;
    if (a > 0)
        if (b > 0)
            Console.WriteLine("both positive");
    else
        Console.WriteLine("a is not positive");
    Console.WriteLine("end");
  options: ["end", "both positive\nend", "a is not positive\nend", "שגיאת קומפילציה"]
  answer: 2
  explanation: "זו בעיית ה-else התלוי (Dangling Else): `else` משויך תמיד ל-`if` הקרוב ביותר שעדיין אין לו `else`, כלומר ל-`if (b > 0)`, בלי קשר להזחה. `a > 0` אמת ו-`b > 0` שקר, ולכן רץ ה-`else` של התנאי הפנימי ומודפסת הודעה מטעה. סוגריים מסולסלים סביב ה-`if` הפנימי היו מונעים את הבלבול."
  optionExplanations:
    "0": "`end` לבד מניח שה-`else` שייך ל-`if (a > 0)`, כפי שההזחה מרמזת. הקומפיילר משייך אותו ל-`if` הפנימי."
    "1": "`b` הוא 0, ולכן `b > 0` שקר."
    "3": "`if` מקונן בלי סוגריים הוא חוקי. הבעיה כאן היא בקריאות, לא בקומפילציה."

- id: cs.control-flow.conditions.008
  type: single
  difficulty: 1
  tags: [compile-error]
  prompt: מה יקרה כשננסה לקמפל ולהריץ את הקוד?
  code: |
    int count = 3;
    if (count)
        Console.WriteLine("has items");
  options:
    - "יודפס `has items`, כי כל מספר שונה מ-0 נחשב אמת"
    - "שגיאת קומפילציה, כי התנאי ב-`if` חייב להיות מטיפוס `bool`"
    - "לא יודפס כלום, כי רק 1 נחשב אמת"
    - "תיזרק `InvalidCastException` בזמן ריצה"
  answer: 1
  explanation: "ב-C#, בניגוד ל-C, ל-JavaScript ול-Python, אין המרה מרומזת ממספר ל-`bool`. התנאי של `if` חייב להיות ביטוי בוליאני, ולכן צריך לכתוב במפורש `if (count > 0)`."
  optionExplanations:
    "0": "כך מתנהגות C ו-Python. ב-C# `int` לא מומר ל-`bool` בשום מצב."
    "3": "הבעיה מתגלה כבר בקומפילציה, ולכן הקוד לא מגיע לשלב הריצה."

- id: cs.control-flow.conditions.010
  type: truefalse
  difficulty: 1
  prompt: "בשרשרת `if` / `else if` / `else`, אם כמה תנאים מתקיימים, הבלוקים של כולם רצים לפי הסדר."
  answer: false
  explanation: "בשרשרת רץ לכל היותר בלוק אחד: של התנאי הראשון שמתקיים. אחריו כל ה-`else if` וה-`else` מדולגים. כשרוצים לבדוק כמה תנאים בלתי תלויים ולהריץ כל אחד שמתקיים, כותבים כמה `if` נפרדים בלי `else`."

- id: cs.control-flow.conditions.012
  type: bug
  difficulty: 1
  prompt: "הקוד אמור להדפיס `Pass` לכל ציון של 60 ומעלה. איזו שורה צריך לתקן?"
  code: |
    int score = 60;
    if (score > 60)
        Console.WriteLine("Pass");
    else
        Console.WriteLine("Fail");
  answer: 2
  explanation: "`>` לא כולל את 60 עצמו, כך שציון 60 בדיוק מקבל `Fail`. «60 ומעלה» פירושו `>=`. טעות גבול (Boundary Error) כזו נפוצה מאוד בתנאים, ולכן תמיד כדאי לבדוק בראש את ערך הגבול עצמו."
  fixed: |
    int score = 60;
    if (score >= 60)
        Console.WriteLine("Pass");
    else
        Console.WriteLine("Fail");

- id: cs.control-flow.conditions.014
  type: bug
  difficulty: 3
  prompt: "הקוד אמור למשוך את הסכום מהחשבון רק אם יש בו מספיק כסף. איזו שורה צריך לתקן?"
  code: |
    int balance = 100;
    int amount = 150;
    if (amount <= balance);
    {
        balance -= amount;
    }
    Console.WriteLine(balance);
  answer: 3
  explanation: "הנקודה־פסיק בסוף שורת ה-`if` היא פקודה ריקה, והיא כל גוף התנאי. הבלוק `{ ... }` שאחריה הוא בלוק עצמאי שרץ תמיד, ולכן היתרה יורדת ל-`-50`. הקומפיילר רק מזהיר על כך (CS0642), ולא עוצר את הבנייה."
  fixed: |
    int balance = 100;
    int amount = 150;
    if (amount <= balance)
    {
        balance -= amount;
    }
    Console.WriteLine(balance);

- id: cs.control-flow.conditions.015
  type: cleaner
  difficulty: 1
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      int age = 20;
      bool isAdult;
      if (age >= 18)
          isAdult = true;
      else
          isAdult = false;
      Console.WriteLine(isAdult);
    - |
      int age = 20;
      bool isAdult = age >= 18;
      Console.WriteLine(isAdult);
  answer: 1
  explanation: "הביטוי `age >= 18` הוא כבר ערך מטיפוס `bool`. אפשר להציב אותו ישירות במשתנה. `if` שמציב `true` בענף אחד ו-`false` בשני רק חוזר על התנאי במילים אחרות."
  optionExplanations:
    "0": "`if` שמציב `true` בענף אחד ו-`false` בשני משכפל את התנאי עצמו."

- id: cs.control-flow.conditions.016
  type: smell
  difficulty: 2
  prompt: איזה ריח קוד בולט כאן?
  code: |
    bool isPaid = true;
    int itemCount = 3;
    bool hasAddress = true;
    if (isPaid)
    {
        if (itemCount > 0)
        {
            if (hasAddress)
            {
                Console.WriteLine("Shipping");
            }
        }
    }
  options:
    - "מספר קסם - Magic Number"
    - "שכפול קוד - Duplicated Code"
    - "קינון עמוק - Deep Nesting"
    - "שם לא ברור - Unclear Name"
  answer: 2
  explanation: "שלושה `if` מקוננים זה בתוך זה מכריחים את הקורא לעקוב אחרי כמה רמות הזחה כדי להבין מתי מודפס `Shipping`. כאן כל התנאים צריכים להתקיים יחד, ולכן אפשר לחבר אותם לתנאי אחד: `if (isPaid && itemCount > 0 && hasAddress)`."
  optionExplanations:
    "0": "0 בהשוואה `itemCount > 0` הוא ערך טבעי ומובן, לא מספר קסם."
    "1": "אין כאן קטע קוד שחוזר על עצמו."
    "3": "השמות `isPaid`, `itemCount` ו-`hasAddress` ברורים."

- id: cs.control-flow.conditions.017
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    int x = 7;
    if (x % 2 == 0)
        Console.WriteLine("even");
    else
        Console.WriteLine("odd");
  options: ["odd", "even", "even\nodd", "1"]
  answer: 0
  explanation: "`7 % 2` הוא 1, ולכן התנאי `x % 2 == 0` שקר ורץ הענף של `else`. בדיוק אחד מהענפים של `if` / `else` רץ, אף פעם לא שניהם."
  optionExplanations:
    "1": "השארית של 7 ב-2 היא 1, ולא 0, ולכן 7 אינו זוגי."
    "2": "רק אחד מהענפים רץ: או ה-`if` או ה-`else`."
    "3": "התוכנית מדפיסה את הטקסט שבענף, ולא את השארית."

- id: cs.control-flow.conditions.018
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int a = 3;
    int b = 8;
    int max = a;
    if (b > max)
        max = b;
    Console.WriteLine(max);
  options: ["8", "3", "11", "שגיאת קומפילציה"]
  answer: 0
  explanation: "זו התבנית הקלאסית למציאת מקסימום: מניחים שהראשון הוא הגדול ביותר, ומחליפים אם מוצאים גדול ממנו. `8 > 3`, ולכן `max` מקבל 8."
  optionExplanations:
    "1": "התנאי `b > max` אמת, ולכן `max` מתעדכן ל-8."
    "2": "אין כאן חיבור. `max = b` מציב את הערך של `b`."
    "3": "`if` בלי `else` חוקי לגמרי."

