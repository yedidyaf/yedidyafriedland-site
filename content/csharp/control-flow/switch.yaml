- id: cs.control-flow.switch.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    int day = 3;
    switch (day)
    {
        case 1:
            Console.WriteLine("Sunday");
            break;
        case 3:
            Console.WriteLine("Tuesday");
            break;
        default:
            Console.WriteLine("Other");
            break;
    }
  options: ["Tuesday", "Tuesday\nOther", "Other", "Sunday\nTuesday"]
  answer: 0
  explanation: "משפט `switch` קופץ ישירות ל-`case` שהערך שלו שווה לביטוי, כאן `case 3`. ה-`break` מסיים את ה-`switch`, ו-`default` רץ רק כשאף `case` לא מתאים."
  optionExplanations:
    "1": "ב-C# אין נפילה (Fall-through) ל-`case` הבא. `break` יוצא מה-`switch`, ו-`default` לא רץ."
    "2": "`default` נבחר רק כשאין `case` מתאים, וכאן `case 3` מתאים."

- id: cs.control-flow.switch.002
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    char grade = 'B';
    switch (grade)
    {
        case 'A':
        case 'B':
            Console.WriteLine("Great");
            break;
        case 'C':
            Console.WriteLine("OK");
            break;
        default:
            Console.WriteLine("Try again");
            break;
    }
  options: ["OK", "Great", "Try again", "שגיאת קומפילציה"]
  answer: 1
  explanation: "מותר לשים כמה תוויות `case` ברצף מעל אותו קטע קוד, כל עוד התוויות העליונות ריקות. `'B'` שייך לקבוצה `case 'A': case 'B':`, ולכן מודפס `Great`. הנפילה האסורה ב-C# היא רק מ-`case` שיש בו פקודות."
  optionExplanations:
    "0": "`OK` שייך ל-`case 'C'`. אחרי `Great` יש `break`, ולכן הביצוע לא ממשיך הלאה."
    "3": "`case 'A':` ריק לגמרי, ולכן הוא חולק את הקוד עם `case 'B':`. רק `case` עם פקודות חייב להסתיים ב-`break`."

- id: cs.control-flow.switch.003
  type: output
  difficulty: 2
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    int n = 1;
    switch (n)
    {
        case 1:
            Console.WriteLine("one");
        case 2:
            Console.WriteLine("two");
            break;
    }
  options: ["one\ntwo", "one", "שגיאת קומפילציה", "two"]
  answer: 2
  explanation: "ב-C# כל `case` שיש בו פקודות חייב להסתיים בפקודה שמוציאה ממנו את השליטה, כמו `break`, `return` או `throw`. בלי `break` אחרי `Console.WriteLine(\"one\")` הקומפיילר מדווח שגיאה CS0163: אסור ליפול מ-`case` אחד לאחר. ההחלטה הזו מכוונת, כדי למנוע את באג הנפילה המוכר מ-C ומ-Java."
  optionExplanations:
    "0": "זה היה הפלט ב-C או ב-Java, שבהן יש נפילה. C# אוסרת אותה כבר בקומפילציה."
    "1": "C# לא מוסיפה `break` בעצמה. היא דורשת שתכתבו אותו."

- id: cs.control-flow.switch.004
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    string size = "M";
    decimal price = size switch
    {
        "S" => 10m,
        "M" => 12.5m,
        "L" => 15m,
        _ => 0m
    };
    Console.WriteLine(price);
  options: ["10", "12.5", "0", "12.5m"]
  answer: 1
  explanation: "ביטוי `switch` (Switch Expression) בודק את הזרועות לפי הסדר ומחזיר את הערך של הזרוע הראשונה שמתאימה. `\"M\"` מתאים לזרוע השנייה, והערך `12.5m` מוצב ב-`price`. הסיומת `m` רק מסמנת ליטרל מטיפוס `decimal` ואינה חלק מהפלט."
  optionExplanations:
    "0": "`10` הוא הערך של `\"S\"`. נבחרת הזרוע שהתבנית שלה מתאימה, לא הראשונה ברשימה."
    "2": "`0` היה מתקבל רק אם אף זרוע לא הייתה מתאימה, ואז הזרוע `_` נבחרת."
    "3": "`m` היא סיומת של ליטרל בקוד המקור. היא לא מודפסת."

- id: cs.control-flow.switch.005
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int temp = 30;
    string feel = temp switch
    {
        < 0 => "freezing",
        < 20 => "cold",
        < 30 => "nice",
        _ => "hot"
    };
    Console.WriteLine(feel);
  options: ["nice", "hot", "cold", "freezing"]
  answer: 1
  explanation: "תבניות יחס (Relational Patterns) כמו `< 30` משוות את הערך לקבוע. הזרועות נבדקות לפי הסדר: 30 אינו קטן מ-0, מ-20 או מ-30 (`<` לא כולל שוויון), ולכן נבחרת `_` ומודפס `hot`."
  optionExplanations:
    "0": "`< 30` לא מתקיים עבור 30 עצמו. כדי לכלול אותו צריך `<= 30`."
    "2": "30 אינו קטן מ-20."

- id: cs.control-flow.switch.006
  type: single
  difficulty: 3
  prompt: מה יקרה כשהקוד ירוץ?
  code: |
    int level = 4;
    string name = level switch
    {
        1 => "low",
        2 => "medium",
        3 => "high"
    };
    Console.WriteLine(name);
  options:
    - "הקוד מתקמפל עם אזהרה, ובזמן ריצה נזרקת `SwitchExpressionException` כי אף זרוע לא מתאימה"
    - "שגיאת קומפילציה, כי ביטוי `switch` חייב לכלול זרוע `_`"
    - "`name` יקבל `null` ותודפס שורה ריקה"
    - "`name` יקבל את הערך של הזרוע האחרונה, ויודפס `high`"
  answer: 0
  explanation: "כשביטוי `switch` לא מכסה את כל הערכים האפשריים, הקומפיילר מוציא אזהרה (CS8509) ולא שגיאה. אם בזמן ריצה אף זרוע לא מתאימה, נזרקת `SwitchExpressionException`. לכן כמעט תמיד מוסיפים זרוע `_` אחרונה, שמחזירה ערך ברירת מחדל או זורקת חריגה עם הודעה ברורה."
  optionExplanations:
    "1": "ביטוי שאינו ממצה (Exhaustive) הוא אזהרה בלבד. הבעיה מתגלה רק בזמן ריצה."
    "2": "ביטוי `switch` לא מחזיר ערך ברירת מחדל בשקט. ערך שלא מכוסה זורק חריגה."
    "3": "אין «זרוע אחרונה כברירת מחדל». רק זרוע שהתבנית שלה מתאימה יכולה להיבחר."

- id: cs.control-flow.switch.007
  type: single
  difficulty: 1
  prompt: "מה המשמעות של `_` בזרוע האחרונה של ביטוי ה-`switch`?"
  code: |
    int code = 5;
    string label = code switch
    {
        1 => "one",
        _ => "other"
    };
  options:
    - "משתנה בשם `_` שמקבל את הערך של `code`, ואפשר להשתמש בו בצד ימין של הזרוע"
    - "זרוע שמתאימה רק לערך `0`, ערך ברירת המחדל של `int`"
    - "זרוע שמתאימה רק כאשר `code` הוא `null`"
    - "תבנית השלכה (Discard) שמתאימה לכל ערך שלא התאים לזרועות הקודמות"
  answer: 3
  explanation: "`_` היא תבנית השלכה: היא מתאימה לכל ערך, ולכן היא המקבילה של `default` במשפט `switch` קלאסי. מקומה בסוף, כי זרוע שמתאימה לכל ערך «בולעת» את כל מה שאחריה; זרוע שנכתבת אחרי `_` היא שגיאת קומפילציה."
  optionExplanations:
    "0": "`_` כאן לא יוצר משתנה. כדי לקבל את הערך במשתנה כותבים תבנית כמו `var x => ...`."
    "1": "`_` מתאים לכל ערך, לא רק ל-0."
    "2": "`int` אינו יכול להיות `null`, ו-`_` מתאים לכל ערך ולא רק ל-`null`."

- id: cs.control-flow.switch.008
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    object item = 42;
    string kind = item switch
    {
        string s => $"text of length {s.Length}",
        int n when n > 100 => "big number",
        int n => $"number {n}",
        _ => "something else"
    };
    Console.WriteLine(kind);
  options: ["big number", "text of length 2", "number 42", "something else"]
  answer: 2
  explanation: "תבנית טיפוס (Type Pattern) כמו `int n` בודקת אם הערך הוא מהטיפוס הזה, ואם כן מציבה אותו במשתנה חדש. `42` הוא `int`, אבל המשמר `when n > 100` לא מתקיים, ולכן הזרוע מדולגת ונבחרת הזרוע הבאה, `int n`."
  optionExplanations:
    "0": "`when` הוא תנאי נוסף: הזרוע נבחרת רק אם גם הטיפוס מתאים וגם התנאי אמת, ו-42 לא גדול מ-100."
    "1": "`42` נשמר ב-`object` כ-`int`, לא כמחרוזת, ולכן `string s` לא מתאים."
    "3": "`_` נבחר רק אם אף זרוע קודמת לא התאימה, וכאן `int n` מתאימה."

- id: cs.control-flow.switch.009
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    int x = 0, y = 5;
    string position = (x, y) switch
    {
        (0, 0) => "origin",
        (0, _) => "on Y axis",
        (_, 0) => "on X axis",
        _ => "elsewhere"
    };
    Console.WriteLine(position);
  options: ["on X axis", "on Y axis", "elsewhere", "origin"]
  answer: 1
  explanation: "תבנית טאפל (Tuple Pattern) בודקת כמה ערכים בבת אחת, ו-`_` בתוך הסוגריים פירושו «כל ערך במקום הזה». `(0, 5)` לא מתאים ל-`(0, 0)`, אבל מתאים ל-`(0, _)`: הרכיב הראשון 0 והשני כלשהו."
  optionExplanations:
    "0": "`(_, 0)` דורש שהרכיב השני יהיה 0, וכאן `y` הוא 5."
    "2": "`_` הכללי נבחר רק אם אף זרוע קודמת לא מתאימה, ו-`(0, _)` מתאימה."
    "3": "`(0, 0)` דורש ששני הרכיבים יהיו 0."

- id: cs.control-flow.switch.010
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    int n = 2;
    switch (n)
    {
        default:
            Console.WriteLine("default");
            break;
        case 1:
            Console.WriteLine("one");
            break;
        case 2:
            Console.WriteLine("two");
            break;
    }
  options: ["default", "two", "default\ntwo", "שגיאת קומפילציה"]
  answer: 1
  explanation: "`default` נבחר רק כשאף `case` לא מתאים, בלי קשר למקומו בתוך ה-`switch`. הערך 2 מתאים ל-`case 2`, ולכן מודפס `two`. בכל זאת, המוסכמה היא לכתוב את `default` בסוף, כדי שהקוד ייקרא בסדר שבו הוא מתנהג."
  optionExplanations:
    "0": "`default` אינו תווית שנבחרת לפי מיקומה. הוא נבחר רק אם אין `case` מתאים."
    "2": "רק `case` אחד רץ, וגם אין נפילה מ-`default` הלאה בזכות ה-`break`."
    "3": "מותר לכתוב את `default` בכל מקום בתוך ה-`switch`."

- id: cs.control-flow.switch.011
  type: single
  difficulty: 2
  prompt: "מה ההבדל המרכזי בין משפט `switch` (Switch Statement) לביטוי `switch` (Switch Expression)?"
  options:
    - "ביטוי `switch` מאפשר נפילה (Fall-through) מזרוע לזרוע, ומשפט `switch` לא"
    - "ביטוי `switch` עובד רק על מספרים שלמים, ומשפט `switch` עובד גם על מחרוזות"
    - "ביטוי `switch` מחשב ומחזיר ערך שאפשר להציב במשתנה, ומשפט `switch` מריץ פקודות בכל `case`"
    - "במשפט `switch` אי אפשר להשתמש בתבניות כמו `> 10`, רק בביטוי `switch`"
  answer: 2
  explanation: "ביטוי `switch` הוא ביטוי: כל זרוע היא `pattern => value`, אין בו `break`, והתוצאה מוחזרת ואפשר להציב אותה במשתנה. משפט `switch` הוא פקודה שמריצה קוד בכל `case`. שניהם תומכים במחרוזות ובתבניות, ובאף אחד מהם אין נפילה."
  optionExplanations:
    "0": "בביטוי `switch` כל זרוע מחזירה ערך אחד ואין נפילה כלל. גם במשפט `switch` אין נפילה מ-`case` שיש בו פקודות."
    "1": "שניהם עובדים על מחרוזות, על מספרים, על `enum` ועל תבניות טיפוס."
    "3": "מאז C# 9 מותר לכתוב גם במשפט `switch` תבניות כמו `case > 10:`."

- id: cs.control-flow.switch.012
  type: truefalse
  difficulty: 1
  prompt: "במשפט `switch` חובה לכתוב תווית `default`."
  answer: false
  explanation: "`default` אופציונלי במשפט `switch`. בלעדיו, אם אף `case` לא מתאים, פשוט לא קורה כלום והתוכנית ממשיכה אחרי ה-`switch`. בביטוי `switch` המצב שונה: ערך שאף זרוע לא מכסה זורק חריגה בזמן ריצה, ולכן שם כמעט תמיד מוסיפים `_`."

- id: cs.control-flow.switch.013
  type: bug
  difficulty: 1
  prompt: "המתודה אמורה להחזיר `C` לציונים 70 עד 79, כולל 70. איזו שורה צריך לתקן?"
  code: |
    string Grade(int score) => score switch
    {
        >= 90 => "A",
        >= 80 => "B",
        > 70 => "C",
        _ => "F"
    };
  answer: 5
  explanation: "`> 70` לא כולל את 70, כך שציון 70 בדיוק נופל לזרוע `_` ומקבל `F`. התבנית הנכונה היא `>= 70`. סדר הזרועות עצמו נכון: מהגבול הגבוה לנמוך, כי הזרוע הראשונה שמתאימה היא שנבחרת."
  fixed: |
    string Grade(int score) => score switch
    {
        >= 90 => "A",
        >= 80 => "B",
        >= 70 => "C",
        _ => "F"
    };

- id: cs.control-flow.switch.014
  type: bug
  difficulty: 2
  prompt: "המתודה אמורה לזהות פקודות בלי תלות באותיות גדולות או קטנות, כך ש-`START`, `Start` ו-`start` יחזירו כולן `Starting`. איזו שורה צריך לתקן?"
  code: |
    string Handle(string command)
    {
        switch (command)
        {
            case "start":
                return "Starting";
            case "stop":
                return "Stopping";
            default:
                return "Unknown";
        }
    }
  answer: 3
  explanation: "השוואת מחרוזות ב-`switch` היא מדויקת ורגישה לגודל אותיות (Case-sensitive): `\"START\"` אינו שווה ל-`\"start\"`, ולכן הוא מגיע ל-`default`. מנרמלים את הקלט לפני ההשוואה, למשל עם `command.ToLower()`, וכותבים את ה-`case` באותיות קטנות. שימו לב שגם `return` מסיים `case`, ולכן אין צורך ב-`break`."
  fixed: |
    string Handle(string command)
    {
        switch (command.ToLower())
        {
            case "start":
                return "Starting";
            case "stop":
                return "Stopping";
            default:
                return "Unknown";
        }
    }

- id: cs.control-flow.switch.015
  type: bug
  difficulty: 3
  prompt: "המתודה מקבלת מספר חודש (1 עד 12) ואמורה להחזיר את הרבעון שלו: חודשים 1 עד 3 הם `Q1`, חודשים 4 עד 6 הם `Q2`, וכן הלאה. איזו שורה צריך לתקן?"
  code: |
    string Quarter(int month)
    {
        switch (month / 3)
        {
            case 0:
                return "Q1";
            case 1:
                return "Q2";
            case 2:
                return "Q3";
            default:
                return "Q4";
        }
    }
  answer: 3
  explanation: "`month / 3` היא חלוקה שלמה. עבור חודש 3 מתקבל 1 ולכן `Q2`, ועבור חודש 6 מתקבל 2 ולכן `Q3`: החודש האחרון של כל רבעון מסווג לא נכון. הביטוי `(month - 1) / 3` ממפה את 1 עד 3 ל-0, את 4 עד 6 ל-1 וכן הלאה. כשבודקים `switch` על ביטוי מחושב, כדאי לבדוק בראש את ערכי הגבול."
  fixed: |
    string Quarter(int month)
    {
        switch ((month - 1) / 3)
        {
            case 0:
                return "Q1";
            case 1:
                return "Q2";
            case 2:
                return "Q3";
            default:
                return "Q4";
        }
    }

- id: cs.control-flow.switch.016
  type: cleaner
  difficulty: 2
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      string StatusText(int code)
      {
          if (code == 200)
              return "OK";
          else if (code == 404)
              return "Not Found";
          else if (code == 500)
              return "Server Error";
          else
              return "Unknown";
      }
    - |
      string StatusText(int code) => code switch
      {
          200 => "OK",
          404 => "Not Found",
          500 => "Server Error",
          _ => "Unknown"
      };
    - |
      string StatusText(int code)
      {
          string text;
          switch (code)
          {
              case 200:
                  text = "OK";
                  break;
              case 404:
                  text = "Not Found";
                  break;
              case 500:
                  text = "Server Error";
                  break;
              default:
                  text = "Unknown";
                  break;
          }
          return text;
      }
  answer: 1
  explanation: "כשממפים ערך אחד לתוצאה לפי ערכים קבועים, ביטוי `switch` הוא הקצר והברור ביותר: כל מקרה בשורה אחת, אין `break`, אין משתנה ביניים, והקורא רואה מיד שזו טבלת מיפוי."
  optionExplanations:
    "0": "שרשרת `if` / `else if` חוזרת על `code ==` בכל ענף ומסתירה את העובדה שזה מיפוי פשוט."
    "2": "משפט `switch` עם משתנה עזר ו-`break` בכל `case` מכפיל את מספר השורות בלי להוסיף מידע."
