id: csharp
prefix: cs
title_he: סי שארפ
title_en: C#
highlight: csharp
version: "C# 12 / .NET 8"
description_he: מבחנים ב-C# ברמת בגרות במדעי המחשב, 3 עד 5 יחידות. מהיסודות, דרך מערכים ומתודות, ועד מחלקות, ירושה וקוד נקי. כל שאלה מגיעה עם הסבר, וכל קטע קוד נבדק בהרצה אמיתית.
simulation:
  questions: 30
  minutes: 40
  passScore: 85
  blueprint:
    basics: 4
    control-flow: 5
    collections: 3
    strings: 3
    methods: 4
    oop: 7
    clean-code: 4
chapters:
  - id: basics
    title_he: יסודות
    title_en: Basics
    description_he: משתנים, טיפוסים, אופרטורים, קלט ופלט בקונסול והמרות. הבסיס של כל תוכנית C#.
    topics:
      - id: variables
        title_he: משתנים
        title_en: Variables
        summary_he: הצהרה על משתנים, השמה, const, ומשתנה שחייב לקבל ערך לפני השימוש בו.
      - id: value-types
        title_he: טיפוסים
        title_en: Data Types
        summary_he: int, double, bool, char ו-string, מה כל טיפוס יכול להכיל, וערכים מותרים ואסורים.
      - id: operators
        title_he: אופרטורים
        title_en: Operators
        summary_he: חלוקה שלמה מול עשרונית, שארית %, ++ ו-+=, אופרטורי השוואה ולוגיים, וקדימות.
      - id: console-io
        title_he: קלט ופלט
        title_en: Console Input and Output
        summary_he: Console.WriteLine מול Write, Console.ReadLine שמחזירה מחרוזת, ושרשור בפלט.
      - id: casting
        title_he: המרות
        title_en: Casting and Conversion
        summary_he: המרה מרומזת ומפורשת (int), int.Parse ו-double.Parse, ואובדן מידע בהמרה.
  - id: control-flow
    title_he: זרימת בקרה
    title_en: Control Flow
    description_he: תנאים, switch ולולאות. איך התוכנית מחליטה מה לעשות ובאיזה סדר.
    topics:
      - id: conditions
        title_he: תנאים
        title_en: Conditions
        summary_he: if, else if ו-else, תנאים מקוננים, והערכה מקוצרת של && ו-||.
      - id: switch
        title_he: משפט switch
        title_en: Switch Statement
        summary_he: switch עם case, break ו-default, ומתי switch קריא יותר משרשרת if.
      - id: loops
        title_he: לולאות
        title_en: Loops
        summary_he: for, while ו-do-while, מונה וצובר, ומתי כל לולאה מתאימה.
      - id: loop-control
        title_he: שליטה בלולאות
        title_en: Loop Control
        summary_he: break, continue, לולאות מקוננות, ותנאי עצירה.
  - id: collections
    title_he: מערכים
    title_en: Arrays
    description_he: מערכים חד־ממדיים ודו־ממדיים. אורך קבוע, אינדקסים, מעבר בלולאה, מערך מונים וחיפוש.
    topics:
      - id: arrays
        title_he: מערכים
        title_en: Arrays
        summary_he: יצירת מערך, אורך קבוע, ערכי ברירת מחדל, מעבר בלולאה, מערך מונים, מערך דו־ממדי ו-IndexOutOfRangeException.
  - id: strings
    title_he: מחרוזות
    title_en: Strings
    description_he: עבודה עם טקסט ב-C#. תווים, אינדקסים, אינטרפולציה ומתודות של מחרוזת.
    topics:
      - id: string-basics
        title_he: יסודות מחרוזות
        title_en: String Basics
        summary_he: string ו-char, אינדקסים, Length, מעבר על תווים בלולאה, השוואה, ומחרוזות שאינן ניתנות לשינוי.
      - id: interpolation
        title_he: אינטרפולציה ותווי בריחה
        title_en: Interpolation and Escape Characters
        summary_he: מחרוזות עם $, שרשור מול אינטרפולציה, ותווי בריחה כמו \n, \t ו-\".
      - id: string-methods
        title_he: מתודות מחרוזת
        title_en: String Methods
        summary_he: Substring, IndexOf, Contains, ToUpper, Replace, Split, CompareTo ועוד, ומה כל אחת מחזירה.
  - id: methods
    title_he: מתודות
    title_en: Methods
    description_he: הגדרת פעולות סטטיות, פרמטרים, העמסה ורקורסיה.
    topics:
      - id: defining-methods
        title_he: הגדרת מתודות
        title_en: Defining Methods
        summary_he: חתימת מתודה, טיפוס החזרה, void, return, וקריאה למתודה סטטית.
      - id: parameters
        title_he: פרמטרים
        title_en: Parameters
        summary_he: העברה לפי ערך, ומה קורה כשמעבירים מערך למתודה ומשנים אותו בתוכה.
      - id: overloading
        title_he: העמסה
        title_en: Method Overloading
        summary_he: כמה מתודות באותו שם עם חתימות שונות, ואיך הקומפיילר בוחר ביניהן.
      - id: recursion
        title_he: רקורסיה
        title_en: Recursion
        summary_he: מקרה בסיס וקריאה רקורסיבית, מעקב אחרי קריאות, ו-StackOverflowException.
  - id: oop
    title_he: תכנות מונחה עצמים
    title_en: Object-Oriented Programming
    description_he: מחלקות, ירושה, פולימורפיזם, מחלקות מופשטות והרכבה, ותכנון מחלקות מתוך דרישה.
    topics:
      - id: classes-objects
        title_he: מחלקות ואובייקטים
        title_en: Classes and Objects
        summary_he: class, שדות private, בנאים, this, פעולות Get ו-Set, ToString, static מול מופע, ומערך של עצמים.
      - id: inheritance
        title_he: ירושה
        title_en: Inheritance
        summary_he: מחלקת בסיס ויורשת, base, protected, וסדר הפעלת בנאים.
      - id: polymorphism
        title_he: פולימורפיזם
        title_en: Polymorphism
        summary_he: virtual ו-override, הפניה מטיפוס הבסיס לעצם מטיפוס יורש, והמרה כלפי מטה עם is.
      - id: abstract-classes
        title_he: מחלקות מופשטות
        title_en: Abstract Classes
        summary_he: abstract class ו-abstract method, מימוש חלקי, ולמה אי אפשר ליצור עצם ממחלקה מופשטת.
      - id: composition
        title_he: הרכבה מול ירושה
        title_en: Composition vs Inheritance
        summary_he: יחס is-a מול has-a, מחלקה שמכילה עצמים של מחלקה אחרת, וזיהוי יחסים בין מחלקות.
      - id: class-design
        title_he: תכנון מחלקות
        title_en: Class Design
        summary_he: מקבלים דרישה וחתימות של פעולות, ומשבצים כל פעולה במחלקה שאחראית עליה.
  - id: clean-code
    title_he: קוד נקי
    title_en: Clean Code
    description_he: קוד שקל לקרוא ולשנות. שמות טובים, מתודות קצרות, אי־שכפול, זיהוי ריחות קוד ומוסכמות C#.
    topics:
      - id: naming
        title_he: שמות
        title_en: Naming
        summary_he: שמות שמסבירים כוונה, PascalCase ו-camelCase, ומה לא לקצר.
      - id: small-methods
        title_he: מתודות קטנות וממוקדות
        title_en: Small Methods
        summary_he: מתודה שעושה דבר אחד, מספר פרמטרים קטן, ללא תופעות לוואי מפתיעות, ורמת הפשטה אחידה.
      - id: dry
        title_he: אל תחזור על עצמך
        title_en: DRY (Don't Repeat Yourself)
        summary_he: זיהוי שכפול קוד, חילוץ מתודה, ומתי שכפול קטן עדיף על הפשטה מוקדמת.
      - id: code-smells
        title_he: ריחות קוד
        title_en: Code Smells
        summary_he: Long Method, Magic Number, Deep Nesting, God Class ועוד, ואיך מתקנים.
      - id: conventions
        title_he: מוסכמות C#
        title_en: C# Conventions
        summary_he: מוסכמות שמות של מיקרוסופט, סוגריים מסולסלים, הזחה והערות.
