- id: cs.exceptions.throwing.011
  type: single
  difficulty: 2
  prompt: "המתודה `Next` נקראת כשאין כרטיסים בתור. איזו חריגה הכי מתאימה לזרוק במקום ההערה?"
  code: |
    class TicketQueue
    {
        private readonly Queue<string> _tickets = new();

        public string Next()
        {
            if (_tickets.Count == 0)
            {
                // איזו חריגה לזרוק כאן?
            }
            return _tickets.Dequeue();
        }
    }
  options:
    - "`InvalidOperationException`"
    - "`ArgumentException`"
    - "`NullReferenceException`"
    - "`IndexOutOfRangeException`"
  answer: 0
  explanation: "ל-`Next` אין בכלל פרמטרים, והבעיה היא שמצב האובייקט (תור ריק) לא מאפשר את הפעולה. זה בדיוק התפקיד של `InvalidOperationException`, וזו גם החריגה ש-`Queue<T>.Dequeue` זורקת בעצמה על תור ריק."
  optionExplanations:
    "1": "`ArgumentException` מתאימה לארגומנט לא חוקי, ול-`Next` אין ארגומנטים."
    "2": "`NullReferenceException` נזרקת על ידי סביבת הריצה בגישה ל-`null`; לא זורקים אותה בעצמנו."
    "3": "`IndexOutOfRangeException` שמורה לגישה למערך מחוץ לגבולות, ונזרקת על ידי סביבת הריצה."

