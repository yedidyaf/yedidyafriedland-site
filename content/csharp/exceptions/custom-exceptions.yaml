    "2": "`Message` של החריגה החדשה הוא `message` שהועבר, לא ההודעה של `inner`."
    "3": "הבנאי לא משפיע על תפיסת חריגות; הוא רק שומר הפניה לחריגה המקורית."

- id: cs.exceptions.custom-exceptions.013
  type: truefalse
  difficulty: 1
