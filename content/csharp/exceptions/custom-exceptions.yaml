    - "לזרוק את שתי החריגות יחד, כך ששני בלוקי `catch` ירוצו"
    - "להעתיק את ההודעה של `inner` אל `Message` של החריגה החדשה"
    - "למנוע מ-`inner` להיתפס בבלוק `catch` אחר"
  answer: 0
  explanation: "כשמתרגמים חריגה טכנית (למשל `FormatException`) לחריגה של האפליקציה, מעבירים את המקורית כ-`inner`. היא נשמרת ב-`InnerException`, והמידע על הסיבה המקורית לא אובד. לכן מקובל שלחריגה מותאמת יהיה גם בנאי כזה."
  optionExplanations:
