- id: cs.exceptions.custom-exceptions.015
  type: bug
  difficulty: 2
  prompt: "`CardDeclinedException` אמורה להיות סוג של `PaymentException`, כך שה-`catch` יטפל בה. איזו שורה צריך לתקן?"
  code: |
    try
    {
        Pay(0);
    }
    catch (PaymentException e)
    {
        Console.WriteLine($"Payment failed: {e.Message}");
    }

    static void Pay(int amount)
    {
        if (amount <= 0)
            throw new CardDeclinedException("Amount must be positive");
    }

    class PaymentException : Exception
    {
        public PaymentException(string message) : base(message) { }
    }

    class CardDeclinedException : Exception
    {
        public CardDeclinedException(string message) : base(message) { }
    }
  answer: 21
  explanation: "`CardDeclinedException` יורשת ישירות מ-`Exception`, ולכן היא לא סוג של `PaymentException`, וה-`catch` לא תופס אותה. החריגה יוצאת מהתוכנית בלי טיפול. התיקון הוא לרשת מ-`PaymentException`."
  fixed: |
    try
    {
        Pay(0);
    }
    catch (PaymentException e)
    {
        Console.WriteLine($"Payment failed: {e.Message}");
    }

    static void Pay(int amount)
    {
        if (amount <= 0)
            throw new CardDeclinedException("Amount must be positive");
    }

    class PaymentException : Exception
    {
        public PaymentException(string message) : base(message) { }
    }

    class CardDeclinedException : PaymentException
    {
        public CardDeclinedException(string message) : base(message) { }
    }

- id: cs.exceptions.custom-exceptions.016
  type: bug
  difficulty: 2
  prompt: "`Message` של החריגה אמור להחזיר את ההודעה, ו-`Sku` את קוד המוצר. איזו שורה צריך לתקן?"
  code: |
    class StockException : Exception
    {
        public string Sku { get; }

        public StockException(string sku, string message) : base(sku)
        {
            Sku = sku;
        }
    }
  answer: 5
  explanation: "הבנאי מעביר ל-`base` את המשתנה הלא נכון: `sku` במקום `message`. לכן `Message` יחזיר את קוד המוצר, וההודעה האמיתית תאבד. צריך `: base(message)`."
  fixed: |
    class StockException : Exception
    {
        public string Sku { get; }

        public StockException(string sku, string message) : base(message)
        {
            Sku = sku;
        }
    }
