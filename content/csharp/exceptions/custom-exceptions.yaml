    "2": "`struct` לא יכול לרשת ממחלקה, ולכן גם לא מ-`Exception`."
    "3": "הקוד מתקמפל, אבל לפי המוסכמה שם של חריגה מסתיים ב-`Exception`, לא ב-`Error`."

- id: cs.exceptions.custom-exceptions.011
