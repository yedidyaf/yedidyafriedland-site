- id: cs.exceptions.try-catch.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    try
    {
        int[] nums = { 1, 2, 3 };
        Console.WriteLine(nums[3]);
        Console.WriteLine("after");
    }
    catch (IndexOutOfRangeException)
    {
        Console.WriteLine("caught");
    }
    Console.WriteLine("end");
  options: ["caught\nend", "after\ncaught\nend", "caught", "3\nafter\nend"]
  answer: 0
  explanation: "הגישה ל-`nums[3]` זורקת חריגה (Exception) מסוג `IndexOutOfRangeException`, כי האינדקס האחרון הוא 2. הביצוע קופץ מיד לבלוק ה-`catch`, ולכן `after` לא מודפס. אחרי ה-`catch` התוכנית ממשיכה כרגיל ומדפיסה `end`."
  optionExplanations:
    "1": "שורות שבאות אחרי השורה שזרקה, באותו בלוק `try`, לא מתבצעות."
    "2": "החריגה נתפסה, ולכן התוכנית ממשיכה לשורה שאחרי בלוק ה-`catch`."
    "3": "אין איבר באינדקס 3 במערך של שלושה איברים, ולכן לא מודפס ערך."

- id: cs.exceptions.try-catch.002
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    int total = 10;
    int count = 0;
    try
    {
        Console.WriteLine(total / count);
    }
    catch (DivideByZeroException)
    {
        Console.WriteLine("zero");
    }
    finally
    {
        Console.WriteLine("done");
    }
  options: ["zero\ndone", "done", "zero", "0\ndone"]
  answer: 0
  explanation: "חלוקה של `int` באפס זורקת `DivideByZeroException`, והיא נתפסת ב-`catch`. בלוק `finally` רץ תמיד בסוף, גם כשנתפסה חריגה, ולכן מודפס `zero` ואחריו `done`."
  optionExplanations:
    "1": "החריגה נתפסת ב-`catch` המתאים, ולכן גם `zero` מודפס לפני `finally`."
    "2": "`finally` רץ גם אחרי `catch`, לא רק כשאין חריגה."
    "3": "חלוקה שלמה באפס לא מחזירה 0; היא זורקת חריגה."

- id: cs.exceptions.try-catch.003
  type: output
  difficulty: 2
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    try
    {
        int n = int.Parse("abc");
    }
    catch (Exception)
    {
        Console.WriteLine("general");
    }
    catch (FormatException)
    {
        Console.WriteLine("format");
    }
  options: ["שגיאת קומפילציה", "general", "format", "general\nformat"]
  answer: 0
  explanation: "בלוקי `catch` נבדקים לפי הסדר, ו-`catch (Exception)` תופס כל חריגה. לכן `catch (FormatException)` אחריו לעולם לא יגיע, והקומפיילר מסרב לקמפל (שגיאה CS0160). צריך לסדר מהספציפי לכללי: קודם `FormatException`, ואז `Exception`."
  optionExplanations:
    "1": "זה היה הפלט אילו הקוד היה מתקמפל, אבל C# לא מאפשר `catch` שלא ניתן להגיע אליו."
    "2": "גם אילו הקוד היה מתקמפל, הבלוק הכללי הראשון היה תופס את החריגה ראשון."
    "3": "לכל היותר בלוק `catch` אחד מתבצע עבור חריגה אחת."

- id: cs.exceptions.try-catch.004
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    string[] inputs = { "12", "abc", "99999999999" };
    foreach (string s in inputs)
    {
        try
        {
            Console.WriteLine(int.Parse(s));
        }
        catch (FormatException)
        {
            Console.WriteLine("format");
        }
        catch (Exception e)
        {
            Console.WriteLine(e.GetType().Name);
        }
    }
  options: ["12\nformat\nOverflowException", "12\nformat\nformat", "12\nformat\n99999999999", "12\nFormatException\nOverflowException"]
  answer: 0
  explanation: "`\"abc\"` איננו מספר, ולכן נזרקת `FormatException` והיא נתפסת בבלוק הראשון. `\"99999999999\"` הוא מספר תקין בפורמט, אבל גדול מ-`int.MaxValue`, ולכן נזרקת `OverflowException`. היא לא מתאימה לבלוק הראשון, ולכן נתפסת בבלוק הכללי, שמדפיס את שם הטיפוס."
  optionExplanations:
    "1": "המחרוזת בנויה מספרות בלבד, ולכן הבעיה היא גלישה (Overflow) ולא פורמט."
    "2": "`int` מוגבל ל-2147483647, ולכן המספר לא נכנס בו."
    "3": "`FormatException` נתפסת בבלוק הראשון, שמדפיס `format` ולא את שם הטיפוס."

- id: cs.exceptions.try-catch.005
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    Console.WriteLine(Check("5"));
    Console.WriteLine(Check("x"));

    static string Check(string s)
    {
        try
        {
            int.Parse(s);
            return "ok";
        }
        catch (FormatException)
        {
            return "bad";
        }
        finally
        {
            Console.WriteLine("finally");
        }
    }
  options: ["finally\nok\nfinally\nbad", "ok\nfinally\nbad\nfinally", "ok\nbad", "finally\nok\nbad"]
  answer: 0
  explanation: "`finally` רץ גם כשיוצאים מהמתודה עם `return`, מתוך `try` או מתוך `catch`. הוא רץ לפני שהמתודה מחזירה בפועל, ולכן `finally` מודפס בתוך `Check`, ורק אחר כך `Console.WriteLine` שבחוץ מדפיס את הערך שהוחזר."
  optionExplanations:
    "1": "ההדפסה שבחוץ מתבצעת רק אחרי ש-`Check` הסתיימה לגמרי, כולל ה-`finally`."
    "2": "`return` לא מדלג על `finally`."
    "3": "`finally` רץ בכל קריאה, גם בזו שנכנסה ל-`catch`."

- id: cs.exceptions.try-catch.006
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    Console.WriteLine(GetValue());

    static int GetValue()
    {
        int x = 1;
        try
        {
            return x;
        }
        finally
        {
            x = 2;
            Console.WriteLine($"finally {x}");
        }
    }
  options: ["finally 2\n1", "finally 2\n2", "1\nfinally 2", "2"]
  answer: 0
  explanation: "ב-`return x` הערך של `x` (כלומר 1) מחושב ונשמר כערך ההחזרה עוד לפני ש-`finally` רץ. השינוי של `x` בתוך `finally` לא משנה את הערך שכבר נשמר, ולכן מוחזר 1."
  optionExplanations:
    "1": "ערך ההחזרה נקבע ברגע ביצוע `return`; שינוי המשתנה אחר כך לא משפיע עליו."
    "2": "`finally` רץ לפני שהמתודה חוזרת, ולכן ההדפסה שבו קודמת להדפסת התוצאה."

- id: cs.exceptions.try-catch.007
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    string[] messages = { "timeout", "disk full" };
    foreach (string m in messages)
    {
        try
        {
            throw new InvalidOperationException(m);
        }
        catch (InvalidOperationException e) when (e.Message == "timeout")
        {
            Console.WriteLine("retry");
        }
        catch (InvalidOperationException e)
        {
            Console.WriteLine($"fail: {e.Message}");
        }
    }
  options: ["retry\nfail: disk full", "retry\nretry", "fail: timeout\nfail: disk full", "retry\nfail: timeout\nfail: disk full"]
  answer: 0
  explanation: "מסנן חריגות (Exception Filter) עם `when` גורם לבלוק לתפוס רק אם התנאי אמת. בפעם הראשונה ההודעה היא `timeout`, ולכן הבלוק הראשון תופס. בפעם השנייה התנאי שקר, והחיפוש ממשיך לבלוק הבא, שתופס כל `InvalidOperationException`."
  optionExplanations:
    "1": "כשתנאי ה-`when` שקר, הבלוק לא תופס את החריגה, גם אם הטיפוס מתאים."
    "2": "`fail: timeout` היה מודפס רק אם לא היה מסנן, או אם הבלוק הכללי היה ראשון."
    "3": "כל חריגה נתפסת בבלוק `catch` אחד בלבד."

- id: cs.exceptions.try-catch.008
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    string input = "x";
    try
    {
        try
        {
            int.Parse(input);
        }
        catch (FormatException) when (input.Length > 3)
        {
            Console.WriteLine("inner");
        }
        finally
        {
            Console.WriteLine("finally");
        }
    }
    catch (FormatException)
    {
        Console.WriteLine("outer");
    }
  options: ["finally\nouter", "inner\nfinally", "outer\nfinally", "inner\nfinally\nouter"]
  answer: 0
  explanation: "האורך של `input` הוא 1, ולכן המסנן של ה-`catch` הפנימי שקר והוא לא תופס. החריגה ממשיכה החוצה, אבל לפני שהיא עוזבת את ה-`try` הפנימי רץ ה-`finally` שלו. רק אחר כך היא נתפסת ב-`catch` החיצוני."
  optionExplanations:
    "1": "תנאי ה-`when` הוא `1 > 3`, כלומר שקר, ולכן הבלוק הפנימי לא תופס."
    "2": "ה-`finally` הפנימי רץ כשהביצוע יוצא מהבלוק הפנימי, לפני שמגיעים ל-`catch` החיצוני."
    "3": "חריגה שנתפסה לא ממשיכה לבלוק `catch` נוסף, ובכל מקרה הבלוק הפנימי לא תפס כאן."

- id: cs.exceptions.try-catch.009
  type: bug
  difficulty: 2
  prompt: "המתודה אמורה להחזיר 1- כאשר `text` איננו מספר, למשל `\"abc\"`. באיזו שורה הבאג?"
  code: |
