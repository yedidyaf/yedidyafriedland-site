- id: cs.exceptions.try-catch.010
  type: bug
  difficulty: 2
  prompt: "המתודה אמורה להחזיר את הגיל, או להדפיס `Invalid age` ולהחזיר 0 כשהטקסט איננו מספר. באיזו שורה הבאג?"
  code: |
    class AgeReader
    {
        public static int ReadAge(string text)
        {
            int age = 0;
            try
            {
                age = int.Parse(text);
            }
            finally
            {
                Console.WriteLine("Invalid age");
            }
            return age;
        }
    }
  answer: 10
  explanation: "`finally` לא תופס חריגה: הוא רץ תמיד ואחריו החריגה ממשיכה החוצה. לכן ההודעה מודפסת גם לקלט תקין, ובקלט לא תקין המתודה זורקת במקום להחזיר 0. צריך `catch (FormatException)`, שרץ רק כשנזרקה חריגה ומטפל בה."
  fixed: |
    class AgeReader
    {
        public static int ReadAge(string text)
        {
            int age = 0;
            try
            {
                age = int.Parse(text);
            }
            catch (FormatException)
