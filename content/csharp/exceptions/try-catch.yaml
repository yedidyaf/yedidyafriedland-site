            {
                return -1;
            }
        }
    }
  answer: 9
  explanation: "`int.Parse` על טקסט שאיננו מספר זורק `FormatException`, לא `OverflowException`. הבלוק תופס את הטיפוס הלא נכון, ולכן החריגה יוצאת מהמתודה במקום להחזיר 1-. בלוק `catch` תופס רק את הטיפוס שצוין ואת היורשים שלו."
  fixed: |
    class Parser
    {
        public static int ParseOrDefault(string text)
        {
