- id: cs.exceptions.using-dispose.007
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    var stream = new MemoryStream();
    using (stream)
    {
        stream.WriteByte(1);
    }
    try
    {
        stream.WriteByte(2);
    }
    catch (Exception e)
    {
        Console.WriteLine(e.GetType().Name);
    }
  options: ["ObjectDisposedException", "NullReferenceException", "InvalidOperationException", "לא יודפס כלום"]
  answer: 0
  explanation: "בסוף בלוק ה-`using` נקרא `Dispose` על `stream`, אבל המשתנה עצמו עדיין מפנה לאובייקט. שימוש באובייקט אחרי `Dispose` זורק `ObjectDisposedException`. לכן עדיף להצהיר על המשתנה בתוך ה-`using`, כך שלא יהיה נגיש אחריו."
  optionExplanations:
    "1": "`Dispose` לא הופך את המשתנה ל-`null`; ההפניה לאובייקט נשארת."
    "2": "`ObjectDisposedException` אכן יורשת מ-`InvalidOperationException`, אבל `GetType().Name` מחזיר את הטיפוס המדויק."
    "3": "אובייקט שעבר `Dispose` לא אמור לעבוד כרגיל; הוא זורק חריגה."

