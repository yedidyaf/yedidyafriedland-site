- id: cs.exceptions.using-dispose.014
  type: bug
  difficulty: 2
  prompt: "המתודה מעתיקה את תוכן הקובץ `from` לקובץ `to`, אבל לפעמים הקובץ החדש נשאר ריק. באיזו שורה הבאג?"
  code: |
    class FileCopier
    {
        public static void Copy(string from, string to)
        {
