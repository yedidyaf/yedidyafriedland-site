- id: cs.exceptions.using-dispose.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    using (var file = new Resource("log"))
    {
        Console.WriteLine("write");
    }
    Console.WriteLine("end");

    class Resource : IDisposable
    {
        private readonly string _name;

        public Resource(string name)
        {
            _name = name;
            Console.WriteLine($"open {_name}");
        }

        public void Dispose() => Console.WriteLine($"close {_name}");
    }
  options: ["open log\nwrite\nclose log\nend", "open log\nwrite\nend\nclose log", "open log\nwrite\nend", "write\nend"]
  answer: 0
  explanation: "הצהרת `using` קוראת ל-`Dispose` ברגע שהביצוע יוצא מהבלוק שלה. לכן `close log` מודפס מיד אחרי `write`, לפני השורה שאחרי הבלוק. כך משחררים משאב (Resource) בנקודה ידועה ולא «מתישהו»."
  optionExplanations:
    "1": "`Dispose` נקרא בסוף בלוק ה-`using`, לא בסוף התוכנית."
    "2": "`using` קורא ל-`Dispose` אוטומטית; לא צריך לקרוא לה בעצמכם."
    "3": "הבנאי של `Resource` רץ כשיוצרים את האובייקט, ולכן `open log` מודפס ראשון."

- id: cs.exceptions.using-dispose.002
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    using (var a = new Resource("A"))
    using (var b = new Resource("B"))
    {
        Console.WriteLine("work");
    }

    class Resource : IDisposable
    {
        private readonly string _name;

        public Resource(string name)
        {
            _name = name;
            Console.WriteLine($"open {_name}");
        }

        public void Dispose() => Console.WriteLine($"close {_name}");
    }
  options: ["open A\nopen B\nwork\nclose B\nclose A", "open A\nopen B\nwork\nclose A\nclose B", "open A\nwork\nclose A\nopen B\nwork\nclose B", "open B\nopen A\nwork\nclose A\nclose B"]
  answer: 0
  explanation: "שני ה-`using` מקוננים: `b` נמצא בתוך הבלוק של `a`. המשאבים נפתחים לפי הסדר ונסגרים בסדר הפוך, כמו מחסנית. זה חשוב כש-`B` תלוי ב-`A`, למשל פקודה שרצה על חיבור למסד נתונים."
  optionExplanations:
    "1": "המשאב שנפתח אחרון נסגר ראשון, כי הוא נמצא בבלוק הפנימי."
    "2": "יש בלוק אחד משותף לשני ה-`using`, ולכן `work` מודפס פעם אחת."
    "3": "המשאבים נוצרים לפי סדר הכתיבה: קודם `A` ואז `B`."

- id: cs.exceptions.using-dispose.003
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    try
    {
        using (var conn = new Resource("db"))
        {
            Console.WriteLine("query");
            throw new InvalidOperationException();
        }
    }
    catch (InvalidOperationException)
    {
        Console.WriteLine("error");
    }

    class Resource : IDisposable
    {
        private readonly string _name;

        public Resource(string name)
        {
            _name = name;
            Console.WriteLine($"open {_name}");
        }

        public void Dispose() => Console.WriteLine($"close {_name}");
    }
  options: ["open db\nquery\nclose db\nerror", "open db\nquery\nerror\nclose db", "open db\nquery\nerror", "open db\nerror\nclose db"]
  answer: 0
  explanation: "`using` מבטיח ש-`Dispose` ייקרא גם כשנזרקת חריגה. החריגה יוצאת מבלוק ה-`using`, `Dispose` רץ, ורק אחר כך החריגה מגיעה ל-`catch` שבחוץ."
  optionExplanations:
    "1": "`Dispose` רץ כשהחריגה עוזבת את בלוק ה-`using`, וזה קורה לפני שה-`catch` החיצוני מתחיל."
    "2": "חריגה לא מבטלת את `Dispose`; זו בדיוק ההבטחה של `using`."
    "3": "השורה `query` מודפסת לפני ה-`throw`."

