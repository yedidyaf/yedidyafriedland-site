  type: bug
  difficulty: 2
  prompt: "המתודה אמורה לכתוב טקסט לקובץ ולסגור את הקובץ תמיד, בין אם הכתיבה הצליחה ובין אם נכשלה (שגיאות צריכות להגיע לקוד הקורא). באיזו שורה הבאג?"
