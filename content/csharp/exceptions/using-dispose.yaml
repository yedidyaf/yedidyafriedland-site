  answer: 6
  explanation: "`StreamWriter` שומר טקסט במאגר זמני (Buffer) וכותב אותו לקובץ רק בשחרור. כאן לא קוראים ל-`Dispose` על `writer`, ולכן הנתונים עלולים לא להיכתב והקובץ נשאר פתוח. גם הכותב צריך `using`."
  fixed: |
    class FileCopier
    {
        public static void Copy(string from, string to)
        {
            using var reader = new StreamReader(from);
