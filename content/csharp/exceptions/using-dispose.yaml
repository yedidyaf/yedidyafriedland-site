        Console.WriteLine("caught");
    }

    class Resource : IDisposable
    {
        public Resource(string name)
        {
            Console.WriteLine($"open {name}");
            throw new ArgumentException("cannot open");
        }

        public void Dispose() => Console.WriteLine("close");
    }
