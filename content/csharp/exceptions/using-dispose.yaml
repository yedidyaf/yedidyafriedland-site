  answer: 0
  explanation: "הבנאי זורק, ולכן אובייקט לא נוצר ושום דבר לא הוקצה ל-`r`. ההגנה של `using` (ה-`try` וה-`finally` שהוא מייצר) מתחילה רק אחרי שהמשאב נוצר בהצלחה, ולכן אין למי לקרוא `Dispose`."
  optionExplanations:
    "1": "`Dispose` נקרא רק על משאב שנוצר בהצלחה; כאן הבנאי נכשל."
    "2": "הבנאי זורק לפני שנכנסים לבלוק, ולכן `inside` לא מודפס."
    "3": "`open bad` מודפס בבנאי לפני ה-`throw`, ו-`Dispose` לא נקרא."

- id: cs.exceptions.using-dispose.006
