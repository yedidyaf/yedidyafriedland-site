    "2": "זה הצעד הרקורסיבי (Recursive step), החלק השני של כל רקורסיה."
    "3": "הערך הסופי מורכב מכל הקריאות. מקרה הבסיס הוא רק התחנה האחרונה בדרך פנימה."

