- id: cs.methods.recursion.016
  type: cleaner
  difficulty: 1
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      static int Factorial(int n)
      {
          if (n <= 1)
              return 1;
          return n * Factorial(n - 1);
      }
    - |
      static int Factorial(int n)
      {
          int result;
          if (n <= 1)
          {
              result = 1;
          }
          else
          {
              result = n * Factorial(n - 1);
          }
          return result;
      }
  answer: 0
  explanation: "הדפוס הקלאסי ברקורסיה: בודקים את מקרה הבסיס בראש המתודה ויוצאים מיד, ואחריו כותבים את הצעד הרקורסיבי. זה תנאי שמירה (Guard Clause), והיא מראה בבירור את שני החלקים של הרקורסיה."
  optionExplanations:
    "1": "משתנה העזר וה-`else` מוסיפים שורות וקינון בלי להוסיף מידע, ומטשטשים את ההפרדה בין מקרה הבסיס לצעד הרקורסיבי."
