    "2": "יש קריאה רקורסיבית נוספת אחרי ההדפסה, ולכן כל רמה מדפיסה גם בצד השני."
    "3": "`3` מודפס רק אחרי ש-`Print(2)` הראשונה הסתיימה, כלומר אחרי `121`."

