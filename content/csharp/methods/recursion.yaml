- id: cs.methods.recursion.018
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    int[] a = { 3, 9, 4 };
    Console.WriteLine(Max(a, 0));

    static int Max(int[] a, int i)
    {
        if (i == a.Length - 1)
            return a[i];
        int rest = Max(a, i + 1);
        if (a[i] > rest)
            return a[i];
        return rest;
    }
  options: ["9", "4", "3", "IndexOutOfRangeException"]
  answer: 0
  explanation: "המתודה מוצאת את המקסימום מהאינדקס `i` ועד סוף המערך. מקרה הבסיס הוא האיבר האחרון. בדרך חזרה כל קריאה משווה את האיבר שלה למקסימום של שאר המערך: `Max(a, 2)` מחזירה 4, `Max(a, 1)` מחזירה 9, ו-`Max(a, 0)` מחזירה 9."
  optionExplanations:
    "1": "4 הוא רק מקרה הבסיס. הקריאות שמעליו משוות אותו לאיברים הקודמים."
    "2": "3 הוא האיבר הראשון, אבל 9 גדול ממנו."
    "3": "הרקורסיה נעצרת באינדקס האחרון, `a.Length - 1`, ולא חורגת ממנו."

