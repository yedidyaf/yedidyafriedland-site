        Print(n - 1);
    }
  options: ["1213121", "321", "123", "3213121"]
  answer: 0
  explanation: "`Print(1)` מדפיסה `1`. `Print(2)` מדפיסה את `Print(1)`, אחר כך `2`, ושוב את `Print(1)`: `121`. `Print(3)` מדפיסה `121`, אחר כך `3`, ושוב `121`. כל קריאה עם שתי קריאות רקורסיביות יוצרת עץ קריאות, לא שרשרת."
  optionExplanations:
