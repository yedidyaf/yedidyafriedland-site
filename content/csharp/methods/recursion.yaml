- id: cs.methods.recursion.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    Console.WriteLine(Factorial(5));

    static int Factorial(int n)
    {
        if (n <= 1)
            return 1;
        return n * Factorial(n - 1);
    }
  options: ["120", "24", "15", "720"]
  answer: 0
  explanation: "רקורסיה (Recursion) היא מתודה שקוראת לעצמה. כאן `Factorial(5)` = 5 * 4 * 3 * 2 * `Factorial(1)`, ומקרה הבסיס (Base case) מחזיר 1. התוצאה: 120."
  optionExplanations:
    "1": "`24` הוא `Factorial(4)`. הקריאה מתחילה מ-5 ומכפילה גם בו."
    "2": "`15` הוא סכום 1 עד 5. הפעולה כאן היא כפל."
    "3": "`720` הוא `Factorial(6)`."

- id: cs.methods.recursion.002
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    Count(3);

    static void Count(int n)
    {
        if (n == 0)
            return;
        Console.Write(n);
        Count(n - 1);
        Console.Write(n);
    }
  options: ["321123", "321", "123321", "3210123"]
  answer: 0
  explanation: "כל קריאה מדפיסה את `n`, מחכה שהקריאה הרקורסיבית תסתיים, ואז מדפיסה את `n` שוב. בדרך פנימה מודפס `321`, ובחזרה, כשכל קריאה מסתיימת בסדר הפוך, מודפס `123`. לכל קריאה יש `n` משלה, ולכן הערך לא אבד."
  optionExplanations:
    "1": "הקריאה הרקורסיבית לא מסיימת את המתודה. אחרי שהיא חוזרת, השורה שאחריה רצה."
    "2": "ההדפסה הראשונה בכל קריאה קורית לפני הקריאה הרקורסיבית, ולכן `3` מודפס ראשון."
    "3": "במקרה הבסיס, `n == 0`, המתודה חוזרת לפני ההדפסה, ולכן `0` לא מודפס."

- id: cs.methods.recursion.003
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    Console.WriteLine(DigitSum(4096));

    static int DigitSum(int n)
    {
        if (n < 10)
            return n;
        return n % 10 + DigitSum(n / 10);
    }
  options: ["19", "6", "4", "4096"]
  answer: 0
  explanation: "בכל קריאה `n % 10` הוא הספרה האחרונה ו-`n / 10` מוריד אותה. הקריאות: 6 + 9 + 0 + `DigitSum(4)`, ומקרה הבסיס מחזיר 4. הסכום הוא 19."
  optionExplanations:
    "1": "`6` הוא רק הספרה האחרונה. התוצאה של הקריאה הרקורסיבית מתווספת אליה."
    "2": "`4` הוא ערך מקרה הבסיס בלבד. כל קריאה בדרך חזרה מוסיפה אליו את הספרה שלה."
    "3": "המספר עצמו מוחזר רק כשהוא קטן מ-10."

- id: cs.methods.recursion.004
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    int calls = 0;
    Console.WriteLine(Fib(4));
    Console.WriteLine(calls);

    int Fib(int n)
    {
        calls++;
        if (n < 2)
            return n;
        return Fib(n - 1) + Fib(n - 2);
    }
  options: ["3\n9", "3\n5", "3\n4", "5\n9"]
  answer: 0
  explanation: "`Fib(4)` = 3. כל קריאה שאינה מקרה בסיס פותחת שתי קריאות, ולכן מספר הקריאות הוא 1 ועוד הקריאות של `Fib(3)` (5) ועוד אלה של `Fib(2)` (3), כלומר 9. אותם ערכים מחושבים שוב ושוב, ולכן רקורסיה כזו מתנפחת מהר."
  optionExplanations:
    "1": "`5` הוא מספר הקריאות של `Fib(3)` בלבד. צריך לספור גם את הקריאה ל-`Fib(4)` ואת ענף `Fib(2)`."
    "2": "`4` מניח שיש קריאה אחת לכל ערך של `n`. בפועל `Fib(2)`, `Fib(1)` ו-`Fib(0)` נקראות יותר מפעם אחת."
    "3": "`Fib(4)` הוא 3 בסדרה 0, 1, 1, 2, 3. `5` הוא `Fib(5)`."

- id: cs.methods.recursion.005
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    Console.WriteLine(Reverse("abc"));

    static string Reverse(string s)
    {
        if (s.Length <= 1)
            return s;
        return Reverse(s.Substring(1)) + s[0];
    }
  options: ["cba", "abc", "bca", "a"]
  answer: 0
  explanation: "כל קריאה הופכת את שאר המחרוזת ומוסיפה את התו הראשון בסוף: `Reverse(\"bc\") + 'a'`, ו-`Reverse(\"bc\")` הוא `Reverse(\"c\") + 'b'`. בדרך חזרה מתקבל `c`, אחר כך `cb`, ולבסוף `cba`."
  optionExplanations:
    "1": "התו הראשון מתווסף אחרי התוצאה הרקורסיבית, ולכן הוא עובר לסוף."
    "2": "`bca` הוא הזזה אחת של `a` לסוף. גם `bc` עובר היפוך ברקורסיה."
    "3": "`a` הוא התו הראשון בלבד. מקרה הבסיס מחזיר מחרוזת באורך 1, כאן `c`."

- id: cs.methods.recursion.006
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    var path = new List<int>();
    Collect(3, path);
    Console.WriteLine(string.Join(",", path));

    static void Collect(int n, List<int> acc)
    {
        if (n == 0)
            return;
        Collect(n - 1, acc);
        acc.Add(n);
    }
  options: ["1,2,3", "3,2,1", "3", "1,2"]
  answer: 0
  explanation: "כל הקריאות מקבלות הפניה לאותה רשימה. ה-`Add` נמצא אחרי הקריאה הרקורסיבית, ולכן הוא רץ בדרך חזרה: קודם הקריאה הפנימית ביותר מוסיפה 1, אחריה 2 ולבסוף 3."
  optionExplanations:
    "1": "`3,2,1` היה מתקבל אילו `Add` היה לפני הקריאה הרקורסיבית."
    "2": "כל הקריאות משנות את אותה רשימה, כי ההפניה עוברת בכל קריאה."
    "3": "גם הקריאה החיצונית, עם `n` = 3, מוסיפה את הערך שלה אחרי שהקריאות הפנימיות חוזרות."

- id: cs.methods.recursion.007
  type: bug
  difficulty: 1
  prompt: "`SumTo(5)` אמורה להחזיר 1 + 2 + 3 + 4 + 5 = `15`, אבל התוכנית קורסת עם `StackOverflowException`. באיזו שורה הבאג?"
  code: |
    Console.WriteLine(SumTo(5));

    static int SumTo(int n)
    {
        if (n == 0)
            return 0;
        return n + SumTo(n);
    }
  answer: 7
  explanation: "הקריאה הרקורסיבית חייבת לקרב את הבעיה למקרה הבסיס. `SumTo(n)` קוראת לעצמה עם אותו ערך, ולכן `n` אף פעם לא מגיע ל-0. התיקון: `SumTo(n - 1)`."
  fixed: |
    Console.WriteLine(SumTo(5));

    static int SumTo(int n)
    {
        if (n == 0)
            return 0;
        return n + SumTo(n - 1);
    }

