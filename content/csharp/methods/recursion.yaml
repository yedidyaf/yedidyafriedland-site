- id: cs.methods.recursion.009
  type: single
  difficulty: 1
  prompt: מהו מקרה הבסיס (Base case) במתודה רקורסיבית?
  options:
    - "המצב שבו המתודה מחזירה תשובה בלי לקרוא שוב לעצמה"
    - "הקריאה הראשונה למתודה, מהקוד הראשי"
    - "הקריאה הרקורסיבית שמקטינה את הבעיה"
    - "הערך שהמתודה מחזירה בסוף כל הקריאות"
  answer: 0
  explanation: "מקרה הבסיס הוא בעיה קטנה מספיק כדי לפתור אותה ישירות, למשל `n <= 1` בעצרת. הוא עוצר את שרשרת הקריאות. בלעדיו, או אם הקריאה הרקורסיבית לא מתקרבת אליו, הרקורסיה לא נגמרת."
  optionExplanations:
