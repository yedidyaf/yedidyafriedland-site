- id: cs.methods.defining-methods.018
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    Console.WriteLine(Max(Max(3, 7), 5));

    static int Max(int a, int b)
    {
        if (a > b)
            return a;
        return b;
    }
  options: ["7", "5", "3", "שגיאת קומפילציה"]
  answer: 0
  explanation: "הקריאה הפנימית מחושבת קודם: `Max(3, 7)` מחזירה 7. הערך הזה משמש כארגומנט לקריאה החיצונית, `Max(7, 5)`, שמחזירה 7. `return` מסיים את המתודה מיד, ולכן כשמתקיים `a > b` השורה `return b` לא רצה."
  optionExplanations:
    "1": "5 הוא הארגומנט השני של הקריאה החיצונית, אבל 7 גדול ממנו."
    "2": "3 הוא הקטן מבין השלושה."
    "3": "מותר להעביר ערך שמוחזר ממתודה כארגומנט לקריאה אחרת."

