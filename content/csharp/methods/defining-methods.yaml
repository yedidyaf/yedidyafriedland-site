- id: cs.methods.defining-methods.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    Console.WriteLine(Square(4) + Square(3));

    static int Square(int n)
    {
        return n * n;
    }
  options: ["25", "169", "49", "7"]
  answer: 0
  explanation: "טיפוס ההחזרה (Return type) של `Square` הוא `int`, ולכן `Square(4) + Square(3)` הוא חיבור של שני מספרים: 16 + 9 = 25. אין כאן שרשור מחרוזות."
  optionExplanations:
    "1": "`169` היה מתקבל משרשור מחרוזות, אבל המתודה מחזירה `int` ולכן `+` הוא חיבור חשבוני."
    "2": "`49` הוא `(4 + 3) * (4 + 3)`. כל קריאה מחושבת בנפרד ורק אחר כך התוצאות מחוברות."
    "3": "`7` הוא סכום הארגומנטים עצמם, בלי להפעיל עליהם את המתודה."

- id: cs.methods.defining-methods.003
  type: single
  difficulty: 1
  prompt: "מה המשמעות של המילה `void` בהגדרת המתודה `static void PrintTitle(string title)`?"
  options:
    - "המתודה לא מחזירה ערך לקורא"
    - "המתודה לא מקבלת פרמטרים"
    - "המתודה מחזירה `null`"
    - "המתודה פרטית ואי אפשר לקרוא לה מבחוץ"
  answer: 0
  explanation: "`void` במקום טיפוס ההחזרה אומר שהמתודה מבצעת פעולה ולא מחזירה ערך. אי אפשר להציב את תוצאת הקריאה שלה במשתנה."
  optionExplanations:
    "1": "הפרמטרים נכתבים בסוגריים אחרי שם המתודה. כאן יש פרמטר אחד, `title`."
    "2": "`null` הוא ערך. מתודת `void` לא מחזירה שום ערך, גם לא `null`."
    "3": "הנגישות נקבעת במילים כמו `public` ו-`private`, לא ב-`void`."

- id: cs.methods.defining-methods.004
  type: output
  difficulty: 2
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    int total = Print(5);
    Console.WriteLine(total);

    static void Print(int n)
    {
        Console.WriteLine(n);
    }
  options: ["שגיאת קומפילציה", "5\n5", "5\n0", "5"]
  answer: 0
  explanation: "`Print` מוגדרת `void`, כלומר היא לא מחזירה ערך. לכן אי אפשר להציב את הקריאה שלה במשתנה מסוג `int`, והקומפיילר עוצר כבר בשורה הראשונה."
  optionExplanations:
    "1": "מתודת `void` לא מחזירה את הארגומנט שקיבלה. היא לא מחזירה כלום."
    "2": "אין ערך ברירת מחדל שחוזר ממתודת `void`. הקוד לא מתקמפל בכלל."
    "3": "לא יודפס כלום, כי תוכנית שלא מתקמפלת לא רצה."

- id: cs.methods.defining-methods.008
  type: bug
  difficulty: 1
  prompt: "המתודה `Max` אמורה להחזיר את הגדול מבין שני המספרים, ולכן הקוד אמור להדפיס `9`. איזו שורה צריך לתקן?"
  code: |
    Console.WriteLine(Max(3, 9));

    static int Max(int a, int b)
    {
        int result = a;
        if (b > a)
        {
            result = b;
        }
        return a;
    }
  answer: 10
  explanation: "המתודה מחשבת את התוצאה הנכונה ב-`result`, אבל מחזירה את `a`. מה שקובע את ערך הקריאה הוא רק מה שכתוב אחרי `return`, ולכן מודפס `3`. התיקון: `return result;`."
  fixed: |
    Console.WriteLine(Max(3, 9));

    static int Max(int a, int b)
    {
        int result = a;
        if (b > a)
        {
            result = b;
        }
        return result;
    }

- id: cs.methods.defining-methods.009
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להוסיף בונוס של 10 נקודות לציון ולהדפיס `80`. איזו שורה צריך לתקן?"
  code: |
    int score = 70;
    AddBonus(score);
    Console.WriteLine(score);

    static int AddBonus(int value)
    {
        return value + 10;
    }
  answer: 2
  explanation: "`AddBonus` לא משנה את `score`. היא מחשבת ערך חדש ומחזירה אותו. הקריאה בשורה 2 זורקת את הערך המוחזר, ולכן מודפס `70`. צריך להציב אותו: `score = AddBonus(score);`."
  fixed: |
    int score = 70;
    score = AddBonus(score);
    Console.WriteLine(score);

    static int AddBonus(int value)
    {
        return value + 10;
    }

- id: cs.methods.defining-methods.010
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    Check(5);
    Check(-1);

    static void Check(int n)
    {
        if (n < 0)
        {
            Console.WriteLine("invalid");
            return;
        }
        Console.WriteLine(n * 2);
    }
  options: ["10\ninvalid", "10\ninvalid\n-2", "10\n-2", "invalid"]
  answer: 0
  explanation: "גם במתודת `void` אפשר לכתוב `return;` בלי ערך. הוא יוצא מהמתודה מיד, ולכן בקריאה עם `-1` השורה האחרונה לא רצה."
  optionExplanations:
    "1": "`return` מסיים את המתודה מיד. הקוד שאחריו לא מתבצע בקריאה הזו."
    "2": "התנאי `n < 0` מתקיים עבור `-1`, ולכן מודפס `invalid` ולא החישוב."
    "3": "הקריאה הראשונה, `Check(5)`, מדפיסה `10` לפני הקריאה השנייה."

- id: cs.methods.defining-methods.011
  type: output
  difficulty: 3
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    int factor = 3;

    static int Scale(int x)
    {
        return x * factor;
    }

    Console.WriteLine(Scale(5));
  options: ["שגיאת קומפילציה", "15", "0", "5"]
  answer: 0
  explanation: "מתודה מקומית שמוגדרת `static` אסורה בלכידה (Capture) של משתנים מהסביבה שלה. היא רואה רק את הפרמטרים והמשתנים שלה, ולכן השימוש ב-`factor` הוא שגיאת קומפילציה. בלי `static` הקוד היה מדפיס `15`."
  optionExplanations:
    "1": "`15` היה מודפס אילו `Scale` לא הייתה `static`. המילה `static` חוסמת גישה למשתנים שמחוץ למתודה."
    "2": "אין ערך ברירת מחדל למשתנה שלא נגיש. הקומפיילר עוצר עם שגיאה."
    "3": "`factor` לא מתעלם בשקט. השימוש בו הוא שגיאה."

- id: cs.methods.defining-methods.012
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    Console.WriteLine(Tag("x") + Tag("y"));

    static string Tag(string s)
    {
        Console.Write(s.ToUpper());
        return s;
    }
  options: ["XYxy", "xyXY", "XxYy", "xy"]
  answer: 0
  explanation: "לפני ש-`Console.WriteLine` רץ, צריך לחשב את הארגומנט שלו. שתי הקריאות ל-`Tag` רצות משמאל לימין ומדפיסות `X` ואז `Y` (תופעת לוואי, Side effect). רק אחר כך מודפס הערך המשורשר שהן החזירו, `xy`."
  optionExplanations:
    "1": "הארגומנט של `WriteLine` מחושב לפני ההדפסה שלו, ולכן ההדפסות שבתוך `Tag` מגיעות קודם."
    "2": "`Tag(\"y\")` נקראת רק אחרי ש-`Tag(\"x\")` הסתיימה, ו-`WriteLine` מדפיס רק בסוף."
    "3": "`Console.Write` בתוך `Tag` מדפיס בפועל. ערך ההחזרה וההדפסה הם שני דברים נפרדים."

- id: cs.methods.defining-methods.013
  type: single
  difficulty: 1
  prompt: "איזו הגדרה תקינה למתודה שמקבלת שם ומחזירה מחרוזת ברכה?"
  options:
    - "`static string Greet(string name)`"
    - "`static Greet(string name): string`"
    - "`static string Greet(name)`"
    - "`static void string Greet(string name)`"
  answer: 0
  explanation: "ב-C# כותבים קודם את טיפוס ההחזרה, אחריו את שם המתודה, ובסוגריים כל פרמטר עם הטיפוס שלו. זו חתימת המתודה (Method signature) יחד עם טיפוס ההחזרה."
  optionExplanations:
    "1": "טיפוס החזרה אחרי נקודתיים הוא תחביר של שפות אחרות. ב-C# הוא נכתב לפני השם."
    "2": "כל פרמטר ב-C# חייב טיפוס מפורש, למשל `string name`."
    "3": "למתודה יש טיפוס החזרה אחד בלבד. `void` ו-`string` לא יכולים להופיע יחד."

