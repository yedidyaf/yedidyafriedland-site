- id: cs.methods.defining-methods.021
  type: bug
  difficulty: 2
  prompt: "המתודה `DigitSum` אמורה להחזיר את סכום הספרות של `n`, ולכן הקוד אמור להדפיס `6`. בפועל התוכנית לא מסתיימת. איזו שורה צריך לתקן?"
  code: |
    Console.WriteLine(DigitSum(123));

    static int DigitSum(int n)
    {
        int sum = 0;
        while (n > 0)
        {
            sum += n % 10;
            n = n % 10;
        }
        return sum;
    }
  answer: 9
  explanation: "`n % 10` נותן את ספרת האחדות, ולכן אחרי הסיבוב הראשון `n` נשאר 3 לתמיד והלולאה אינסופית. כדי להוריד את הספרה האחרונה צריך חלוקה שלמה: `n = n / 10`."
  fixed: |
    Console.WriteLine(DigitSum(123));

    static int DigitSum(int n)
    {
        int sum = 0;
        while (n > 0)
        {
            sum += n % 10;
            n = n / 10;
        }
        return sum;
    }

- id: cs.methods.defining-methods.022
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    int a = 3;
    int b = F(a);
    Console.WriteLine(a + " " + b);

    static int F(int x)
    {
        x = x * 2;
        return x + 1;
    }
  options: ["3 7", "6 7", "3 6", "7 7"]
  answer: 0
  explanation: "הפרמטר `x` מקבל עותק של הערך של `a` (העברה לפי ערך, Pass by Value). השינוי של `x` בתוך המתודה לא נוגע ב-`a`, שנשאר 3. המתודה מחזירה `6 + 1`, ולכן `b` הוא 7."
  optionExplanations:
    "1": "`x` הוא עותק. שינוי שלו לא משנה את `a`."
    "2": "המתודה מחזירה `x + 1`, כלומר 7, ולא את `x` עצמו."
    "3": "`a` לא מושפע ממה שקורה ל-`x` בתוך המתודה."

- id: cs.methods.defining-methods.023
  type: order
  difficulty: 2
  tags: [algorithm]
  prompt: "סדרו את השורות כך שהמתודה תבדוק אם מספר גדול מ-1 הוא ראשוני."
  code: |
    Console.WriteLine(IsPrime(13) + " " + IsPrime(15));
    static bool IsPrime(int n)
    {
        for (int d = 2; d < n; d++)
        {
            if (n % d == 0)
                return false;
        }
        return true;
    }
  output: "True False"
  anyOrder: [[1, [2, 10]]]
  explanation: "מחפשים מחלק בין 2 ל-`n - 1`: מחלק אחד מספיק כדי להחזיר `false` מיד. רק אם הלולאה הסתיימה בלי למצוא מחלק מחזירים `true`, ולכן `return true` נמצא אחרי הלולאה ולא בתוכה. אם הוא בתוך הלולאה, המתודה תחזיר תשובה כבר אחרי בדיקת המחלק 2."
