- id: cs.methods.overloading.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    class Program
    {
        static void Main()
        {
            Print(5);
            Print("5");
            Print(5.0);
        }

        static void Print(int x)
        {
            Console.WriteLine("int");
        }

        static void Print(string x)
        {
            Console.WriteLine("string");
        }

        static void Print(double x)
        {
            Console.WriteLine("double");
        }
    }
  options: ["int\nstring\ndouble", "int\nint\nint", "int\nstring\nint", "string\nstring\nstring"]
  answer: 0
  explanation: "שלוש המתודות נקראות `Print`, אבל רשימות הפרמטרים שלהן שונות. זו העמסה (Overloading). הקומפיילר בוחר בכל קריאה את הגרסה שמתאימה לטיפוס הארגומנט: `5` הוא `int`, `\"5\"` הוא `string` ו-`5.0` הוא `double`."
  optionExplanations:
    "1": "הקומפיילר בוחר גרסה לפי הטיפוס של כל ארגומנט, ולא את הראשונה שמופיעה."
    "2": "`5.0` הוא ליטרל מסוג `double`, ואין המרה מרומזת מ-`double` ל-`int`."
    "3": "הבחירה נעשית לפי הטיפוס, לא לפי האופן שבו הערך ייראה כשמדפיסים אותו."

- id: cs.methods.overloading.004
  type: output
  difficulty: 2
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    class Program
    {
        static void Main()
        {
            Console.WriteLine(Half(5));
        }

        static int Half(int n)
        {
            return n / 2;
        }

        static double Half(int n)
        {
            return n / 2.0;
        }
    }
  options: ["שגיאת קומפילציה", "2", "2.5", "2\n2.5"]
  answer: 0
  explanation: "טיפוס ההחזרה אינו חלק מהחתימה לצורך העמסה. לשתי המתודות אותו שם ואותה רשימת פרמטרים, `(int)`, ולכן זו הגדרה כפולה ושגיאת קומפילציה."
  optionExplanations:
    "1": "הקומפיילר לא בוחר לפי הטיפוס שהקורא מצפה לקבל. הוא דוחה את ההגדרה הכפולה עוד לפני הקריאה."
    "2": "אין דרך לבחור בין שתי מתודות עם אותה רשימת פרמטרים, ולכן הקוד לא מתקמפל."
    "3": "קריאה אחת מפעילה מתודה אחת לכל היותר, וכאן הקוד לא מתקמפל בכלל."

- id: cs.methods.overloading.005
  type: single
  difficulty: 1
  prompt: מה חייב להיות שונה בין שתי גרסאות מועמסות של אותה מתודה?
  options:
    - "רשימת הפרמטרים: מספר הפרמטרים, הטיפוסים שלהם או סדר הטיפוסים"
    - "טיפוס ההחזרה"
    - "שמות הפרמטרים"
    - "משנה הגישה, למשל `public` מול `private`"
  answer: 0
  explanation: "הקומפיילר מבחין בין מתודות מועמסות לפי השם ורשימת הפרמטרים, כלומר החתימה (Signature). רק כך הוא יכול להחליט בכל קריאה איזו גרסה להפעיל, לפי הארגומנטים."
  optionExplanations:
    "1": "שתי מתודות שנבדלות רק בטיפוס ההחזרה הן הגדרה כפולה, כי בקריאה לא רואים איזה טיפוס מצופה."
    "2": "שמות הפרמטרים לא משפיעים על החתימה. `Add(int a)` ו-`Add(int b)` הן אותה מתודה."
    "3": "משנה הגישה לא שייך לחתימה, ושינוי שלו בלבד יוצר הגדרה כפולה."

- id: cs.methods.overloading.007
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    class Program
    {
        static void Main()
        {
            Show(7 / 2);
            Show(7 / 2.0);
            Show((double)7 / 2);
        }

        static void Show(int x)
        {
            Console.WriteLine("int " + x);
        }

        static void Show(double x)
        {
            Console.WriteLine("double " + x);
        }
    }
  options:
    - "int 3\ndouble 3.5\ndouble 3.5"
    - "double 3.5\ndouble 3.5\ndouble 3.5"
    - "int 3\ndouble 3.5\nint 3"
    - "int 3\ndouble 3.5\ndouble 3"
  answer: 0
  explanation: "הגרסה נבחרת לפי הטיפוס של הביטוי כולו. `7 / 2` הוא `int` שערכו 3. ב-`7 / 2.0` וב-`(double)7 / 2` אחד הצדדים הוא `double`, ולכן התוצאה `double` ושווה 3.5. ההמרה `(double)` חלה על `7` לפני החלוקה."
  optionExplanations:
    "1": "חלוקה בין שני `int` נשארת `int`, ולכן נבחרת `Show(int)`."
    "2": "ההמרה חלה על `7` לפני החלוקה, ולכן התוצאה כבר `double`."
    "3": "ההמרה לא חלה על תוצאה של חלוקה שלמה, אלא על `7`, ולכן מתקבל 3.5."

