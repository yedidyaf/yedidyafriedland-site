- id: cs.methods.overloading.013
  type: bug
  difficulty: 2
  prompt: "התוכנית אמורה להדפיס `5 ILS` ואז `5 USD`, אבל היא קורסת עם `StackOverflowException`. איזו שורה צריך לתקן?"
  code: |
    class Program
    {
        static void Main()
        {
            Console.WriteLine(Price(5));
            Console.WriteLine(Price(5, "USD"));
        }

        static string Price(int amount)
        {
            return Price(amount, "ILS");
        }

        static string Price(int amount, string currency)
        {
            return Price(amount);
        }
    }
  answer: 16
  explanation: "הגרסה הקצרה מעבירה את העבודה לגרסה המלאה, וזה נכון. אבל הגרסה המלאה מעבירה חזרה לגרסה הקצרה, ושתיהן קוראות זו לזו בלי סוף. הגרסה המלאה היא זו שצריכה לבצע את העבודה בפועל: `return amount + \" \" + currency;`."
  fixed: |
    class Program
    {
        static void Main()
        {
            Console.WriteLine(Price(5));
            Console.WriteLine(Price(5, "USD"));
        }

        static string Price(int amount)
        {
            return Price(amount, "ILS");
        }

        static string Price(int amount, string currency)
        {
            return amount + " " + currency;
        }
    }

- id: cs.methods.overloading.014
  type: bug
  difficulty: 2
  prompt: "הקריאה `Average(3, 4)` אמורה להדפיס `3.5`, אבל מודפס `3`. איזו שורה צריך לתקן?"
  code: |
    class Program
    {
        static void Main()
        {
            Console.WriteLine(Average(3, 4));
        }

        static double Average(int a, int b)
        {
            return (a + b) / 2;
        }

        static double Average(double a, double b)
        {
            return (a + b) / 2;
        }
    }
  answer: 10
  explanation: "הארגומנטים `3` ו-`4` הם `int`, ולכן נבחרת הגרסה של `int` ולא של `double`. בה `(a + b) / 2` היא חלוקה שלמה שנותנת 3, ורק אחר כך התוצאה מומרת ל-`double`. התיקון: `(a + b) / 2.0`."
  fixed: |
    class Program
    {
        static void Main()
        {
            Console.WriteLine(Average(3, 4));
        }

        static double Average(int a, int b)
        {
            return (a + b) / 2.0;
        }

        static double Average(double a, double b)
        {
            return (a + b) / 2;
        }
    }

- id: cs.methods.overloading.015
  type: single
  difficulty: 1
  prompt: "אפשר לכתוב גם `Console.WriteLine(42)` וגם `Console.WriteLine(\"hi\")`. מה מאפשר לקרוא לאותו שם עם ארגומנטים מטיפוסים שונים?"
  options:
    - "העמסת מתודות - Overloading"
    - "דריסת מתודות - Overriding"
    - "ירושה - Inheritance"
    - "המרה של כל ארגומנט ל-`string` לפני הקריאה"
  answer: 0
  explanation: "למחלקה `Console` יש גרסאות רבות של `WriteLine`, למשל עבור `int`, `string`, `double` ו-`bool`, כולן באותו שם. הקומפיילר בוחר בכל קריאה את הגרסה שמתאימה לטיפוס הארגומנט."
  optionExplanations:
    "1": "דריסה (Overriding) היא החלפת מימוש של מתודה ממחלקת בסיס במחלקה יורשת, לא כמה גרסאות באותה מחלקה."
    "2": "ירושה היא יחס בין מחלקות, והיא לא קשורה לבחירת גרסה לפי טיפוס הארגומנט."
    "3": "אין המרה אוטומטית ל-`string`. נבחרת גרסה שמקבלת את הטיפוס עצמו, למשל `WriteLine(int)`."

- id: cs.methods.overloading.016
  type: single
  difficulty: 3
  prompt: "במחלקה מוגדרות שתי הגרסאות הבאות. איזו קריאה מתוך `Main` לא תתקמפל?"
  code: |
    class Program
    {
        static void F(int a, double b)
        {
            Console.WriteLine("int, double");
        }

        static void F(double a, int b)
        {
            Console.WriteLine("double, int");
        }
    }
  options: ["`F(1, 2)`", "`F(1, 2.0)`", "`F(1.0, 2)`", "`F(1.5, 2)`"]
  answer: 0
  explanation: "ב-`F(1, 2)` שתי הגרסאות מתאימות. הראשונה טובה יותר עבור הארגומנט הראשון, והשנייה טובה יותר עבור השני, ואף אחת לא טובה יותר בשניהם. זו קריאה דו־משמעית (Ambiguous Call), והקומפיילר מסרב לבחור."
  optionExplanations:
    "1": "`2.0` הוא `double`, ולכן רק `F(int, double)` מתאימה."
    "2": "`1.0` הוא `double` ואין המרה מרומזת ממנו ל-`int`, ולכן רק `F(double, int)` מתאימה."
    "3": "`1.5` הוא `double`, ולכן רק `F(double, int)` מתאימה."

