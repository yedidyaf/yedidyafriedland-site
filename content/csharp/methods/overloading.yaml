- id: cs.methods.overloading.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    Printer.Print(5);
    Printer.Print("5");
    Printer.Print(5.0);

    static class Printer
    {
        public static void Print(int x) => Console.WriteLine("int");
        public static void Print(string x) => Console.WriteLine("string");
        public static void Print(double x) => Console.WriteLine("double");
    }
  options: ["int\nstring\ndouble", "int\nint\nint", "int\nstring\nint", "string\nstring\nstring"]
  answer: 0
  explanation: "שלוש המתודות נקראות `Print` אבל רשימות הפרמטרים שלהן שונות. זו העמסה (Overloading). הקומפיילר בוחר בכל קריאה את הגרסה שמתאימה לטיפוס הארגומנט: `5` הוא `int`, `\"5\"` הוא `string`, ו-`5.0` הוא `double`."
  optionExplanations:
    "2": "`5.0` הוא ליטרל מסוג `double`, ואין המרה מרומזת מ-`double` ל-`int`."
    "3": "הבחירה נעשית לפי הטיפוס, לא לפי האופן שבו הערך ייראה כשמדפיסים אותו."

- id: cs.methods.overloading.002
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    Calc.Show(7);

    static class Calc
    {
        public static void Show(long x) => Console.WriteLine("long");
        public static void Show(double x) => Console.WriteLine("double");
    }
  options: ["long", "double", "שגיאת קומפילציה"]
  answer: 0
  explanation: "אין גרסה שמקבלת `int`, ושתי הגרסאות מתאימות דרך המרה מרומזת. הקומפיילר מעדיף את הטיפוס הספציפי יותר: יש המרה מרומזת מ-`long` ל-`double` אבל לא להפך, ולכן `long` נחשבת ההמרה הטובה יותר."
  optionExplanations:
    "1": "`double` היא המרה אפשרית אבל פחות טובה. כלל ההכרעה: הטיפוס שאפשר להמיר ממנו לשני עדיף."
    "2": "אין דו־משמעות (Ambiguity), כי אחת ההמרות טובה מהשנייה לפי כללי השפה."

- id: cs.methods.overloading.003
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    Calc.Show(3);
    Calc.Show(3L);
    Calc.Show(3.0f);

    static class Calc
    {
        public static void Show(int x) => Console.WriteLine("int");
        public static void Show(long x) => Console.WriteLine("long");
        public static void Show(double x) => Console.WriteLine("double");
    }
  options: ["int\nlong\ndouble", "int\nint\ndouble", "int\nlong\nint", "שגיאת קומפילציה"]
  answer: 0
  explanation: "התאמה מדויקת תמיד מנצחת: `3` הוא `int` ו-`3L` הוא `long`. ל-`3.0f` מסוג `float` אין גרסה מדויקת, והמרה מרומזת קיימת רק ל-`double`, ולכן נבחרת היא."
  optionExplanations:
    "1": "הסיומת `L` הופכת את הליטרל ל-`long`, ולכן יש לו התאמה מדויקת."
    "2": "אין המרה מרומזת מ-`float` ל-`int`, כי היא עלולה לאבד את החלק העשרוני."
    "3": "לכל קריאה יש גרסה אחת שמתאימה הכי טוב, ולכן אין דו־משמעות."

- id: cs.methods.overloading.004
  type: output
  difficulty: 2
  tags: [compile-error]
  prompt: מה יודפס?
  code: |
    Console.WriteLine(Parser.Parse("5"));

    static class Parser
    {
        public static int Parse(string s) => int.Parse(s);
        public static double Parse(string s) => double.Parse(s);
    }
  options: ["שגיאת קומפילציה", "5", "5\n5"]
  answer: 0
  explanation: "טיפוס ההחזרה אינו חלק מהחתימה לצורך העמסה. לשתי המתודות אותו שם ואותה רשימת פרמטרים, `(string)`, ולכן זו הגדרה כפולה ושגיאת קומפילציה."
  optionExplanations:
    "1": "הקומפיילר לא בוחר לפי הטיפוס שהקורא מצפה לקבל. הוא דוחה את ההגדרה הכפולה עוד לפני הקריאה."
    "2": "קריאה אחת מפעילה מתודה אחת לכל היותר, וכאן הקוד לא מתקמפל בכלל."

- id: cs.methods.overloading.005
  type: single
  difficulty: 1
  prompt: מה חייב להיות שונה בין שתי גרסאות מועמסות של אותה מתודה?
  options:
    - "רשימת הפרמטרים: מספר הפרמטרים, הטיפוסים שלהם או סדר הטיפוסים"
    - "טיפוס ההחזרה"
    - "שמות הפרמטרים"
    - "משנה הגישה, למשל `public` מול `private`"
  answer: 0
  explanation: "הקומפיילר מבחין בין מתודות מועמסות לפי השם ורשימת הפרמטרים (טיפוסים, סדר, ומגדירים כמו `ref`), כלומר החתימה (Signature). רק כך הוא יכול להחליט בכל קריאה לאיזו גרסה הכוונה."
  optionExplanations:
    "1": "שתי מתודות שנבדלות רק בטיפוס ההחזרה הן הגדרה כפולה, כי בקריאה לא רואים איזה טיפוס מצופה."
    "2": "שמות הפרמטרים לא משפיעים על החתימה. `Add(int a)` ו-`Add(int b)` הן אותה מתודה."
    "3": "משנה הגישה לא שייך לחתימה, ושינוי שלו בלבד יוצר הגדרה כפולה."

- id: cs.methods.overloading.006
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    Log.Write("a");
    Log.Write("a", "b");

    static class Log
    {
        public static void Write(string msg) => Console.WriteLine("one");
        public static void Write(params string[] msgs) => Console.WriteLine($"many: {msgs.Length}");
    }
  options: ["one\nmany: 2", "many: 1\nmany: 2", "one\none", "שגיאת קומפילציה"]
  answer: 0
  explanation: "לקריאה עם ארגומנט אחד שתי הגרסאות מתאימות, אבל הקומפיילר מעדיף גרסה שמתאימה בצורה הרגילה על פני גרסת `params` שצריך לפרוש. לקריאה עם שני ארגומנטים רק גרסת `params` מתאימה, ו-`msgs` הוא מערך באורך 2."
  optionExplanations:
    "1": "כשיש גרסה רגילה שמתאימה בדיוק, היא עדיפה על גרסת `params`."
    "2": "`Write(string)` מקבלת ארגומנט אחד בלבד ולא מתאימה לקריאה עם שניים."
    "3": "אין דו־משמעות: כלל ההכרעה מעדיף את הצורה הרגילה על הצורה המורחבת של `params`."

- id: cs.methods.overloading.007
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    Printer.Show(7 / 2);
    Printer.Show(7 / 2.0);
    Printer.Show((double)7 / 2);

    static class Printer
    {
        public static void Show(int x) => Console.WriteLine($"int {x}");
        public static void Show(double x) => Console.WriteLine($"double {x}");
    }
  options:
    - "int 3\ndouble 3.5\ndouble 3.5"
    - "double 3.5\ndouble 3.5\ndouble 3.5"
    - "int 3\ndouble 3.5\nint 3"
    - "int 3\ndouble 3.5\ndouble 3"
  answer: 0
  explanation: "הגרסה נבחרת לפי הטיפוס של הביטוי כולו. `7 / 2` הוא `int` שערכו 3. ב-`7 / 2.0` וב-`(double)7 / 2` אחד האופרנדים הוא `double`, ולכן התוצאה `double` ושווה 3.5. ההמרה `(double)7` קודמת לחלוקה."
  optionExplanations:
    "1": "חלוקה בין שני `int` נשארת `int`, ולכן נבחרת `Show(int)`."
    "2": "ההמרה חלה על `7` לפני החלוקה, ולכן התוצאה כבר `double`."
    "3": "ההמרה לא חלה על תוצאה של חלוקה שלמה, אלא על `7`, ולכן מתקבל 3.5."

- id: cs.methods.overloading.008
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
