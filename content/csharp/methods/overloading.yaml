    - "`void Save(ref int id)` ו-`void Save(out int id)`"
    - "`int Save(int id)` ו-`void Save(int id)`"
    - "`void Save(int id)` ו-`void Save(int userId)`"
  answer: 0
  explanation: "העברה לפי ערך מול `ref` נחשבת הבדל בחתימה, ובקריאה רואים איזו גרסה נבחרה: `Save(x)` או `Save(ref x)`. לעומת זאת, `ref` ו-`out` נחשבים אותו דבר לצורך העמסה, וגם טיפוס ההחזרה ושמות הפרמטרים לא מבדילים בין מתודות."
  optionExplanations:
