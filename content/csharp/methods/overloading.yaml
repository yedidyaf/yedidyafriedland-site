  options: ["9\n12", "3\n12", "שגיאת קומפילציה", "9\n9"]
  answer: 0
  explanation: "הגרסה עם פרמטר אחד מחשבת שטח של ריבוע על ידי קריאה לגרסה עם שני פרמטרים. זו דרך מקובלת להימנע משכפול קוד בין גרסאות מועמסות."
  optionExplanations:
    "1": "`Area(3)` מעבירה את `side` פעמיים לגרסה השנייה, ולכן מתקבל 3 * 3."
    "2": "מותר שגרסה מועמסת אחת תקרא לאחרת. הקומפיילר בוחר לפי מספר הארגומנטים."
    "3": "`Area(3, 4)` נקראת עם שני ארגומנטים ולכן מפעילה ישירות את הגרסה השנייה."

- id: cs.methods.overloading.009
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    Console.WriteLine(MathUtil.Max(2, 3.5));
    Console.WriteLine(MathUtil.Max(7, 3));

    static class MathUtil
    {
        public static int Max(int a, int b) => a > b ? a : b;
        public static double Max(double a, double b) => a > b ? a : b;
    }
  options: ["3.5\n7", "3\n7", "שגיאת קומפילציה", "3.5\n7.0"]
  answer: 0
  explanation: "בקריאה הראשונה `3.5` הוא `double`, ואין המרה מרומזת ממנו ל-`int`, ולכן רק גרסת `double` מתאימה, ו-`2` מומר ל-`double`. בקריאה השנייה יש התאמה מדויקת לגרסת `int`."
  optionExplanations:
    "1": "C# לא חותך `double` ל-`int` בשקט. גרסת `int` פשוט לא מתאימה לקריאה הראשונה."
    "2": "אין צורך בהתאמה מדויקת לכל ארגומנט. מספיק שקיימת המרה מרומזת."
    "3": "הקריאה השנייה מפעילה את גרסת `int`, ומספר שלם מודפס בלי `.0`."

- id: cs.methods.overloading.010
  type: single
