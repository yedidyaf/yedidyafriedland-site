- id: cs.methods.parameters.020
  type: single
  difficulty: 1
  prompt: "מה פירוש העברה לפי ערך (Pass by Value) של פרמטר מטיפוס `int`?"
  options:
    - "המתודה מקבלת עותק של הערך, ושינוי שלו בתוכה לא משפיע על הקורא"
    - "המתודה מקבלת את המשתנה עצמו, ושינוי שלו משנה גם את המשתנה של הקורא"
    - "המתודה לא יכולה להשתמש בערך שהועבר"
    - "אסור לשנות את הפרמטר בתוך המתודה"
  answer: 0
  explanation: "ב-C# פרמטרים מועברים לפי ערך: הפרמטר הוא משתנה חדש שמקבל עותק של הארגומנט. המתודה יכולה לשנות אותו, אבל השינוי נשאר בתוכה."
  optionExplanations:
    "1": "זה תיאור של העברה לפי הפניה. פרמטר `int` רגיל מקבל עותק."
    "2": "המתודה משתמשת בערך כרגיל: מחשבת איתו, משווה אותו ומחזירה תוצאות."
    "3": "מותר לשנות את הפרמטר, אבל השינוי לא יוצא מהמתודה."

- id: cs.methods.parameters.021
  type: bug
  difficulty: 2
  prompt: "המתודה `DoubleAll` אמורה להכפיל ב-2 כל איבר במערך, ולכן הקוד אמור להדפיס `6`. בפועל מודפס `3`. איזו שורה צריך לתקן?"
  code: |
    int[] nums = { 3, 5 };
    DoubleAll(nums);
    Console.WriteLine(nums[0]);

    static void DoubleAll(int[] a)
    {
        for (int i = 0; i < a.Length; i++)
        {
            int x = a[i];
            x = x * 2;
        }
    }
  answer: 10
  explanation: "`x` הוא משתנה נפרד שקיבל עותק של `a[i]`. הכפלה שלו לא משנה את האיבר במערך. צריך לשמור את התוצאה בתוך המערך עצמו: `a[i] = x * 2;`."
  fixed: |
    int[] nums = { 3, 5 };
    DoubleAll(nums);
    Console.WriteLine(nums[0]);

    static void DoubleAll(int[] a)
    {
        for (int i = 0; i < a.Length; i++)
        {
            int x = a[i];
            a[i] = x * 2;
        }
    }

