- id: cs.methods.parameters.011
  type: bug
  difficulty: 2
  prompt: "המתודה `ClearCart` אמורה לרוקן את העגלה, ולכן הקוד אמור להדפיס `0`. איזו שורה צריך לתקן?"
  code: |
    var cart = new List<string> { "milk", "bread" };
    ClearCart(cart);
    Console.WriteLine(cart.Count);

    static void ClearCart(List<string> items)
    {
        items = new List<string>();
    }
  answer: 7
  explanation: "ההפניה לרשימה מועברת לפי ערך. ההצבה בשורה 7 מפנה רק את הפרמטר המקומי לרשימה חדשה, והעגלה של הקורא לא משתנה, ולכן מודפס `2`. צריך לשנות את האובייקט עצמו: `items.Clear();`."
  fixed: |
    var cart = new List<string> { "milk", "bread" };
    ClearCart(cart);
    Console.WriteLine(cart.Count);

    static void ClearCart(List<string> items)
