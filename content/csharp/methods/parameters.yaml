- id: cs.methods.parameters.026
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    string s = Repeat("ab", 3);
    Console.WriteLine(s);
    Console.WriteLine(s.Length);

    static string Repeat(string text, int times)
    {
        string result = "";
        for (int i = 0; i < times; i++)
        {
            result += text;
        }
        return result;
    }
  options: ["ababab\n6", "ab\n2", "ababab\n3", "ab3\n3"]
  answer: 0
  explanation: "המתודה בונה מחרוזת חדשה ומחזירה אותה. בכל סיבוב היא משרשרת את `text` לסוף, ואחרי שלושה סיבובים מתקבל `ababab`, שהאורך שלו 6 תווים."
  optionExplanations:
    "1": "הערך המוחזר נשמר ב-`s`, ולכן מודפסת התוצאה ולא הארגומנט."
    "2": "`Length` סופר תווים, ויש 6."
    "3": "`times` קובע כמה פעמים הלולאה רצה, ולא מוצמד לטקסט."
