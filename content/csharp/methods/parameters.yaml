- id: cs.methods.parameters.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    int a = 1;
    Inc(a);
    Console.WriteLine(a);

    static void Inc(int n)
    {
        n++;
    }
  options: ["1", "2", "0", "שגיאת קומפילציה"]
  answer: 0
  explanation: "פרמטר מטיפוס `int` מקבל עותק של הערך (העברה לפי ערך, Pass by Value). `n++` מגדיל את העותק בתוך המתודה, ו-`a` נשאר 1. כדי שמתודה תשפיע על הקורא, היא מחזירה ערך עם `return`."
  optionExplanations:
    "1": "`n` הוא עותק של `a`. השינוי שלו נשאר בתוך המתודה."
    "2": "`a` לא מאופס. הוא פשוט לא משתנה."
    "3": "מתודת `void` שמשנה את הפרמטר שלה חוקית, גם אם השינוי לא מועיל."

- id: cs.methods.parameters.003
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    int[] arr = { 1, 2 };
    Reset(arr);
    Console.WriteLine(arr.Length);

    static void Reset(int[] items)
    {
        items = new int[5];
        items[0] = 9;
    }
  options: ["2", "5", "1", "9"]
  answer: 0
  explanation: "`items` מקבל עותק של ההפניה (Reference) למערך של הקורא. `items = new int[5]` מפנה את העותק הזה למערך חדש, אבל `arr` עדיין מפנה למערך המקורי באורך 2. גם ההצבה `items[0] = 9` נעשית במערך החדש."
  optionExplanations:
    "1": "המערך באורך 5 קיים רק בתוך המתודה. `arr` לא הוחלף."
    "2": "המערך המקורי לא השתנה, ואורכו 2."
    "3": "מודפס האורך של `arr`, לא ערך של איבר."

- id: cs.methods.parameters.004
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    int[] arr = { 1, 2, 3 };
    Change(arr);
    Console.WriteLine(arr[0] + "," + arr[1] + "," + arr[2]);

    static void Change(int[] a)
    {
        a[0] = 10;
        a = new int[] { 7, 8, 9 };
        a[1] = 20;
    }
  options: ["10,2,3", "10,20,3", "7,20,9", "1,2,3"]
  answer: 0
  explanation: "בהתחלה `a` מפנה לאותו מערך כמו `arr`, ולכן `a[0] = 10` משנה את המערך המקורי. אחרי `a = new int[] {...}`, הפרמטר מפנה למערך אחר, ו-`a[1] = 20` משנה רק אותו. לכן `arr` הוא `10,2,3`."
  optionExplanations:
    "1": "אחרי ההצבה של מערך חדש, `a[1] = 20` משנה את המערך החדש ולא את `arr`."
    "2": "`arr` לא מפנה למערך החדש. רק הפרמטר `a` הוחלף."
    "3": "השינוי הראשון, `a[0] = 10`, נעשה לפני ההחלפה, ולכן הוא כן נראה ב-`arr`."

- id: cs.methods.parameters.011
  type: bug
  difficulty: 2
  prompt: "המתודה `Clear` אמורה לאפס את כל האיברים במערך, ולכן הקוד אמור להדפיס `0`. בפועל מודפס `5`. איזו שורה צריך לתקן?"
  code: |
    int[] scores = { 5, 8, 9 };
    Clear(scores);
    Console.WriteLine(scores[0]);

    static void Clear(int[] items)
    {
        items = new int[items.Length];
    }
  answer: 7
  explanation: "ההצבה `items = new int[...]` מחליפה רק את העותק של ההפניה שבתוך המתודה. המערך של הקורא לא נגע. כדי לשנות את המערך המקורי צריך לשנות את האיברים שלו: `for (int i = 0; i < items.Length; i++) items[i] = 0;`."
  fixed: |
    int[] scores = { 5, 8, 9 };
    Clear(scores);
    Console.WriteLine(scores[0]);

    static void Clear(int[] items)
    {
        for (int i = 0; i < items.Length; i++) items[i] = 0;
    }

- id: cs.methods.parameters.014
  type: truefalse
  difficulty: 1
  prompt: "כשמעבירים מערך למתודה, שינוי של איבר בתוך המתודה, למשל `a[0] = 5`, נראה גם אצל הקורא."
  answer: true
  explanation: "מערך הוא טיפוס הפניה (Reference Type). המתודה מקבלת עותק של ההפניה, אבל ההפניה מצביעה על אותו מערך, ולכן שינוי של איבר נראה גם מחוץ למתודה. זה שונה מ-`int`, שבו המתודה מקבלת עותק של הערך עצמו."

