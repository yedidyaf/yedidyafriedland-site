    }

- id: cs.methods.parameters.012
  type: bug
  difficulty: 1
  prompt: "`Swap` אמורה להחליף בין שני המשתנים, ולכן הקוד אמור להדפיס `2 1`. איזו שורה צריך לתקן?"
  code: |
    int a = 1, b = 2;
    Swap(ref a, ref b);
    Console.WriteLine($"{a} {b}");

    static void Swap(ref int x, ref int y)
    {
        int temp = x;
        x = y;
        y = x;
    }
  answer: 9
  explanation: "השימוש ב-`ref` נכון, אבל בשורה 9 `x` כבר קיבל את הערך של `y`, ולכן `y = x` מציב בו את אותו ערך. מודפס `2 2`. משתנה העזר `temp` נועד בדיוק לזה: `y = temp;`."
  fixed: |
    int a = 1, b = 2;
    Swap(ref a, ref b);
    Console.WriteLine($"{a} {b}");

    static void Swap(ref int x, ref int y)
    {
        int temp = x;
        x = y;
        y = temp;
    }

