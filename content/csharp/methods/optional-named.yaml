- id: cs.methods.optional-named.016
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    AddItem("a");
    AddItem("b");

    static void AddItem(string item, List<string> list = null)
    {
        list ??= new List<string>();
        list.Add(item);
        Console.WriteLine(list.Count);
    }
  options: ["1\n1", "1\n2", "שגיאת קומפילציה", "NullReferenceException"]
  answer: 0
  explanation: "אי אפשר לכתוב `new List<string>()` כערך ברירת מחדל, ולכן הדפוס המקובל הוא ברירת מחדל `null` ויצירת אובייקט בתוך המתודה. כל קריאה בלי ארגומנט מקבלת `null` ויוצרת רשימה חדשה, ולכן בכל פעם מודפס 1."
  optionExplanations:
    "1": "זו מלכודת של Python, שבה רשימה כברירת מחדל נוצרת פעם אחת ומשותפת לכל הקריאות. כאן כל קריאה מקבלת `null` מחדש ויוצרת רשימה חדשה."
    "2": "`null` הוא ערך ברירת מחדל חוקי לפרמטר מטיפוס הפניה."
    "3": "`??=` מציב רשימה חדשה כש-`list` הוא `null`, ולכן `Add` לא נקרא על `null`."
