  type: truefalse
  difficulty: 3
  prompt: "ערך ברירת המחדל של פרמטר אופציונלי נכתב לתוך הקוד של הקורא בזמן הקומפילציה. לכן אם ספרייה משנה את ברירת המחדל, קוד שקומפל מול הגרסה הישנה ימשיך להעביר את הערך הישן עד שיקומפל מחדש."
