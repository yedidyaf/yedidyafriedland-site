- id: py.oop.polymorphism.012
  type: single
  difficulty: 2
  prompt: מה הבעיה העיקרית בעיצוב הזה, ומה הפתרון?
  code: |
    def area(shape):
        if isinstance(shape, Square):
            return shape.side ** 2
        if isinstance(shape, Circle):
            return 3.14 * shape.radius ** 2
        if isinstance(shape, Triangle):
            return shape.base * shape.height / 2
  options:
    - "`isinstance` איטית, ולכן עדיף לבדוק `type(shape) == Square`"
    - "צריך לאחד את כל הצורות למחלקה אחת עם שדה `kind`, ולבדוק אותו בפונקציה"
    - "כל צורה חדשה מחייבת לשנות את הפונקציה. עדיף שלכל מחלקה תהיה מתודת `area` משלה, ולקרוא `shape.area()`"
    - "הפונקציה ארוכה מדי, ולכן צריך לפצל אותה לשלוש פונקציות נפרדות"
  answer: 2
  explanation: "שרשרת של בדיקות טיפוס היא סימן שחסר פולימורפיזם. כשכל צורה מממשת `area` בעצמה, הקוד שמשתמש בצורות לא משתנה כשמוסיפים צורה חדשה, והידע על כל צורה נמצא במחלקה שלה."
  optionExplanations:
    "0": "`type` רק מחליפה בדיקה אחת בבדיקה אחרת, ואף פוגעת במחלקות יורשות. הבעיה היא עצם הבדיקה."
    "1": "שדה `kind` הוא אותה שרשרת `if` בצורה אחרת. כל צורה חדשה עדיין דורשת שינוי בפונקציה."
    "3": "גם אחרי פיצול, מישהו צריך לבדוק את הטיפוס ולבחור פונקציה. הבעיה נשארת."

- id: py.oop.polymorphism.013
  type: bug
  difficulty: 2
  prompt: "`HalfPrice` אמורה לחצות את המחיר, והקוד אמור להדפיס `50.0`. בפועל הוא מדפיס `100`. באיזו שורה הבאג?"
  code: |
    class Discount:
        def apply(self, price):
            return price

    class HalfPrice(Discount):
        def aply(self, price):
            return price / 2

    def checkout(price, discount):
        return discount.apply(price)

    print(checkout(100, HalfPrice()))
  answer: 6
  explanation: "בגלל שגיאת הקלדה, `HalfPrice` לא דורסת את `apply`, אלא מוסיפה מתודה חדשה בשם `aply`. `checkout` קוראת ל-`apply`, ומוצאת את הגרסה של `Discount`, שמחזירה את המחיר בלי שינוי. דריסה עובדת רק כששם המתודה זהה בדיוק."
  fixed: |
    class Discount:
        def apply(self, price):
            return price

    class HalfPrice(Discount):
        def apply(self, price):
            return price / 2

    def checkout(price, discount):
        return discount.apply(price)

    print(checkout(100, HalfPrice()))

- id: py.oop.polymorphism.014
  type: bug
  difficulty: 3
  prompt: "כל מייצא אמור לקבל רשימת נתונים ולהחזיר אותה כמחרוזת בפורמט שלו, והלולאה אמורה לעבוד על כל מייצא. באיזו שורה הבאג?"
  code: |
    class Exporter:
        def export(self, data):
            return str(data)

    class CsvExporter(Exporter):
        def export(self, data):
            return ",".join(data)

    class JsonExporter(Exporter):
        def export(self):
            return "[" + ", ".join(data) + "]"

    for exporter in [CsvExporter(), JsonExporter()]:
        print(exporter.export(["a", "b"]))
  answer: 10
  explanation: "פולימורפיזם עובד רק אם כל המחלקות שומרות על אותה חתימה. `JsonExporter.export` לא מקבלת `data`, ולכן הקריאה `exporter.export([...])` זורקת `TypeError`. דריסה צריכה לקבל את אותם פרמטרים כמו מתודת הבסיס, כדי שהקוד שקורא לה לא יצטרך לדעת עם איזו מחלקה הוא עובד."
  fixed: |
    class Exporter:
        def export(self, data):
            return str(data)

    class CsvExporter(Exporter):
        def export(self, data):
            return ",".join(data)

    class JsonExporter(Exporter):
        def export(self, data):
            return "[" + ", ".join(data) + "]"

    for exporter in [CsvExporter(), JsonExporter()]:
        print(exporter.export(["a", "b"]))

- id: py.oop.polymorphism.015
