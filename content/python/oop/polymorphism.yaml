    "1": "פייתון לא אוכפת type hints בזמן ריצה. הם עוזרים לקורא ולכלים, אבל לא עוצרים את הקוד."
    "3": "ההפך: מתודות באותו שם במחלקות שונות הן בדיוק מה שמאפשר פולימורפיזם."

