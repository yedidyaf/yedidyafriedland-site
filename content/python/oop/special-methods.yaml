- id: py.oop.special-methods.015
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    class Task:
        def __init__(self, name, priority):
            self.name = name
            self.priority = priority

        def __lt__(self, other):
            return self.priority < other.priority

    tasks = [Task("b", 2), Task("a", 3), Task("c", 1)]
    print([t.name for t in sorted(tasks)])
  options: ["['a', 'b', 'c']", "['b', 'a', 'c']", "TypeError", "['c', 'b', 'a']"]
  answer: 3
  explanation: "`sorted` משווה איברים עם `<`, שמתורגם ל-`__lt__` (less than). כאן `__lt__` משווה לפי עדיפות, ולכן הסדר הוא לפי 1, 2, 3: `c`, `b`, `a`."
  optionExplanations:
    "0": "המיון לא לפי השם. `sorted` משתמשת ב-`__lt__`, שמשווה את `priority`."
    "1": "`sorted` מחזירה רשימה ממוינת. זה הסדר המקורי של הרשימה."
    "2": "בלי `__lt__` אכן הייתה נזרקת `TypeError`. כאן היא מוגדרת, ולכן המיון עובד."

