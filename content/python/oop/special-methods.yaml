    - "`__print__`"
    - "`__init__`"
    - "`__str__`"
    - "`__len__`"
  answer: 2
  explanation: "`print` קוראת ל-`str(obj)`, ו-`str` קוראת ל-`__str__`. אם `__str__` לא מוגדרת, פייתון משתמשת ב-`__repr__`. שמות המתודות המיוחדות מוקפים בשני קווים תחתונים, ולכן הן נקראות גם Dunder Methods (Double Underscore)."
  optionExplanations:
    "0": "אין מתודה מיוחדת בשם `__print__`. ההמרה למחרוזת עוברת דרך `str`."
