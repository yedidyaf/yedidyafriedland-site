  type: hierarchy
  difficulty: 2
  prompt: "לפי הקוד, ממי יורשת כל מחלקה?"
  code: |
    class Account:
        def __init__(self, owner):
            self.owner = owner

    class SavingsAccount(Account): ...
    class CheckingAccount(Account): ...
    class StudentChecking(CheckingAccount): ...

