            self.account = account
  targets:
    - id: Account
    - id: CheckingAccount
    - id: SavingsAccount
    - id: "object (אין מחלקת בסיס מפורשת)"
  items:
    - label: Account
      answer: "object (אין מחלקת בסיס מפורשת)"
      why: "`Account` לא מציינת מחלקת בסיס, ולכן היא יורשת ישירות מ-`object`."
    - label: SavingsAccount
      answer: Account
    - label: StudentChecking
      answer: CheckingAccount
      why: "מחלקת הבסיס הישירה היא זו שבסוגריים. `StudentChecking` היא גם סוג של `Account`, אבל דרך `CheckingAccount`."
    - label: Statement
      answer: "object (אין מחלקת בסיס מפורשת)"
      why: "`Statement` מקבלת חשבון ומחזיקה אותו כתכונה (has-a), אבל לא יורשת ממנו."
  explanation: "מחלקת הבסיס הישירה נקבעת רק לפי מה שכתוב בסוגריים בהגדרת המחלקה. קבלת אובייקט כפרמטר ושמירתו בתכונה הן הרכבה, לא ירושה."

