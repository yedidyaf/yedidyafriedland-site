- id: py.oop.inheritance.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    class Animal:
        def __init__(self, name):
            self.name = name

        def describe(self):
            return f"I am {self.name}"

    class Cat(Animal):
        pass

    print(Cat("Tom").describe())
  options: ["AttributeError", "I am Tom", "TypeError", "I am Cat"]
  answer: 1
  explanation: "`Cat` יורשת (Inheritance) מ-`Animal` ולא מגדירה דבר משלה. כשפייתון לא מוצאת `__init__` או `describe` ב-`Cat`, היא ממשיכה לחפש במחלקת הבסיס (Base Class) ומשתמשת בהן. לכן `Cat(\"Tom\")` מאותחל עם השם `Tom`."
  optionExplanations:
    "0": "מחלקה יורשת מקבלת את כל המתודות של מחלקת הבסיס, גם בלי להגדיר אותן מחדש."
    "2": "גם `__init__` עוברת בירושה, ולכן `Cat` מקבלת את הפרמטר `name`."
    "3": "`self.name` הוא הערך שהועבר, `Tom`, ולא שם המחלקה."

- id: py.oop.inheritance.002
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    class Animal:
        def sound(self):
            return "..."

    class Dog(Animal):
        def sound(self):
            return "Woof"

    a = Animal()
    d = Dog()
    print(a.sound(), d.sound())
  options: ["Woof Woof", "... ...", "... Woof", "Woof ..."]
  answer: 2
  explanation: "`Dog` דורסת (Override) את `sound`: היא מגדירה מתודה באותו שם, והחיפוש מוצא אותה ב-`Dog` לפני `Animal`. הדריסה משפיעה רק על מופעים של `Dog`, ומופע של `Animal` ממשיך להשתמש בגרסה המקורית."
  optionExplanations:
    "0": "דריסה במחלקה היורשת לא משנה את מחלקת הבסיס. `Animal` עדיין מחזירה `...`."
    "1": "`d` הוא מופע של `Dog`, ולכן הגרסה של `Dog` נמצאת ראשונה ורצה."

- id: py.oop.inheritance.003
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    class Employee:
        def __init__(self, name):
            self.name = name

    class Manager(Employee):
        def __init__(self, name, team):
            self.team = team

    m = Manager("Noa", "R&D")
    print(m.team)
    print(m.name)
  options: ["R&D\nNoa", "AttributeError", "R&D\nNone", "R&D\nAttributeError"]
  answer: 3
  explanation: "`Manager` דורסת את `__init__`, ולכן ה-`__init__` של `Employee` לא רץ בכלל, ו-`self.name` לא נוצר. `m.team` מודפס, ואז `m.name` זורקת `AttributeError`. התיקון: לקרוא ל-`super().__init__(name)` בתחילת `__init__` של `Manager`."
  optionExplanations:
    "0": "פייתון לא קוראת אוטומטית ל-`__init__` של מחלקת הבסיס כשהמחלקה היורשת מגדירה `__init__` משלה."
    "1": "`self.team` נוצר כרגיל, ולכן השורה הראשונה מודפסת לפני השגיאה."
    "2": "תכונה שלא הוגדרה לא מקבלת `None`. גישה אליה זורקת `AttributeError`."

- id: py.oop.inheritance.004
  type: bug
  difficulty: 2
  prompt: "`Motorcycle` אמורה לאתחל את מספר הגלגלים (2) דרך מחלקת הבסיס, ואז לשמור את המותג. הקוד אמור להדפיס `2`. איזו שורה צריך לתקן?"
  code: |
    class Vehicle:
        def __init__(self, wheels):
            self.wheels = wheels

    class Motorcycle(Vehicle):
        def __init__(self, brand):
            super().__init__(self, 2)
            self.brand = brand

    m = Motorcycle("Yamaha")
    print(m.wheels)
  answer: 7
  explanation: "`super().__init__` כבר קשורה לאובייקט הנוכחי ומעבירה את `self` לבד. העברה נוספת של `self` שולחת שני ארגומנטים ל-`__init__(self, wheels)` שמצפה לאחד, ולכן נזרקת `TypeError`. הקריאה הנכונה: `super().__init__(2)`."
  fixed: |
    class Vehicle:
        def __init__(self, wheels):
            self.wheels = wheels

    class Motorcycle(Vehicle):
        def __init__(self, brand):
            super().__init__(2)
            self.brand = brand

    m = Motorcycle("Yamaha")
    print(m.wheels)

- id: py.oop.inheritance.005
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    class Report:
        def header(self):
            return "Report"

    class SalesReport(Report):
        def header(self):
            return super().header() + " - Sales"

    print(SalesReport().header())
  options: ["Report - Sales", "Report", "- Sales", "RecursionError"]
  answer: 0
  explanation: "`super().header()` קוראת לגרסה של מחלקת הבסיס, ולא לגרסה הנוכחית. כך מתודה דורסת יכולה להרחיב את ההתנהגות המקורית במקום להחליף אותה: `Report` ועוד ` - Sales`."
  optionExplanations:
    "1": "הגרסה של `SalesReport` היא שרצה, והיא מוסיפה טקסט למה שמחלקת הבסיס מחזירה."
    "2": "`super().header()` מחזירה `Report`, וזה החלק הראשון של המחרוזת."
    "3": "`super()` מדלגת על המחלקה הנוכחית ומתחילה לחפש בבסיס, ולכן אין כאן קריאה של המתודה לעצמה."

- id: py.oop.inheritance.006
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    class A:
        def hello(self):
            return "A"

    class B(A):
        def hello(self):
            return "B"

    class C(A):
        def hello(self):
            return "C"

    class D(B, C):
        pass

    print(D().hello())
  options: ["A", "C", "TypeError", "B"]
  answer: 3
  explanation: "בירושה מרובה (Multiple Inheritance) פייתון מחפשת לפי סדר חיפוש המתודות (MRO): `D`, `B`, `C`, `A`, `object`. מחלקות הבסיס נבדקות לפי הסדר שבו נכתבו בסוגריים, ולכן `hello` נמצאת קודם ב-`B`."
  optionExplanations:
    "0": "`A` נבדקת רק אחרי `B` ו-`C`, שתיהן יורשות ממנה. החיפוש עוצר כבר ב-`B`."
    "1": "`B` נכתבה לפני `C` ב-`class D(B, C)`, ולכן היא נבדקת ראשונה."
    "2": "פייתון לא זורקת שגיאה כשכמה מחלקות בסיס מגדירות אותה מתודה. ה-MRO מכריע מי רצה."

- id: py.oop.inheritance.007
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    class A:
        def go(self):
            return "A"

    class B(A):
        def go(self):
            return "B" + super().go()

    class C(A):
        def go(self):
            return "C" + super().go()

    class D(B, C):
        def go(self):
            return "D" + super().go()

    print(D().go())
  options: ["DBA", "DBCA", "DBACA", "DCBA"]
  answer: 1
  explanation: "`super()` לא קוראת בהכרח להורה הישיר. היא קוראת למחלקה הבאה ב-MRO של האובייקט, כאן `D`, `B`, `C`, `A`. לכן `super()` בתוך `B` מגיעה ל-`C`, ורק `C` מגיעה ל-`A`. כל מחלקה רצה פעם אחת בדיוק."
  optionExplanations:
    "0": "זה נכון רק אם `super()` ב-`B` הייתה קוראת להורה הישיר `A`. עבור מופע של `D`, המחלקה הבאה אחרי `B` היא `C`."
    "2": "ה-MRO מכיל כל מחלקה פעם אחת, ולכן `A` לא רצה פעמיים."
    "3": "`B` נכתבה לפני `C` בהגדרת `D`, ולכן היא באה לפניה ב-MRO."

- id: py.oop.inheritance.008
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    class Shape:
        pass

    class Square(Shape):
        pass

    s = Square()
    print(isinstance(s, Shape), type(s) == Shape, issubclass(Shape, Square))
  options: ["True True False", "True False False", "False False False", "True False True"]
  answer: 1
  explanation: "`isinstance` מתחשבת בירושה: ריבוע הוא סוג של צורה, ולכן `True`. `type(s)` מחזיר את המחלקה המדויקת, `Square`, ולכן ההשוואה ל-`Shape` היא `False`. `issubclass(Shape, Square)` שואל אם `Shape` יורשת מ-`Square`, וזה הפוך מהקוד, ולכן `False`."
  optionExplanations:
    "0": "`type` לא מתחשבת בירושה. היא מחזירה בדיוק את המחלקה שממנה נוצר האובייקט."
    "2": "`isinstance` מחזירה `True` גם עבור מחלקות בסיס, לא רק עבור המחלקה המדויקת."
    "3": "הכיוון חשוב: `Square` יורשת מ-`Shape`, ולא להפך."

