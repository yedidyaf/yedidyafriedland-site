- id: py.oop.inheritance.014
  type: single
  difficulty: 2
  prompt: "מה עושה `super().__init__(name)` בתוך `__init__` של מחלקה יורשת?"
  options:
    - "יוצרת אובייקט חדש ונפרד של מחלקת הבסיס ושומרת אותו בתכונה"
    - "קוראת ל-`__init__` של המחלקה הבאה ב-MRO, כדי לאתחל את החלק של האובייקט שמגיע ממחלקת הבסיס"
    - "מעתיקה את כל המתודות של מחלקת הבסיס אל המחלקה היורשת"
    - "מוחקת את `__init__` של מחלקת הבסיס כדי שלא תרוץ שוב"
  answer: 1
  explanation: "`super()` מחזירה אובייקט עזר שמפנה את הקריאה למחלקה הבאה בסדר החיפוש. `__init__` של הבסיס רצה על אותו `self`, ומוסיפה לו את התכונות שלה. לא נוצר אובייקט נוסף."
  optionExplanations:
    "0": "יש אובייקט אחד בלבד. `__init__` של הבסיס מאתחלת את אותו `self`."
    "2": "המתודות זמינות כבר מכוח הירושה, דרך החיפוש במחלקת הבסיס. `super()` לא מעתיקה כלום."
    "3": "`super()` לא משנה מחלקות. היא רק מריצה את המתודה של מחלקת הבסיס."

- id: py.oop.inheritance.015
  type: bug
  difficulty: 3
  prompt: "מנהל אמור לקבל שכר שנתי של 12 משכורות ועוד בונוס. הקוד אמור להדפיס `125000`, אבל נזרקת שגיאה. איזו שורה צריך לתקן?"
  code: |
    class Employee:
        def __init__(self, salary):
            self.salary = salary

        def yearly_pay(self):
            return self.salary * 12

    class Manager(Employee):
        def __init__(self, salary, bonus):
            super().__init__(salary)
            self.bonus = bonus

        def yearly_pay(self):
            return self.yearly_pay() + self.bonus

    print(Manager(10000, 5000).yearly_pay())
  answer: 14
  explanation: "`self.yearly_pay()` מוצאת שוב את הגרסה של `Manager`, כי החיפוש מתחיל במחלקה של האובייקט. המתודה קוראת לעצמה בלי סוף, ונזרקת `RecursionError`. כדי לקרוא לגרסה של מחלקת הבסיס צריך `super().yearly_pay()`."
  fixed: |
    class Employee:
        def __init__(self, salary):
            self.salary = salary

        def yearly_pay(self):
            return self.salary * 12

    class Manager(Employee):
        def __init__(self, salary, bonus):
            super().__init__(salary)
            self.bonus = bonus

        def yearly_pay(self):
            return super().yearly_pay() + self.bonus

    print(Manager(10000, 5000).yearly_pay())

- id: py.oop.inheritance.016
  type: single
  difficulty: 3
  prompt: "בהינתן הקוד, איזו מההגדרות הבאות של `C` תזרוק `TypeError` כבר בזמן הגדרת המחלקה?"
  code: |
    class A: ...
    class B(A): ...
  options:
    - "`class C(B, A): ...`"
    - "`class C(A, B): ...`"
    - "`class C(B): ...`"
    - "`class C(A): ...`"
  answer: 1
  explanation: "ה-MRO חייב לשמור על שני כללים: מחלקה באה לפני מחלקות הבסיס שלה, ומחלקות הבסיס נשמרות בסדר שבו נכתבו. ב-`class C(A, B)` נדרש ש-`A` תבוא לפני `B`, אבל `B` יורשת מ-`A` ולכן חייבת לבוא לפניה. אין סדר שמקיים את שניהם, ופייתון זורקת `TypeError`."
  optionExplanations:
    "0": "`B` לפני `A` מתאים לכך ש-`B` יורשת מ-`A`. ה-MRO הוא `C`, `B`, `A`, `object`, והגדרה כזאת חוקית (אם כי מיותרת)."
    "2": "ירושה פשוטה מ-`B` תמיד חוקית. `C` מקבלת גם את `A` דרך `B`."
    "3": "ירושה פשוטה מ-`A` חוקית, גם אם יש מחלקות אחרות שיורשות ממנה."
