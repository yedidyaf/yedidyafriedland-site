    - "הקוד רץ מהר יותר, כי מתודות מופשטות לא מבצעות כלום"
    - "אפשר להעביר ל-`OrderService` כל מימוש של החוזה, למשל מסד נתונים אמיתי או מאגר בזיכרון לבדיקות, בלי לשנות אותה"
