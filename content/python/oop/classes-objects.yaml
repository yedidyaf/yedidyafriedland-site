  optionExplanations:
    "0": "שלוש החלפות מצב מתחילות ב-`False` ומסתיימות ב-`True`. מספר זוגי של החלפות היה מחזיר ל-`False`."
    "2": "`toggle` אכן מחזירה `None`, אבל מדפיסים את התכונה `is_on`, ולא את מה שהמתודה מחזירה."
