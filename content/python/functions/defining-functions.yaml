- id: py.functions.defining-functions.001
  type: single
  difficulty: 1
  prompt: באיזו מילה שמורה מגדירים פונקציה בפייתון?
  options: ["`def`", "`function`", "`func`", "`define`"]
  answer: 0
  explanation: "הגדרת פונקציה (Function Definition) מתחילה ב-`def`, אחריה שם הפונקציה, סוגריים עם הפרמטרים ונקודתיים. `function` ו-`func` הן מילים מ-JavaScript ומ-Go, ולא מילים שמורות בפייתון."
  optionExplanations:
    "1": "`function` משמשת להגדרת פונקציות ב-JavaScript, לא בפייתון."
    "2": "`func` משמשת ב-Go וב-Swift. בפייתון זו סתם מילה שאפשר להשתמש בה כשם משתנה."
    "3": "`define` היא לא מילה שמורה בשום חלק של פייתון."

- id: py.functions.defining-functions.002
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    def greet(name):
        print("Hello", name)

    result = greet("Dana")
    print(result)
  options:
    - "Hello Dana\nNone"
    - "Hello Dana"
    - "Hello Dana\nHello Dana"
    - "None"
  answer: 0
  explanation: "הקריאה `greet(\"Dana\")` מדפיסה `Hello Dana`, אבל אין בפונקציה `return`, ולכן היא מחזירה `None`. הערך הזה נשמר ב-`result` ומודפס בשורה השנייה. הדפסה (print) והחזרת ערך (return) הן שני דברים שונים."
  optionExplanations:
    "1": "השורה `print(result)` כן מתבצעת, ומדפיסה את מה שהפונקציה החזירה: `None`."
    "2": "`result` לא שומר את מה שהודפס, אלא את הערך המוחזר, וזה `None`."
    "3": "ההדפסה בתוך הפונקציה מתבצעת לפני ההדפסה של `result`, ולכן `Hello Dana` מופיע ראשון."

- id: py.functions.defining-functions.003
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    def check(n):
        if n > 0:
            return "positive"
        return "not positive"
        print("done")

    print(check(5))
    print(check(-2))
  options:
    - "positive\nnot positive"
    - "positive\nnot positive\ndone"
    - "positive\ndone\nnot positive\ndone"
    - "positive"
  answer: 0
  explanation: "`return` מסיים את הפונקציה מיד ומחזיר ערך למי שקרא לה. השורה `print(\"done\")` נמצאת אחרי `return` שתמיד מתבצע, ולכן היא אף פעם לא רצה. קוד כזה נקרא קוד שאינו נגיש (Unreachable Code)."
  optionExplanations:
    "1": "שום `return` לא ממשיך לשורה שאחריו, ולכן `done` לא מודפס אף פעם."
    "2": "גם `return \"positive\"` מסיים את הפונקציה מיד, בלי לעבור לשורות הבאות."
    "3": "יש שתי קריאות לפונקציה ושתי הדפסות, ולכן מודפסות שתי שורות."

- id: py.functions.defining-functions.004
  type: truefalse
  difficulty: 1
  prompt: "מותר לכתוב בפונקציה אחת כמה הוראות `return`, למשל אחת בכל ענף של `if`."
  answer: true
  explanation: "מותר לכתוב כמה `return`, וזה דפוס נפוץ: כל ענף מחזיר את התשובה שלו. ברגע שאחד מהם מתבצע, הפונקציה מסתיימת, ולכן השורות שאחריו לא רצות. אם אף `return` לא מתבצע, הפונקציה מחזירה `None`."

