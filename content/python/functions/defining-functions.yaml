  optionExplanations:
    "1": "`return` ריק לא מחזיר את הפרמטר. הוא מחזיר `None`."
    "2": "`print` מקבל שני ערכים ומדפיס את שניהם, כולל `None`. הוא לא מדלג עליו."
    "3": "`return` בלי ערך הוא תחביר חוקי, ונפוץ ליציאה מוקדמת מפונקציה."

- id: py.functions.defining-functions.006
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    def find_first_even(nums):
        for n in nums:
            if n % 2 == 0:
                return n

    print(find_first_even([3, 8, 6]))
    print(find_first_even([1, 5]))
  options:
    - "8\nNone"
    - "8\n0"
    - "6\nNone"
    - "8\nFalse"
  answer: 0
  explanation: "בקריאה הראשונה `return n` מתבצע כשמגיעים ל-8, והלולאה נעצרת. בקריאה השנייה אין מספר זוגי, הלולאה מסתיימת והפונקציה מגיעה לסופה בלי `return`, ולכן היא מחזירה `None` באופן אוטומטי."
  optionExplanations:
    "1": "פונקציה שלא הגיעה ל-`return` מחזירה `None`, לא `0`."
    "2": "`return` עוצר את הלולאה במספר הזוגי הראשון, 8, ולא ממשיך ל-6."
    "3": "פייתון לא ממציאה ערך `False`. היעדר `return` תמיד נותן `None`."

- id: py.functions.defining-functions.007
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    def double(x):
        print(x * 2)

    y = double(5)
    print(y + 1)
  options:
    - "10\nTypeError"
    - "11"
    - "10\n11"
    - "TypeError"
  answer: 0
  explanation: "`double` מדפיסה 10 אבל לא מחזירה כלום, ולכן `y` הוא `None`. הביטוי `None + 1` זורק `TypeError`. זו הטעות הנפוצה של בלבול בין `print` ל-`return`: כדי להשתמש בתוצאה בהמשך, הפונקציה חייבת להחזיר אותה."
  optionExplanations:
    "1": "`y` לא מקבל את 10. ההדפסה רק מציגה את הערך במסך, והפונקציה מחזירה `None`."
    "2": "`y` הוא `None`, ואי אפשר לחבר `None` למספר."
    "3": "השגיאה קורית רק בשורה האחרונה. הקריאה ל-`double(5)` כבר הדפיסה 10 לפני כן."

- id: py.functions.defining-functions.008
  type: bug
  difficulty: 2
  prompt: הקוד אמור להדפיס את ממוצע הציונים, `90.0`. באיזו שורה הבאג?
  code: |
    def average(nums):
        total = sum(nums)
        total / len(nums)

    scores = [80, 90, 100]
    print(average(scores))
  answer: 3
  explanation: "בשורה 3 הממוצע מחושב, אבל התוצאה לא נשמרת ולא מוחזרת. הפונקציה מגיעה לסופה בלי `return` ומחזירה `None`, ולכן מודפס `None`. צריך `return total / len(nums)`."
  fixed: |
    def average(nums):
        total = sum(nums)
        return total / len(nums)

    scores = [80, 90, 100]
    print(average(scores))

- id: py.functions.defining-functions.009
  type: bug
  difficulty: 3
  prompt: הפונקציה אמורה להחזיר כמה מספרים חיוביים יש ברשימה. באיזו שורה הבאג?
  code: |
    def count_positives(nums):
        count = 0
        for n in nums:
            if n > 0:
                count += 1
            return count
  answer: 6
  explanation: "`return count` מוזח בתוך הלולאה, ולכן הפונקציה חוזרת כבר אחרי האיבר הראשון ומחזירה 0 או 1. ההזחה (Indentation) קובעת לאיזה בלוק שייכת שורה. `return` צריך להיות ברמת ההזחה של `for`, כך שיתבצע רק אחרי שהלולאה עברה על כל האיברים."
  fixed: |
    def count_positives(nums):
        count = 0
        for n in nums:
            if n > 0:
                count += 1
        return count

- id: py.functions.defining-functions.010
