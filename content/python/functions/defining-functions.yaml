- id: py.functions.defining-functions.014
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    def label():
        return "first"

    def show():
        return label()

    def label():
        return "second"

    print(show())
  options: ["second", "first", "first\nsecond", "NameError"]
  answer: 0
  explanation: "`def` השני יוצר פונקציה חדשה ומצמיד אליה את השם `label`, במקום הקודמת. `show` לא זוכרת איזו פונקציה הייתה בשם הזה כשהיא הוגדרה: היא מחפשת את השם `label` רק כשהיא נקראת, ואז השם כבר מפנה לגרסה השנייה."
  optionExplanations:
    "1": "השם `label` נבדק בזמן הקריאה ל-`show`, לא בזמן ההגדרה שלה."
    "2": "`show` מחזירה ערך אחד, ויש רק `print` אחד."
    "3": "בזמן הקריאה ל-`show` השם `label` כבר מוגדר, ולכן אין שגיאה."

- id: py.functions.defining-functions.015
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    def add_item(items, item):
        items.append(item)

    cart = ["milk"]
    cart = add_item(cart, "bread")
    print(cart)
  options: ["None", "['milk', 'bread']", "['milk']", "AttributeError"]
  answer: 0
  explanation: "הפונקציה אכן מוסיפה את `bread` לרשימה, אבל לא מחזירה כלום, ולכן היא מחזירה `None`. ההשמה `cart = add_item(...)` דורסת את ההפניה לרשימה ב-`None`. פונקציה שמשנה ארגומנט במקום ולא מחזירה ערך לא צריכה השמה של התוצאה."
  optionExplanations:
    "1": "הרשימה אכן שונתה, אבל `cart` כבר לא מפנה אליה. ההשמה החליפה אותה ב-`None`."
    "2": "גם `bread` נוסף, כי `append` משנה את הרשימה המקורית. אבל בכל מקרה `cart` כבר לא מפנה אליה."
    "3": "`append` נקרא על הרשימה בתוך הפונקציה, לפני ההשמה, ולכן אין שגיאה. `print(None)` מדפיס `None`."

