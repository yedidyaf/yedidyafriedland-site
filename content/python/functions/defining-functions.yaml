  answer: 0
  explanation: "מחרוזת תיעוד (Docstring) היא מחרוזת שמופיעה כהוראה הראשונה בגוף הפונקציה. פייתון שומרת אותה ב-`__doc__`, ו-`help` מציגה אותה. נהוג לכתוב אותה בגרשיים משולשים (`\"\"\"`), אבל זו מוסכמה ולא התנאי: מה שקובע הוא המיקום."
