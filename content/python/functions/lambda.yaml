- id: py.functions.lambda.005
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    nums = [1, 2, 3]
    result = map(lambda n: n * 10, nums)
    print(list(result))
    print(list(result))
  options:
    - "[10, 20, 30]\n[]"
    - "[10, 20, 30]\n[10, 20, 30]"
    - "[10, 20, 30]\n[100, 200, 300]"
    - "[1, 2, 3]\n[10, 20, 30]"
  answer: 0
  explanation: "`map` לא מחזירה רשימה אלא איטרטור (Iterator), שמחשב כל ערך רק כשמבקשים אותו. `list` הראשון עובר על כל הערכים ומרוקן את האיטרטור, ולכן `list` השני מקבל איטרטור ריק. כשצריך את התוצאה יותר מפעם אחת, שומרים אותה ברשימה: `result = list(map(...))`."
  optionExplanations:
    "1": "איטרטור עובר על הערכים פעם אחת בלבד. אחרי המעבר הראשון לא נשאר בו כלום."
    "2": "`map` לא מפעילה את הפונקציה שוב על התוצאות. היא עוברת על `nums` פעם אחת."
    "3": "`map` מפעילה את ה-`lambda` על כל איבר, ולכן כבר הרשימה הראשונה מוכפלת."

