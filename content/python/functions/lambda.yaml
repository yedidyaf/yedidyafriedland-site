- id: py.functions.lambda.001
  type: single
  difficulty: 1
  prompt: "מה יוצר הביטוי `lambda x: x * 2`?"
  options:
    - "פונקציה ללא שם שמקבלת `x` ומחזירה `x * 2`"
    - "את המספר שהוא כפליים מ-`x`"
    - "משתנה בשם `lambda` שערכו `x * 2`"
    - "רשימה של כל הכפולות של `x`"
  answer: 0
  explanation: "`lambda` יוצרת פונקציה אנונימית (Anonymous Function): לפני הנקודתיים הפרמטרים, ואחריהן ביטוי אחד שערכו מוחזר. הביטוי לא מחושב כשה-`lambda` נוצרת, אלא רק כשקוראים לפונקציה, למשל `(lambda x: x * 2)(5)` מחזיר 10."
  optionExplanations:
    "1": "שום דבר לא מחושב ביצירת ה-`lambda`. החישוב מתבצע רק בקריאה לפונקציה."
    "2": "`lambda` היא מילה שמורה ולא שם של משתנה."
    "3": "`lambda` מחזירה ערך אחד בכל קריאה, לפי הארגומנט שמקבלת."

- id: py.functions.lambda.002
  type: single
  difficulty: 1
  prompt: "איזו הגדרה שקולה ל-`add = lambda a, b: a + b`?"
  options:
    - "`def add(a, b): return a + b`"
    - "`def add(a, b): print(a + b)`"
    - "`def add(a, b): a + b`"
    - "`add = a + b`"
  answer: 0
  explanation: "גוף ה-`lambda` הוא ביטוי שערכו מוחזר באופן אוטומטי, כאילו נכתב לפניו `return`. לכן היא שקולה לפונקציה רגילה שמחזירה `a + b`."
  optionExplanations:
    "1": "`lambda` מחזירה את הערך, היא לא מדפיסה אותו. הפונקציה הזאת מחזירה `None`."
    "2": "בלי `return` הפונקציה מחשבת ומשליכה את התוצאה, ומחזירה `None`. ב-`lambda` ה-`return` מובלע."
    "3": "זו השמה של ערך, לא הגדרת פונקציה. היא תיכשל אם `a` ו-`b` לא מוגדרים."

- id: py.functions.lambda.003
  type: truefalse
  difficulty: 1
  prompt: "גוף של `lambda` יכול להכיל כמה הוראות בכמה שורות, למשל לולאת `for` והשמות למשתנים."
  answer: false
  explanation: "גוף של `lambda` הוא ביטוי (Expression) אחד בלבד. אי אפשר לכתוב בו הוראות (Statements) כמו `for`, `return` או השמה רגילה. מותר ביטוי תנאי, כמו `lambda n: \"even\" if n % 2 == 0 else \"odd\"`. כשצריך יותר, כותבים פונקציה רגילה עם `def`."

