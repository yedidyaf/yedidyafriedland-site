- id: py.functions.lambda.008
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    def add(a, b):
        return a + b

    def sub(a, b):
        return a - b

    ops = {"+": add, "-": sub}
    print(ops["-"](10, 4))
  options: ["6", "14", "-", "TypeError"]
  answer: 0
  explanation: "בפייתון פונקציות הן ערכים לכל דבר (First-Class Functions): אפשר לשמור אותן במילון, ברשימה או במשתנה. `ops[\"-\"]` מחזיר את הפונקציה `sub`, והסוגריים שאחריו קוראים לה עם 10 ו-4."
  optionExplanations:
    "1": "המפתח `\"-\"` מפנה ל-`sub`, ולא ל-`add`."
    "2": "`ops[\"-\"]` הוא הערך של המפתח, כלומר פונקציה, ולא המפתח עצמו."
    "3": "מותר לקרוא לפונקציה ישירות מתוך ביטוי, גם בלי לשמור אותה קודם במשתנה."

- id: py.functions.lambda.009
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    funcs = []
    for i in range(3):
        funcs.append(lambda: i)

    print([f() for f in funcs])
  options: ["[2, 2, 2]", "[0, 1, 2]", "[3, 3, 3]", "[0, 0, 0]"]
  answer: 0
  explanation: "ה-`lambda` לא שומרת את הערך של `i` כשהיא נוצרת, אלא את השם `i`. היא קוראת אותו רק כשקוראים לה, ואז הלולאה כבר הסתיימה ו-`i` הוא 2. זו קשירה מאוחרת (Late Binding). כדי לשמור את הערך הנוכחי כותבים `lambda i=i: i`, כי ערך ברירת מחדל מחושב ברגע ההגדרה."
  optionExplanations:
    "1": "זו התוצאה הצפויה אילו כל `lambda` הייתה שומרת עותק של `i`, אבל היא קוראת את `i` רק בזמן הקריאה."
    "2": "`range(3)` נותן 0, 1, 2, ולכן הערך האחרון של `i` הוא 2 ולא 3."
    "3": "בזמן הקריאה `i` כבר לא 0. הלולאה הסתיימה, והערך האחרון שלו הוא 2."

