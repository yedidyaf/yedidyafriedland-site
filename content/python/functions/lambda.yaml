  optionExplanations:
    "1": "זו התוצאה של `key=lambda w: (len(w), w)` עם `reverse=True`, שהופך גם את סדר המילים באותו אורך. כאן רק האורך הפוך, ו-`bb` לפני `dd`."
    "2": "המינוס לפני `len` הופך את סדר האורכים, ולכן הארוכה ראשונה."
    "3": "`sorted` מחזירה רשימה ממוינת חדשה, ולא את הסדר המקורי."

- id: py.functions.lambda.011
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס את המוצר היקר ביותר, `('book', 40)`. איזו שורה צריך לתקן?"
  code: |
    products = [("pen", 5), ("book", 40), ("bag", 25)]
    by_price = sorted(products, key=lambda p: p[0], reverse=True)
    print(by_price[0])
  answer: 2
  explanation: "`p[0]` הוא שם המוצר, ולכן המיון הוא לפי שם בסדר אלפביתי הפוך, ומודפס `('pen', 5)`. המחיר נמצא ב-`p[1]`, וה-`key` צריך להחזיר אותו."
  fixed: |
    products = [("pen", 5), ("book", 40), ("bag", 25)]
    by_price = sorted(products, key=lambda p: p[1], reverse=True)
    print(by_price[0])

- id: py.functions.lambda.012
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להשאיר רק את השמות שאינם ריקים ולהדפיס `['dana', 'yossi']`. איזו שורה צריך לתקן?"
  code: |
    names = ["dana", "", "yossi", ""]
    non_empty = map(lambda n: n != "", names)
    print(list(non_empty))
  answer: 2
  explanation: "`map` מחליפה כל איבר בתוצאת הפונקציה, ולכן מודפס `[True, False, True, False]`. כדי להשאיר רק חלק מהאיברים צריך `filter`, שמשתמשת בתוצאה כתנאי ומחזירה את האיברים המקוריים."
  fixed: |
    names = ["dana", "", "yossi", ""]
    non_empty = filter(lambda n: n != "", names)
