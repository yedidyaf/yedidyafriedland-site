  optionExplanations:
    "1": "הפונקציה לא שומרת את הערך של `rate` מרגע ההגדרה. היא מחפשת את השם רק כשהיא רצה."
    "2": "`rate` נמצא בטווח הגלובלי, ופייתון מגיעה אליו בחיפוש לפי LEGB."
    "3": "אין השמה ל-`rate` בתוך הפונקציה, ולכן הוא לא נחשב מקומי."

- id: py.functions.scope.007
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    def outer():
        x = "outer"
        def inner():
            x = "inner"
        inner()
        print(x)

    outer()
  options: ["outer", "inner", "NameError", "outer\ninner"]
  answer: 0
  explanation: "ההשמה בתוך `inner` יוצרת משתנה מקומי חדש של `inner`, שמסתיר את ה-`x` של `outer` ולא משנה אותו. `print` נמצא ב-`outer`, ולכן מודפס ה-`x` שלה. כדי לשנות את המשתנה של הפונקציה העוטפת צריך `nonlocal x`."
  optionExplanations:
    "1": "השמה בפונקציה פנימית לא משנה את המשתנה של הפונקציה העוטפת, אלא אם מצהירים `nonlocal`."
    "2": "`x` מוגדר ב-`outer` לפני ההדפסה, ולכן אין שגיאה."
    "3": "`inner` לא מדפיסה דבר. יש רק `print` אחד."

- id: py.functions.scope.008
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    def counter():
        count = 0
        def step():
            nonlocal count
            count += 1
            return count
        step()
        return step()

    print(counter())
  options: ["2", "1", "0", "UnboundLocalError"]
  answer: 0
  explanation: "`nonlocal count` מקשר את `count` שבתוך `step` למשתנה של הפונקציה העוטפת (Enclosing Function), `counter`. כל קריאה ל-`step` מגדילה את אותו משתנה: הקריאה הראשונה מעלה אותו ל-1, והשנייה ל-2 ומחזירה אותו."
  optionExplanations:
    "1": "שתי הקריאות ל-`step` משנות את אותו משתנה, ולכן השינוי מצטבר."
    "2": "`nonlocal` מאפשר לשנות את המשתנה של `counter`, ולכן הוא לא נשאר 0."
    "3": "בזכות `nonlocal`, ההשמה לא יוצרת משתנה מקומי חדש, ולכן אין `UnboundLocalError`."

