- id: py.functions.scope.011
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    x = "global"

    def outer():
        x = "enclosing"
        def inner():
            print(x)
        return inner

    f = outer()
    x = "changed"
    f()
  options: ["enclosing", "global", "changed", "NameError"]
  answer: 0
  explanation: "`inner` לא מגדירה `x`, ולכן פייתון מחפשת לפי LEGB: אין `x` מקומי, ובפונקציה העוטפת יש `x = \"enclosing\"`. החיפוש נעצר שם ולא מגיע לטווח הגלובלי. `inner` זוכרת את המשתנה של `outer` גם אחרי ש-`outer` הסתיימה. פונקציה כזו נקראת סגור (Closure)."
  optionExplanations:
    "1": "הטווח של הפונקציה העוטפת (E) נבדק לפני הטווח הגלובלי (G)."
    "2": "השינוי של `x` הגלובלי לא משפיע, כי `inner` מוצאת את `x` כבר בפונקציה העוטפת."
    "3": "`inner` שומרת גישה למשתנים של `outer` גם אחרי ש-`outer` החזירה אותה."

- id: py.functions.scope.012
  type: bug
  difficulty: 3
  prompt: "הקוד אמור ליצור מונה ולהדפיס `1`. בפועל נזרקת שגיאה. באיזו שורה הבאג?"
  code: |
    def make_counter():
        count = 0
        def increment():
            global count
            count += 1
            return count
        return increment

    c = make_counter()
    print(c())
  answer: 4
  explanation: "`global count` מפנה ל-`count` ברמת המודול, אבל אין משתנה כזה. ה-`count` הוא משתנה של הפונקציה העוטפת `make_counter`. לכן `count += 1` זורק `NameError`. כדי לשנות משתנה של פונקציה עוטפת צריך `nonlocal count`."
  fixed: |
    def make_counter():
        count = 0
        def increment():
            nonlocal count
            count += 1
            return count
        return increment

    c = make_counter()
    print(c())

- id: py.functions.scope.013
  type: bug
  difficulty: 2
  prompt: "הפונקציה אמורה לרוקן את הרשימה הגלובלית `history`, כך שיודפס `[]`. באיזו שורה הבאג?"
  code: |
    history = [1, 2, 3]

    def clear_history():
        history = []

    clear_history()
    print(history)
  answer: 4
  explanation: "`history = []` היא השמה, ולכן היא יוצרת משתנה מקומי חדש שנעלם בסוף הפונקציה, והרשימה הגלובלית לא משתנה. הפתרון: `history.clear()`, שמשנה את אובייקט הרשימה עצמו. לשנות אובייקט דרך שם גלובלי מותר בלי `global`; רק השמה מחדש לשם דורשת `global`."
  fixed: |
    history = [1, 2, 3]

    def clear_history():
        history.clear()

    clear_history()
    print(history)

- id: py.functions.scope.014
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    data = [1, 2]

    def add():
        data.append(3)

    def reset():
        data = []

    add()
    reset()
    print(data)
  options: ["[1, 2, 3]", "[]", "[1, 2]", "UnboundLocalError"]
  answer: 0
  explanation: "ב-`add` אין השמה ל-`data`, ולכן השם מפנה לרשימה הגלובלית, ו-`append` משנה אותה. ב-`reset` יש השמה, ולכן `data` שם הוא משתנה מקומי חדש, והרשימה הגלובלית לא נפגעת. ההבדל הוא בין שינוי אובייקט (Mutation) להצמדת השם לאובייקט אחר (Rebinding)."
  optionExplanations:
    "1": "`reset` יוצרת משתנה מקומי בשם `data`, ולא משנה את המשתנה הגלובלי."
    "2": "`append` לא דורש `global`, כי הוא משנה את הרשימה עצמה ולא מבצע השמה לשם."
    "3": "ב-`reset` לא קוראים את `data` לפני ההשמה, ולכן אין `UnboundLocalError`."

