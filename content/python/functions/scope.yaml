    "2": "זה הסדר ההפוך. אילו זה היה הסדר, לא היה אפשר להסתיר שם מובנה במשתנה מקומי."
    "3": "הפונקציה העוטפת קרובה יותר מהמודול, ולכן היא נבדקת לפני הטווח הגלובלי."

- id: py.functions.scope.004
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    count = 0

    def increment():
        count += 1

    increment()
    print(count)
  options: ["UnboundLocalError", "1", "0", "NameError"]
  answer: 0
  explanation: "`count += 1` היא השמה, ולכן פייתון מחליטה ש-`count` הוא משתנה מקומי בכל הפונקציה. כדי לחשב `count + 1` צריך לקרוא את המשתנה המקומי, אבל הוא עוד לא קיבל ערך, ולכן נזרק `UnboundLocalError`. כדי לשנות את המשתנה הגלובלי צריך `global count`."
  optionExplanations:
    "1": "בלי `global`, השמה בתוך פונקציה לא יכולה לשנות משתנה גלובלי."
    "2": "הקוד לא מגיע להדפסה, כי הקריאה ל-`increment` נכשלת."
    "3": "השם `count` כן מוכר, כמשתנה מקומי שעוד לא קיבל ערך. לכן השגיאה היא `UnboundLocalError`, ולא `NameError`."

- id: py.functions.scope.005
  type: single
  difficulty: 1
  prompt: "איזו שורה צריך להוסיף בתחילת `increment` כדי שהיא תגדיל את המשתנה הגלובלי `count`?"
  code: |
    count = 0

    def increment():
        count += 1
  options: ["`global count`", "`nonlocal count`", "`count = count`", "`return count`"]
  answer: 0
  explanation: "ההצהרה `global count` אומרת לפייתון שהשם `count` בפונקציה הזאת מפנה למשתנה של המודול. כך ההשמה משנה את המשתנה הגלובלי ולא יוצרת משתנה מקומי."
  optionExplanations:
    "1": "`nonlocal` מתייחס למשתנה של פונקציה עוטפת. כאן אין פונקציה עוטפת, ולכן זו `SyntaxError`."
    "2": "זו השמה, ולכן גם היא הופכת את `count` למקומי, ונזרק `UnboundLocalError` כבר בשורה הזאת."
    "3": "`return count` קורא את `count` המקומי לפני שקיבל ערך, ולכן נזרק `UnboundLocalError`. וגם אילו לא, הפונקציה הייתה מסתיימת לפני ההגדלה."

