- id: py.functions.scope.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    x = 10

    def show():
        x = 5
        print(x)

    show()
    print(x)
  options:
    - "5\n10"
    - "5\n5"
    - "10\n10"
    - "10\n5"
  answer: 0
  explanation: "השמה בתוך פונקציה יוצרת משתנה מקומי (Local Variable) חדש, שקיים רק בזמן הקריאה. ה-`x` שבתוך `show` הוא משתנה אחר לגמרי מה-`x` הגלובלי (Global Variable), ולכן ה-`x` הגלובלי נשאר 10."
  optionExplanations:
    "1": "ההשמה `x = 5` לא משנה את המשתנה הגלובלי. היא יוצרת משתנה מקומי באותו שם."
    "2": "בתוך הפונקציה המשתנה המקומי מסתיר את הגלובלי, ולכן שם מודפס 5."
    "3": "סדר ההדפסות הפוך: קודם מודפס ה-`x` המקומי מתוך `show`, ורק אחר כך הגלובלי."

- id: py.functions.scope.002
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    def make():
        secret = 42

    make()
    print(secret)
  options: ["NameError", "42", "None", "UnboundLocalError"]
  answer: 0
  explanation: "`secret` הוא משתנה מקומי של `make`. הוא נוצר בתחילת הקריאה ונעלם כשהיא מסתיימת. מחוץ לפונקציה השם לא קיים בטווח ההכרה (Scope), ולכן נזרק `NameError`. כדי להוציא ערך מפונקציה משתמשים ב-`return`."
  optionExplanations:
    "1": "משתנים מקומיים לא נשארים זמינים אחרי שהפונקציה הסתיימה."
    "2": "פייתון לא מחזירה `None` עבור שם שלא קיים. היא זורקת שגיאה."
    "3": "`UnboundLocalError` נזרק כשקוראים משתנה מקומי בתוך פונקציה לפני שהוא קיבל ערך. כאן הקריאה היא ברמת המודול."

