        global last_result
        result = a + b
        last_result = result
        return result
  options:
    - "תופעת לוואי נסתרת - Hidden Side Effect"
    - "קוד מת - Dead Code"
    - "מתודה ארוכה - Long Method"
    - "רשימת פרמטרים ארוכה - Long Parameter List"
  answer: 0
  explanation: "השם `add` מבטיח רק חישוב, אבל הפונקציה גם משנה משתנה גלובלי. מי שקורא לה לא מצפה לזה, וקוד אחר שתלוי ב-`last_result` משתנה בלי שום סימן במקום הקריאה. עדיף פונקציה שרק מחזירה ערך, ואם צריך לשמור אותו, הקורא ישמור במפורש."
  optionExplanations:
    "1": "כל השורות מתבצעות ומשפיעות. הבעיה היא לא קוד שלא רץ, אלא מה שהקוד עושה בלי להודיע."
    "2": "הפונקציה קצרה מאוד. הבעיה היא השינוי הנסתר של מצב גלובלי."
    "3": "שני פרמטרים הם כמות טבעית לחיבור."
