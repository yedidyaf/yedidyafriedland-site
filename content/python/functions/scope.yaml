    - "גלובלי, מקומי, פונקציה עוטפת, מובנה"
    - "מובנה, גלובלי, פונקציה עוטפת, מקומי"
    - "מקומי, גלובלי, פונקציה עוטפת, מובנה"
  answer: 0
  explanation: "LEGB הם ראשי התיבות של Local, Enclosing, Global, Built-in. פייתון מתחילה בטווח הקרוב ביותר, הפונקציה הנוכחית, וממשיכה החוצה: הפונקציה העוטפת, המודול, ולבסוף השמות המובנים כמו `len` ו-`print`. השם הראשון שנמצא הוא זה שמשמש."
  optionExplanations:
