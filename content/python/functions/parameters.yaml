- id: py.functions.parameters.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    def describe(name, age):
        print(name, "is", age)

    describe(age=30, name="Noa")
  options: ["Noa is 30", "30 is Noa", "TypeError", "name is age"]
  answer: 0
  explanation: "בארגומנטים לפי שם (Keyword Arguments) כל ערך מגיע לפרמטר שהשם שלו נכתב, בלי קשר לסדר בקריאה. לכן `name` מקבל `\"Noa\"` ו-`age` מקבל 30, והסדר בהגדרת הפונקציה קובע את ההדפסה."
  optionExplanations:
    "1": "הסדר בקריאה לא משנה כשמציינים שמות. כל ערך מגיע לפרמטר שלו."
    "2": "מותר להעביר ארגומנטים לפי שם בכל סדר, כל עוד כל פרמטר מקבל ערך אחד בדיוק."
    "3": "`print` מדפיס את ערכי המשתנים, לא את השמות שלהם."

- id: py.functions.parameters.002
  type: single
  difficulty: 1
  prompt: "נתונה הפונקציה `def power(base, exp=2):`. איזו קריאה תזרוק שגיאה?"
  options: ["`power(exp=3)`", "`power(3)`", "`power(3, 3)`", "`power(exp=3, base=2)`"]
  answer: 0
  explanation: "ל-`exp` יש ערך ברירת מחדל (Default Value), ולכן מותר לוותר עליו. ל-`base` אין ברירת מחדל, ולכן הוא פרמטר חובה. `power(exp=3)` לא מעבירה ערך ל-`base`, ונזרק `TypeError`."
  optionExplanations:
    "1": "`exp` מקבל את ברירת המחדל 2, ו-`base` מקבל 3. הקריאה תקינה."
    "2": "שני הפרמטרים מקבלים ערך לפי מיקום. הקריאה תקינה."
    "3": "ארגומנטים לפי שם יכולים להופיע בכל סדר, ושני הפרמטרים מקבלים ערך."

