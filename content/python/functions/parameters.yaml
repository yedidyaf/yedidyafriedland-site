- id: py.functions.parameters.007
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    def add_tag(tag, tags=[]):
        tags.append(tag)
        return tags

    print(add_tag("a"))
    print(add_tag("b"))
  options:
    - "['a']\n['a', 'b']"
    - "['a']\n['b']"
    - "['a', 'b']\n['a', 'b']"
    - "['b']\n['a', 'b']"
  answer: 0
  explanation: "ערך ברירת המחדל `[]` נוצר פעם אחת בלבד, כשה-`def` מתבצע, ולא בכל קריאה. שתי הקריאות משתמשות באותה רשימה, ולכן `b` מתווסף לרשימה שכבר מכילה את `a`. זו המלכודת של ערך ברירת מחדל שניתן לשינוי (Mutable Default Argument). הפתרון: `tags=None` ובתוך הפונקציה `if tags is None: tags = []`."
  optionExplanations:
    "1": "זו התוצאה שרוב המתחילים מצפים לה, אבל הרשימה לא נוצרת מחדש בכל קריאה. היא משותפת לכל הקריאות."
    "2": "השורה הראשונה מודפסת מיד אחרי הקריאה הראשונה, כשברשימה יש רק `a`."
    "3": "`a` נכנס לרשימה בקריאה הראשונה, ונשאר בה גם בשנייה."

- id: py.functions.parameters.008
  type: bug
  difficulty: 3
  prompt: "כל קריאה בלי `roster` אמורה ליצור רשימה חדשה ונפרדת. בפועל, `class_b` מכילה גם את `Dana`. איזו שורה צריך לתקן?"
  code: |
    def add_student(name, roster=[]):
        if roster is None:
            roster = []
        roster.append(name)
        return roster

    class_a = add_student("Dana")
    class_b = add_student("Yossi")
  answer: 1
  explanation: "הבדיקה `if roster is None` נכונה, אבל ברירת המחדל היא `[]` ולא `None`, ולכן התנאי אף פעם לא מתקיים. הרשימה שבברירת המחדל נוצרת פעם אחת ומשותפת לכל הקריאות. צריך `roster=None`, ואז נוצרת רשימה חדשה בכל קריאה."
  fixed: |
    def add_student(name, roster=None):
        if roster is None:
            roster = []
        roster.append(name)
        return roster

    class_a = add_student("Dana")
    class_b = add_student("Yossi")

