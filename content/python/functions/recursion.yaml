- id: py.functions.recursion.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    def factorial(n):
        if n == 0:
            return 1
        return n * factorial(n - 1)

    print(factorial(4))
  options: ["24", "10", "0", "4"]
  answer: 0
  explanation: "פונקציה רקורסיבית (Recursive Function) קוראת לעצמה עם בעיה קטנה יותר. `factorial(4)` היא `4 * factorial(3)`, וכך הלאה עד `factorial(0)`, מקרה הבסיס שמחזיר 1. התוצאה: `4 * 3 * 2 * 1 * 1 = 24`."
  optionExplanations:
    "1": "10 הוא סכום המספרים 1 עד 4. כאן כל שלב כופל ולא מחבר."
    "2": "מקרה הבסיס מחזיר 1 ולא 0, ולכן המכפלה לא מתאפסת."
    "3": "הקריאה הראשונה לא מחזירה את `n` לבד, אלא את `n` כפול התוצאה של הקריאה הרקורסיבית."

