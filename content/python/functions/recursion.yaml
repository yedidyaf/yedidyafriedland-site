    "3": "`fib(4)` היא 3, כי `fib(0)` היא 0 ו-`fib(1)` היא 1."

- id: py.functions.recursion.009
  type: bug
  difficulty: 1
  prompt: "הפונקציה אמורה לחשב `base` בחזקת `exp`. בפועל היא נכשלת ב-`RecursionError`. איזו שורה צריך לתקן?"
  code: |
    def power(base, exp):
        if exp == 0:
            return 1
        return base * power(base, exp)
  answer: 4
  explanation: "הקריאה הרקורסיבית מעבירה את אותו `exp`, ולכן הבעיה לא קטנה ולא מגיעים לעולם למקרה הבסיס `exp == 0`. בכל קריאה רקורסיבית הקלט חייב להתקרב למקרה הבסיס: `power(base, exp - 1)`."
  fixed: |
    def power(base, exp):
        if exp == 0:
            return 1
        return base * power(base, exp - 1)

- id: py.functions.recursion.010
  type: bug
  difficulty: 2
  prompt: "הפונקציה אמורה להחזיר את מכפלת המספרים ברשימה, למשל `product([2, 3, 4])` צריכה להחזיר 24. בפועל היא תמיד מחזירה 0. איזו שורה צריך לתקן?"
  code: |
    def product(nums):
        if not nums:
            return 0
        return nums[0] * product(nums[1:])
  answer: 3
  explanation: "כל שרשרת הכפל מסתיימת במקרה הבסיס, הרשימה הריקה. אם הוא מחזיר 0, כל המכפלה מתאפסת. מקרה הבסיס של מכפלה צריך להחזיר 1, האיבר הנייטרלי של כפל, בדיוק כמו שמקרה הבסיס של סכום מחזיר 0."
  fixed: |
    def product(nums):
        if not nums:
            return 1
        return nums[0] * product(nums[1:])

- id: py.functions.recursion.011
  type: bug
  difficulty: 3
  prompt: "הפונקציה אמורה לבדוק אם מחרוזת היא פלינדרום (נקראת אותו דבר משני הכיוונים). בפועל `is_palindrome(\"abcba\")` מחזירה `False`. איזו שורה צריך לתקן?"
  code: |
    def is_palindrome(s):
        if len(s) <= 1:
            return True
        if s[0] != s[-1]:
            return False
        return is_palindrome(s[1:-2])
  answer: 6
  explanation: "אחרי שבודקים את התו הראשון והאחרון, צריך להמשיך עם מה שביניהם: `s[1:-1]`. החיתוך `s[1:-2]` מוריד תו נוסף מהסוף, ולכן ב-`\"abcba\"` הקריאה הבאה מקבלת `\"bc\"` במקום `\"bcb\"`, ומחזירה `False`. הקריאה הרקורסיבית חייבת להקטין את הבעיה בדיוק בחלק שכבר נבדק."
  fixed: |
    def is_palindrome(s):
        if len(s) <= 1:
            return True
        if s[0] != s[-1]:
            return False
        return is_palindrome(s[1:-1])

