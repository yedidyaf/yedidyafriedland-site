- id: py.control-flow.for-loops.014
  type: cleaner
  difficulty: 2
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      names = ["Dana", "Avi"]
      for i, name in enumerate(names, start=1):
          print(i, name)
    - |
      names = ["Dana", "Avi"]
      for i in range(len(names)):
          print(i + 1, names[i])
    - |
      names = ["Dana", "Avi"]
      i = 1
      for name in names:
          print(i, name)
          i += 1
  answer: 0
  explanation: "כשצריך גם מספור וגם את האיבר, `enumerate` נותן את שניהם ישירות, בלי גישה לפי אינדקס ובלי מונה ידני. הפרמטר `start=1` חוסך את החישוב `i + 1`."
  optionExplanations:
    "1": "`range(len(...))` עם `names[i]` הוא דפוס שהועתק משפות אחרות. הוא ארוך יותר ופתוח לטעויות אינדקס."
    "2": "מונה ידני מוסיף שתי שורות שאפשר לשכוח לעדכן, כשבדיוק לזה נועד `enumerate`."

- id: py.control-flow.for-loops.015
  type: single
  difficulty: 2
  prompt: "כמה פעמים תרוץ הפקודה `print` בקוד הבא?"
  code: |
    for i in range(4):
        for j in range(0, 10, 3):
            print(i, j)
  options: ["16", "12", "40", "20"]
  answer: 0
  explanation: "בלולאה מקוננת, מספר ההרצות של הגוף הפנימי הוא מכפלת מספרי הסיבובים. החיצונית רצה 4 פעמים. `range(0, 10, 3)` מייצר 0, 3, 6, 9, כלומר 4 ערכים. סך הכול 4 × 4 = 16."
  optionExplanations:
    "1": "`range(0, 10, 3)` כולל גם את 9, ולכן יש בו 4 ערכים ולא 3."
    "2": "זה מתעלם מהקפיצה של 3. הלולאה הפנימית לא רצה 10 פעמים."
    "3": "בלולאות מקוננות מכפילים את מספרי הסיבובים, לא מחברים."

- id: py.control-flow.for-loops.016
  type: truefalse
  difficulty: 2
  prompt: "`range(10, 0)` מייצר את המספרים מ-10 עד 1 בסדר יורד."
  answer: false
  explanation: "ברירת המחדל של הקפיצה היא `1`, כלומר ספירה קדימה. כשההתחלה גדולה מהסוף אין מספרים בדרך, ו-`range(10, 0)` ריק. כדי לספור לאחור צריך קפיצה שלילית: `range(10, 0, -1)`."
