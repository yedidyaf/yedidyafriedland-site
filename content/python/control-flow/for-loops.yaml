  prompt: "`range(10, 0)` מייצר את המספרים מ-10 עד 1 בסדר יורד."
  answer: false
  explanation: "ברירת המחדל של הקפיצה היא `1`, כלומר ספירה קדימה. כשההתחלה גדולה מהסוף אין מספרים בדרך, ו-`range(10, 0)` ריק. כדי לספור לאחור צריך קפיצה שלילית: `range(10, 0, -1)`."

- id: py.control-flow.for-loops.017
  type: order
  difficulty: 1
  tags: [algorithm]
  prompt: "סדרו את השורות כך שהתוכנית תחשב 5 עצרת (1·2·3·4·5)."
  code: |
    n = 5
    result = 1
    for i in range(1, n + 1):
        result *= i
    print(result)
  output: "120"
  anyOrder: [[1, 2]]
  explanation: "צובר של מכפלה (Accumulator) מתחיל ב-1, לא ב-0, כי כפל ב-0 מאפס הכל. הלולאה עוברת על 1 עד `n` (לכן `n + 1` ב-`range`), ובכל סיבוב כופלת. ההדפסה באה אחרי הלולאה ולא בתוכה, אחרת יודפסו גם התוצאות החלקיות."
