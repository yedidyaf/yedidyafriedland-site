- id: py.control-flow.for-loops.015
  type: single
  difficulty: 2
  prompt: "כמה פעמים תרוץ הפקודה `print` בקוד הבא?"
  code: |
    for i in range(4):
        for j in range(0, 10, 3):
            print(i, j)
  options: ["16", "12", "40", "20"]
  answer: 0
  explanation: "בלולאה מקוננת, מספר ההרצות של הגוף הפנימי הוא מכפלת מספרי הסיבובים. החיצונית רצה 4 פעמים. `range(0, 10, 3)` מייצר 0, 3, 6, 9, כלומר 4 ערכים. סך הכול 4 × 4 = 16."
  optionExplanations:
    "1": "`range(0, 10, 3)` כולל גם את 9, ולכן יש בו 4 ערכים ולא 3."
    "2": "זה מתעלם מהקפיצה של 3. הלולאה הפנימית לא רצה 10 פעמים."
    "3": "בלולאות מקוננות מכפילים את מספרי הסיבובים, לא מחברים."

- id: py.control-flow.for-loops.016
