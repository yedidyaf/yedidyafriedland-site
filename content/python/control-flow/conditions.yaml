- id: py.control-flow.conditions.017
  type: order
  difficulty: 3
  tags: [algorithm]
  prompt: "סדרו את השורות כך שהתוכנית תמיין שלושה מספרים מהקטן לגדול בעזרת השוואות והחלפות בלבד."
  code: |
    a, b, c = 9, 7, 4
    if a > b:
        a, b = b, a
    if b > c:
        b, c = c, b
    if a > b:
        a, b = b, a
    print(a, b, c)
  output: "4 7 9"
  explanation: "כל `if` משווה שני שכנים ומחליף אותם אם הם בסדר הפוך. ההשוואה של `a` ו-`b`, אחר כך של `b` ו-`c`, מעבירה את הגדול ביותר ל-`c`. אבל אחרי ההחלפה השנייה ייתכן ש-`b` קטן מ-`a`, ולכן משווים את `a` ו-`b` שוב בסוף. עם הקלט 9, 7, 4 צריך את שלוש ההחלפות."
