- id: py.control-flow.loop-control.013
  type: single
  difficulty: 2
  prompt: "מתי רץ בלוק `else` שמחובר ללולאת `for` או `while`?"
  options:
    - "כשהלולאה הסתיימה בלי שבוצע `break`"
    - "רק כשהלולאה לא רצה אף פעם"
    - "רק כשבוצע `break`"
    - "תמיד, אחרי שהלולאה מסתיימת"
  answer: 0
  explanation: "`else` של לולאה רץ כשהלולאה הגיעה לסופה הטבעי: ב-`for` כשנגמרו האיברים, וב-`while` כשהתנאי נכשל. אם הלולאה נקטעה ב-`break`, הוא מדולג. השם מבלבל, ולכן כדאי לחשוב עליו כ\"לא היה break\"."
  optionExplanations:
    "1": "גם לולאה שלא רצה אף פעם מסתיימת בלי `break`, ולכן ה-`else` רץ. אבל הוא רץ גם אחרי לולאה שרצה כרגיל."
    "2": "זה ההפך: `break` הוא בדיוק המצב שבו ה-`else` מדולג."
    "3": "אם כך, לא היה בו טעם. ה-`else` מדולג כשהיה `break`."

