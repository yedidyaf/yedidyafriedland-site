- id: py.control-flow.loop-control.009
  type: bug
  difficulty: 1
  prompt: "הקוד אמור להדפיס רק את המספר השלילי הראשון ברשימה. באיזו שורה הבאג?"
  code: |
    numbers = [5, 8, -2, 7, -9]
    for n in numbers:
        if n < 0:
            print("first negative:", n)
            continue
  answer: 5
  explanation: "`continue` רק עובר לסיבוב הבא, ולכן הלולאה ממשיכה ומדפיסה גם את `-9`. כדי לעצור אחרי שמצאנו את הראשון צריך `break`."
  fixed: |
    numbers = [5, 8, -2, 7, -9]
    for n in numbers:
        if n < 0:
            print("first negative:", n)
            break

- id: py.control-flow.loop-control.010
  type: bug
  difficulty: 3
  prompt: "הפונקציה אמורה להדפיס `found` אם `target` נמצא ב-`items`, ו-`not found` פעם אחת בלבד אם הוא לא נמצא. באיזו שורה הבאג?"
  code: |
    def report(items, target):
        for item in items:
            if item == target:
                print("found")
                break
            else:
                print("not found")
  answer: 6
  explanation: "ה-`else` מוזח כחלק מה-`if`, ולכן `not found` מודפס עבור כל איבר שאינו שווה ל-`target`. הכוונה הייתה ל-`else` של הלולאה, שרץ פעם אחת ורק אם לא היה `break`. לשם כך הוא צריך להיות באותה הזחה של ה-`for`."
  fixed: |
    def report(items, target):
        for item in items:
            if item == target:
                print("found")
                break
        else:
            print("not found")

- id: py.control-flow.loop-control.011
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס רק את השמות שאינם ריקים. באיזו שורה הבאג?"
  code: |
    names = ["Dana", "", "Avi"]
    for name in names:
        if name == "":
