        print(name)
  answer: 4
  explanation: "`pass` לא עושה דבר, ולכן הביצוע ממשיך ל-`print` גם עבור המחרוזת הריקה, ומודפסת שורה ריקה. כדי לדלג על שאר הגוף בסיבוב הזה צריך `continue`."
  fixed: |
    names = ["Dana", "", "Avi"]
    for name in names:
        if name == "":
            continue
        print(name)

