  prompt: "בכל האפשרויות `n` מתחיל ב-`10`, וגוף הלולאה הוא `n -= 3`. עם איזה תנאי הלולאה לא תיעצר לעולם?"
  options: ["`while n != 0:`", "`while n != 1:`", "`while n > 0:`", "`while n >= -5:`"]
  answer: 0
  explanation: "`n` עובר את הערכים 10, 7, 4, 1, -2, -5 וכן הלאה, ולעולם לא שווה בדיוק ל-0. לכן התנאי `n != 0` תמיד מתקיים. תנאי עצירה עם `!=` מסוכן כשהמשתנה קופץ בצעדים: בטוח יותר לכתוב תנאי עם `>` או `<`, שעוצר גם כשעוברים את הגבול."
  optionExplanations:
    "1": "`n` כן מגיע בדיוק ל-1 אחרי שלושה סיבובים, ואז הלולאה נעצרת."
