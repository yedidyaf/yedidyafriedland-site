- id: py.exceptions.custom-exceptions.013
  type: bug
  difficulty: 3
  prompt: "המחלקה אמורה לשמור את `used` ואת `limit`, ו-`print(e)` אמור להציג למשל `used 120 of 100`. איזו שורה צריך לתקן?"
  code: |
    class QuotaExceededError(Exception):
        def __init__(self, used, limit):
            super().__init__()
            self.used = used
            self.limit = limit


    try:
        raise QuotaExceededError(120, 100)
    except QuotaExceededError as e:
        print(e)
  answer: 3
  explanation: "ההודעה של חריגה נקבעת לפי הארגומנטים שמועברים ל-`__init__` של `Exception`. הקריאה `super().__init__()` לא מעבירה כלום, ולכן `print(e)` מדפיס שורה ריקה. צריך להעביר את ההודעה המעוצבת."
  fixed: |
    class QuotaExceededError(Exception):
        def __init__(self, used, limit):
            super().__init__(f"used {used} of {limit}")
            self.used = used
            self.limit = limit


    try:
        raise QuotaExceededError(120, 100)
    except QuotaExceededError as e:
        print(e)

