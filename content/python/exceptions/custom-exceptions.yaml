  optionExplanations:
    "1": "Python לא מחפשת את ההתאמה המדויקת ביותר, אלא את הראשונה לפי הסדר."
    "2": "רק בלוק `except` אחד רץ לכל חריגה."
    "3": "`except ShopError` תופס גם מחלקות שיורשות מ-`ShopError`."

- id: py.exceptions.custom-exceptions.006
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    class ValidationError(Exception):
        pass
