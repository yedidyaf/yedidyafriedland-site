- id: py.exceptions.custom-exceptions.004
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    class AppError(Exception):
        pass


    class NotFoundError(AppError):
        pass


    try:
        raise NotFoundError("user 7")
    except AppError as e:
        print(type(e).__name__, e)
  options: ["NotFoundError user 7", "AppError user 7", "NotFoundError", "AppError NotFoundError"]
  answer: 0
  explanation: "`except AppError` תופס כל חריגה שהיא מופע של `AppError`, כולל מחלקות שיורשות ממנה. התפיסה לפי מחלקת הבסיס לא משנה את האובייקט: `e` הוא עדיין `NotFoundError`, וההודעה שלו נשמרת."
  optionExplanations:
    "1": "`type(e)` מחזיר את הסוג האמיתי של האובייקט, לא את המחלקה שכתובה ב-`except`."
    "2": "`print` מקבל שני ערכים: שם המחלקה ואת החריגה עצמה, שמודפסת כהודעה שלה."
    "3": "הערך השני הוא `e`, ו-`print(e)` מציג את ההודעה `user 7`."

