- id: py.exceptions.custom-exceptions.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    class InsufficientFundsError(Exception):
        pass


    def withdraw(balance, amount):
        if amount > balance:
            raise InsufficientFundsError("not enough money")
        return balance - amount


    try:
        withdraw(50, 80)
    except InsufficientFundsError as e:
        print("Error:", e)
  options: ["Error: not enough money", "Error: InsufficientFundsError", "Error:", "InsufficientFundsError"]
  answer: 0
  explanation: "מחלקת חריגה מותאמת אישית (Custom Exception) היא מחלקה שיורשת מ-`Exception`. גם עם `pass` בלבד היא יורשת את כל ההתנהגות, כולל שמירת ההודעה, ולכן `print(e)` מדפיס את ההודעה שהועברה."
  optionExplanations:
    "1": "הדפסת החריגה מציגה את ההודעה שלה, לא את שם המחלקה."
    "2": "המחלקה לא צריכה `__init__` משלה. ה-`__init__` של `Exception` שומר את ההודעה."
    "3": "החריגה נתפסת על ידי `except InsufficientFundsError`, ולכן התוכנית לא נעצרת."

- id: py.exceptions.custom-exceptions.002
  type: single
  difficulty: 1
  prompt: ממה כדאי שמחלקת חריגה מותאמת אישית תירש?
  options: ["`Exception`", "`BaseException`", "`object`", "`Error`"]
  answer: 0
  explanation: "חריגות של אפליקציה יורשות מ-`Exception` (או מחריגה שיורשת ממנה). כך `except Exception:` תופס אותן, כמו את שאר שגיאות התוכנית."
  optionExplanations:
    "1": "`BaseException` שמורה לחריגות מערכת כמו `KeyboardInterrupt` ו-`SystemExit`. חריגה שיורשת ממנה ישירות לא תיתפס ב-`except Exception:`."
    "2": "אפשר לזרוק רק אובייקט שיורש מ-`BaseException`. זריקה של מחלקה שיורשת מ-`object` תגרום ל-`TypeError`."
    "3": "אין ב-Python מחלקה מובנית בשם `Error`, ולכן תתקבל `NameError`."

