  optionExplanations:
    "1": "בסיס משותף לא הופך את המחלקות לאותו סוג. `PasswordError` אינה `EmailError`."
    "2": "החריגה לא נתפסה, ולכן התוכנית נעצרת ו-`done` לא מודפס."
    "3": "נזרקה `PasswordError`, ושם המחלקה המדויקת שלה הוא שמופיע, לא שם מחלקת הבסיס."

- id: py.exceptions.custom-exceptions.007
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    class HttpError(Exception):
        def __init__(self, status, message):
            super().__init__(f"{status}: {message}")
            self.status = status


    try:
        raise HttpError(404, "not found")
    except HttpError as e:
        print(e.status)
        print(e)
  options: ["404\n404: not found", "404\nnot found", "404\nHttpError", "404\n404"]
  answer: 0
  explanation: "חריגה מותאמת יכולה לשמור מידע נוסף כמאפיינים, כאן `status`. הקריאה ל-`super().__init__` עם מחרוזת קובעת את ההודעה ש-`print(e)` מציג, ולכן מודפסת המחרוזת המעוצבת `404: not found`."
  optionExplanations:
    "1": "ההודעה היא מה שהועבר ל-`super().__init__`, כלומר המחרוזת המעוצבת שכוללת גם את הסטטוס."
    "2": "הדפסת החריגה מציגה את ההודעה שלה, לא את שם המחלקה."
    "3": "`print(e)` לא מדפיס את `e.status` אלא את ההודעה שנשמרה ב-`super().__init__`."

