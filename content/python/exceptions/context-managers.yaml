- id: py.exceptions.context-managers.001
  type: single
  difficulty: 1
  prompt: "מה מבטיח הבלוק `with open(\"data.txt\") as f:`?"
  options:
    - "הקובץ ייסגר בסוף הבלוק, גם אם נזרקה בו חריגה"
    - "הקובץ ייסגר בסוף הבלוק, אבל רק אם לא נזרקה בו חריגה"
    - "חריגות שנזרקות בתוך הבלוק ייבלעו ולא יעצרו את התוכנית"
    - "תוכן הקובץ כולו ייקרא לזיכרון כבר בתחילת הבלוק"
  answer: 0
  explanation: "`with` מפעיל מנהל הקשר (Context Manager). הקובץ הוא מנהל הקשר שסוגר את עצמו ביציאה מהבלוק, בכל דרך יציאה: סיום רגיל, `return` או חריגה. כך לא נשארים קבצים פתוחים בטעות."
  optionExplanations:
    "1": "זה היתרון המרכזי של `with`: הסגירה מתבצעת גם כשנזרקת חריגה, בדומה ל-`finally`."
    "2": "קובץ לא בולע חריגות. הוא נסגר, והחריגה ממשיכה לעלות כרגיל."
    "3": "`with` לא קורא את הקובץ. הקריאה מתבצעת רק כשקוראים למתודה כמו `f.read()`."

- id: py.exceptions.context-managers.002
