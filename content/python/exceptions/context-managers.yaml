  difficulty: 1
  prompt: מה יודפס?
  code: |
    class Door:
        def __enter__(self):
            print("open")
            return self

        def __exit__(self, exc_type, exc, tb):
            print("close")


    with Door():
        print("inside")
    print("after")
  options: ["open\ninside\nclose\nafter", "inside\nopen\nclose\nafter", "open\ninside\nafter\nclose", "open\nclose\ninside\nafter"]
  answer: 0
  explanation: "בכניסה לבלוק `with` נקראת `__enter__`, אחר כך רץ גוף הבלוק, וביציאה ממנו נקראת `__exit__`. רק אחרי כל אלה ממשיכה השורה שמחוץ לבלוק."
  optionExplanations:
    "1": "`__enter__` רצה לפני גוף הבלוק, לא אחריו."
    "2": "`__exit__` נקראת מיד ביציאה מהבלוק, לפני הקוד שאחריו, ולא בסוף התוכנית."
    "3": "`__exit__` נקראת רק אחרי שכל גוף הבלוק רץ."

