- id: py.exceptions.context-managers.009
  type: bug
  difficulty: 2
  prompt: מנהל ההקשר אמור להדפיס `closed` ביציאה ולתת לכל חריגה מתוך הבלוק להמשיך הלאה. איזו שורה צריך לתקן?
  code: |
    class Session:
        def __enter__(self):
            print("opened")
            return self

        def __exit__(self, exc_type, exc, tb):
            print("closed")
            return True
  answer: 8
  explanation: "ערך אמת שמוחזר מ-`__exit__` אומר ל-Python שהחריגה טופלה, ולכן כל חריגה בתוך הבלוק נבלעת בשקט. כדי שהחריגה תמשיך, מחזירים `False` או לא מחזירים דבר (`None`)."
  fixed: |
    class Session:
        def __enter__(self):
            print("opened")
            return self

        def __exit__(self, exc_type, exc, tb):
            print("closed")
            return False

- id: py.exceptions.context-managers.010
  type: bug
  difficulty: 2
  prompt: הפונקציה אמורה לכתוב לקובץ את כל השורות ואחריהן שורה `END`. איזו שורה צריך לתקן?
  code: |
    def save_report(path, lines):
        with open(path, "w") as f:
            for line in lines:
                f.write(line + "\n")
        f.write("END\n")
  answer: 5
  explanation: "השורה האחרונה נמצאת מחוץ לבלוק `with`, ושם הקובץ כבר נסגר. המשתנה `f` עדיין קיים, אבל כתיבה לקובץ סגור זורקת `ValueError: I/O operation on closed file`. צריך להזיח את השורה לתוך הבלוק."
  fixed: |
    def save_report(path, lines):
        with open(path, "w") as f:
            for line in lines:
                f.write(line + "\n")
            f.write("END\n")

- id: py.exceptions.context-managers.011
  type: bug
  difficulty: 3
  prompt: המחלקה אמורה לשמש ב-`with` ולהגדיל את רמת ההזחה בכניסה ולהקטין אותה ביציאה. איזו שורה צריך לתקן?
  code: |
    class Indent:
        def __init__(self):
            self.level = 0

        def __enter__(self):
            self.level += 1
            return self

        def __exit__(self):
            self.level -= 1
  answer: 9
  explanation: "Python קוראת ל-`__exit__` תמיד עם שלושה ארגומנטים מלבד `self`: סוג החריגה, החריגה וה-traceback (או שלושה `None`). חתימה בלי הפרמטרים האלה גורמת ל-`TypeError` ביציאה מכל בלוק `with`."
  fixed: |
    class Indent:
        def __init__(self):
            self.level = 0

        def __enter__(self):
            self.level += 1
            return self

        def __exit__(self, exc_type, exc, tb):
            self.level -= 1

