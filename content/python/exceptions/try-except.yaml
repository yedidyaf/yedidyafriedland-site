- id: py.exceptions.try-except.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    try:
        print("A")
        x = int("abc")
        print("B")
    except ValueError:
        print("C")
    print("D")
  options: ["A\nC\nD", "A\nB\nC\nD", "C\nD", "A\nValueError"]
  answer: 0
  explanation: "ברגע שנזרקת חריגה (Exception) בתוך `try`, שאר השורות בבלוק מדולגות והביצוע עובר ל-`except` המתאים. אחרי הטיפול התוכנית ממשיכה כרגיל מהשורה שאחרי כל המבנה, ולכן `D` מודפס."
  optionExplanations:
    "1": "`B` לא מודפס, כי השורה `int(\"abc\")` זורקת `ValueError` והביצוע קופץ מיד ל-`except`."
    "2": "`A` מודפס לפני השורה שזורקת. מה שכבר רץ לפני החריגה לא מתבטל."
    "3": "החריגה נתפסה על ידי `except ValueError`, ולכן התוכנית לא נעצרת וממשיכה להדפיס."

- id: py.exceptions.try-except.002
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    try:
        nums = [1, 2, 3]
        print(nums[5])
    except KeyError:
        print("key")
    except IndexError:
        print("index")
    except Exception:
        print("general")
  options: ["index", "index\ngeneral", "general", "key"]
  answer: 0
  explanation: "כשיש כמה בלוקי `except`, Python בודקת אותם לפי הסדר ומריצה רק את הראשון שמתאים לסוג החריגה. גישה לאינדקס שלא קיים ברשימה זורקת `IndexError`, ולכן מודפס `index` בלבד, אף ש-`Exception` היה מתאים גם הוא."
  optionExplanations:
    "1": "רק בלוק `except` אחד רץ. אחרי שנמצא בלוק מתאים, שאר הבלוקים מדולגים."
    "2": "`Exception` אכן תופס גם `IndexError`, אבל הבלוק של `IndexError` מופיע קודם ולכן הוא שנבחר."
    "3": "`KeyError` נזרקת בגישה למפתח חסר במילון. ברשימה נזרקת `IndexError`."

- id: py.exceptions.try-except.003
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    def parse(text):
        try:
            n = int(text)
        except ValueError:
            print("bad")
        else:
            print("ok", n)

    parse("7")
    parse("x")
  options: ["ok 7\nbad", "ok 7", "ok 7\nValueError", "bad\nok 7"]
  answer: 0
  explanation: "בלוק `else` רץ רק כש-`try` הגיע לסופו בלי חריגה. בקריאה הראשונה ההמרה מצליחה ולכן `else` רץ. בקריאה השנייה נזרקת `ValueError`, בלוק `except` רץ ו-`else` מדולג."
  optionExplanations:
    "1": "גם הקריאה `parse(\"x\")` מדפיסה משהו: ההמרה נכשלת ובלוק `except` מדפיס `bad`."
    "2": "החריגה נתפסת בתוך הפונקציה, ולכן היא לא מגיעה לתוכנית הראשית."
    "3": "הקריאות רצות לפי הסדר שבו הן כתובות. `parse(\"7\")` רצה ראשונה."

- id: py.exceptions.try-except.004
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    def get_status():
        try:
            return "try"
        finally:
            print("finally")

    print(get_status())
  options: ["finally\ntry", "try\nfinally", "try", "finally"]
  answer: 0
  explanation: "בלוק `finally` רץ תמיד לפני שהפונקציה באמת יוצאת, גם כש-`try` מסתיים ב-`return`. הערך `\"try\"` נשמר בצד, `finally` מדפיס, ורק אז הפונקציה מחזירה את הערך ו-`print` שבחוץ מדפיס אותו."
  optionExplanations:
    "1": "`print` החיצוני מקבל את הערך רק אחרי שהפונקציה סיימה, כלומר אחרי ש-`finally` כבר רץ."
    "2": "`return` לא מדלג על `finally`. הבלוק רץ בכל דרך יציאה מ-`try`."
    "3": "`finally` לא מבטל את ה-`return`. הערך `\"try\"` עדיין מוחזר ומודפס."

- id: py.exceptions.try-except.005
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    try:
        print("1")
        prices = {}
        print(prices["milk"])
    except ValueError:
        print("2")
    finally:
        print("3")
    print("4")
  options: ["1\n3\nKeyError", "1\n2\n3\n4", "1\n3\n4", "1\nKeyError"]
  answer: 0
  explanation: "הגישה למפתח שלא קיים זורקת `KeyError`, ואין `except` שמתאים לה, ולכן החריגה לא נתפסת. לפני שהיא ממשיכה לעלות (Propagation), `finally` רץ ומדפיס `3`. אחר כך התוכנית נעצרת עם `KeyError`, ו-`4` לא מודפס."
  optionExplanations:
    "1": "`except ValueError` לא תופס `KeyError`. בלוק `except` רץ רק כשסוג החריגה מתאים."
    "2": "`finally` לא תופס את החריגה. הוא רק רץ בדרך החוצה, והחריגה ממשיכה ועוצרת את התוכנית."
    "3": "`finally` רץ גם כשהחריגה לא נתפסה, ולכן `3` מודפס לפני שהתוכנית נעצרת."

