- id: py.exceptions.try-except.012
  type: bug
  difficulty: 2
  prompt: הפונקציה אמורה להדפיס `finished` בכל מקרה, גם כשהסכום הצליח וגם כשנכשל. איזו שורה צריך לתקן?
  code: |
    def total(items):
        try:
            result = sum(items)
        except TypeError:
            print("bad items")
            result = 0
        else:
            print("finished")
        return result
  answer: 7
  explanation: "`else` רץ רק כשלא הייתה חריגה, ולכן כש-`sum` נכשל `finished` לא מודפס. קוד שחייב לרוץ בכל מקרה שייך לבלוק `finally`."
  fixed: |
    def total(items):
        try:
            result = sum(items)
        except TypeError:
            print("bad items")
            result = 0
        finally:
            print("finished")
        return result

- id: py.exceptions.try-except.013
  type: bug
  difficulty: 3
  prompt: הפונקציה אמורה להחזיר את החריגה האחרונה שנזרקה בהמרת המחרוזות, או `None` אם כל ההמרות הצליחו. איזו שורה צריך לתקן?
  code: |
    def last_error(texts):
        error = None
        for t in texts:
            try:
                int(t)
            except ValueError as e:
                error = e
        return e
  answer: 8
  explanation: "המשתנה שאחרי `as` קיים רק בתוך בלוק ה-`except`. בסוף הבלוק Python מוחקת אותו, ולכן `return e` זורק `UnboundLocalError` בכל מקרה. בדיוק בשביל זה הקוד שומר את החריגה ב-`error`, ויש להחזיר אותו."
  fixed: |
    def last_error(texts):
        error = None
        for t in texts:
            try:
                int(t)
            except ValueError as e:
                error = e
        return error

