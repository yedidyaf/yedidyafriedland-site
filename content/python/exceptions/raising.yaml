- id: py.exceptions.raising.012
  type: bug
  difficulty: 1
  prompt: הפונקציה אמורה לזרוק `ValueError` כשהעוצמה מחוץ לטווח 0 עד 100. איזו שורה צריך לתקן?
  code: |
    def set_volume(percent):
        if percent < 0 or percent > 100:
            ValueError("volume must be 0-100")
        return percent
  answer: 3
  explanation: "השורה יוצרת אובייקט `ValueError` אבל לא זורקת אותו: האובייקט נוצר ומיד נשכח, והפונקציה ממשיכה ומחזירה ערך לא תקין. בלי המילה `raise`, חריגה היא סתם אובייקט."
  fixed: |
    def set_volume(percent):
        if percent < 0 or percent > 100:
            raise ValueError("volume must be 0-100")
        return percent

