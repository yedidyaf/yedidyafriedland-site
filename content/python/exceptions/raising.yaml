- id: py.exceptions.raising.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    def set_age(age):
        if age < 0:
            raise ValueError("negative age")
        print("age set")

    set_age(5)
    set_age(-1)
    print("end")
  options: ["age set\nValueError", "age set\nnegative age\nend", "age set\nend", "ValueError"]
  answer: 0
  explanation: "`raise` זורק חריגה (Exception) ועוצר את הביצוע מיד. אף אחד לא תופס אותה, ולכן התוכנית נעצרת: `print(\"age set\")` בתוך הקריאה השנייה ו-`print(\"end\")` לא רצים."
  optionExplanations:
    "1": "`raise` לא מדפיס את ההודעה וממשיך. החריגה עוצרת את התוכנית כי אין `try` שתופס אותה."
    "2": "אחרי `raise` הפונקציה לא ממשיכה, והחריגה עולה עד לתוכנית הראשית ועוצרת אותה."
    "3": "הקריאה הראשונה, `set_age(5)`, רצה בהצלחה לפני שהחריגה נזרקת ומדפיסה `age set`."

