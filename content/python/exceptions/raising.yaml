  optionExplanations:
    "1": "הדפסת אובייקט חריגה מציגה את ההודעה שלו, לא את שם המחלקה."
    "2": "החריגה נזרקת רק בקריאה השנייה. הקריאה הראשונה כבר הדפיסה `70`."
