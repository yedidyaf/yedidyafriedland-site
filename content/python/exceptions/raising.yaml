- id: py.exceptions.raising.007
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    def read_port(text):
        try:
            return int(text)
        except ValueError as e:
            raise RuntimeError("bad port") from e

    try:
        read_port("abc")
    except RuntimeError as e:
        print(e)
        print(type(e.__cause__).__name__)
  options: ["bad port\nValueError", "bad port\nNoneType", "bad port\nRuntimeError", "ValueError"]
  answer: 0
  explanation: "`raise ... from e` משרשר חריגות (Exception Chaining): החריגה החדשה שומרת את המקורית במאפיין `__cause__`. כך הקוד הקורא מקבל שגיאה ברמה שמתאימה לו, `RuntimeError`, ועדיין אפשר לראות את הסיבה המקורית, `ValueError`."
  optionExplanations:
    "1": "`from e` הוא בדיוק מה שממלא את `__cause__`. בלי `from` היה מודפס `NoneType`."
    "2": "`__cause__` מצביע על החריגה המקורית, לא על החריגה החדשה עצמה."
    "3": "ה-`ValueError` נתפסה בתוך הפונקציה, ומה שיוצא ממנה הוא `RuntimeError` שנתפסת בחוץ."

