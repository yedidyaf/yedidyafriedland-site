- id: py.strings.formatting.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    name = "Dana"
    age = 30
    print(f"{name} is {age}")
    print("{name} is {age}")
  options: ["Dana is 30\n{name} is {age}", "Dana is 30\nDana is 30", "{name} is {age}\n{name} is {age}", "Dana is 30\nNameError"]
  answer: 0
  explanation: "ב-f-string (מחרוזת מעוצבת) האות `f` לפני המירכאות גורמת ל-Python להחליף כל `{...}` בערך של הביטוי שבתוכו. בלי ה-`f` זו מחרוזת רגילה, והסוגריים המסולסלים מודפסים כמו שהם."
  optionExplanations:
    "1": "בלי `f` לפני המירכאות אין החלפה. Python לא מנחשת שהתכוונתם ל-f-string."
    "2": "בשורה הראשונה יש `f`, ולכן המשתנים מוחלפים בערכים שלהם."
    "3": "מחרוזת רגילה לא מחפשת משתנים, ולכן אין סיבה ל-`NameError`. הטקסט פשוט מודפס כמו שהוא."

- id: py.strings.formatting.002
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    pi = 3.14159
    print(f"{pi:.2f}")
  options: ["3.14", "3.1", "3.15", "3.14159"]
  answer: 0
  explanation: "אחרי הנקודתיים בא מפרט העיצוב (Format Specifier). `.2f` פירושו מספר עשרוני עם בדיוק שתי ספרות אחרי הנקודה, עם עיגול. 3.14159 מעוגל ל-3.14, כי הספרה השלישית היא 1."
  optionExplanations:
    "1": "`.2f` הוא שתי ספרות אחרי הנקודה, לא שתי ספרות בסך הכול."
    "2": "העיגול נקבע לפי הספרה השלישית אחרי הנקודה, 1, ולכן מעגלים למטה."
    "3": "מפרט העיצוב משנה את התצוגה. בלעדיו היה מודפס המספר המלא."

- id: py.strings.formatting.003
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    x = 5
    print(f"{x} * 2 = {x * 2}")
  options: ["5 * 2 = 10", "x * 2 = x * 2", "5 * 2 = 5 * 2", "10 = 10"]
  answer: 0
  explanation: "בתוך הסוגריים המסולסלים של f-string אפשר לכתוב כל ביטוי, ו-Python מחשבת אותו. מחוץ לסוגריים הטקסט מודפס כמו שהוא, ולכן `* 2 =` נשאר טקסט רגיל."
  optionExplanations:
    "1": "עם `f` לפני המירכאות, כל מה שבתוך `{}` מחושב."
    "2": "`{x * 2}` הוא ביטוי שלם בתוך הסוגריים, ולכן מחושב ל-10 ולא מוחלף רק `x`."
    "3": "רק התוכן שבתוך `{}` מחושב. הטקסט שמחוץ לסוגריים נשאר כמו שהוא."

- id: py.strings.formatting.004
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    s = "ab"
    print(f"[{s:>5}]")
    print(f"[{s:<5}]")
  options: ["[   ab]\n[ab   ]", "[ab   ]\n[   ab]", "[ab]\n[ab]", "[     ab]\n[ab     ]"]
  answer: 0
  explanation: "המספר אחרי סימן היישור הוא הרוחב הכולל של השדה, כולל הטקסט עצמו. `>` מיישר לימין ומרפד (Padding) ברווחים משמאל, `<` מיישר לשמאל ומרפד מימין. החץ מצביע לכיוון שאליו נדחף הטקסט."
  optionExplanations:
    "1": "`>` דוחף את הטקסט לימין, ולכן הרווחים לפניו."
    "2": "הרוחב 5 גדול מאורך הטקסט, ולכן מתווספים רווחים עד 5 תווים."
    "3": "5 הוא הרוחב הכולל, לא מספר הרווחים. לטקסט באורך 2 מתווספים 3 רווחים."

- id: py.strings.formatting.005
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    n = 7
    print(f"{n:03}")
    print(f"{n:*^5}")
  options: ["007\n**7**", "7.000\n**7**", "007\n*****7", "700\n7****"]
  answer: 0
  explanation: "`03` פירושו רוחב 3 עם ריפוד באפסים משמאל, ולכן `007`. ב-`*^5` התו `*` הוא תו המילוי, `^` מרכז, ו-5 הוא הרוחב הכולל: שתי כוכביות מכל צד של `7`."
  optionExplanations:
    "1": "`03` הוא רוחב, לא מספר ספרות אחרי הנקודה. ספרות אחרי הנקודה נכתבות עם נקודה, כמו `.3f`."
    "2": "`^` מרכז את הטקסט, ו-5 הוא הרוחב הכולל ולא מספר תווי המילוי."
    "3": "מספרים מרופדים באפסים משמאל, כדי לא לשנות את ערכם. `^` מרכז, לא מיישר לשמאל."

- id: py.strings.formatting.006
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    num = 42
    word = "hi"
    print(f"[{num:5}]")
    print(f"[{word:5}]")
  options: ["[   42]\n[hi   ]", "[42   ]\n[hi   ]", "[   42]\n[   hi]", "[42   ]\n[   hi]"]
  answer: 0
  explanation: "כשמציינים רוחב בלי סימן יישור, ברירת המחדל תלויה בטיפוס: מספרים מיושרים לימין, כמו בטבלת מספרים, ומחרוזות מיושרות לשמאל, כמו טקסט רגיל. כדי לקבוע יישור במפורש מוסיפים `<`, `>` או `^`."
  optionExplanations:
    "1": "מספרים מיושרים כברירת מחדל לימין, כדי שספרות האחדות יעמדו זו מתחת לזו."
    "2": "מחרוזות מיושרות כברירת מחדל לשמאל. יישור לימין דורש `>`."
    "3": "זה בדיוק ההפך מברירות המחדל של מספרים ושל מחרוזות."

- id: py.strings.formatting.007
  type: single
  difficulty: 2
  prompt: "`price = 4.5`. איזו שורה מדפיסה `Price: 4.50`?"
  options:
    - "`print(\"Price: {:.2f}\".format(price))`"
    - "`print(\"Price: {}\".format(price, \".2f\"))`"
    - "`print(\"Price: {:2f}\".format(price))`"
    - "`print(\"Price: {.2f}\".format(price))`"
  answer: 0
  explanation: "המתודה `format` מחליפה כל `{}` בארגומנט הבא. מפרט העיצוב נכתב בתוך הסוגריים אחרי נקודתיים, בדיוק כמו ב-f-string: `{:.2f}`."
  optionExplanations:
    "1": "ארגומנט עודף ל-`format` פשוט לא בשימוש. מודפס `Price: 4.5`."
    "2": "בלי נקודה, `2` הוא רוחב השדה ולא מספר הספרות. `f` לבד מציג 6 ספרות: `Price: 4.500000`."
    "3": "בלי נקודתיים, `.2f` מתפרש כגישה לתכונה בשם `2f`, ונזרק `AttributeError`."

- id: py.strings.formatting.008
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    template = "{1} {0} {1}"
    print(template.format("a", "b"))
  options: ["b a b", "a b a", "a b", "IndexError"]
  answer: 0
  explanation: "מספר בתוך `{}` הוא האינדקס של הארגומנט ב-`format`, מתחיל מ-0. `{0}` הוא `\"a\"` ו-`{1}` הוא `\"b\"`. אפשר להשתמש באותו אינדקס כמה פעמים."
  optionExplanations:
    "1": "`a b a` מתקבל אם סופרים את הארגומנטים מ-1. האינדקסים ב-`format` מתחילים מ-0."
    "2": "כל `{}` מוחלף בנפרד, גם כשהאינדקס חוזר, ולכן יש שלושה ערכים בפלט."
    "3": "יש שני ארגומנטים, ולכן האינדקסים 0 ו-1 חוקיים. שימוש חוזר באינדקס מותר."

- id: py.strings.formatting.009
  type: cleaner
  difficulty: 2
  prompt: כל הגרסאות מדפיסות את אותה שורה. איזו גרסה נקייה יותר?
  options:
    - |
      print(f"{name}: {count} x {price:.2f}")
    - |
      print(name + ": " + str(count) + " x " + format(price, ".2f"))
    - |
      print("{}: {} x {:.2f}".format(name, count, price))
  answer: 0
  explanation: "f-string מציגה את המשתנים במקום שבו הם מופיעים בטקסט, כך שרואים מיד איך התוצאה תיראה. אין צורך בהמרות `str` ובשרשור, ואין צורך להתאים סדר של ערכים לסוגריים מסולסלים ריקים."
  optionExplanations:
    "1": "שרשור עם `+` ו-`str` מפזר את הטקסט בין מירכאות רבות, וקל לשכוח רווח או המרה."
    "2": "עם `format` צריך לעקוב אחרי סדר הערכים כדי לדעת מה נכנס לכל `{}`."

- id: py.strings.formatting.010
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    ratio = 0.256
    total = 1234567.891
    print(f"{ratio:.1%}")
    print(f"{total:,.2f}")
  options: ["25.6%\n1,234,567.89", "0.3%\n1,234,567.89", "25.6%\n1234567.89", "0.256%\n1,234,567.891"]
  answer: 0
  explanation: "`%` במפרט העיצוב מכפיל ב-100 ומוסיף סימן אחוז, ו-`.1` קובע ספרה אחת אחרי הנקודה. `,` מוסיף מפריד אלפים, ו-`.2f` מעגל לשתי ספרות אחרי הנקודה."
  optionExplanations:
    "1": "`%` מכפיל ב-100 לפני העיגול, ולכן 0.256 הופך ל-25.6."
    "2": "הפסיק במפרט העיצוב הוא מפריד אלפים, ולכן הוא מופיע בפלט."
    "3": "`%` לא רק מוסיף סימן, הוא מכפיל ב-100. ו-`.2f` מעגל לשתי ספרות."

- id: py.strings.formatting.011
  type: bug
  difficulty: 3
  prompt: "הקוד אמור להדפיס סכום עם שתי ספרות אחרי הנקודה: `Total: 12.50`. איזו שורה צריך לתקן?"
  code: |
    price = 7.25
    shipping = 5.25
    total = price + shipping
    print(f"Total: {total:.2}")
  answer: 4
  explanation: "בלי האות `f` בסוף מפרט העיצוב, `.2` פירושו שתי ספרות משמעותיות בסך הכול, ולא שתי ספרות אחרי הנקודה. לכן 12.5 מוצג כ-`1.2e+01`. `.2f` קובע עיצוב של נקודה קבועה (Fixed-Point) עם שתי ספרות אחרי הנקודה."
  fixed: |
    price = 7.25
    shipping = 5.25
    total = price + shipping
    print(f"Total: {total:.2f}")

