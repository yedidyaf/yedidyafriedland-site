- id: py.strings.formatting.014
  type: single
  difficulty: 1
  prompt: "מה פירוש `.2f` בביטוי `f\"{x:.2f}\"`?"
  options:
    - "הצגת `x` עם שתי ספרות בדיוק אחרי הנקודה העשרונית"
    - "הצגת `x` עם שתי ספרות בסך הכול"
    - "הצגת `x` בשדה ברוחב שני תווים"
    - "חיתוך `x` לשתי ספרות אחרי הנקודה, בלי עיגול"
  answer: 0
  explanation: "הנקודה מציינת דיוק (Precision), `2` הוא מספר הספרות אחרי הנקודה, ו-`f` הוא עיצוב של נקודה קבועה. הערך מעוגל, ואם חסרות ספרות מתווספים אפסים: `7` מוצג כ-`7.00`."
  optionExplanations:
    "1": "שתי ספרות בסך הכול הוא `.2` בלי `f`. ה-`f` קובע שהספירה היא אחרי הנקודה."
    "2": "רוחב השדה נכתב לפני הנקודה, למשל `5.2f`. המספר שאחרי הנקודה הוא הדיוק."
    "3": "העיצוב מעגל, לא חותך: `2.678` מוצג כ-`2.68`."

- id: py.strings.formatting.015
  type: truefalse
  difficulty: 2
  prompt: "אם `x` הוא `float`, אז `f\"{x:.2f}\"` הוא ערך מסוג `float` מעוגל לשתי ספרות."
  answer: false
  explanation: "f-string תמיד יוצרת מחרוזת (`str`). העיצוב קובע רק איך המספר ייראה כטקסט, ולא משנה את `x`. כדי לקבל מספר מעוגל משתמשים ב-`round(x, 2)`."

- id: py.strings.formatting.016
  type: truefalse
  difficulty: 2
  prompt: "בתוך הסוגריים המסולסלים של f-string אפשר לכתוב חישובים וקריאות לפונקציות, למשל `f\"{len(name) * 2}\"`."
  answer: true
  explanation: "הסוגריים המסולסלים ב-f-string מכילים ביטוי (Expression) של Python, לא רק שם של משתנה. Python מחשבת את הביטוי וממירה את התוצאה למחרוזת. עם זאת, כדאי לשמור את הביטויים קצרים, וחישוב מסובך עדיף לשמור קודם במשתנה."

- id: py.strings.formatting.017
  type: order
  difficulty: 1
  tags: [algorithm]
  prompt: "סדרו את השורות כך שהתוכנית תדפיס את שלוש השורות הראשונות של לוח הכפל של 7."
  code: |
    n = 7
    for i in range(1, 4):
        result = n * i
        print(f"{n} x {i} = {result}")
  output: "7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21"
  explanation: "בכל סיבוב מחשבים את התוצאה ורק אז מדפיסים אותה עם f-string, שמשבץ ערכים בתוך `{}`. אם ההדפסה באה לפני החישוב, `result` עדיין לא מוגדר בסיבוב הראשון ותיזרק `NameError`."
