- id: py.basics.data-types.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    print(type(3.0))
  options: ["<class 'float'>", "<class 'int'>", "float", "3.0"]
  answer: 0
  explanation: "כל מספר עם נקודה עשרונית הוא `float`, גם אם החלק העשרוני הוא אפס. `type` מחזירה את המחלקה עצמה, ו-`print` מציגה אותה בצורה `<class 'float'>`."
  optionExplanations:
    "1": "הערך `3.0` שווה מתמטית ל-`3`, אבל הנקודה העשרונית הופכת אותו ל-`float`."
    "2": "`type` מחזירה אובייקט של מחלקה, ו-`print` מציגה אותו כ-`<class 'float'>` ולא רק כשם."

- id: py.basics.data-types.002
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    a = "7"
    b = 7
    print(a == b)
  options: ["False", "True", "TypeError", "7"]
  answer: 0
  explanation: "`\"7\"` היא מחרוזת (`str`) ו-`7` הוא מספר שלם (`int`). ערכים מטיפוסים שונים כאלה לעולם אינם שווים זה לזה, ופייתון לא ממירה ביניהם אוטומטית."
  optionExplanations:
    "1": "פייתון לא ממירה מחרוזת למספר בהשוואה, בניגוד לשפות כמו JavaScript."
    "2": "השוואה עם `==` בין טיפוסים שונים חוקית ומחזירה `False`. רק השוואות סדר כמו `<` ביניהם זורקות `TypeError`."

- id: py.basics.data-types.003
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    x = 3
    y = 3.0
    print(x == y, type(x) == type(y))
  options: ["True False", "False False", "True True", "False True"]
  answer: 0
  explanation: "`==` משווה ערכים, ו-`3` שווה מספרית ל-`3.0`. הטיפוסים עצמם שונים: `int` מול `float`. ערך שווה לא אומר טיפוס זהה."
  optionExplanations:
    "1": "בין מספרים פייתון משווה ערך מספרי, ולכן `3 == 3.0` מחזיר `True`."
    "2": "`type(3)` הוא `int` ו-`type(3.0)` הוא `float`, ולכן הם שונים."

- id: py.basics.data-types.004
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    x = True
    print(isinstance(x, int), type(x) == int)
  options: ["True False", "False False", "True True", "False True"]
  answer: 0
  explanation: "`bool` הוא תת-טיפוס (Subclass) של `int`. `isinstance` מחזירה `True` גם עבור תת-טיפוסים, ואילו `type(x) == int` בודקת התאמה מדויקת, ו-`type(True)` הוא `bool`. לכן בדרך כלל עדיף `isinstance`."
  optionExplanations:
    "1": "`isinstance` מכירה בירושה, ו-`bool` יורש מ-`int`."
    "2": "`type` מחזירה את הטיפוס המדויק, `bool`, ולא את טיפוס הבסיס."

- id: py.basics.data-types.005
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    print(0.1 + 0.2 == 0.3)
  options: ["False", "True", "0.3", "TypeError"]
  answer: 0
  explanation: "מספרי `float` נשמרים בבסיס 2, ולא כל שבר עשרוני ניתן לייצוג מדויק. `0.1 + 0.2` יוצא `0.30000000000000004`, ולכן ההשוואה נכשלת. משווים מספרי `float` עם סבולת, למשל `math.isclose`."
  optionExplanations:
    "1": "מתמטית זה נכון, אבל במחשב `0.1` ו-`0.2` אינם מיוצגים במדויק."
    "2": "`==` מחזיר ערך בוליאני, לא את תוצאת החיבור."

- id: py.basics.data-types.006
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    x = None
    print(x)
    print(type(x))
  options: ["None\n<class 'NoneType'>", "\n<class 'NoneType'>", "None\n<class 'None'>", "0\n<class 'NoneType'>"]
  answer: 0
  explanation: "`None` מייצג \"אין ערך\". הוא מודפס כ-`None`, והטיפוס שלו הוא `NoneType`. `None` אינו `0` ואינו מחרוזת ריקה, אלא ערך נפרד."
  optionExplanations:
    "1": "`print(None)` מדפיסה את המילה `None` ולא שורה ריקה."
    "2": "`None` הוא הערך היחיד מהטיפוס `NoneType`. אין טיפוס בשם `None`."
    "3": "`None` אינו מספר, ולכן לא מודפס `0`."

- id: py.basics.data-types.007
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    a = 2 + 3.0
    b = "5"
    c = True + 1
    print(type(a), type(b), type(c))
  options:
    - "<class 'float'> <class 'str'> <class 'int'>"
    - "<class 'int'> <class 'int'> <class 'bool'>"
    - "<class 'float'> <class 'int'> <class 'int'>"
    - "<class 'int'> <class 'str'> <class 'bool'>"
  answer: 0
  explanation: "חיבור של `int` עם `float` נותן `float`, גם כשהתוצאה עגולה. `\"5\"` במירכאות הוא מחרוזת, לא מספר. `True` מתנהג בחישוב כמו `1`, והתוצאה של `True + 1` היא `int` רגיל."
  optionExplanations:
    "1": "`3.0` הוא `float`, ולכן גם התוצאה `5.0`. ו-`\"5\"` במירכאות הוא מחרוזת."
    "2": "המירכאות הופכות את `\"5\"` למחרוזת, גם אם בתוכה יש ספרה."
    "3": "חיבור עם `float` נותן `float`, וחיבור של `bool` עם מספר נותן `int`, לא `bool`."

- id: py.basics.data-types.008
  type: single
  difficulty: 1
  prompt: "איזה מהערכים הבאים הוא מהטיפוס `bool`?"
  options: ["`False`", "`\"False\"`", "`0`", "`None`"]
  answer: 0
  explanation: "לטיפוס `bool` יש בדיוק שני ערכים: `True` ו-`False`, באות גדולה וללא מרכאות."
  optionExplanations:
    "1": "המרכאות הופכות את הערך למחרוזת (`str`) שבמקרה מכילה את המילה False."
    "2": "`0` הוא `int`. הוא אמנם נחשב שקרי בתנאי, אבל הטיפוס שלו אינו `bool`."
    "3": "`None` הוא מהטיפוס `NoneType`, לא `bool`."

- id: py.basics.data-types.009
  type: single
  difficulty: 1
  prompt: איזה מהערכים הבאים הוא מהטיפוס `float`?
  options: ["`3`", "`\"3.0\"`", "`3.0`", "`True`"]
  answer: 2
  explanation: "מספר עם נקודה עשרונית הוא `float` (מספר ממשי), גם כשהחלק העשרוני הוא 0. בלי נקודה המספר הוא `int`, ועם מירכאות הוא מחרוזת."
  optionExplanations:
    "0": "`3` בלי נקודה עשרונית הוא `int`."
    "1": "המירכאות הופכות את הערך למחרוזת (`str`), גם אם בתוכה כתוב מספר."
    "3": "`True` הוא ערך בוליאני (`bool`)."

- id: py.basics.data-types.010
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    result = None
    print(type(result))
  options: ["<class 'NoneType'>", "<class 'None'>", "None", "<class 'null'>"]
  answer: 0
  explanation: "`None` מייצג «אין ערך», והוא הערך היחיד מהטיפוס `NoneType`. `type` מחזירה את הטיפוס, ולא את הערך עצמו, ולכן מודפס `<class 'NoneType'>`."
  optionExplanations:
    "1": "השם של הטיפוס הוא `NoneType`, ולא `None`."
    "2": "זה היה מודפס עבור `print(result)`. כאן מודפס הטיפוס של הערך."
    "3": "בפייתון אין `null`; הערך «אין ערך» נקרא `None`."

- id: py.basics.data-types.011
  type: truefalse
  difficulty: 2
  prompt: "`isinstance(5, float)` מחזיר `True`, כי כל מספר שלם הוא גם מספר ממשי."
  answer: false
  explanation: "מתמטית זה נכון, אבל בפייתון `int` ו-`float` הם שני טיפוסים נפרדים, ו-`int` אינו תת-טיפוס של `float`. לכן `isinstance(5, float)` מחזיר `False`, ו-`isinstance(5, int)` מחזיר `True`."

- id: py.basics.data-types.012
  type: truefalse
  difficulty: 2
  prompt: "הביטוי `True + True` שווה ל-`2`."
  answer: true
  explanation: "`bool` הוא תת-טיפוס של `int`: `True` מתנהג כמו `1` ו-`False` כמו `0` בחישובים. לכן `True + True` הוא `2`, והתוצאה מהטיפוס `int`."

- id: py.basics.data-types.013
  type: single
  difficulty: 2
  prompt: "מה הדרך המקובלת לבדוק אם המשתנה `x` מכיל `None`?"
  options: ["`x is None`", "`x == \"None\"`", "`not x`", "`type(x) == \"NoneType\"`"]
  answer: 0
  explanation: "יש בפייתון אובייקט `None` אחד בלבד, ולכן בודקים זהות עם `is`. זו המוסכמה שממליץ עליה PEP 8."
  optionExplanations:
    "1": "זו השוואה למחרוזת שמכילה את המילה None, ולא לערך `None`."
    "2": "`not x` יחזיר `True` גם עבור `0`, `\"\"` ורשימה ריקה, ולכן הוא לא מבדיל בין `None` לבין ערכים שקריים אחרים."
    "3": "`type` מחזירה מחלקה ולא מחרוזת, ולכן ההשוואה למחרוזת תמיד `False`."

- id: py.basics.data-types.014
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס `True`, כי הקלט נשמר כמחרוזת. איזו שורה צריך לתקן?"
  code: |
    user_input = "42"
    is_text = isinstance(user_input, int)
    print(is_text)
  answer: 2
  explanation: "`\"42\"` במירכאות הוא מחרוזת (`str`), גם אם בתוכה יש ספרות. הבדיקה בשורה 2 שואלת אם זה `int`, ולכן מודפס `False`. צריך לבדוק `isinstance(user_input, str)`."
  fixed: |
    user_input = "42"
    is_text = isinstance(user_input, str)
    print(is_text)

- id: py.basics.data-types.015
  type: bug
  difficulty: 2
  prompt: "הקוד אמור להדפיס `<class 'bool'>`. איזו שורה צריך לתקן?"
  code: |
    is_ready = "True"
    print(type(is_ready))
  answer: 1
  explanation: "`\"True\"` במירכאות הוא מחרוזת של ארבע אותיות, ולא הערך הבוליאני. לכן מודפס `<class 'str'>`. הערכים הבוליאניים נכתבים בלי מירכאות: `True` ו-`False`."
  fixed: |
    is_ready = True
    print(type(is_ready))

- id: py.basics.data-types.016
  type: single
  difficulty: 2
  prompt: "`x = 5`. איזה ביטוי מחזיר `True`?"
  options:
    - "`isinstance(x, float)`"
    - "`type(x) == float`"
    - "`isinstance(x, int)`"
    - "`type(x) == \"int\"`"
  answer: 2
  explanation: "`5` בלי נקודה עשרונית הוא `int`. `isinstance(x, int)` בודקת אם הערך הוא מהטיפוס `int`, ולכן מחזירה `True`."
  optionExplanations:
    "0": "`int` ו-`float` הם טיפוסים נפרדים; `5` הוא `int`, ו-`5.0` היה `float`."
    "1": "`type(5)` הוא `int`, ולכן ההשוואה ל-`float` מחזירה `False`."
    "3": "`type` מחזירה טיפוס, לא מחרוזת. טיפוס לעולם לא שווה למחרוזת `\"int\"`."
