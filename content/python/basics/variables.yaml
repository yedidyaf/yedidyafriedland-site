- id: py.basics.variables.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    x = 5
    y = x
    x = 10
    print(x, y)
  options: ["10 5", "10 10", "5 5", "5 10"]
  answer: 0
  explanation: "השמה (Assignment) קושרת שם לאובייקט. `y = x` גורמת ל-`y` להצביע על אותו `5`, ו-`x = 10` רק מפנה את `x` לאובייקט אחר. `y` לא \"עוקב\" אחרי `x`, ולכן הוא נשאר `5`."
  optionExplanations:
    "1": "`y = x` לא יוצרת קשר קבוע בין המשתנים. היא מעתיקה את ההפניה ברגע ההשמה בלבד."
    "2": "`x = 10` מתבצעת לפני ההדפסה, ולכן `x` כבר מצביע על `10`."

- id: py.basics.variables.002
  type: single
  difficulty: 1
  prompt: איזה מהשמות הבאים הוא שם משתנה חוקי בפייתון?
  options: ["`total_2`", "`2total`", "`total-2`", "`total 2`"]
  answer: 0
  explanation: "שם משתנה (Identifier) מורכב מאותיות, ספרות וקו תחתון, ואסור שיתחיל בספרה. `total_2` עומד בכל הכללים."
  optionExplanations:
    "1": "שם משתנה לא יכול להתחיל בספרה."
    "2": "המקף מתפרש כאופרטור חיסור, ולכן `total-2` הוא ביטוי ולא שם."
    "3": "רווח מפריד בין שני שמות, ולכן אי אפשר להשתמש בו בתוך שם משתנה."

- id: py.basics.variables.003
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    a = 1
    b = 2
    a, b = b, a
    print(a, b)
  options: ["2 1", "1 2", "2 2", "1 1"]
  answer: 0
  explanation: "בהשמה מרובה (Multiple Assignment) פייתון מחשבת קודם את כל הצד הימני, `(2, 1)`, ורק אחר כך משייכת את הערכים לשמות שבצד שמאל. כך מחליפים ערכים בין שני משתנים בשורה אחת, בלי משתנה עזר."
  optionExplanations:
    "2": "זו התוצאה של `a = b` ואחריו `b = a` בשתי שורות נפרדות. בהשמה מרובה הצד הימני מחושב במלואו לפני ההשמה."

- id: py.basics.variables.004
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    a = 1
    b = 2
    a = b
    b = a
    print(a, b)
  options: ["2 2", "2 1", "1 1", "1 2"]
  answer: 0
  explanation: "השורות רצות לפי הסדר. אחרי `a = b` הערך `1` כבר אבד, ו-`b = a` מעתיקה ל-`b` את הערך `2` שנמצא עכשיו ב-`a`. כדי להחליף ערכים צריך `a, b = b, a` או משתנה עזר."
  optionExplanations:
    "1": "זו החלפה אמיתית, אבל שתי השמות נפרדות לא מבצעות החלפה: הערך המקורי של `a` נדרס בשורה 3."
    "2": "`a = b` משנה את `a` ולא את `b`, ולכן הערך `1` לא מועתק לשום מקום."

- id: py.basics.variables.005
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    a = [1, 2, 3]
    b = a
    b.append(4)
    print(a)
  options: ["[1, 2, 3, 4]", "[1, 2, 3]", "[4]", "None"]
  answer: 0
  explanation: "`b = a` לא מעתיקה את הרשימה. שני השמות מצביעים על אותו אובייקט (Reference), ולכן שינוי דרך `b` נראה גם דרך `a`."
  optionExplanations:
    "1": "זה היה נכון אילו `b = a` הייתה יוצרת עותק. בפועל יש רק רשימה אחת עם שני שמות."

- id: py.basics.variables.006
  type: single
  difficulty: 1
  prompt: מה נכון לגבי הקוד הבא?
  code: |
    x = 7
    x = "seven"
  options:
    - "`x` מצביע עכשיו על המחרוזת `\"seven\"`, וזה חוקי לגמרי"
    - "השורה השנייה זורקת `TypeError`, כי `x` כבר הוגדר כ-`int`"
    - "`x` מחזיק עכשיו שני ערכים: `7` וגם `\"seven\"`"
    - "השורה השנייה זורקת `NameError`, כי אי אפשר להגדיר את `x` פעמיים"
  answer: 0
  explanation: "פייתון היא שפה עם טיפוסיות דינמית (Dynamic Typing): למשתנה אין טיפוס קבוע, רק לאובייקט שהוא מצביע עליו. השמה חדשה פשוט מפנה את השם לאובייקט אחר, מכל טיפוס."
  optionExplanations:
    "1": "בשפות כמו C# או Java זה היה נכון. בפייתון הטיפוס שייך לערך, לא למשתנה."
    "2": "משתנה מצביע בכל רגע על אובייקט אחד בלבד. ההשמה החדשה מחליפה את ההפניה הקודמת."
    "3": "`NameError` נזרקת כשמשתמשים בשם שלא הוגדר. השמה חוזרת לאותו שם מותרת תמיד."

- id: py.basics.variables.007
  type: truefalse
  difficulty: 1
  prompt: "בפייתון `count` ו-`Count` הם שני משתנים שונים."
  answer: true
  explanation: "פייתון מבחינה בין אותיות גדולות לקטנות (Case Sensitive). `count` ו-`Count` הם שני שמות נפרדים, ושימוש באחד מהם לפני שהוגדר יזרוק `NameError`."

- id: py.basics.variables.008
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    x = y = 0
    x += 1
    print(x, y)
  options: ["1 0", "1 1", "0 0", "0 1"]
  answer: 0
  explanation: "השמה בשרשרת (Chained Assignment) מפנה את שני השמות לאותו `0`. מספרים אינם ניתנים לשינוי (Immutable), ולכן `x += 1` יוצרת אובייקט חדש `1` ומפנה אליו רק את `x`."
  optionExplanations:
    "1": "שני השמות אכן מצביעים בהתחלה על אותו אובייקט, אבל `x += 1` לא משנה את ה-`0`. היא מפנה את `x` לאובייקט חדש."

- id: py.basics.variables.009
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    a, b = 1, 2, 3
    print(a, b)
  options: ["ValueError", "1 2", "1 (2, 3)", "TypeError"]
  answer: 0
  explanation: "בפירוק (Unpacking) מספר השמות בצד שמאל חייב להיות שווה למספר הערכים בצד ימין. כאן יש שני שמות ושלושה ערכים, ולכן נזרקת `ValueError` (too many values to unpack) עוד לפני ההדפסה."
  optionExplanations:
    "1": "פייתון לא מתעלמת מערכים עודפים. אי התאמה במספר הערכים היא שגיאה."
    "2": "הערכים העודפים לא נאספים אוטומטית למשתנה האחרון."
    "3": "הטיפוסים תקינים. הבעיה היא במספר הערכים, ולכן השגיאה היא `ValueError`."

- id: py.basics.variables.010
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    a, b = 1, 2
    a, b = a + b, a
    print(a, b)
  options: ["3 1", "3 3", "3 2", "2 1"]
  answer: 0
  explanation: "הצד הימני מחושב במלואו לפני ההשמה, עם הערכים הישנים: `a + b` הוא `3` ו-`a` הוא `1`. רק אז `a` מקבל `3` ו-`b` מקבל `1`."
  optionExplanations:
    "1": "זו התוצאה אילו `b` היה מקבל את הערך החדש של `a`. בהשמה מרובה כל הצד הימני מחושב קודם."
    "2": "`b` מקבל את הערך הקודם של `a`, שהוא `1`, ולא נשאר `2`."

