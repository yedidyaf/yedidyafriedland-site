- id: py.clean-code.naming.016
  type: single
  difficulty: 3
  prompt: "פונקציה מחזירה `True` או `False` לפי תקינות של כתובת מייל, ואינה זורקת חריגות. איזה שם מתאר אותה הכי טוב?"
