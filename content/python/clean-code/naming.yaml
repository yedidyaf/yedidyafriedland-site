- id: py.clean-code.naming.008
  type: bug
  difficulty: 2
  prompt: "הפונקציה מקבלת רשימת מחירים ושיעור הנחה (למשל `0.1` עבור 10%), ואמורה להחזיר את הסכום אחרי ההנחה. באיזו שורה הבאג?"
  code: |
    def final_price(prices, discount):
        total = 0
        for price in prices:
            total += price
        discount_amount = total * discount
        return total - discount
  answer: 6
  explanation: "בשורה 6 מחסירים את שיעור ההנחה (`0.1`) במקום את סכום ההנחה, `discount_amount`. הבאג נולד מהשם: `discount` יכול להתפרש גם כשיעור וגם כסכום. שם מדויק כמו `discount_rate` היה מונע את הבלבול."
  fixed: |
    def final_price(prices, discount):
        total = 0
        for price in prices:
            total += price
        discount_amount = total * discount
        return total - discount_amount

- id: py.clean-code.naming.009
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    list = [3, 1, 2]
    print(sorted(list))
    letters = list("abc")
    print(letters)
  options:
    - "[1, 2, 3]\n['a', 'b', 'c']"
    - "[1, 2, 3]\nTypeError"
    - "TypeError"
    - "[3, 1, 2]\nTypeError"
  answer: 1
  explanation: "השם `list` דורס את הפונקציה המובנית (Built-in) `list`. השורה השנייה עובדת, אבל בשורה השלישית `list` הוא כבר רשימה, וקריאה לרשימה כמו לפונקציה זורקת `TypeError`. אל תתנו למשתנים שמות כמו `list`, `str`, `sum` או `id`. שם שמתאר את התוכן, כמו `scores`, גם ברור יותר."
  optionExplanations:
    "0": "אחרי `list = [3, 1, 2]` השם `list` כבר לא מצביע על הפונקציה המובנית."
    "2": "השגיאה קורית רק בשורה 3. השורה 2 כבר הדפיסה את הרשימה הממוינת."
    "3": "`sorted` מחזירה רשימה חדשה וממוינת, ולכן מודפס `[1, 2, 3]`."

- id: py.clean-code.naming.010
  type: bug
  difficulty: 2
  prompt: "הפונקציה מקבלת זמן התחלה במילישניות (Milliseconds) ואמורה להחזיר את מועד הסיום במילישניות, אחרי פרק הזמן הקצוב. באיזו שורה הבאג?"
  code: |
    TIMEOUT_SECONDS = 30


    def deadline_ms(start_ms):
        return start_ms + TIMEOUT_SECONDS
  answer: 5
  explanation: "בשורה 5 מחברים שניות למילישניות, וצריך `TIMEOUT_SECONDS * 1000`. כאן השמות עשו את העבודה: הסיומות `_ms` ו-`_SECONDS` חושפות שהיחידות לא מתאימות. אילו הקבוע היה נקרא רק `TIMEOUT`, הבאג היה נסתר. כשלערך יש יחידות, כדאי לכלול אותן בשם."
  fixed: |
    TIMEOUT_SECONDS = 30


    def deadline_ms(start_ms):
        return start_ms + TIMEOUT_SECONDS * 1000

