- id: py.clean-code.naming.005
  type: cleaner
  difficulty: 1
  prompt: "איזו לולאה על המילון `grades` (שם תלמיד ← ציון) נקייה יותר?"
  options:
    - |
      grades = {"Dana": 92, "Omer": 85}
      for k, v in grades.items():
          print(f"{k}: {v}")
    - |
      grades = {"Dana": 92, "Omer": 85}
      for student, grade in grades.items():
          print(f"{student}: {grade}")
    - |
      grades = {"Dana": 92, "Omer": 85}
      for item in grades.items():
          print(f"{item[0]}: {item[1]}")
  answer: 1
  explanation: "פירוק הזוג לשני שמות בעלי משמעות, `student` ו-`grade`, מספר לקורא מה יש במילון בלי לחפש את ההגדרה שלו."
  optionExplanations:
    "0": "`k` ו-`v` הם שמות טכניים (מפתח וערך) שלא אומרים מה המפתח ומה הערך."
    "2": "`item[0]` ו-`item[1]` מחייבים לזכור מה נמצא בכל אינדקס."

- id: py.clean-code.naming.006
  type: single
  difficulty: 2
  prompt: בקובץ אחד יש שלוש פונקציות, וכולן קוראות רשומה אחת ממסד הנתונים. מה הבעיה בשמות?
  code: |
    def fetch_customer(customer_id): ...
    def get_order(order_id): ...
    def retrieve_product(product_id): ...
  options:
    - "השמות ארוכים מדי. עדיף `cust`, `ord` ו-`prod`"
    - "חסר בשמות הטיפוס המוחזר, למשל `get_order_dict`"
    - "שם של פונקציה צריך להיות שם עצם, למשל `customer(customer_id)`"
    - "שלוש מילים שונות לאותה פעולה, והקורא יחפש הבדל שאין. עדיף מילה אחת, למשל `get_`, בכל הפונקציות"
  answer: 3
  explanation: "עקביות בשמות: מילה אחת לכל מושג. כש-`fetch`, `get` ו-`retrieve` מופיעים יחד, הקורא מניח שיש ביניהם הבדל (אולי אחת ניגשת לרשת?) ומבזבז זמן לבדוק. אותה פעולה מקבלת תמיד אותו פועל."
  optionExplanations:
    "0": "קיצורים הופכים את השמות לפחות ברורים, ולא פותרים את חוסר העקביות."
    "1": "קידוד הטיפוס בשם מוסיף רעש, והוא הופך לשקר כשהטיפוס משתנה."
    "2": "פונקציה מבצעת פעולה, ולכן מקובל ששמה יתחיל בפועל."

