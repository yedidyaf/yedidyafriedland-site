- id: py.clean-code.naming.001
  type: smell
  difficulty: 1
  prompt: איזה ריח קוד בולט כאן?
  code: |
    def calc(d):
        t = 0
        for x in d:
            t += x
        return t / len(d)
  options:
    - "מספר קסם - Magic Number"
    - "קינון עמוק - Deep Nesting"
    - "שם לא ברור - Unclear Name"
    - "מתודה ארוכה - Long Method"
  answer: 2
  explanation: "אי אפשר לדעת מה `calc`, `d` ו-`t` מייצגים בלי לקרוא את כל הגוף. שמות שמסבירים כוונה (Intention-Revealing Names), כמו `average(numbers)` ו-`total`, הופכים את הקוד לקריא מיד. אין כאן מספר קסם, קינון עמוק או פונקציה ארוכה: הבעיה היא השמות."
  optionExplanations:
    "0": "אין בקוד מספר בלי שם. ה-`0` הוא ערך התחלתי טבעי של סכום."
    "1": "יש רק לולאה אחת, בלי תנאים מקוננים."
    "3": "הפונקציה בת ארבע שורות. היא קצרה, רק השמות שלה לא אומרים כלום."

- id: py.clean-code.naming.002
  type: single
  difficulty: 1
  prompt: "הפונקציה `upd_usr_addr(usr, addr)` מעדכנת את הכתובת של משתמש. איזה שם עדיף?"
  options:
    - "`updateUserAddress(user, address)`"
    - "`update_user_address(user, address)`"
    - "`update(u, a)`"
    - "`upd_usr_addr(usr, addr)`, כי הוא קצר יותר"
  answer: 1
  explanation: "קיצורים כמו `upd` ו-`usr` מאלצים את הקורא לפענח. מילים מלאות עולות כמה תווים ונקראות מיד. בפייתון שמות של פונקציות ופרמטרים נכתבים ב-snake_case."
  optionExplanations:
    "0": "camelCase אינו המוסכמה לשמות פונקציות בפייתון. לפי PEP 8 כותבים snake_case."
    "2": "`update` כללי מדי, ו-`u` ו-`a` לא אומרים כלום על מה שמעדכנים."
    "3": "קיצור חוסך הקלדה פעם אחת, אבל כל קורא משלם עליו בפענוח."

- id: py.clean-code.naming.003
  type: cleaner
  difficulty: 1
  prompt: איזו שורה מגדירה בצורה הנקייה ביותר את מספר השניות ביממה כקבוע של המודול?
  options:
    - "spd = 24 * 60 * 60"
    - "x = 86400"
    - "SECONDS_PER_DAY = 24 * 60 * 60"
  answer: 2
  explanation: "השם אומר בדיוק מה הערך, והביטוי `24 * 60 * 60` מראה מאיפה הוא בא. אותיות גדולות מסמנות קבוע (Constant) לפי PEP 8."
  optionExplanations:
    "0": "`spd` הוא קיצור שצריך לנחש את פירושו, ואותיות קטנות לא מסמנות שזה קבוע."
    "1": "`x` לא אומר כלום, ו-`86400` הוא מספר קסם שצריך לחשב כדי להבין מה הוא."

- id: py.clean-code.naming.004
