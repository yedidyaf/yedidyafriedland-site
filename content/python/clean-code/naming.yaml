  explanation: "הקשר מיותר (Redundant Context): שם המחלקה כבר אומר שמדובר בלקוח, ולכן הקידומת רק חוזרת עליו. `customer.customer_name` אומר את אותה מילה פעמיים, ו-`customer.name` אומר את אותו דבר בקצרה."
  optionExplanations:
