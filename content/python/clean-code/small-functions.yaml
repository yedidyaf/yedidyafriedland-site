- id: py.clean-code.small-functions.012
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    def sorted_names(names):
        names.sort()
        return names


    team = ["Noa", "Avi", "Lior"]
    ordered = sorted_names(team)
    print(team[0])
  options: ["Noa", "Avi", "Lior", "['Avi', 'Lior', 'Noa']"]
  answer: 1
  explanation: "`names` ו-`team` מצביעים על אותה רשימה, ו-`sort` ממיינת אותה במקום. לכן גם `team` ממוינת, והאיבר הראשון שלה הוא `Avi`. זו תופעת לוואי נסתרת (Hidden Side Effect): השם מבטיח להחזיר רשימה ממוינת, לא לשנות את הרשימה של מי שקרא. `return sorted(names)` מחזירה רשימה חדשה ומשאירה את המקור כמו שהוא."
  optionExplanations:
    "0": "זו הייתה התשובה אם הפונקציה הייתה יוצרת רשימה חדשה. `sort` משנה את הרשימה המקורית."
    "2": "`Lior` הוא האיבר האחרון אחרי המיון, לא הראשון."
    "3": "מודפס `team[0]`, איבר אחד, ולא הרשימה כולה."

- id: py.clean-code.small-functions.013
  type: bug
  difficulty: 2
  prompt: "הפונקציה אמורה להוסיף תגית לרשימה שהתקבלה. אם לא התקבלה רשימה, היא אמורה להחזיר בכל קריאה רשימה חדשה שמכילה רק את התגית. באיזו שורה הבאג?"
  code: |
    def add_tag(tag, tags=[]):
        if tags is None:
            tags = []
        tags.append(tag)
        return tags
  answer: 1
  explanation: "ערך ברירת המחדל `[]` נוצר פעם אחת, כשהפונקציה מוגדרת, ומשותף לכל הקריאות. לכן קריאה שנייה בלי רשימה תחזיר את התגית הקודמת וגם את החדשה, ותנאי ה-`None` לא מתקיים כשלא מעבירים רשימה. זו תופעת לוואי מפתיעה בין קריאות. ברירת מחדל `None` מפעילה את התנאי שכבר כתוב ויוצרת רשימה חדשה בכל קריאה."
  fixed: |
    def add_tag(tag, tags=None):
        if tags is None:
            tags = []
        tags.append(tag)
        return tags

- id: py.clean-code.small-functions.014
  type: bug
  difficulty: 3
  prompt: "הפונקציה אמורה להחזיר רשימה חדשה של מחירים אחרי הנחה, בלי לשנות את הרשימה המקורית. באיזו שורה הבאג?"
  code: |
    def discounted(prices, rate):
        result = prices
        for i in range(len(result)):
            result[i] = result[i] * (1 - rate)
        return result
  answer: 2
  explanation: "השמה לא מעתיקה רשימה: `result` ו-`prices` הם שני שמות לאותה רשימה, ולכן הלולאה משנה את המקור. זו תופעת לוואי (Side Effect) שהקורא לא מצפה לה. התיקון הוא `prices.copy()`, וגרסה נקייה עוד יותר היא `return [p * (1 - rate) for p in prices]`."
  fixed: |
    def discounted(prices, rate):
        result = prices.copy()
        for i in range(len(result)):
            result[i] = result[i] * (1 - rate)
        return result

