- id: py.clean-code.small-functions.001
  type: smell
  difficulty: 1
  prompt: איזה ריח קוד בולט כאן?
  code: |
    def create_user(first_name, last_name, email, phone,
                    street, city, zip_code, country, birth_date):
        ...
  options:
    - "רשימת פרמטרים ארוכה - Long Parameter List"
    - "מתודה ארוכה - Long Method"
    - "מחלקת אל - God Class"
    - "דגל בוליאני - Flag Argument"
  answer: 0
  explanation: "תשעה פרמטרים קשה לזכור, ובקריאה לפונקציה קל להחליף את הסדר שלהם בלי לשים לב. פרמטרים שהולכים תמיד יחד, כמו `street`, `city`, `zip_code` ו-`country`, מבקשים להפוך לאובייקט אחד, למשל `Address`."
  optionExplanations:
    "1": "גוף הפונקציה לא מוצג כלל. הבעיה נראית כבר בחתימה."
    "2": "זו פונקציה אחת, לא מחלקה שמרכזת אחריויות רבות."
    "3": "אין כאן פרמטר בוליאני שמחליף את ההתנהגות של הפונקציה."

- id: py.clean-code.small-functions.002
  type: smell
  difficulty: 1
  prompt: איזה ריח קוד בולט כאן?
  code: |
    def get_total(cart):
        total = sum(item.price for item in cart.items)
        cart.items.clear()
        return total
  options:
    - "מתודה ארוכה - Long Method"
    - "תופעת לוואי נסתרת - Hidden Side Effect"
    - "מספר קסם - Magic Number"
    - "קוד מת - Dead Code"
  answer: 1
  explanation: "השם `get_total` מבטיח רק לחשב סכום, אבל הפונקציה גם מרוקנת את העגלה. מי שיקרא לה פעמיים יקבל `0` בפעם השנייה. אם צריך גם לרוקן את העגלה, זו פעולה נפרדת עם שם משלה, למשל `clear_cart`."
  optionExplanations:
    "0": "הפונקציה בת שלוש שורות. הבעיה היא במה שהיא עושה, לא באורך."
    "2": "אין בקוד מספר בלי שם."
    "3": "כל השורות רצות ומשפיעות על התוצאה, ולכן אין כאן קוד מת."

- id: py.clean-code.small-functions.003
  type: smell
  difficulty: 2
  prompt: איזה ריח קוד בולט כאן?
  code: |
    def format_price(amount, for_report):
        if for_report:
            return f"{amount:,.2f} ILS"
        return f"{amount:.0f} ILS"


    print(format_price(1250.5, True))
  options:
    - "קינון עמוק - Deep Nesting"
    - "רשימת פרמטרים ארוכה - Long Parameter List"
    - "דגל בוליאני - Flag Argument"
    - "קנאת תכונות - Feature Envy"
  answer: 2
  explanation: "הפרמטר `for_report` הופך את הפונקציה לשתי פונקציות שונות שגרות באותו גוף, ובקריאה `format_price(1250.5, True)` אי אפשר להבין מה `True` עושה. עדיף שתי פונקציות עם שמות שמסבירים את עצמם, למשל `format_report_price` ו-`format_short_price`."
  optionExplanations:
    "0": "יש רק `if` אחד, בלי תנאים מקוננים."
    "1": "שני פרמטרים הם מספר קטן. הבעיה היא בסוג של הפרמטר השני."
    "3": "הפונקציה משתמשת רק בנתונים שהיא מקבלת, ולא בנתונים של מחלקה אחרת."

- id: py.clean-code.small-functions.004
  type: single
  difficulty: 3
  prompt: "מה הבעיה העיקרית בפונקציה `checkout`?"
  code: |
    import sqlite3


    def checkout(cart, user):
        validate_cart(cart)
        total = calculate_total(cart)
        conn = sqlite3.connect("shop.db")
        conn.execute("INSERT INTO orders VALUES (?, ?)", (user.id, total))
        conn.commit()
        send_receipt(user, total)
  options:
    - "יש לה יותר מדי פרמטרים. עדיף שתקבל רק את `cart`"
    - "היא חייבת להחזיר ערך, אחרת היא לא פונקציה תקינה"
    - "צריך לאחד את `validate_cart` ו-`calculate_total` לפונקציה אחת כדי לקצר"
    - "היא מערבבת רמות הפשטה: צעדים כלליים כמו `validate_cart` לצד פרטי SQL. עדיף לחלץ את השמירה ל-`save_order(user, total)`"
  answer: 3
  explanation: "רמת הפשטה אחידה (Single Level of Abstraction): כל שורה בפונקציה צריכה להיות באותו גובה. `validate_cart` ו-`send_receipt` מתארים מה קורה, ושלוש שורות ה-SQL מתארות איך. אחרי חילוץ `save_order`, הפונקציה נקראת כמו רשימת צעדים: לאמת, לחשב, לשמור, לשלוח קבלה."
  optionExplanations:
    "0": "שני פרמטרים הם מספר סביר, ושניהם נחוצים: הקבלה נשלחת למשתמש."
    "1": "פונקציה שמבצעת פעולה ואינה מחזירה ערך היא תקינה לגמרי."
    "2": "אימות וחישוב הם שתי אחריויות שונות. איחוד שלהן יפגע בעיקרון של דבר אחד לכל פונקציה."

