- id: py.clean-code.small-functions.007
  type: cleaner
  difficulty: 3
  prompt: "`grades` היא רשימה של ציונים שלמים. איזו גרסה של `report` נקייה יותר?"
  options:
    - |
      def step1(grades):
          return [g for g in grades if 0 <= g <= 100]


      def step2(x):
          return sum(x) / len(x) if x else 0


      def report(grades):
          return f"Average: {step2(step1(grades)):.1f}"
    - |
      def report(grades):
          total = 0
          count = 0
          for g in grades:
              if g >= 0:
                  if g <= 100:
                      total += g
                      count += 1
          avg = total / count if count else 0
          return f"Average: {avg:.1f}"
    - |
      def valid_grades(grades):
          return [g for g in grades if 0 <= g <= 100]


      def average(numbers):
          return sum(numbers) / len(numbers) if numbers else 0


      def report(grades):
          return f"Average: {average(valid_grades(grades)):.1f}"
  answer: 2
  explanation: "פיצול לפונקציות קטנות עוזר רק כשלכל אחת שם שמסביר מה היא עושה. בגרסה הנקייה `report` נקראת כמו משפט: הממוצע של הציונים התקינים."
  optionExplanations:
    "0": "הפיצול נכון, אבל `step1`, `step2` ו-`x` לא אומרים כלום. פונקציה קטנה בלי שם טוב לא חוסכת לקורא את הפענוח."
    "1": "הסינון, הספירה והחישוב מעורבבים בלולאה אחת עם תנאים מקוננים, במקום פונקציות קטנות שכל אחת עושה דבר אחד."

