  difficulty: 2
  prompt: "הפונקציה אמורה להחזיר `\"no discount\"` רק כשלא הועברה הנחה בכלל (`None`). הנחה של `0` היא ערך תקין, ועבורה צריך לחזור `\"0% off\"`. באיזו שורה הבאג?"
