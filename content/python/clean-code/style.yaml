        return f"{discount}% off"
  answer: 2
  explanation: "`not discount` נכון גם עבור `0`, כי `0` הוא ערך falsy. כשרוצים לבדוק אם ערך הוא `None`, PEP 8 ממליץ לכתוב `is None`. זה גם מדויק וגם מבהיר לקורא מה בדיוק בודקים."
  fixed: |
    def describe_discount(discount=None):
        if discount is None:
            return "no discount"
        return f"{discount}% off"

