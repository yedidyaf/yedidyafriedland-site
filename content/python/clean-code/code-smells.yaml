- id: py.clean-code.code-smells.002
  type: cleaner
  difficulty: 2
  prompt: איזו גרסה נקייה יותר?
  options:
    - |
      def is_adult(age):
          return age >= 18
    - |
      def is_adult(age):
          if age >= 18:
              return True
          else:
              return False
    - |
      def is_adult(age):
          result = False
          if age >= 18:
              result = True
          return result
  answer: 0
  explanation: "הביטוי `age >= 18` כבר מחזיר ערך בוליאני. אין צורך ב-if שמחזיר True או False."
  optionExplanations:
    "1": "if שמחזיר True ו-False הוא שכפול של התנאי עצמו."
    "2": "משתנה עזר ו-if מוסיפים שלוש שורות בלי להוסיף מידע."
