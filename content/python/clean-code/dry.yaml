  optionExplanations:
    "0": "כל השורות רצות ומשפיעות. אין כאן קוד שלא נגיע אליו."
    "2": "כל פונקציה קצרה. הבעיה היא שהן חוזרות על אותו כלל."
    "3": "אין פרמטר בוליאני שמחליף את ההתנהגות של פונקציה."

