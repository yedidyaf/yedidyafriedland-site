- id: py.clean-code.dry.010
  type: bug
  difficulty: 2
  prompt: "הפונקציה מקבלת רשימה של נקודות `(x, y)` ואמורה להחזיר את גבולות המלבן החוסם: `min_x, min_y, max_x, max_y`. איזו שורה צריך לתקן?"
  code: |
    def bounding_box(points):
        min_x = min(p[0] for p in points)
        max_x = max(p[0] for p in points)
        min_y = min(p[1] for p in points)
        max_y = max(p[0] for p in points)
        return min_x, min_y, max_x, max_y
  answer: 5
  explanation: "בשורה 5 נשאר `p[0]` מהשורה שהועתקה, וצריך `p[1]`. זה באג קלאסי של העתק־הדבק (Copy-Paste): שורות כמעט זהות מעייפות את העין, וההבדל היחיד בהן הוא בדיוק המקום שבו טועים. שמות ברורים, כמו `xs = [x for x, _ in points]`, מקטינים את הסיכון."
  fixed: |
    def bounding_box(points):
        min_x = min(p[0] for p in points)
        max_x = max(p[0] for p in points)
        min_y = min(p[1] for p in points)
        max_y = max(p[1] for p in points)
        return min_x, min_y, max_x, max_y

