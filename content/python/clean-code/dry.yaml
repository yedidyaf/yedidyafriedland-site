        for price in cart:
            result += price
        return result


    print(total(cart))
    print(total(wishlist))
  answer: 7
  explanation: "בשורה 7 הלולאה עדיין עוברת על `cart`, השם מהקוד המקורי, במקום על הפרמטר `prices`. לכן `total(wishlist)` מחזיר `45`. כשמחלצים פונקציה, צריך להחליף כל שימוש במשתנה חיצוני בפרמטר. פונקציה שתלויה רק בפרמטרים שלה גם קלה יותר לבדיקה."
  fixed: |
