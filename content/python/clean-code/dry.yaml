            raise ValueError("invalid email")
        save_user(email, password)


    def change_email(user, email):
        if "@" not in email or email.startswith("@"):
            raise ValueError("invalid email")
        user.email = email
  options:
    - "קוד מת - Dead Code"
    - "שכפול קוד - Duplicated Code"
    - "מתודה ארוכה - Long Method"
