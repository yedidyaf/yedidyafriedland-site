- id: py.clean-code.dry.012
  type: bug
  difficulty: 2
  prompt: "הלולאה הועתקה לפונקציה כדי שאפשר יהיה לחשב סכום של כל רשימה. הפונקציה אמורה להחזיר את סכום הרשימה שהיא מקבלת. איזו שורה צריך לתקן?"
  code: |
    cart = [5, 40]
    wishlist = [120, 35]


