- id: py.advanced.iterators-generators.010
  type: bug
  difficulty: 2
  prompt: הפונקציה אמורה להפיק את כל המספרים הזוגיים מ-0 ועד `limit` (לא כולל). באיזו שורה הבאג?
  code: |
    def evens(limit):
        for n in range(limit):
            if n % 2 == 0:
                return n

    print(list(evens(7)))
  answer: 4
  explanation: "`return` מסיים את הפונקציה כבר במספר הזוגי הראשון ומחזיר את `0` בלבד, ואז `list(0)` זורק `TypeError`. `yield` מחזיר ערך ומשהה את הפונקציה, כך שהלולאה ממשיכה בבקשה הבאה ומפיקה `[0, 2, 4, 6]`."
  fixed: |
    def evens(limit):
        for n in range(limit):
            if n % 2 == 0:
                yield n

    print(list(evens(7)))

- id: py.advanced.iterators-generators.011
  type: bug
  difficulty: 3
  prompt: "האיטרטור אמור לספור לאחור מ-`start` עד 1 כולל. למשל, `list(Countdown(3))` צריך להחזיר `[3, 2, 1]`. באיזו שורה הבאג?"
  code: |
    class Countdown:
        def __init__(self, start):
            self.current = start

        def __iter__(self):
            return self

        def __next__(self):
            if self.current < 0:
                raise StopIteration
            value = self.current
            self.current -= 1
            return value
  answer: 9
  explanation: "פרוטוקול האיטרטור (Iterator Protocol): `__next__` מחזיר את הערך הבא, וזורק `StopIteration` כשאין עוד ערכים. התנאי `< 0` עוצר מאוחר מדי, ולכן גם `0` מוחזר: `[3, 2, 1, 0]`. התנאי הנכון הוא `<= 0`."
  fixed: |
    class Countdown:
        def __init__(self, start):
            self.current = start

        def __iter__(self):
            return self

        def __next__(self):
            if self.current <= 0:
                raise StopIteration
            value = self.current
            self.current -= 1
            return value

