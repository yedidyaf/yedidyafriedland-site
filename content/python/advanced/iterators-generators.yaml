  optionExplanations:
    "1": "גנרטור לא חוזר להתחלה. כדי להתחיל מחדש צריך ליצור גנרטור חדש: `two()`."
    "2": "`next` על גנרטור שנגמר לא מחזיר `None`, אלא זורק `StopIteration`."
    "3": "השורה האחרונה כן רצה, והיא זורקת חריגה במקום להדפיס."

- id: py.advanced.iterators-generators.005
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
