- id: py.advanced.iterators-generators.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    def count_up(n):
        for i in range(n):
            yield i * 10

    gen = count_up(3)
    print(next(gen))
    print(next(gen))
  options: ["0\n10", "10\n20", "0\n0", "[0, 10, 20]"]
  answer: 0
  explanation: "פונקציה עם `yield` היא גנרטור (Generator). כל קריאה ל-`next` ממשיכה את הריצה מהנקודה שבה הגנרטור עצר בפעם הקודמת, ומחזירה את הערך הבא: קודם `0`, אחר כך `10`."
  optionExplanations:
    "1": "`range(n)` מתחיל מ-0, ולכן הערך הראשון הוא `0 * 10`, כלומר `0`."
    "2": "הגנרטור זוכר איפה עצר. הקריאה השנייה ל-`next` לא מתחילה את הפונקציה מחדש."
    "3": "`next` מחזיר ערך אחד בכל פעם, ולא רשימה של כל הערכים."

- id: py.advanced.iterators-generators.002
  type: single
  difficulty: 1
  prompt: "מה מחזירה הקריאה `make()`?"
  code: |
    def make():
        print("running")
        yield 1
  options:
    - "אובייקט גנרטור, בלי להריץ עדיין אף שורה מגוף הפונקציה"
    - "את המספר `1`, אחרי שהודפס `running`"
    - "את הרשימה `[1]`, אחרי שהודפס `running`"
    - "את `None`, כי בפונקציה אין `return`"
  answer: 0
  explanation: "קריאה לפונקציה שיש בה `yield` לא מריצה את הגוף שלה. היא רק יוצרת אובייקט גנרטור. הגוף מתחיל לרוץ (ו-`running` מודפס) רק בקריאה הראשונה ל-`next` או כשלולאה מבקשת את הערך הראשון."
  optionExplanations:
    "1": "כך מתנהגת פונקציה רגילה עם `return 1`. עם `yield` מתקבל גנרטור, והערך `1` יופק רק כשיבקשו אותו."
    "2": "גנרטור לא בונה רשימה. כדי לקבל `[1]` צריך לכתוב במפורש `list(make())`."
    "3": "המילה `yield` לבדה הופכת את הפונקציה לגנרטור, גם בלי `return`."

