  optionExplanations:
    "1": "כשמעבירים ערך ברירת מחדל, `next` מחזיר אותו (`\"done\"`) ולא `None`."
    "2": "`StopIteration` נזרקת רק כשאין ערך ברירת מחדל. כאן יש `\"done\"`."
    "3": "כל קריאה ל-`next` מתקדמת באיטרטור, ולכן הקריאה השנייה מחזירה `2`."

