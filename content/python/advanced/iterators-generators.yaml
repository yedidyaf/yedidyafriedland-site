    "2": "אחרי `break` הלולאה לא מבקשת עוד ערכים, ולכן הקוד שמייצר את 3 לא רץ."
    "3": "הגנרטור לא מייצר ערכים מראש. ערך נוצר רק כשהלולאה מבקשת אותו."

