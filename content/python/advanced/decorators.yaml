- id: py.advanced.decorators.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    def shout(func):
        def wrapper():
            return func().upper()
        return wrapper

    @shout
    def greet():
        return "hello"

    print(greet())
  options: ["HELLO", "hello", "None", "TypeError"]
  answer: 0
  explanation: "דקורטור (Decorator) הוא פונקציה שמקבלת פונקציה ומחזירה פונקציה אחרת שעוטפת אותה. אחרי `@shout`, השם `greet` מצביע על `wrapper`, שקוראת ל-`greet` המקורית ומחזירה את התוצאה באותיות גדולות."
  optionExplanations:
    "1": "`@shout` מחליף את `greet` בעטיפה. הקריאה `greet()` מריצה את `wrapper`, ולא את הפונקציה המקורית ישירות."
    "2": "`wrapper` מחזירה את `func().upper()`, ולכן יש ערך החזרה."
    "3": "`wrapper` לא מקבלת פרמטרים, וגם `greet()` נקראת בלי ארגומנטים, ולכן הקריאה תקינה."

