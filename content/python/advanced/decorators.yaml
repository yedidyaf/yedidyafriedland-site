  optionExplanations:
    "1": "`wrapper` מחזירה את הרשימה `results`, ולא תוצאה בודדת."
    "2": "בכל סיבוב נקראת `func(*args)` עם אותו ארגומנט, `5`, ולכן התוצאה תמיד `10`."
    "3": "העטיפה אוספת את התוצאות לרשימה ולא סוכמת אותן."

