- id: py.advanced.decorators.011
  type: bug
  difficulty: 3
  prompt: "הדקורטור אמור לנסות להריץ את הפונקציה עד `times` פעמים כשנזרקת `ValueError`, ולהשתמש בו כך: `@retry(3)`. באיזו שורה הבאג?"
  code: |
    from functools import wraps

    def retry(times):
        def decorator(func):
            @wraps(func)
            def wrapper(*args, **kwargs):
                for _ in range(times):
                    try:
                        return func(*args, **kwargs)
                    except ValueError:
                        print("retrying")
                raise RuntimeError("failed")
            return wrapper
        return wrapper
  answer: 14
  explanation: "בדקורטור עם פרמטרים יש שלוש שכבות: `retry(times)` מחזיר את `decorator`, ו-`decorator(func)` מחזיר את `wrapper`. השורה האחרונה מחזירה את `wrapper`, שבכלל לא מוגדר בטווח של `retry`, ולכן `@retry(3)` זורק `NameError`. התיקון: `return decorator`."
  fixed: |
    from functools import wraps

    def retry(times):
        def decorator(func):
            @wraps(func)
            def wrapper(*args, **kwargs):
                for _ in range(times):
                    try:
                        return func(*args, **kwargs)
                    except ValueError:
                        print("retrying")
                raise RuntimeError("failed")
            return wrapper
        return decorator

