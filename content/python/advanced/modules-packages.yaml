- id: py.advanced.modules-packages.015
  type: bug
  difficulty: 3
  prompt: "הפונקציות אמורות לבנות נתיבים לקבצים בתוך תיקייה. איזו שורה צריך לתקן?"
  code: |
    import os.path

    def config_file(folder):
        return path.join(folder, "config.ini")

    def log_file(folder):
        return path.join(folder, "app.log")
  answer: 1
  explanation: "`import os.path` טוען את `os.path`, אבל יוצר בקובץ רק את השם `os`. לכן `path` לבדו לא מוגדר, ושתי הפונקציות זורקות `NameError`. התיקון בשורה אחת: `from os import path`, שיוצר את השם `path`."
  fixed: |
    from os import path

    def config_file(folder):
        return path.join(folder, "config.ini")

    def log_file(folder):
        return path.join(folder, "app.log")

- id: py.advanced.modules-packages.016
  type: architecture
  difficulty: 2
  prompt: שבצו כל חתימה במודול של החבילה שאליו היא שייכת.
  requirement: "חבילה בשם `weather` להתראות מזג אוויר: שולפת תחזית לעיר מ-API חיצוני, מחליטה אם צריך לשלוח התראה, וניתנת להרצה משורת הפקודה עם `python -m weather.cli`."
  targets:
    - id: weather/models.py
      desc: מחלקות הנתונים
    - id: weather/client.py
      desc: תקשורת עם ה-API החיצוני
    - id: weather/alerts.py
      desc: כללי ההתראה
    - id: weather/cli.py
      desc: נקודת הכניסה משורת הפקודה
  items:
    - label: "class Forecast: def __init__(self, city: str, temp_c: float, wind_kmh: float)"
      answer: weather/models.py
      why: מחלקת נתונים בלי לוגיקה ובלי תקשורת, שכל שאר המודולים משתמשים בה.
    - label: "def http_get_json(url: str, timeout: float) -> dict"
      answer: weather/client.py
      why: בקשת רשת היא פרט טכני של התקשורת עם ה-API.
    - label: "def fetch_forecast(city: str) -> Forecast"
      answer: weather/client.py
      why: שליפת התחזית מה-API והחזרתה כאובייקט היא האחריות של הלקוח.
    - label: "def should_alert(forecast: Forecast, max_wind_kmh: float) -> bool"
      answer: weather/alerts.py
      why: ההחלטה מתי להתריע היא כלל עסקי, שלא תלוי באיך התחזית הגיעה.
    - label: "def is_heatwave(forecast: Forecast) -> bool"
      answer: weather/alerts.py
      why: גם זה כלל התראה שמקבל תחזית ומחליט, בלי רשת ובלי ממשק.
    - label: "def main(argv: list[str]) -> int"
      answer: weather/cli.py
      why: "קוראת את הארגומנטים, מפעילה את שאר המודולים ומדפיסה תוצאה. בסוף הקובץ: `if __name__ == \"__main__\": main(sys.argv[1:])`."
  explanation: "חלוקה טובה לחבילה נותנת לכל מודול אחריות אחת: `models` מחזיק נתונים, `client` מדבר עם העולם החיצוני, `alerts` מחליט לפי כללים, ו-`cli` מחבר הכול. כך אפשר לבדוק את `alerts` בלי רשת, ולייבא את החבילה בלי שהתוכנית תרוץ, כי רק `cli.py` מכיל את בלוק ה-`__main__`."
