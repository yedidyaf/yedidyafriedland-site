- id: py.advanced.modules-packages.014
  type: bug
  difficulty: 1
  prompt: "כשמריצים את הקובץ ישירות, הוא אמור לקרוא ל-`main`. כשמייבאים אותו, `main` לא צריכה לרוץ. איזו שורה צריך לתקן?"
  code: |
