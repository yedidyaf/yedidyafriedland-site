- id: py.advanced.type-hints.010
  type: single
  difficulty: 3
  prompt: איזו פונקציה בודק טיפוסים כמו mypy יסמן כשגויה, ולמה?
  code: |
    def first_word(text: str | None) -> str:
        if text is None:
            return ""
        return text.split()[0]

    def shout(text: str | None) -> str:
        return text.upper()
  options:
    - "`shout`, כי `text` יכול להיות `None`, ול-`None` אין מתודה `upper`"
    - "`first_word`, כי היא מחזירה מחרוזת ריקה ולא `None`"
    - "`first_word`, כי `split()[0]` מחזיר רשימה ולא `str`"
    - "אף אחת, כי פייתון לא בודקת רמזי טיפוס"
  answer: 0
  explanation: "בודק הטיפוסים מתחשב בתנאים בקוד: ב-`first_word`, אחרי הבדיקה `if text is None`, הוא יודע ש-`text` הוא `str` (צמצום טיפוס, Type Narrowing). ב-`shout` אין בדיקה כזו, ולכן `text.upper()` עלול לרוץ על `None`. זו בדיוק הטעות ש-`Optional` נועד לחשוף."
  optionExplanations:
    "1": "הרמז `-> str` מבטיח מחרוזת, ו-`\"\"` היא מחרוזת. החזרת `None` הייתה דווקא שגיאה."
    "2": "`split()` מחזיר רשימה, אבל `[0]` שולף ממנה איבר אחד, שהוא `str`."
    "3": "נכון שפייתון לא בודקת, אבל השאלה היא על mypy, שכן בודק לפני הריצה."

