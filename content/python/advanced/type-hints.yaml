- id: py.advanced.type-hints.014
  type: bug
  difficulty: 2
  prompt: "הפונקציה מקבלת גילים כמחרוזות (למשל משורות של קובץ) ואמורה להחזיר את סכומם כמספר שלם. איזו שורה צריך לתקן?"
  code: |
    def total_age(ages: list[str]) -> int:
        total = 0
        for age in ages:
            total += age
        return total

    print(total_age(["30", "25"]))
  answer: 4
  explanation: "הרמז `-> int` לא ממיר את הערכים. `0 + \"30\"` הוא חיבור של `int` ו-`str`, וזורק `TypeError`. צריך להמיר במפורש: `total += int(age)`. רמזי טיפוס מתעדים כוונה; את ההמרה עצמה הקוד צריך לעשות."
  fixed: |
    def total_age(ages: list[str]) -> int:
        total = 0
        for age in ages:
            total += int(age)
        return total

    print(total_age(["30", "25"]))

- id: py.advanced.type-hints.015
  type: bug
  difficulty: 2
  prompt: "הפונקציה אמורה להחזיר את השם באות ראשונה גדולה, או `anonymous` אם התקבל `None`. איזו שורה צריך לתקן?"
  code: |
    def label(name: str | None) -> str:
        if name is not None:
            return "anonymous"
        return name.title()
  answer: 2
  explanation: "התנאי הפוך: הפונקציה מחזירה `anonymous` דווקא כשיש שם, וכשמתקבל `None` היא מגיעה ל-`None.title()` וזורקת `AttributeError`. הרמז `str | None` מזכיר לטפל ב-`None` קודם, אבל לא בודק שהטיפול נכון. התנאי הנכון: `if name is None`."
  fixed: |
    def label(name: str | None) -> str:
        if name is None:
            return "anonymous"
        return name.title()

