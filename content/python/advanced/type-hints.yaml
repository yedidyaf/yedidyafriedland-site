- id: py.advanced.type-hints.017
  type: order
  difficulty: 2
  tags: [algorithm]
  prompt: "סדרו את השורות כך שהפונקציה עם רמזי הטיפוס תחשב את אורך המילה הארוכה ביותר."
  code: |
    def longest(words: list[str]) -> int:
        best = 0
        for word in words:
            best = max(best, len(word))
        return best
