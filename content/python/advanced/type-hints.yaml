- id: py.advanced.type-hints.001
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    def double(x: int) -> int:
        return x * 2

    print(double("ab"))
  options: ["abab", "TypeError", "None", "ab2"]
  answer: 0
  explanation: "רמזי טיפוס (Type Hints) הם תיעוד בלבד: פייתון לא בודקת אותם בזמן ריצה. הפונקציה מקבלת מחרוזת, ו-`\"ab\" * 2` הוא שכפול מחרוזת, ולכן מודפס `abab`. בודק טיפוסים סטטי כמו mypy היה מסמן את הקריאה כשגויה עוד לפני הריצה."
  optionExplanations:
    "1": "פייתון לא זורקת שגיאה בגלל רמז טיפוס. `TypeError` נזרקת רק אם הפעולה עצמה לא חוקית, ו-`\"ab\" * 2` חוקית."
    "2": "הפונקציה מחזירה את `x * 2`, ולכן יש ערך החזרה."
    "3": "כפל מחרוזת במספר שלם משכפל אותה. הוא לא מחבר את הספרה למחרוזת."

- id: py.advanced.type-hints.002
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    def greet(name: str, times: int = 1) -> str:
        return name * times

    print(greet.__annotations__)
  options:
    - "{'name': <class 'str'>, 'times': <class 'int'>, 'return': <class 'str'>}"
    - "{'name': <class 'str'>, 'times': <class 'int'>}"
    - "{'return': <class 'str'>, 'name': <class 'str'>, 'times': <class 'int'>}"
    - "{'name': 'str', 'times': 'int', 'return': 'str'}"
  answer: 0
  explanation: "הדבר היחיד שפייתון עושה עם רמזי טיפוס בזמן ריצה הוא לשמור אותם במילון `__annotations__` של הפונקציה. הפרמטרים נשמרים לפי הסדר, והטיפוס המוחזר נשמר תחת המפתח `'return'`. הערכים הם אובייקטי הטיפוס עצמם, לא מחרוזות."
  optionExplanations:
    "1": "גם רמז ערך ההחזרה (`-> str`) נשמר, תחת המפתח `'return'`."
    "2": "המילון שומר על סדר ההגדרה: קודם הפרמטרים, ורק בסוף `'return'`."
    "3": "הערכים הם המחלקות עצמן (`<class 'str'>`), כי הרמזים מחושבים כביטויים רגילים."

- id: py.advanced.type-hints.003
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    count: int
    print("ok")
    print(count)
  options: ["ok\nNameError", "ok\n0", "ok\nNone", "NameError"]
  answer: 0
  explanation: "`count: int` בלי `=` הוא הערת טיפוס (Annotation) בלבד: הוא מודיע לכלים מה הטיפוס המתוכנן, אבל לא יוצר משתנה ולא נותן לו ערך. לכן `print(count)` זורק `NameError`. בפייתון אין ערך ברירת מחדל לפי טיפוס."
  optionExplanations:
    "1": "פייתון לא מאתחלת משתנים לפי הטיפוס שלהם, כמו בשפות אחרות. המשתנה פשוט לא קיים."
    "2": "גם `None` הוא ערך שצריך להציב במפורש: `count: int | None = None`."
    "3": "השורה `count: int` חוקית ולא זורקת שגיאה, ולכן `ok` מודפס לפני הכישלון."

- id: py.advanced.type-hints.004
  type: output
  difficulty: 1
  prompt: מה יודפס?
  code: |
    age: int = "twenty"
    print(age, type(age).__name__)
  options: ["twenty str", "TypeError", "twenty int", "20 int"]
  answer: 0
  explanation: "רמז הטיפוס על משתנה לא ממיר את הערך ולא בודק אותו. `age` מצביע על מחרוזת, ולכן הטיפוס שלו בזמן ריצה הוא `str`. רק בודק טיפוסים סטטי יתריע שהערך לא תואם להצהרה."
  optionExplanations:
    "1": "ההשמה מתבצעת בלי שום בדיקה. פייתון לא אוכפת רמזי טיפוס."
    "2": "`type` מחזיר את הטיפוס האמיתי של הערך, ולא את מה שנכתב ברמז."
    "3": "רמז טיפוס לא ממיר ערכים. גם `int(\"twenty\")` לא היה מצליח."

- id: py.advanced.type-hints.005
  type: output
  difficulty: 2
  prompt: מה יודפס?
  code: |
    from typing import Optional

    def find(names: list[str], target: str) -> Optional[int]:
        for i, name in enumerate(names):
            if name == target:
                return i
        return None

    print(find(["dan", "noa"], "noa"), find(["dan"], "eli"))
  options: ["1 None", "1 -1", "noa None", "TypeError"]
  answer: 0
  explanation: "`Optional[int]` אומר שהפונקציה מחזירה `int` או `None`. כאן `\"noa\"` נמצא באינדקס `1`, ו-`\"eli\"` לא נמצא ולכן מוחזר `None`. הרמז מזהיר את הקורא: לפני שמשתמשים בתוצאה כמספר, צריך לבדוק אם היא `None`."
  optionExplanations:
    "1": "`-1` הוא מה ש-`str.find` מחזיר כשלא נמצאה התאמה. הפונקציה כאן מחזירה במפורש `None`."
    "2": "הפונקציה מחזירה את האינדקס `i` מ-`enumerate`, ולא את השם עצמו."
    "3": "החזרת `None` תואמת לרמז `Optional[int]`, וגם בלי זה פייתון לא הייתה זורקת שגיאה בגלל רמז."

- id: py.advanced.type-hints.006
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    nums: list[int] = [1, 2]
    nums.append("three")
    print(isinstance(nums, list))
    print(isinstance(nums, list[int]))
  options: ["True\nTypeError", "True\nFalse", "True\nTrue", "TypeError"]
  answer: 0
  explanation: "הרמז `list[int]` לא מנע להכניס מחרוזת לרשימה. `isinstance(nums, list)` בודק את הטיפוס האמיתי ומחזיר `True`. אבל `list[int]` הוא כינוי גנרי (Generic Alias) לשימוש ברמזים בלבד, ו-`isinstance` לא יודע לבדוק את טיפוסי האיברים, ולכן הוא זורק `TypeError`."
  optionExplanations:
    "1": "`isinstance` לא עובר על האיברים כדי להחזיר `False`. הוא מסרב לקבל `list[int]` בכלל."
    "2": "פייתון לא בודקת את טיפוסי האיברים ברשימה, ו-`isinstance` לא מקבל טיפוס גנרי עם פרמטרים."
    "3": "`append` של מחרוזת עובד בלי שגיאה, והשורה הראשונה מדפיסה `True`."

