    - label: "def happy_hour_price(price: float, hour: int) -> float"
      answer: domain/pricing.py
      why: "כלל ההנחה בשעות 17:00 עד 19:00 הוא כלל עסקי."
    - label: "def order_total(items: list[MenuItem], hour: int) -> float"
      answer: domain/pricing.py
      why: "חישוב הסכום לתשלום הוא לוגיקה."
    - label: "def show_menu(items: list[MenuItem]) -> None"
      answer: presentation/menu_screen.py
      why: "הצגה לקופאי שייכת לשכבת התצוגה."
    - label: "def ask_item_number(max_number: int) -> int"
      answer: presentation/menu_screen.py
      why: "קליטת בחירה מהקופאי היא ממשק."
  explanation: "שלוש השכבות כאן הן תצוגה (Presentation), תחום (Domain) ונתונים (Data). שמות התיקיות שונים מ-ui, service ו-repository, אבל העיקרון זהה: כל שכבה עושה דבר אחד, והתחום לא יודע מאיפה הגיע התפריט ואיך הוא מוצג."
