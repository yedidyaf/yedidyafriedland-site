  explanation: "הפרדת ממשקים (Interface Segregation): במקום ממשק גדול אחד עם `print_doc`, `scan` ו-`fax`, יש ממשקים קטנים. כל מכשיר מממש רק מה שיש לו, וכל פונקציה במשרד דורשת רק את מה שהיא צריכה."

- id: py.software-design.solid.014
  type: single
  difficulty: 3
  prompt: "כל המחלקות הבאות יורשות מ-`Storage`. איזו מהן מפרה את עקרון החלפת ליסקוב?"
  code: |
    class Storage:
        def save(self, key: str, data: bytes) -> None:
            """Stores data so that load(key) returns it later."""
            ...

        def load(self, key: str) -> bytes:
            ...
  options:
    - "`ReadOnlyStorage`, שבה `save` זורקת תמיד `PermissionError`"
    - "`CachedStorage`, ששומרת עותק בזיכרון ואז קוראת ל-`super().save`"
    - "`CompressedStorage`, שדוחסת את המידע ב-`save` ופורסת אותו ב-`load`"
    - "`LoggingStorage`, שכותבת שורת לוג ואז קוראת ל-`super().save`"
  answer: 0
  explanation: "עקרון החלפת ליסקוב (Liskov Substitution) דורש שכל מחלקה יורשת תקיים את החוזה של מחלקת הבסיס. החוזה של `save` הוא ש-`load` תחזיר אחר כך את המידע. קוד שמקבל `Storage` וקורא ל-`save` יקרוס כשיקבל `ReadOnlyStorage`. אחסון לקריאה בלבד צריך הפשטה משלו, בלי `save`."
  optionExplanations:
    "1": "מטמון (Cache) רק מוסיף התנהגות, והחוזה נשמר: `load` מחזירה את מה שנשמר."
    "2": "הדחיסה פנימית. מבחוץ `load` עדיין מחזירה בדיוק את מה שהועבר ל-`save`."
    "3": "כתיבת לוג היא תוספת שלא משנה את מה שהקוד הקורא מקבל."

- id: py.software-design.solid.015
  type: single
  difficulty: 1
  prompt: "מה המשמעות של עקרון פתוח לסגור (Open/Closed)?"
  options:
    - "אפשר להוסיף התנהגות חדשה על ידי כתיבת קוד חדש, בלי לשנות קוד קיים שכבר עובד"
    - "מתודות ציבוריות פתוחות לכל הקוד, ומשתנים פרטיים סגורים בתוך המחלקה"
    - "כל קובץ נפתח לעריכה פעם אחת, ואחרי שהוא נבדק אסור לגעת בו לעולם"
    - "מחלקה צריכה להיות פתוחה לירושה, ולכן אסור להגדיר בה מתודות מופשטות"
  answer: 0
  explanation: "פתוח להרחבה (Extension) וסגור לשינוי (Modification): תכונה חדשה מגיעה כמחלקה או פונקציה חדשה, למשל `HolidayDiscount`, ולא כעוד `elif` בקוד קיים. כך קוד שכבר נבדק לא נשבר."
  optionExplanations:
    "1": "זה תיאור של כימוס (Encapsulation), עיקרון אחר."
    "2": "מותר ואף צריך לתקן באגים בקוד קיים. העיקרון מדבר על הוספת התנהגות חדשה, לא על איסור לגעת בקוד."
    "3": "להפך: מתודות מופשטות הן הדרך הנפוצה לאפשר הרחבה."

- id: py.software-design.solid.016
  type: single
  difficulty: 1
  prompt: "רוצים להוסיף הנחת חג. איזה שינוי עומד בעקרון פתוח לסגור?"
  code: |
    from abc import ABC, abstractmethod

    class Discount(ABC):
        @abstractmethod
        def apply(self, price: float) -> float: ...

    class StudentDiscount(Discount):
        def apply(self, price: float) -> float:
            return price * 0.9

    def final_price(price: float, discount: Discount) -> float:
        return round(discount.apply(price), 2)
  options:
    - "לכתוב מחלקה חדשה `HolidayDiscount(Discount)` עם `apply` משלה"
    - "להוסיף ל-`final_price` תנאי `if isinstance(discount, HolidayDiscount)`"
    - "להוסיף ל-`final_price` פרמטר `is_holiday: bool`"
    - "להעתיק את `final_price` לפונקציה חדשה `final_holiday_price`"
  answer: 0
  explanation: "המבנה כבר פתוח להרחבה: `final_price` עובדת עם כל `Discount`. מחלקה חדשה מוסיפה את ההתנהגות, ושום שורה קיימת לא משתנה."
  optionExplanations:
    "1": "בדיקת טיפוס בתוך `final_price` מחייבת לשנות אותה בכל הנחה חדשה."
    "2": "דגל בוליאני משנה את חתימת הפונקציה ואת כל מי שקורא לה."
    "3": "העתקה יוצרת שכפול קוד, וכל תיקון יצטרך להיעשות פעמיים."
