  options:
    - "`def __init__(self, repo: UserRepository)`, כאשר `UserRepository` הוא `Protocol` עם המתודות שהשירות צריך"
    - "`def __init__(self, repo: SqlUserRepository)`"
    - "`def __init__(self)`, ובתוכו `self.repo = SqlUserRepository()`"
    - "`def __init__(self, db_path: str)`, ובתוכו `self.repo = SqlUserRepository(db_path)`"
  answer: 0
  explanation: "השירות תלוי רק בחוזה, ולכן כל מימוש מתאים: SQL, זיכרון או מזויף. זו הזרקה יחד עם תלות בהפשטה, השילוב שנותן צימוד חלש (Loose Coupling)."
  optionExplanations:
    "1": "יש כאן הזרקה, אבל הטיפוס הוא מימוש מסוים. זה מצהיר שהשירות צריך דווקא SQL, וכלי בדיקת טיפוסים יתריע על מאגר בזיכרון."
    "2": "השירות יוצר מימוש מסוים בעצמו. זה הצימוד החזק ביותר."
    "3": "מזריקים רק את הנתיב, אבל השירות עדיין בוחר ויוצר את המימוש בעצמו."

- id: py.software-design.dependency-injection.017
  type: order
  difficulty: 3
  tags: [algorithm]
  prompt: "סדרו את השורות כך שהשירות יקבל את מקור הנתונים מבחוץ, ויחשב ממנו את הממוצע."
  code: |
    class FakeRepository:
        def get_grades(self):
            return [70, 80, 90]
    class GradeService:
        def __init__(self, repository):
            self.repository = repository
        def average(self):
            grades = self.repository.get_grades()
            return sum(grades) / len(grades)
    print(GradeService(FakeRepository()).average())
  output: "80.0"
  anyOrder: [[[1, 3], [4, 9]], [[5, 6], [7, 9]]]
  explanation: "הזרקת תלויות (Dependency Injection): `GradeService` לא יוצרת את מקור הנתונים בעצמה, היא מקבלת אותו בבנאי. בבדיקות מעבירים `FakeRepository` עם נתונים קבועים, ובתוכנית האמיתית מעבירים מאגר אמיתי, בלי לשנות את השירות."
