    "2": "משתנים גלובליים בקובץ השירות קושרים אותו למימושים, והם נוצרים כבר ברגע הייבוא."
    "3": "יצירה בכל מתודה קושרת את השירות למימושים, ובנוסף יוצרת חיבור חדש בכל קריאה."

