    - "כמשתנים גלובליים בראש `order_service.py`"
    - "בתוך כל מתודה של `OrderService` שצריכה אותם"
  answer: 0
  explanation: "המקום שבו יוצרים את כל המימושים ומחברים אותם נקרא שורש ההרכבה (Composition Root), ובדרך כלל זו נקודת הכניסה. כך רק קובץ אחד יודע אילו מימושים בשימוש, וכל השאר מקבלים את התלויות מבחוץ."
