- id: py.data-structures.lists.009
  type: output
  difficulty: 3
  prompt: מה יודפס?
  code: |
    words = ["kiwi", "fig", "pear", "apple"]
    words.sort(key=len)
    print(words)
  options:
    - "['fig', 'kiwi', 'pear', 'apple']"
    - "['fig', 'pear', 'kiwi', 'apple']"
    - "['apple', 'fig', 'kiwi', 'pear']"
    - "['apple', 'kiwi', 'pear', 'fig']"
  answer: 0
  explanation: "`key=len` אומר למיין לפי אורך המילה ולא לפי סדר אלפביתי. ל-`kiwi` ול-`pear` אותו אורך, והמיון בפייתון יציב (Stable Sort): איברים עם מפתח שווה שומרים על הסדר המקורי שלהם, ולכן `kiwi` נשאר לפני `pear`."
  optionExplanations:
    "1": "המיון לא משווה את המילים עצמן כשהאורך שווה. הוא יציב ושומר על הסדר המקורי."
    "2": "זה מיון אלפביתי, כלומר `sort()` בלי `key`."
    "3": "זה מיון לפי אורך בסדר יורד, שדורש גם `reverse=True`."

