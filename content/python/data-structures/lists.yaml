- id: py.data-structures.lists.015
  type: bug
  difficulty: 2
  prompt: הפונקציה אמורה להחזיר רשימה חדשה שבה כל ערך מוכפל ב-2, בלי לשנות את הרשימה שהתקבלה. באיזו שורה הבאג?
  code: |
    def doubled(values):
        result = values
        for i in range(len(result)):
            result[i] *= 2
        return result
  answer: 2
  explanation: "`result = values` לא יוצר רשימה חדשה, אלא הפניה לאותה רשימה. הלולאה משנה את הרשימה המקורית של מי שקרא לפונקציה. צריך להעתיק קודם: `result = values.copy()`."
  fixed: |
    def doubled(values):
        result = values.copy()
        for i in range(len(result)):
            result[i] *= 2
        return result

- id: py.data-structures.lists.016
  type: bug
  difficulty: 3
  prompt: "הקוד אמור למחוק מהרשימה את כל המספרים השליליים ולהדפיס `[3, 4]`, אבל מדפיס `[3, -2, 4]`. באיזו שורה הבאג?"
  code: |
    nums = [3, -1, -2, 4]
    for n in nums:
        if n < 0:
            nums.remove(n)
    print(nums)
  answer: 2
  explanation: "אסור לשנות רשימה בזמן שעוברים עליה בלולאה. כשמוחקים את 1-, כל האיברים זזים אינדקס אחד שמאלה, והלולאה מדלגת על 2-. הפתרון: לעבור על עותק, `for n in nums[:]:`, ולמחוק מהמקור."
  fixed: |
    nums = [3, -1, -2, 4]
    for n in nums[:]:
        if n < 0:
            nums.remove(n)
    print(nums)
