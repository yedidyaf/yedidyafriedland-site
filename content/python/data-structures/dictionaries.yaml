- id: py.data-structures.dictionaries.014
  type: bug
  difficulty: 2
  prompt: הפונקציה אמורה לספור כמה פעמים כל מילה מופיעה ברשימה. באיזו שורה הבאג?
  code: |
    def count_words(words):
        counts = {}
        for w in words:
            counts[w] += 1
        return counts
  answer: 4
  explanation: "בפעם הראשונה שמילה מופיעה, היא עדיין לא מפתח במילון, ו-`counts[w] += 1` מנסה לקרוא ערך שלא קיים וזורק `KeyError`. צריך לקרוא עם ברירת מחדל: `counts[w] = counts.get(w, 0) + 1`."
  fixed: |
    def count_words(words):
        counts = {}
        for w in words:
            counts[w] = counts.get(w, 0) + 1
        return counts

- id: py.data-structures.dictionaries.015
  type: bug
  difficulty: 1
  prompt: הקוד אמור להדפיס כל מוצר ואת המחיר שלו. באיזו שורה הבאג?
  code: |
    prices = {"tea": 8, "cake": 15}
    for name, price in prices:
        print(name, price)
  answer: 2
  explanation: "מעבר ישיר על מילון נותן רק מפתחות. כאן פייתון מנסה לפרק כל מפתח, למשל `\"tea\"`, לשני משתנים, ונכשלת עם `ValueError`. כדי לקבל זוגות של מפתח וערך משתמשים ב-`prices.items()`."
  fixed: |
    prices = {"tea": 8, "cake": 15}
    for name, price in prices.items():
        print(name, price)

- id: py.data-structures.dictionaries.016
  type: bug
  difficulty: 3
  prompt: "הפונקציה אמורה לקבץ מילים לפי האורך שלהן, למשל `{3: ['sun', 'sky'], 4: ['moon']}`. באיזו שורה הבאג?"
  code: |
    def group_by_length(words):
        groups = {}
        for w in words:
            key = len(w)
            if key not in groups:
                groups[key] = []
            groups[w].append(w)
        return groups
  answer: 7
  explanation: "המפתח של הקבוצה הוא האורך, `key`, אבל שורה 7 ניגשת למילון עם המילה עצמה. המפתח `w` לא קיים, ולכן נזרקת `KeyError`. התיקון: `groups[key].append(w)`."
  fixed: |
    def group_by_length(words):
        groups = {}
        for w in words:
            key = len(w)
            if key not in groups:
                groups[key] = []
            groups[key].append(w)
        return groups
