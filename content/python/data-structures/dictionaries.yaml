- id: py.data-structures.dictionaries.010
  type: single
  difficulty: 2
  prompt: "נתון מילון `d` שאין בו את המפתח `\"k\"`. מה ההבדל בין `d[\"k\"]` לבין `d.get(\"k\")`?"
  options:
    - "`d[\"k\"]` זורק `KeyError`, ו-`d.get(\"k\")` מחזיר `None`"
    - "שניהם מחזירים `None`"
    - "שניהם זורקים `KeyError`"
    - "`d[\"k\"]` מוסיף את המפתח עם הערך `None`, ו-`d.get(\"k\")` לא משנה את המילון"
  answer: 0
  explanation: "גישה בסוגריים מרובעים מניחה שהמפתח קיים, וזורקת `KeyError` אם לא. `get` מיועדת למקרים שבהם המפתח אולי חסר: היא מחזירה `None`, או ערך ברירת מחדל שמעבירים לה כארגומנט שני."
  optionExplanations:
    "1": "רק `get` מחזירה ערך כשהמפתח חסר. גישה ב-`[]` זורקת שגיאה."
    "2": "`get` נועדה בדיוק כדי לא לזרוק שגיאה."
    "3": "קריאה של `d[\"k\"]` לא מוסיפה מפתח. רק השמה, `d[\"k\"] = ...`, מוסיפה."

