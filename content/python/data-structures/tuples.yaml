- id: py.data-structures.tuples.014
  type: bug
  difficulty: 2
  prompt: "הקוד אמור לפרק את הנקודה לשלושה משתנים ולהדפיס `3 4`. איזו שורה צריך לתקן?"
  code: |
    point = (3, 4, 5)
    x, y = point
    print(x, y)
  answer: 2
  explanation: "בפירוק (Unpacking) מספר המשתנים בצד שמאל חייב להיות שווה למספר האיברים בטאפל. כאן יש שלושה איברים ושני משתנים, ולכן נזרקת `ValueError`. התיקון: `x, y, z = point`."
  fixed: |
    point = (3, 4, 5)
    x, y, z = point
    print(x, y)

- id: py.data-structures.tuples.015
  type: bug
  difficulty: 3
  prompt: "הקוד אמור לתת גישה רק אם `role` שווה בדיוק לאחד התפקידים המורשים. בפועל הוא מדפיס `access granted` עבור `\"min\"`. איזו שורה צריך לתקן?"
  code: |
    allowed = ("admin")
    role = "min"
    if role in allowed:
        print("access granted")
  answer: 1
  explanation: "`(\"admin\")` הוא לא טאפל אלא מחרוזת רגילה בסוגריים. על מחרוזת, `in` בודק אם יש תת־מחרוזת, ו-`\"min\"` אכן מופיע בתוך `\"admin\"`. עם פסיק, `(\"admin\",)`, זה טאפל של איבר אחד, ו-`in` משווה איברים שלמים."
  fixed: |
    allowed = ("admin",)
    role = "min"
    if role in allowed:
        print("access granted")

- id: py.data-structures.tuples.016
  type: cleaner
  difficulty: 2
  prompt: "`students` היא רשימה של טאפלים מהצורה `(name, grade)`. איזו גרסה נקייה יותר?"
  options:
    - |
      students = [("Dana", 90), ("Avi", 85)]
      for name, grade in students:
          print(name, grade)
    - |
      students = [("Dana", 90), ("Avi", 85)]
      for student in students:
          print(student[0], student[1])
    - |
      students = [("Dana", 90), ("Avi", 85)]
      for i in range(len(students)):
          print(students[i][0], students[i][1])
  answer: 0
  explanation: "פירוק הטאפל ישירות בכותרת הלולאה נותן לכל חלק שם בעל משמעות. `name` ו-`grade` מסבירים את עצמם, ואילו `[0]` ו-`[1]` מחייבים את הקורא לזכור מה נמצא בכל מקום."
  optionExplanations:
    "1": "אינדקסים מספריים מסתירים את המשמעות של כל שדה. פירוק לשמות קריא יותר."
    "2": "לולאה על אינדקסים מוסיפה רעש. אפשר לעבור ישירות על האיברים ולפרק אותם."
