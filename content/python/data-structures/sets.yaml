    - "שמירת תור של לקוחות לפי סדר ההגעה שלהם"
    - "שמירת ציון לכל תלמיד, כדי למצוא את הציון לפי שם התלמיד"
    - "שמירת רשימת קניות שבה מוצר יכול להופיע כמה פעמים"
  answer: 0
  explanation: "קבוצה מתאימה כשחשוב רק אם ערך קיים או לא: היא מונעת כפילויות ובודקת שייכות מהר. כשהסדר חשוב בוחרים רשימה, וכשכל ערך צריך מידע נלווה בוחרים מילון."
  optionExplanations:
    "1": "קבוצה לא שומרת סדר, ולכן אי אפשר לדעת ממנה מי הגיע ראשון. כאן מתאימה רשימה."
    "2": "כל שם צריך ציון משויך. זה מיפוי ממפתח לערך, כלומר מילון."
    "3": "קבוצה תאחד את כל ההופעות של אותו מוצר. כשכפילויות חשובות, משתמשים ברשימה."

