- id: py.data-structures.sets.015
  type: bug
  difficulty: 2
  prompt: הפונקציה אמורה להחזיר קבוצה של המילים השונות בטקסט. באיזו שורה הבאג?
  code: |
    def unique_words(text):
        seen = {}
        for word in text.split():
            seen.add(word)
        return seen
  answer: 2
  explanation: "`{}` יוצר מילון ריק, לא קבוצה. למילון אין מתודה `add`, ולכן שורה 4 זורקת `AttributeError`, אבל הטעות האמיתית היא ביצירה. קבוצה ריקה יוצרים עם `set()`."
  fixed: |
    def unique_words(text):
        seen = set()
        for word in text.split():
            seen.add(word)
        return seen

- id: py.data-structures.sets.016
  type: cleaner
  difficulty: 3
  prompt: "שלוש פונקציות בודקות אם יש ברשימה ערך שמופיע יותר מפעם אחת. איזו נקייה יותר?"
  options:
    - |
      def has_duplicates(items):
          return len(set(items)) != len(items)
    - |
      def has_duplicates(items):
          for i in range(len(items)):
              for j in range(i + 1, len(items)):
                  if items[i] == items[j]:
                      return True
          return False
    - |
      def has_duplicates(items):
          seen = []
          for item in items:
              if item in seen:
                  return True
              seen.append(item)
          return False
  answer: 0
  explanation: "קבוצה מסירה כפילויות, ולכן אם הגודל שלה קטן מאורך הרשימה, יש כפילות. שורה אחת שמבטאת את הרעיון ישירות, ורצה בזמן ליניארי. (שלוש הגרסאות מניחות שהאיברים ניתנים לגיבוב, כמו מספרים ומחרוזות.)"
  optionExplanations:
    "1": "לולאה כפולה עם אינדקסים ארוכה וקשה לקריאה, ומשווה כל זוג, כך שזמן הריצה ריבועי."
    "2": "הרעיון נכון, אבל `seen` היא רשימה, ו-`in` על רשימה עובר על כל איבריה. עם `set` הקוד היה מהיר, ועם `len(set(...))` גם קצר."
